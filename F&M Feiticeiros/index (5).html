isitos para poderem ser obtidos, possuindo níveis de 1 a 5. A ativação da técnica pode ser realizada como uma ação livre, e o seu custo é igual à soma do custo de todos os fenômenos escolhidos. Após encerrar a ativação da técnica, seu usuário recebe um nível de exaustão para cada fenômeno ativado.\n\n▸ Lista de Fenômenos\nAbaixo estão listados todos os fenômenos da ativação de Criatura Mística Âmbar, ordenados por nível.\n\n▸ Garras Âmbar\nFenômeno de Nível 2 Custo: 4 Pontos de Energia Você manifesta potentes garras ao redor de ambos seus braços, transformandoos em armas naturais e letais. Seus punhos passam a contar como armas marciais, com as propriedades Leve e Fineza, além de causar 3d8 de dano de força ou chocante (a sua escolha) adicional.\n\n▸ Canhão Vocal\nFenômeno de Nível 2 Custo: 4 Pontos de Energia Você modifica sua face, de maneira a transformá-la em um potencial canhão, utilizando ondas sonoras. Enquanto estiver com canhão vocal manifestado, você pode disparar uma onda sonora como uma ação comum, forçando todas as criaturas dentro de 6 metros a realizarem um teste de resistência de Fortitude, recebendo 6d8 de dano de força, ou apenas metade em um sucesso. Uma criatura que falhar no teste também recebe a condição Surdo por 1 rodada.\n\n▸ Visão Raio-X\nFenômeno de Nível 3 Custo: 6 Pontos de Energia Você cria um revestimento sobre os seus olhos, o qual o concede uma visão perfeita, da qual nenhum detalhe escapa. Você recebe um bônus de +10 em Percepção, +4 em Reflexos e +4 em Rolagens de Ataque enquanto o fenômeno estiver manifestado, além de receber visão em Raio-X.\n\n▸ Palmas Místicas\nFenômeno de Nível 3 Custo: 6 Pontos de Energia Além de garras, você se torna capaz de produzir uma grande explosão em rajada a partir da palma das suas mãos. Enquanto estiver com palmas místicas manifestado, você pode disparar uma rajada a partir de suas mãos como uma ação comum, afetando uma linha reta de 13,5 metros à sua frente, forçando toda as criaturas dentro dela a realizarem um teste de resistência de Reflexos, recebendo 8d12 de dano de força, ou apenas metade em uma falha.\n\n▸ Ativação Intracerebral\nFenômeno de Nível 5 Custo: 10 Pontos de Energia Ativando os sinais elétricos intracerebrais, você aumenta grandemente a sua agilidade, velocidade e tempo de reação, alcançando níveis extremos. Enquanto ativação intracerebral estiver manifestado, seu valor de Destreza aumenta em 6, você recebe uma ação de movimento adicional por turno e realiza testes de Reflexos e Acrobacia com vantagem."},{"tec":"Dez Sombras","n":"ESTOQUE DAS SOMBRAS","nv":0,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Você se prepara para armazenar itens na sua própria sombra. Você pode guardar até 5 espaços de item na sua sombra. Retirar itens da sua sombra é uma ação livre na primeira vez, tornando-se uma ação bônus após isso."},{"tec":"Dez Sombras","n":"OCULTAÇÃO SOMBRIA","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"4,5 Metros","alvo":"Uma Sombra","dur":"Variável","area":"","custo":"","d":"Você se oculta em uma sombra. Você escolhe uma sombra dentro de 4,5 metros para se ocultar em, entrando nela. Enquanto dentro de uma sombra, você é indetectável e invisível, mas não pode se mover, sendo levado por ela. Você fica na sombra até que escolha sair ou que ela deixe de ser feita, nesse caso sendo expulso a força dela. Caso escolha sair e realize um ataque contra a criatura cuja sombra você estava em, a criatura está desprevenida contra o ataque."},{"tec":"Dez Sombras","n":"PASSO SOMBRIO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"9 Metros","alvo":"Uma Sombra","dur":"Imediata","area":"","custo":"","d":"Você avança e teleporta para a sombra de uma criatura não hostil dentro de 9 metros. Esse movimento não causa ataques de oportunidade."},{"tec":"Dez Sombras","n":"FUGA DO COELHO","nv":3,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você invoca diversos coelhos para o permitir evitar um ataque. Caso seja alvo de um ataque você pode, como uma reação, invocar vários coelhos, negando o ataque feito contra você. Os coelhos não podem ser controlados, por não serem shikigamis, e começam a se espalhar pelo campo de batalha, sumindo no começo do seu próximo turno. Além disso, você pode se mover para um ponto desocupado dentro de 9 metros, sem causar ataques de oportunidade."},{"tec":"Dez Sombras","n":"Expansão de Domínio: Jardim Das Sombras Sobrepostas","nv":6,"pas":false,"k":"Domínio","exec":"Ação Comum","alc":"Área de 4,5 m × bônus de treinamento","alvo":"","dur":"1 + nível de aptidão em Domínio (rodadas)","area":"","custo":"15 PE","d":"Jardim da Sombras Sobrepostas é a expansão de domínio das Dez Sombras, utilizada por Megumi Fushiguro.\n\nJardim das Sombras Sobrepostas [Incompleta] Sua expansão espalha sombras fluídas e densas pelo ambiente. Ela dura uma quantidade de rodadas igual a 1 + seu nível de aptidão em domínio e se expande por uma área igual a 4,5 metros multiplicado pelo seu bônus de maestria. Caso esteja em um espaço fechado e a expansão consiga cobri-lo, você consegue usar o próprio lugar como barreira. Sua expansão pode receber os seguintes efeitos:\n\n• Amplificação de Técnica: Invocações Persistentes. Enquanto dentro da expansão, você considera que todas as suas sombras já domadas estão ativas, podendo comandar qualquer uma delas sem necessidade de usar uma ação de invocação ou gastar PE para invocá-las.\n• Efeito Especial: Clones. Você manifesta uma quantidade de clones de você igual a metade do seu bônus de maestria, os quais possuem uma ação comum, uma ação bônus e uma reação, mas não podem comandar invocações. Ao ser alvo de um ataque, um dos clones pode usar a reação para tomar o ataque por você, sendo destruído, mas anulando o dano que você receberia.\n• Efeito Especial: Chão de Sombras. Caso tenha conseguido fechar uma barreira, toda criatura que estiver no domínio deve gastar 1PE por rodada para reforçar seus pés com energia amaldiçoada, caindo na sombra caso não consiga o fazer. Dentro da sombra não há resistência ou oxigênio, com a criatura caindo infinitamente no abismo, seguindo as regras de Segurando o Ar como se estivesse se sufocando.","reg":"Expansão Incompleta: 15 PE. Não possui Acerto Garantido."},{"tec":"Fala Amaldiçoada","n":"COMANDO: CORRER","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Quantidade de Criaturas a sua Escolha","dur":"Imediata","area":"","custo":"","d":"Você comanda uma quantidade qualquer de criaturas dentro de 12 metros a correrem. Criaturas voluntárias dentro da área se movem uma distância igual ao movimento delas; criaturas que não queiram se mover devem realizar um TR de vontade, movendo-se a força em uma falha."},{"tec":"Fala Amaldiçoada","n":"COMANDO: DESORIENTAR","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você comanda uma criatura a se desorientar, sentindo uma explosão mental. A criatura alvo deve realizar um TR de Astúcia, recebendo 2d8 de dano psíquico, ou apenas metade em um sucesso. Caso falhe, ela também recebe a condição Desorientado por uma rodada."},{"tec":"Fala Amaldiçoada","n":"COMANDO: TORCER","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você comanda uma criatura a ter o seu corpo torcido, sentindo dor. Uma criatura afetada deve realizar um TR de Fortitude, recebendo 3d8 de dano de força, ou apenas metade em um sucesso."},{"tec":"Fala Amaldiçoada","n":"COMANDO: EXPLODIR","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você comanda uma criatura a explodir. A criatura afetada deve realizar um TR de Fortitude, recebendo 5d8 de dano de força, ou apenas metade em um sucesso. Toda criatura adjacente ao alvo deve realizar um TR de Reflexos, recebendo metade do dano causado no alvo em uma falha."},{"tec":"Fala Amaldiçoada","n":"COMANDO: FOCAR","nv":2,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você comanda uma criatura a focar em suas tarefas, realizando-as com concentração total. A criatura afetada recebe +5 nas duas próximas rolagens de perícia que realizar."},{"tec":"Fala Amaldiçoada","n":"COMANDO: SANGRAR","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você comanda uma criatura a sangrar, criando cortes no corpo dela. A criatura afetada deve realizar um teste de resistência de Fortitude, recebendo 4d8 de dano cortante, ou apenas metade em um sucesso. Caso a criatura falhe, ela também recebe a condição Sangramento (Médio), perdendo 3d8 de vida ao falhar ou livrando-se em um sucesso."},{"tec":"Fala Amaldiçoada","n":"COMANDO: RESISTIR","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Duas Criaturas","dur":"Sustentada","area":"","custo":"","d":"Você comanda duas criaturas a constantemente resistir melhor a danos. Escolha dois aliados: ambos recebem 6 de redução de dano contra todos os tipos, exceto na alma. Para cada rodada após a primeira, você deve pagar 1 ponto de energia amaldiçoada para manter a habilidade ativa. Caso perca sua concentração, a habilidade se encerra."},{"tec":"Fala Amaldiçoada","n":"COMANDO: TEMER","nv":2,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você comanda um alvo a temer, invadindo sua mente. A criatura alvo deve realizar um teste de resistência de Vontade, recebendo 1d8 de dano psíquico, ou apenas metade em um sucesso. Caso falhe, a criatura também recebe a condição Amedrontado por 1 rodada."},{"tec":"Fala Amaldiçoada","n":"COMANDO: LEVANTAR","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você comanda uma criatura a se levantar. A criatura afetada é imediatamente estabilizada e desperta, caso esteja nos testes de morte ou inconsciente. Além disso, a criatura é curada, recuperando 4d12 pontos de vida."},{"tec":"Fala Amaldiçoada","n":"COMANDO: PARAR","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você escolhe uma criatura e a comanda a parar. A criatura afetada deve realizar um teste de resistência de Vontade: caso falhe, ela recebe as condições Imóvel e Incapacitado durante 1 rodada; caso suceda, ela recebe a condição Lento por 1 rodada."},{"tec":"Fala Amaldiçoada","n":"COMANDO: APAGAR","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"30 Metros","alvo":"Uma Quantidade de Criaturas a sua Escolha","dur":"Imediata","area":"","custo":"","d":"Você escolhe uma quantidade qualquer de criaturas dentro do seu alcance, comandando-as a dormirem. Todas as criaturas afetadas devem realizar um teste de resistência de Vontade. Uma criatura que falhe no teste recebe a condição Inconsciente até que seja acordada de alguma maneira (recebendo um ataque, usando uma ação para interagir com elas etc.)."},{"tec":"Fala Amaldiçoada","n":"COMANDO: OBEDECER","nv":5,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"48 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você comanda uma criatura a te obedecer, seguindo o percurso de ações que você deseja. A criatura alvo deve realizar um teste de resistência de Vontade e, caso falhe, você controla a criatura no próximo turno dela, decidindo quais ações ela realizará, como se moverá e o que fará."},{"tec":"Formação de Gelo","n":"CRIAÇÃO DE GELO","nv":0,"pas":false,"k":"Técnica","exec":"Variável","alc":"9 Metros","alvo":"","dur":"Imediata","area":"","custo":"","d":"Você cria gelo, variando desde formações, objetos e estruturas pequenas até o congelamento de superfícies ou líquidos. A ação utilizada para a criação do gelo varia conforme o que se busca criar, assim como as limitações devem ser definidas pelo mestre."},{"tec":"Formação de Gelo","n":"ESPETO DE GELO","nv":0,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"9 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você forma um espeto de gelo e o dispara contra uma criatura, perfurando. Realize um teste de ataque de técnica (Feitiçaria ou Pontaria) contra o alvo e, caso acerte, causa 1d10 de dano perfurante."},{"tec":"Formação de Gelo","n":"BRISA GELADA","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você cria uma brisa gelada ao redor de uma criatura dentro de 12 metros, a qual deve realizar um teste de resistência de Fortitude, recebendo 3d8 de dano congelante, ou apenas metade em um sucesso. Caso falhe, a criatura também terá desvantagem no próximo teste físico que realizar."},{"tec":"Formação de Gelo","n":"REVESTIMENTO DE GELO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Toque","alvo":"Uma Arma ou Armadura","dur":"Sustentada","area":"","custo":"","d":"Você reveste uma arma ou armadura com gelo, aumentando seu potencial destrutivo ou defensivo. Caso use em uma arma, ela causa 1d10 de dano congelante adicional; caso use em uma armadura, a criatura a utilizando recebe 4 de redução de dano adicional contra dano, exceto queimante e na alma. Para cada rodada após a primeira, você deve pagar 1PE para sustentar."},{"tec":"Formação de Gelo","n":"CONGELAMENTO","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"6 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Diminuindo a temperatura ao máximo, você começa a congelar uma criatura próxima. A criatura alvo deve realizar um teste de resistência de Fortitude, recebendo 4d8 de dano congelante, ou apenas metade em um sucesso. Uma criatura que falhe no teste também recebe a condição Congelamento ou tem o nível dela aumentado em um passo. Esta habilidade pode elevar o Congelamento até o Congelamento Médio."},{"tec":"Formação de Gelo","n":"ESTACA EXPLOSIVA","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você forma uma grande estaca de gelo, a qual está pronta para explodir ao atingir um alvo. Realize um teste de ataque de técnica (Feitiçaria ou Pontaria) contra uma criatura e, caso acerte, causa 4d8 de dano perfurante. Após atingir o alvo, a estaca explode, forçando todas as criaturas dentro de 3 metros do alvo a realizarem um teste de resistência de Reflexos, recebendo 4d8 de dano congelante, ou apenas metade em um sucesso."},{"tec":"Formação de Gelo","n":"AVALANCHE","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"","dur":"Imediata","area":"4,5 Metros","custo":"","d":"Você cobre sua mão com gelo e toca o chão, gerando vários espinhos grandes que são controlados para desabar sobre os alvos. O gelo vai até um ponto dentro do alcance, afetando uma área esférica de 4,5 metros a partir dele; toda criatura na área deve realizar um teste de resistência de Fortitude, recebendo um nível de congelamento em uma falha. Logo após, realizam um teste de resistência de Reflexos, recebendo 6d12 de dano congelante, ou apenas metade em um sucesso. Esta habilidade pode elevar o Congelamento até o Congelamento Médio."},{"tec":"Formação de Gelo","n":"CALMARIA DA GEADA","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"","dur":"Imediata","area":"9 Metros Cone","custo":"","d":"Você canaliza uma nuvem de névoa congelante na mão, liberando-a a frente, o que materializa grandes colunas para congelar os inimigos. O gelo afeta uma área cônica de 12 metros, a partir de você, forçando toda criatura nela a realizar um teste de resistência de Fortitude: em uma falha, ela recebe dois níveis de congelamento; em um sucesso, recebe um; em um sucesso crítico, nenhum. Esta habilidade pode elevar o Congelamento até o Congelamento Total."},{"tec":"Formação de Gelo","n":"EMPALAMENTO DEVASTADOR","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você manifesta uma estaca grande e afiada, disparando-a para empalar e devastar uma parte do seu alvo. Realize um teste de ataque de técnica (Feitiçaria e Pontaria) contra o alvo e, caso acerte, causa 10d10 de dano perfurante. Além disso, caso acerte, a criatura deve realizar um teste de resistência de Fortitude e, caso falhe, ela recebe uma Ferida Interna, de acordo com a tabela de consequências extremas."},{"tec":"Formação de Gelo","n":"TOQUE CONGELANTE","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Toque","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Ao tocar diretamente em uma criatura e concentrando um grande nível de energia, você é capaz de congelar quase diretamente a criatura, visando ser impossível resistir. A criatura alvo deve realizar um teste de resistência de Fortitude: em um sucesso crítico, evita completamente; em um sucesso comum, recebe 2 níveis de congelamento e, em uma falha, recebe 3 níveis de congelamento. Esta habilidade pode elevar o Congelamento até o Congelamento Total."},{"tec":"Ilimitado","n":"AZUL: ATRAÇÃO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você usa do azul para atrair uma criatura com um puxão. A criatura alvo deve realizar um teste de resistência de Fortitude, recebendo 2d10 de dano de força, ou apenas metade em um sucesso. Além disso, caso a criatura falhe no teste, ela é puxada 6 metros na sua direção."},{"tec":"Ilimitado","n":"MOVIMENTO IMEDIATO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"9 Metros","alvo":"Um Espaço Desocupado","dur":"Imediata","area":"","custo":"","d":"Você usa da sua distorção espacial para conseguir uma velocidade extremamente rápida de locomoção, semelhante a um pequeno teleporte. Ao usar essa habilidade, você imediatamente se move para um lugar desocupado dentro de 9 metros. Esse movimento não causa ataques de oportunidade."},{"tec":"Ilimitado","n":"AZUL: ATRAÇÃO CONSTANTE","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Sustentada","area":"","custo":"","d":"Você constantemente usa do azul em seus punhos, atraindo no exato momento em que vai desferir um golpe com eles. Sempre que desferir um golpe desarmado com esta habilidade ativa, ele causa 1d10 de dano de força adicional. Para cada turno após o primeiro, você deve pagar 1 ponto de energia para manter a habilidade ativa."},{"tec":"Ilimitado","n":"AMPLIFICAÇÃO DO INFINITO","nv":1,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você amplifica o foco no infinito, dedicando-se a parar golpes que vá receber. Como reação a ser atacado, você dobra o bônus na classe de armadura e na redução de dano garantida pelo infinito, até o final do turno atual. Sempre que os bônus do infinito aumentarem, o custo desta habilidade aumenta em 2 pontos de energia."},{"tec":"Ilimitado","n":"VOAR","nv":1,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Refinando o seu nível de controle com o infinito, você se torna capaz de pairar sobre o ar, aproximando-se da capacidade de voar. Você recebe 9 metros de movimento de voo e se torna capaz de parar no ar, mantendo-se estático. Seu máximo de energia amaldiçoada é diminuído em 2."},{"tec":"Ilimitado","n":"AZUL: COMPRESSÃO","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você utiliza do azul para comprimir o espaço ao redor de uma criatura, amassando-a. A criatura alvo deve realizar um teste de resistência de Fortitude, recebendo 7d8 de dano de força, ou apenas metade em uma falha."},{"tec":"Ilimitado","n":"AZUL: COLISÃO","nv":2,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"18 Metros","alvo":"Duas Criaturas","dur":"Imediata","area":"","custo":"","d":"Você cria dois pontos de atração em duas criaturas diferentes, forçando uma colisão entre elas. Ambas as criaturas devem realizar um teste de resistência de Fortitude, recebendo 2d8 de dano de força e sendo puxadas uma na direção da outra, causando uma colisão. A colisão causa dano adicional igual a 1d8 de dano de força para cada categoria de tamanho das criaturas envolvidas, acima de minúsculo (a colisão de duas criaturas médias causaria 4d8 de dano)."},{"tec":"Ilimitado","n":"DESVIO IMEDIATO","nv":2,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você utiliza do azul para puxar o seu corpo imediatamente para fora do caminho de um golpe corpo-a-corpo. Como uma reação ao receber um ataque corpo-a-corpo, realize um teste de reflexos: caso seu resultado seja superior ao do ataque, você desvia para um ponto dentro de 3 metros e nega o ataque; em uma falha, você reduz o dano à metade."},{"tec":"Ilimitado","n":"PONTO DE ATRAÇÃO","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"Um Ponto","dur":"Sustentada","area":"","custo":"","d":"Você cria um azul em um ponto dentro de 24 metros, transformando-o em uma força atrativa constante. O ponto de atração afeta uma área esférica de 6 metros e todas as criaturas dentro da área afetada devem realizar um teste de resistência de Fortitude, recebendo 4d12 de dano de força, ou apenas metade em um sucesso. Caso falhe, a criatura também é puxada para o centro da área, recebendo a condição Imóvel por uma rodada. Para cada rodada após a primeira, você deve pagar 2 pontos de energia amaldiçoada para sustentar o ponto de atração. Enquanto o ponto estiver sendo sustentado, uma criatura dentro da área tem a condição Lento e a área conta como terreno difícil; caso uma criatura termine o seu turno dentro da área, mas distante do centro, ela deve repetir o teste de Fortitude, sendo puxada novamente em uma falha."},{"tec":"Ilimitado","n":"TELEPORTE DE LONGA DISTÂNCIA","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"","dur":"Imediata","area":"","custo":"","d":"Você comprime o espaço entre você e um ponto alvo, teleportando-se de maneira imediata. O lugar alvo pode estar a longas distâncias, mas deve ser um lugar que você conheça e já tenha ido em algum momento. Você se teleporta, além de teleportar qualquer criatura ou objeto que você estiver tocando."},{"tec":"Ilimitado","n":"VERMELHO: REPULSÃO","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você usa a reversão de técnica no Ilimitado, criando o poder de repelir, comprimido em uma pequena esfera vermelha que libera uma extrema força explosiva. O alvo deve realizar um teste de resistência de Fortitude, recebendo 10d8 de dano de força, ou apenas metade em um sucesso. Caso falhe, o alvo também é empurrado 12 metros para trás, ou apenas 6 em um sucesso comum. [Requer Reversão de Técnica]"},{"tec":"Ilimitado","n":"AZUL: IMPLOSÃO ABSOLUTA","nv":4,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"6 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você causa a implosão absoluta de uma criatura, utilizando do azul para comprimir ao máximo o espaço ao redor dela. A criatura alvo deve realizar um teste de resistência de Fortitude, recebendo 3d10 de dano, ou apenas metade em um sucesso. Caso a criatura falhe no teste, você consegue comprimir extremamente seu corpo: ela perde ou os braços ou as pernas, a sua escolha, recebendo consequências equivalentes aos membros perdidos."},{"tec":"Ilimitado","n":"CRIAÇÃO DE IMAGENS","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Movendo-se em uma velocidade extrema, você cria várias imagens a partir do seu movimento, confundindo um inimigo. Ao utilizar a habilidade, você cria duas imagens replicando o seu movimento. Caso você seja alvo de um ataque, o atacante deve realizar um teste de resistência de Astúcia e, caso falhe, ele ataca uma das imagens, com o ataque sendo anulado e a imagem dissipada. Ao atacar, as imagens também podem ser utilizadas para simular ataques e confundir o alvo: quando realizar uma ação de ataque, caso haja pelo menos uma imagem restante, você terá vantagem no ataque e, caso as duas estejam presentes, você recebe +5 na rolagem de ataque."},{"tec":"Ilimitado","n":"DISPARO CARMESIM","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"30 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você junta dois dedos na forma de uma pistola e dispara um vermelho altamente destrutivo. A criatura alvo deve realizar um teste de resistência de Reflexos, recebendo 12d10 de dano de força, ou apenas metade em um sucesso. Uma criatura que falhe também é empurrada 18 metros para trás, ou apenas 9 em um sucesso. [Requer Reversão de Técnica]"},{"tec":"Ilimitado","n":"EMPURRAR","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você utiliza do vermelho para focar em empurrar uma criatura dentro de 18 metros, forçando-a ao máximo. A criatura alvo deve realizar um TR de Fortitude: em uma falha, a criatura é empurrada até 30 metros para trás, ou apenas metade em um sucesso. Enquanto estiver sendo empurrada, a criatura irá quebrar qualquer obstáculo no caminho, recebendo 1d10 ao atingir um objeto de peso considerável; 2d10 um objeto pesado; e 4d10 em um objeto extremamente pesado. No fim do trajeto, ela deve realizar um teste de resistência de Fortitude, recebendo a condição Atordoado por uma rodada caso falhe, ou Caído caso suceda. [Requer Reversão de Técnica]"},{"tec":"Ilimitado","n":"VERMELHO CONTROLADO","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você dispara um vermelho contra uma criatura dentro de 18 metros. A criatura alvo deve realizar um teste de resistência de Fortitude, recebendo 12d10 de dano de força ou apenas metade em um sucesso. Após atingir a criatura, porém, você mantém o vermelho controlado, movendo-o de maneira discreta pelo ambiente para um ponto dentro de 9 metros. Como uma ação livre, no turno de conjuração ou no turno seguinte, você pode explodir o vermelho, forçando uma criatura próxima a realizar um teste de resistência de Fortitude, sendo empurrada 9 metros em uma falha ou apenas metade em um sucesso: caso, ao ser empurrada, a criatura entre em seu alcance de ataque, você pode utilizar sua reação para realizar um ataque corpo-a-corpo contra ela, o qual terá vantagem e será um crítico garantido caso acerte. [Requer Reversão de Técnica]"},{"tec":"Ilimitado","n":"VAZIO ROXO","nv":5,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"","alvo":"","dur":"Imediata","area":"Uma linha de 27 metros a sua frente","custo":"","d":"Você causa a fusão do azul com o vermelho, uma técnica complexa que colide dois infinitos para criar massa imaginária, a qual apaga tudo a sua frente. Ao usar essa habilidade, você cria uma enorme esfera roxa, a qual se propaga por uma linha reta de 27 metros a partir de você, com 4,5 metros de largura. Todo objeto pego no caminho dela é apagado e criaturas afetadas devem realizar um teste de resistência de Fortitude, recebendo 17d12 de dano de força, ou apenas metade em sucesso. Caso uma criatura tenha seus pontos de vida reduzidos a 0 pela habilidade, ela é apagada da existência. O dano causado por esta habilidade ignora imunidade, resistência e qualquer tipo de redução de dano. [Requer Reversão de Técnica]\n\n▸ Técnica Máxima: Vazio Roxo Irrestrito\nEmbora não seja colocado dentro da obra como uma técnica máxima, o Vazio Roxo Irrestrito foi colocado como uma dentro de Feiticeiros e Maldições, devido ao fato de ser a mais poderosa técnica usada com o Ilimitado."},{"tec":"Ilimitado","n":"VAZIO ROXO IRRESTRITO","nv":6,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"9 Metros","alvo":"","dur":"Imediata","area":"","custo":"25 PE","d":"Inovando no uso do Ilimitado, você cria um vazio roxo que não é direcionado a um alvo específico, causando uma destruição irrestrita. Ao utilizar esta habilidade, você remotamente cria um azul e um vermelho, combinando-os em um ponto dentro de 9 metros: após os combinar, você ocasiona uma explosão do vazio roxo a partir deles, a qual afeta uma área esférica de 50 metros. Todas as criaturas dentro da área, incluindo você, devem realizar um teste de resistência de Fortitude, recebendo 26d10 de dano de força, ou apenas metade em um sucesso; o teste é realizado com desvantagem e o dano causado por essa habilidade ignora imunidade, resistência e qualquer tipo de redução de dano. Toda a área afetada pela habilidade é destruída e devastada, transformando estruturas e objetos em detritos. O dano que você recebe pela habilidade é reduzido a 1/4, por ser originado de sua própria energia. (Habilidades como Técnica Cuidadosa não podem ser aplicadas nela.) HABILIDADES ADICIONAIS","reg":"Técnica Máxima: 25 PE. Depois de usar, não pode ser usada de novo durante a mesma cena."},{"tec":"Ilimitado","n":"LIBERAÇÃO MÁXIMA: PONTO DE ATRAÇÃO","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"Um Ponto","dur":"Sustentada","area":"","custo":"12 PE","d":"Você cria um azul em um ponto dentro de 24 metros, transformando-o em uma força atrativa constante. O ponto de atração afeta uma área esférica de 7,5 metros e todas as criaturas dentro da área afetada devem realizar um teste de resistência de Fortitude, recebendo 5d12 de dano de força, ou apenas metade em um sucesso. Caso falhe, a criatura também é puxada para o centro da área, recebendo a condição Imóvel por uma rodada. Para cada rodada após a primeira, você deve pagar 2 pontos de energia amaldiçoada para sustentar o ponto de atração. Enquanto o ponto estiver sendo sustentado, uma criatura dentro da área tem a condição Lento e a área conta como terreno difícil; caso uma criatura termine o seu turno dentro da área, mas distante do centro, ela deve repetir o teste de Fortitude, sendo puxada novamente em uma falha. Você também pode escolher, como uma ação bônus, mover o ponto de atração até uma distância máxima de 18 metros; caso seja movido, toda criatura na área também é movida juntamente, assim como objetos e estruturas pelas quais o ponto passe são destruídas, podendo causar danos naqueles presos no centro, baseado na tabela Dano de Fontes Variadas. [Liberação Máxima de Ponto de Atração] LIBERAÇÃO MÁXIMA: COMPRESSÃO ABSOLUTA Habilidade de Técnica Nível 4 Conjuração: Ação Completa Alcance: 6 Metros Alvo: Uma Criatura Duração: Imediata Você causa a compressão total de uma criatura, utilizando do azul com uma liberação superior de energia. A criatura alvo deve realizar um teste de resistência de Fortitude, recebendo 4d10 de dano, ou apenas metade em um sucesso. Caso a criatura falhe no teste, você consegue a comprimir, com ela recebendo a condição Imóvel e começando a ser movida junto do azul, até um ponto a sua escolha dentro de 30 metros; durante o percurso ela irá destruir tudo pelo que passar, além de atrair objetos e detritos, recebendo dano conforme a tabela de Dano de Fontes Variados. No fim do percurso, caso tenha sobrevivido, a criatura deve realizar um teste de resistência de Fortitude, realizando uma rolagem na tabela de consequências extremas em um sucesso, ou duas em uma falha, tendo perdas no seu corpo conforme os resultados. [Liberação Máxima de Implosão Absoluta]","reg":"Liberação Máxima: custo da habilidade +50% (tabela do livro: nível 1 = 3, 2 = 8, 3 = 12, 4 = 18, 5 = 30 PE)."},{"tec":"Ilimitado","n":"Expansão de Domínio: Vazio Imensurável","nv":6,"pas":false,"k":"Domínio","exec":"Ação Comum","alc":"Esfera de 9 m","alvo":"","dur":"3 + nível de aptidão em Domínio (rodadas)","area":"","custo":"25 PE","d":"Esta é a expansão do Ilimitado utilizada por Satoru Gojo, a qual necessita que o usuário da técnica possua os Seis Olhos. Ela é uma expansão completa letal. Vazio Imensurável [Completa] Sua expansão cria um espaço próprio que ocupa área esférica de 9 metros, a qual dura uma quantidade de rodadas igual 3 + seu nível de aptidão em domínio. Ela pode receber os seguintes efeitos:\n\n• Acerto Garantido: Descarga de Informações. Para poder seguir este padrão da expansão, é necessário possuir a aptidão amaldiçoada Acerto Garantido, a qual irá causar a descarga de informações em uma criatura. O efeito do acerto é: uma criatura que comece seu turno dentro da expansão deve realizar um TR de Astúcia e, em uma falha, ela tem os seus atributos mentais reduzidos para 0, com seu cérebro sobrecarregando com o infinito de conhecimento.\n• Efeito Ambiental: Dano. Uma criatura que tenha falhado no teste do seu acerto garantido, com os atributos mentais reduzidos para 0, recebe 1d10+5 de dano psíquico no começo de todo turno dela.\n• Efeito Ambiental: Condições. Toda criatura que não seja você ou esteja te tocando, dentro do domínio, recebe a condição Paralisado. [Este efeito requer Aptidão em Domínios 5].\n• Amplificação de Técnica: Aumento de CD. A Classe de Dificuldade para resistir a todas suas habilidades de técnica, e acerto garantido, aumenta em 2.\n\nQuando a expansão dissipa, caso a criatura tenha falhado no teste enquanto dentro dela, ela mantém as condições recebidas e alteração nos seus atributos, as quais só são revertidas após dias ou meses, a depender do tempo em que foi afetada.","reg":"Expansão Completa letal: 20 PE + 5 PE de Acerto Garantido = 25 PE."},{"tec":"Love Rendezvous","n":"MARCAR ENERGIA","nv":0,"pas":false,"k":"Técnica","exec":"Variável","alc":"","alvo":"Energia Amaldiçoada","dur":"","area":"","custo":"","d":"Ao estar em contato com a energia amaldiçoada de uma criatura, você pode a marcar com uma das cinco estrelas. Como uma ação comum, você pode marcar até duas energias amaldiçoadas como parte do mesmo uso, enquanto como uma ação bônus marca apenas uma. Quando marcada, um pequeno brilho acontecerá sobre a cabeça da criatura ao ativar a técnica. Uma criatura marcada deve seguir as regras especificadas no Funcionamento Básico para se mover. Você pode remover a marca de uma energia amaldiçoada como ação livre, incluindo a sua própria. A marca dura até que você a desative ou remova."},{"tec":"Love Rendezvous","n":"IMBUIR OBJETO","nv":0,"pas":false,"k":"Técnica","exec":"Variável","alc":"Toque","alvo":"Objetos","dur":"Imediata","area":"","custo":"","d":"Você imbui objetos com energia, visando os tornar em alvos válidos para o uso da sua técnica. Como uma ação comum, você pode imbuir até três objetos, como uma ação bônus pode imbuir dois e como ação livre pode imbuir um. Caso já tenha uma estrela marcada na sua energia ao usar essa habilidade, os objetos terão a mesma estrela.\n\nUtilizando da técnica, é possível transformar objetos em efetivas armas, colocando energia amaldiçoada neles de maneira a permitir que sejam marcados com diferentes estrelas e direcionados a alguém marcado que acabe por se mover de maneira errada, de acordo com as regras da técnica (aquele que tiver a maior liberação de energia é quem puxará o outro quando a atração ocorrer), com um acerto garantido e inevitável. Para calcular o dano de diferentes objetos, use como referência a tabela Dano de Fontes Variadas do Livro Básico.\n\n▸ Aprimoramentos de Técnica\nComo uma técnica que depende do seu funcionamento básico e das habilidades de técnica iniciais, outras habilidades de Love Rendezvous se resumem a aprimoramentos da técnica em forma de habilidades passivas de diferentes níveis."},{"tec":"Love Rendezvous","n":"MARCAÇÃO RÁPIDA","nv":0,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Você se torna capaz de realizar a marcação de energia mais rapidamente. Você pode utilizar a habilidade de técnica Marcar Energia como uma reação para marcar uma energia amaldiçoada."},{"tec":"Love Rendezvous","n":"AGILIDADE COM ESTRELAS","nv":1,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Você se torna mais ágil com o uso das diferentes estrelas e marcações. A quantidade de energias amaldiçoadas que você pode marcar com Marcar Energia aumenta em um: três como uma ação comum e duas como ação bônus. Seu máximo de energia amaldiçoada diminui em 2."},{"tec":"Love Rendezvous","n":"MARCAS OCULTAS","nv":1,"pas":false,"k":"Técnica","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Marcar a energia de uma criatura com uma estrela coloca o seu nome em algum lugar do seu corpo, sendo necessário encontrá-la. Uma criatura que tenha sua energia deve utilizar uma ação bônus para poder descobrir qual estrela está marcada em sua energia. Seu máximo de energia amaldiçoada diminui em 2."},{"tec":"Manipulação de Fantoches","n":"MODO DE LÂMINA","nv":0,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Ilimitada","area":"","custo":"","d":"Você transforma o seu braço em uma forma ofensiva, com várias lâminas surgindo nele. Seus ataques desarmados passam a causar 1d6 de dano cortante."},{"tec":"Manipulação de Fantoches","n":"ESCUDO DEFINITIVO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Sustentada","area":"","custo":"","d":"Você cria vários espinhos em um do seu braço, reforçando-o e o transformando em uma espécie de escudo metálico. Sua classe de armadura aumenta em 2 e, ao ser alvo de um ataque corpo-a-corpo, você pode usar sua reação para colocar o escudo espinhento a sua frente, causando 2d6 de dano perfurante no atacante. Você precisa sustentar esta habilidade, pagando 1 de energia por rodada."},{"tec":"Manipulação de Fantoches","n":"GIRO DEFINITIVO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Enquanto seu braço está em forma de ataque, você o rotacional rapidamente, transformando-o em uma espécie de broca. Para usar esta habilidade, você precisa estar com Modo de Lâmina ativa. Ao usá-la, você avança contra uma criatura dentro de 12 metros, a qual realiza um teste de resistência de Reflexos, recebendo 3d8 de dano perfurante, ou metade em um sucesso."},{"tec":"Manipulação de Fantoches","n":"IMPULSO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"","alvo":"","dur":"Imediata","area":"","custo":"","d":"Você impulsiona o seu corpo, movendo-se rapidamente. Você pode se mover até 7,5 metros, e esse movimento não causa ataques de oportunidade."},{"tec":"Manipulação de Fantoches","n":"ULTRA CANHÃO: DISPERSO","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"","dur":"Imediata","area":"9 Metros Linha","custo":"","d":"Você dispara energia em uma linha reta de 9 metros a sua frente. Toda criatura na linha realiza um teste de resistência de Reflexos, recebendo 4d8 de dano de força, ou apenas metade em um sucesso."},{"tec":"Manipulação de Fantoches","n":"ULTRA CANHÃO: FOCADO","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você dispara energia focada em um único alvo. A criatura realiza um TR de Reflexos, recebendo 7d8 de dano de força, ou apenas metade em um sucesso."},{"tec":"Manipulação de Fantoches","n":"MODO: ALBATROZ","nv":3,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Sustentada (2 Pontos por Rodada)","area":"","custo":"","d":"Você modifica a sua cabeça, projetando um canhão a partir de sua mandíbula. Enquanto neste modo, você pode realizar ataques com o canhão imbuído, considerando como se fosse um Canhão de Mão, com 2 níveis de dano acima. Você pode usar tanto Pontaria quanto Feitiçaria para disparos com ele."},{"tec":"Manipulação de Fantoches","n":"CANHÃO DEFINITIVO","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"30 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você concentra quantidades enormes de energia em seu canhão, realizando um disparo potente. Para usar esta habilidade, você precisa estar com Modo: Albatroz ativado. A criatura alvo realiza um teste de resistência de Reflexos, recebendo 13d10 de dano de força, ou apenas metade em um sucesso. Uma criatura afetada por esta habilidade também recebe a condição Desorientado por 4 rodadas, devido ao poder da explosão. Uma criatura afetada pela condição pode repetir o teste no final de todo turno dela, livrando-se antecipadamente da condição em um sucesso."},{"tec":"Manipulação de Maldições","n":"INVOCAÇÃO EMERGENCIAL","nv":0,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você rapidamente invoca uma das maldições dentro de seu estoque para o proteger, servindo como resposta a um perigo. Ao ser alvo de um ataque ou afetado por uma habilidade de dano você pode, como uma reação, invocar uma maldição para o proteger. Você paga metade do custo para invocar a maldição, e reduz o dano em um valor igual a 5 multiplicado pelo custo pago para usar a habilidade. Você pode escolher armazenar a maldição novamente, após a invocar, ou mantê-la em campo, pagando o resto do custo de invocação dela."},{"tec":"Manipulação de Maldições","n":"INVOCAÇÃO EXPLOSIVA","nv":0,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"","alvo":"","dur":"Imediata","area":"","custo":"","d":"Você puxa as suas invocações de maneira explosiva, fazendo com que tenham uma primeira ação imediata assim que invocadas. Ao usar essa habilidade, você pode invocar uma quantidade de maldições igual a 1 + metade do seu bônus de maestria, além de as comandar a realizar uma ação complexa cada, como parte do uso da habilidade. O custo da habilidade é igual ao custo somado de todas as maldições invocadas."},{"tec":"Manipulação de Maldições","n":"INVOCAÇÃO RÁPIDA","nv":0,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"","dur":"Imediata","area":"","custo":"","d":"Você se foca em trazer ao campo o máximo de maldições possíveis de uma vez, adiantando o seu processo de preparo e domínio do campo de batalha. Ao usar essa habilidade, você pode invocar uma quantidade de maldições igual ao número máximo de invocações que você pode ter em campo, em espaços desocupados dentro de 9 metros de você. O custo da habilidade é igual ao custo somado de todas as maldições invocadas.\n\n▸ Técnica Máxima: Uzumaki\nA Manipulação de Maldições tem como sua técnica máxima o Uzumaki."},{"tec":"Manipulação de Maldições","n":"UZUMAKI","nv":6,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"36 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"25 PE","d":"Você começa a combinar e condensar suas maldições em apenas uma, a qual toma a forma de um espírito amaldiçoado em espiral, levitando atrás de si. Quando desejar, você o libera em um alvo, avançando instantaneamente: o alvo deve realizar um TR de Reflexos, recebendo apenas metade do dano em um sucesso. O dano da habilidade é formado conforme as maldições que você decide colocar nela: cada maldição adiciona 2d12 de dano, aumentando em mais 2d12 para grau acima do quarto (4d12 para 3° grau, 6d12 para 2° grau e assim a seguir). Além disso, caso utilize uma maldição de 1° grau ou superior, que tenha uma técnica, você a extrai, podendo utilizá-la uma vez. Toda maldição utilizada na habilidade é perdida.\n\n▸ Adaptando Maldições Consumidas\nComo mencionado, uma maldição que seja consumida pelo usuário da técnica deve ser adaptada como uma invocação. Para questões de mecânica, uma maldição se torna um shikigami uma vez que em sua posse.\n\nA adaptação é baseada no grau da maldição consumida, o qual se mantém quando se torna uma invocação, considerando as regras do Capítulo 10: Invocações do Livro Básico. Os atributos, classe de armadura e movimento são preservados, entretanto, há algumas peculiaridades sobre outros valores:\n\n• A vida deve ser calculada novamente, utilizando o cálculo padrão, mas o bônus fixo por grau é dobrado.\n• As perícias que a maldição possuía enquanto inimigo são mantidas, mas é possível adicionar nelas, caso estejam abaixo da quantidade que teria como uma invocação do grau dela.\n• As ações e características são adaptadas, considerando a quantidade que poderia ter por padrão, assim como as adições no custo para aumentos nessa quantidade. Normalmente, tanto ações quanto características necessitarão de adaptações em seus valores e poder.","reg":"Técnica Máxima: 25 PE. Depois de usar, não pode ser usada de novo durante a mesma cena."},{"tec":"Manipulação de Pássaros Negros","n":"CONEXÃO TELEPÁTICA","nv":0,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"9 Metros","alvo":"Pássaros","dur":"Ilimitada","area":"","custo":"","d":"Você estabelece uma conexão telepática com uma quantidade de pássaros negros a sua escolha, dentro de 9 metros. Após estabelecer a conexão, você recebe a condição Cego, passando a enxergar através apenas dos olhos dos pássaros. Você também pode controlar os pássaros, manipulando-os para se mover. Entretanto, os pássaros não podem se afastar mais do que 100 metros de você. Você pode encerrar a conexão como uma ação livre."},{"tec":"Manipulação de Pássaros Negros","n":"RASANTE ENERGÉTICO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você comanda poucos corvos a darem um rasante em direção a um inimigo, cobertos de energia. Você pode comandar até 4 pássaros a avançarem contra uma criatura, com mínimo de 1. Para cada pássaro, a habilidade causa 1d8 de dano de força. O alvo da habilidade deve realizar um teste de resistência de Reflexos, diminuindo o dano pela metade em um sucesso."},{"tec":"Manipulação de Pássaros Negros","n":"NUVEM DE CORVOS","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Variável","area":"","custo":"","d":"Você envia uma certa quantidade de corvos para circundarem um aliado, defendendo-o. Você pode enviar qualquer quantidade de corvos para o aliado, com a CA dele aumentando em 1 para cada corvo. Essa habilidade dura até que você a cancele, comandando os pássaros a retornar como uma ação livre, finalizando o seu efeito."},{"tec":"Manipulação de Pássaros Negros","n":"AVANÇO COLETIVO","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você comanda alguns corvos a avançarem diretamente em um inimigo, os quais o atacam intensamente com a sua energia. Você pode comandar até 4 pássaros a avançarem contra uma criatura, com mínimo de 1. Para cada pássaro, a habilidade causa 2d8 de dano de força. além de deixar a criatura desprevenida até o começo do próximo turno dela. O alvo da habilidade deve realizar um teste de resistência de Reflexos, diminuindo o dano pela metade em um sucesso, além de evitar a condição."},{"tec":"Manipulação de Pássaros Negros","n":"SACRIFÍCIO DEFENSIVO","nv":2,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Seus corvos estão dispostos a se sacrificar para defender o seu líder. Caso você seja atacado, e tenha pássaros próximos, você pode escolher os sacrificar como uma reação, para reduzir o dano. Você pode escolher sacrificar uma quantidade de pássaros a sua escolha, reduzindo o dano em 10 para cada pássaro sacrificado, os quais são mortos imediatamente."},{"tec":"Manipulação de Pássaros Negros","n":"FESTIM DOS CORVOS","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"Uma Criatura","dur":"Variável","area":"","custo":"","d":"Você manda seus corvos cercarem um inimigo e começarem a festejar nele, atacando-o sem pausa. Você pode comandar até 5 pássaros a cercarem uma criatura, com mínimo de 1. Para cada pássaro, a habilidade causa 3d8 de dano de força. A criatura alvo deve realizar um teste de resistência de Fortitude, reduzindo o dano à metade em um sucesso. No começo de todo turno seu, ela deve repetir o teste, recebendo metade do dano novamente em uma falha. A habilidade dura até que todos os pássaros sejam mortos ou você a cancele como uma ação bônus."},{"tec":"Manipulação de Pássaros Negros","n":"DESCARGA DEVASTADORA","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"30 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Sobrecarrega os seus corvos e faz com que eles se acumulem em um inimigo, logo depois descarregando a sua energia adicional, o que coloca a vida deles em risco. Você pode comandar até 6 pássaros a avançarem contra um inimigo, com mínimo de 1. Para cada pássaro, a habilidade causa 3d10 de dano de força, além de deixar a criatura desprevenida e desorientada até o começo do seu próximo turno. O alvo da habilidade deve realizar um teste de resistência de Reflexos, diminuindo o dano pela metade em um sucesso, além de evitar as condições. Todo pássaro usado na habilidade tem 50% de chance de morrer (1 a 5 em 1d10)."},{"tec":"Manipulação de Pássaros Negros","n":"ATAQUE DO CORVO KAMIKAZE","nv":5,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"48 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"A melhor maneira de se evoluir é com a vida em risco. Você ordena seus pássaros a atacarem um alvo, enquanto fazem um pacto de sacrifício. Você pode comandar até 6 pássaros a avançarem na criatura, com mínimo de 1. Para cada pássaro, a habilidade causa 3d12 de dano de força, além de deixar a criatura desprevenida e desorientada até o começo do seu próximo turno. O alvo da habilidade deve realizar um teste de resistência de Reflexos, diminuindo o dano pela metade em um sucesso, além de evitar as condições. Todo pássaro usado na habilidade morre após a sua conjuração. Caso você tenha usado pelo menos 6 pássaros na habilidade, a criatura também recebe a condição Atordoado por 1 rodada caso falhe no teste de resistência."},{"tec":"Manipulação Sanguínea (Kamo)","n":"BOLSAS DE SANGUE","nv":0,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Você consegue facilmente manipular o seu sangue e, visando diminuir a preocupação com sangramentos, você passa a armazenar em bolsas. Ao iniciar uma missão, você possui uma quantidade de bolsas de sangue igual a metade do seu bônus de maestria. Cada bolsa de sangue pode armazenar o equivalente ao seu bônus de maestria multiplicado por 5 em pontos de vida, os quais podem ser utilizados ao invés dos seus para habilidades. Durante descansos, você pode utilizar dados de vida para encher as bolsas novamente, deixando de se curar para enchê-las."},{"tec":"Manipulação Sanguínea (Kamo)","n":"COBRIR COM SANGUE","nv":0,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Uma Arma ou Projétil","dur":"Sustentada","area":"","custo":"","d":"Você pode usar de sangue externo para cobrir uma arma ou projétil. Durante uma rodada, a arma ou projétil coberto causam 1d10 de dano adicional. Para cada rodada após a primeira, você deve pagar 1 ponto de energia e o custo em pontos de vida novamente para manter o sangue sobre a arma, reforçando-a constantemente."},{"tec":"Manipulação Sanguínea (Kamo)","n":"FLUXO CONTIDO","nv":0,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Conseguindo controlar o seu fluxo sanguíneo, é possível tentar o manter dentro do seu corpo nos momentos em que isso é necessário. Você recebe vantagem em rolagens de testes de morte e imunidade a condição Sangramento."},{"tec":"Manipulação Sanguínea (Kamo)","n":"FLECHA DE SANGUE","nv":1,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Um Projétil","dur":"Imediata","area":"","custo":"","d":"Você concentra sangue em um projétil para influenciar no seu rumo. Ao realizar um ataque à distância, você pode usar sua reação para o cobrir completamente de sangue, fazendo com que ele cause 2d10 de dano adicional em um acerto. Além disso, caso você erre o ataque, você pode o rolar novamente e ficar com o melhor resultado, influenciando no rumo do projétil coberto com o sangue."},{"tec":"Manipulação Sanguínea (Kamo)","n":"RESTRIÇÃO CARMESIM","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você manipula o sangue e o transforma em laços, com intuito de restringir uma criatura. Você forma e dispara uma rede de sangue em uma criatura, a qual deve realizar um teste de resistência de Reflexos com CD aumentada em 2: em uma falha, ela fica imóvel; em um sucesso, fica enredada. No começo de todo turno dela, uma criatura afetada pela restrição carmesim pode realizar um teste de Atletismo contra sua CD de técnica para tentar escapar, conseguindo em um sucesso."},{"tec":"Manipulação Sanguínea (Kamo)","n":"BLOQUEIO RÁPIDO","nv":2,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você concentra sangue para bloquear um golpe, conseguindo gerar um rápido bloqueio, utilizando de sangue para evitar danos que seriam maiores. Como uma reação, você pode gastar até uma quantidade de pontos de vida igual ao seu bônus de maestria multiplicado por 5 e, para cada ponto de vida gasto, o dano que receberia é reduzido em 2."},{"tec":"Manipulação Sanguínea (Kamo)","n":"SANGUE PERFURANTE","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você dispara um raio de sangue com longo alcance e alta velocidade. Realize um teste de ataque de técnica, causando 9d8 de dano perfurante em um acerto. Devido a velocidade do projétil, você possui +2 no teste de acerto desta habilidade."},{"tec":"Manipulação Sanguínea (Kamo)","n":"CICLAGEM SANGUÍNEA","nv":2,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Você se torna capaz de manter uma ciclagem do seu sangue que está fora do seu corpo, reduzindo as perdas ao utilizar habilidades. Sempre que usar uma habilidade de técnica você pode realizar um teste de Fortitude com CD igual a 10 + 4 para cada nível da habilidade e, caso suceda, você consegue manter uma quantidade de sangue equivalente à metade dos pontos de vida gastos na habilidade ao seu redor, reutilizando-os em outras habilidades de técnica. Por ser um processo exaustivo, caso reutilize uma quantidade de pontos de vida igual ao seu modificador de Constituição multiplicado por 10, sem realizar um descanso, você recebe 1 ponto de exaustão cada vez que reutilizar sangue com esta habilidade. Seu máximo de energia amaldiçoada é reduzido em 4 pontos."},{"tec":"Manipulação Sanguínea (Kamo)","n":"CONVERGÊNCIA","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"30 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você comprime e condensa sangue ao limite para criar um único projétil devastador. Realize um teste de ataque de técnica, causando 15d8 de dano perfurante em um acerto. Devido a velocidade do projétil, você possui +4 no teste de acerto desta habilidade."},{"tec":"Manipulação Sanguínea (Kamo)","n":"EXORCISMO CORTANTE","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Um ataque cortante com longo alcance, o qual concentra o sangue em um disco com rápida rotação. A criatura alvo deve realizar um teste de resistência de Reflexos, recebendo 9d8 de dano cortante, ou apenas metade em um sucesso. Além disso, a criatura deve realizar um teste de resistência de Fortitude, recebendo a condição Sangramento (Forte) em uma falha, repetindo o teste no começo do turno dela, perdendo 4d12 de vida ou se livrando da condição em um sucesso."},{"tec":"Manipulação Sanguínea (Kamo)","n":"FLUXO DAS ESCAMAS VERMELHAS","nv":3,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Variável","area":"","custo":"","d":"Você aumenta a temperatura, batimentos e quantidade de células sanguíneas no seu corpo para impulsionar suas capacidades físicas. Ao ativar essa habilidade, os seus valores de Força e Destreza aumentam em 2, seu movimento aumenta em 3 metros e você recebe +4 em rolagens de Reflexos. Para cada turno após o primeiro, em que a habilidade estiver ativa, você deve pagar 2 pontos de energia para a manter sustentada, encerrando-se caso você não pague. Você também pode a encerrar como uma ação livre, dentro do seu turno. Esta habilidade não consome pontos de vida para ser usada."},{"tec":"Manipulação Sanguínea (Choso)","n":"CONVERGÊNCIA","nv":0,"pas":false,"k":"Técnica","exec":"Variável","alc":"","alvo":"","dur":"Imediata","area":"","custo":"","d":"A convergência é uma das bases da manipulação sanguínea, comprimindo sangue ao máximo possível, para assim torná-lo material para vários usos da técnica. Ao utilizar convergência, você cria orbes concentrados de sangue em um ponto dentro de 3 metros, incluindo em sua própria mão, podendo guardálo. A quantidade de orbes de sangue gerados depende da ação utilizada: ao utilizar como uma ação completa, gera 3 orbes; ação comum gera 2 e ação bônus gera 1. Os orbes duram até que sejam dissipados por você ou usados em uma habilidade. Como uma ação livre, você pode manipular os orbes criados, movendo-os para um ponto dentro de 9 metros de você."},{"tec":"Manipulação Sanguínea (Choso)","n":"CONVERSÃO DE SANGUE","nv":0,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Ao converter energia amaldiçoada em sangue, o sangramento e a falta de circulação em seu corpo deixam de ser preocupações. Você se torna imune a condição Sangramento e pode somar seu modificador de Constituição em testes de morte."},{"tec":"Manipulação Sanguínea (Choso)","n":"SANGUE VENENOSO","nv":0,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Com um físico de feto amaldiçoado, seu próprio sangue é venenoso e nocivo para os outros, carregando propriedades danificadoras e debilitantes. Sempre que for atingido por um ataque corpo-a-corpo, o atacante recebe dano venenoso igual ao seu modificador de Constituição. Além disso, você se torna resistente a dano venenoso e pode escolher o causar em ataques que causem dano perfurante."},{"tec":"Manipulação Sanguínea (Choso)","n":"CORPO LIVRE","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Sustentada","area":"","custo":"","d":"Você utiliza da manipulação do seu sangue para conseguir liberdade em seu corpo, estendendo-o. Ao ativar a habilidade, seu alcance para ações e ataques corpo-a-corpo aumenta em 3 metros. Para cada rodada após a primeira em que a habilidade estiver ativa, você deve pagar 1 ponto de energia amaldiçoada para a sustentar."},{"tec":"Manipulação Sanguínea (Choso)","n":"CORREÇÃO DE TRAJETÓRIA","nv":1,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Ao controlar o sangue disparado, você consegue corrigir a trajetória de ataques que o utilize. Quando realizar uma rolagem de ataque com uma habilidade de técnica, caso erre, você pode utilizar sua reação para rolar novamente o ataque, ficando com o novo resultado. Seu máximo de energia amaldiçoada diminui em 2."},{"tec":"Manipulação Sanguínea (Choso)","n":"DISPARAR SANGUE","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você utiliza de um dos orbes de sangue concentrados pela convergência para criar um disparo simples de sangue. Você realiza uma rolagem de ataque com Pontaria contra uma criatura dentro de 12 metros, causando 4d8 de dano perfurante em um acerto."},{"tec":"Manipulação Sanguínea (Choso)","n":"PUNHOS SANGRENTOS","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Sustentada","area":"","custo":"","d":"Você reveste seus punhos com sangue, potencializando o seu dano corpo-acorpo enquanto conseguir renovar o revestimento. Seus ataques desarmados causam um dado de dano adicional. Para cada rodada após a primeira, você deve pagar 1 ponto de energia amaldiçoada para manter a habilidade ativa."},{"tec":"Manipulação Sanguínea (Choso)","n":"ENDURECER SANGUE","nv":2,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você endurece grandemente o seu sangue em resposta a um golpe, absorvendo o dano dele grandemente. Ao receber um ataque que cause dano físico, você pode usar sua reação para reduzir o dano dele a metade. Após utilizar essa habilidade, você também recebe 5 de redução de danos contra danos físicos até o final da rodada."},{"tec":"Manipulação Sanguínea (Choso)","n":"GUME DE SANGUE","nv":2,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Concentração","area":"","custo":"","d":"Você forma uma adaga de sangue, mantendo sempre em uma alta velocidade de rotação, atingindo uma grande letalidade. Ao utilizar a habilidade, você cria um gume de sangue, o qual possui as propriedades Fineza, Leve e Marcial, margem de crítico 18 e causa 2d8 de dano cortante. Você possui maestria no gume de sangue criado. Ele dura até que você perca a sua concentração, assim deixando de manter a rotação e controle estabelecido."},{"tec":"Manipulação Sanguínea (Choso)","n":"SANGUE PERFURANTE","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você utiliza de um orbe de sangue criado com a convergência para o disparar em uma versão ainda mais comprimida, estendendo-se como um projétil perfurante. Você realiza uma rolagem de ataque com Pontaria contra uma criatura dentro de 18 metros, causando 8d8 de dano perfurante caso acerte."},{"tec":"Manipulação Sanguínea (Choso)","n":"EXORCISMO CORTANTE: DISCO","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você cria um disco em rápida rotação a partir do seu sangue, o qual rapidamente voa pelo ar até cortar um alvo. Uma criatura dentro de 24 metros deve realizar um teste de resistência de Reflexos, recebendo 14d8 de dano cortante, ou apenas metade em um sucesso."},{"tec":"Manipulação Sanguínea (Choso)","n":"SUPERNOVA","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"Três Orbes de Sangue","dur":"Imediata","area":"4,5 Metros","custo":"","d":"Você causa a detonação de múltiplos orbes de sangue, os quais disparam para todas as direções, afetando uma área esférica de 4,5 metros a partir dos orbes. Após a detonação, toda criatura dentro da área de um orbe deve realizar um teste de resistência de Reflexos, recebendo 2d12 de dano perfurante, ou apenas metade em um sucesso, para cada orbe."},{"tec":"Manipulação Sanguínea (Choso)","n":"FLUXO DAS ESCAMAS VERMELHAS","nv":3,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Variável","area":"","custo":"","d":"Você aumenta a temperatura, batimentos e quantidade de células sanguíneas no seu corpo para impulsionar suas capacidades físicas. Ao ativar essa habilidade, os seus valores de Força e Destreza aumentam em 2, seu movimento aumenta em 3 metros e você recebe +4 em rolagens de Reflexos. Para cada turno após o primeiro, em que a habilidade estiver ativa, você deve pagar 2 pontos de energia para a manter sustentada, encerrando-se caso você não pague. Você também pode a encerrar como uma ação livre, dentro do seu turno."},{"tec":"Manipulação Sanguínea (Choso)","n":"EXORCISMO CORTANTE: CORRENTEZA","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"","dur":"Imediata","area":"","custo":"","d":"Você manipula o seu sangue em várias linhas cortantes, criando uma correnteza de letalidade. A correnteza se estende por uma linha de 18 metros, com 3 metros de largura, a partir de você. Toda criatura dentro da linha deve realizar um teste de resistência de Reflexos, recebendo 10d10 de dano cortante, ou apenas metade em um sucesso."},{"tec":"Manipulação Sanguínea (Choso)","n":"METEORITO DE SANGUE","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"6 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você endurece sangue na forma de uma pequena pedra supercondensada e dura, disparando-a contra uma criatura dentro de 6 metros. A criatura alvo deve realizar um teste de resistência de Fortitude, recebendo 10d10 de dano perfurante, ou apenas metade em um sucesso. Uma criatura que falhe no teste também recebe uma Ferida Interna, de acordo com a tabela de consequências extremas da página 283 do Livro Básico; a ferida interna tem a base da sua CD como 20 ao invés de 15.\n\n▸ Habilidades Adicionais\nComo habilidade adicional, é possível encontrar a liberação máxima do Fluxo das Escamas Vermelhas, amplificando o seu efeito.\n\nFLUXO DAS ESCAMAS VERMELHAS: EMPILHAR Habilidade de Técnica Nível 3 Conjuração: Ação Bônus Alcance: Próprio Alvo: Próprio Duração: Sustentada Você utiliza ainda mais energia para aumentar a temperatura, batimentos e quantidade de células sanguíneas no seu corpo para impulsionar suas capacidades físicas. Ao ativar essa habilidade, os seus valores de Força e Destreza aumentam em 2, seu movimento aumenta em 4,5 metros e você recebe +7 em rolagens de Reflexos. Para cada turno após o primeiro, em que a habilidade estiver ativa, você deve pagar 2 pontos de energia para a manter sustentada, encerrando-se caso você não pague. Você também pode a encerrar como uma ação livre, dentro do seu turno."},{"tec":"Marés do Desastre","n":"BALA ÁQUEA","nv":0,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"9 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você cria um pequeno projétil de água concentrada, disparando-o contra uma criatura dentro do alcance. Realize um teste de Pontaria ou Feitiçaria, causando 1d10 de dano de impacto em um acerto."},{"tec":"Marés do Desastre","n":"CRIAR ÁGUA","nv":0,"pas":false,"k":"Técnica","exec":"Variável","alc":"9 Metros","alvo":"","dur":"Imediata","area":"Variável","custo":"","d":"Você cria água a partir da sua energia, em quantidades pequenas mas suficientes para cobrir partes do ambiente. Você pode utilizar uma ação completa para criar água suficiente para cobrir uma área esférica de 3 metros; caso use uma ação comum, cobre uma área esférica de 1,5 metros."},{"tec":"Marés do Desastre","n":"INUNDAR","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"9 Metros","alvo":"","dur":"Imediata","area":"4,5 Metros","custo":"","d":"Você começa a criar uma enorme bolha de água e dispara ela em um ponto dentro do alcance, a qual explode para inundar uma área esférica de 4,5 metros. Toda criatura na área deve realizar um TR de Fortitude, recebendo 2d8 de dano de impacto, ou apenas metade em um sucesso. Além disso, toda a área afetada pela habilidade fica coberta por água."},{"tec":"Marés do Desastre","n":"LAÇOS D’ÁGUA","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você forma vários laços d’água, os quais são disparados e rapidamente começam a prender uma criatura dentro do alcance. A criatura alvo deve realizar um TR de Reflexos, recebendo a condição Agarrado caso falhe. No começo de todo turno dela, a criatura pode realizar um teste de Atletismo contra sua CD, escapando em um sucesso."},{"tec":"Marés do Desastre","n":"CHICOTE DA MARÉ","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você cria água e a molda no formato de um chicote, golpeando uma criatura dentro do alcance com a força da maré. A criatura alvo deve realizar um TR de Fortitude, recebendo 6d8 de dano de impacto, ou apenas metade em um sucesso. Uma criatura que falhe no teste também é derrubada."},{"tec":"Marés do Desastre","n":"ONDA DE VARREDURA","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"","dur":"Imediata","area":"6 Metros","custo":"","d":"Você une as mãos e cria uma onda intensa de água, a qual passa varrendo uma área cônica de 6 metros a partir de você. Toda criatura na área deve realizar um TR de Fortitude, recebendo 4d8 de dano de força, ou apenas metade em uma falha. Toda a área afetada pela habilidade fica coberta de água."},{"tec":"Marés do Desastre","n":"BOLHA SUFOCANTE","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"9 Metros","alvo":"Uma Criatura","dur":"Concentração","area":"","custo":"","d":"Você forma grandes quantidades de água ao redor de uma criatura, prendendoa em uma bolha que você sustenta. A criatura alvo deve realizar um TR de Reflexos com CD aumentada em 4 e, caso falhe, ela fica presa na bolha e começa a ser sufocada, não conseguindo escapar conforme você manipula a água. Uma criatura, seguindo as regras de Segurando o Ar, consegue sobreviver uma quantidade de rodadas igual ao modificador de Constituição dela, caindo para 0 pontos de vida no seu próximo turno após essa quantidade de rodadas passar. A bolha dura até você perder a sua concentração ou desmontar ela como uma ação livre, cobrindo também uma área esférica de 1,5 metros com água, a partir da criatura que estava presa."},{"tec":"Marés do Desastre","n":"ESCUDO DE ÁGUA","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Próprio","alvo":"Próprio","dur":"Sustentada","area":"","custo":"","d":"Você forma um anel de água ao seu redor, o qual age como um escudo, conseguindo aparar golpes individuais. Enquanto o escudo estiver manifestado, caso uma criatura realize um ataque sozinha contra você, o ataque é aparado; caso mais de uma criatura realizem ataques simultaneamente, no mesmo turno, o escudo apara eles, mas é destruído logo em seguida. Para cada rodada após a primeira, você deve pagar 2PE para sustentar o escudo."},{"tec":"Marés do Desastre","n":"COMPRESSÃO TOTAL","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Manipulando um volume massivo de água, você começa a comprimir uma criatura ao máximo. A criatura alvo deve realizar um TR de Fortitude, recebendo 10d10 de dano de força, ou apenas metade em uma falha. Uma criatura que falhe no teste também fica Desorientada por 4 rodadas e Confusa por 3 rodadas, podendo repetir o teste no final de todo turno dela, livrando-se antecipadamente em um sucesso. Após comprimir a criatura com a água, ela se espalha por uma área esférica de 3 metros a partir do alvo."},{"tec":"Marés do Desastre","n":"DOMO AQUOSO","nv":4,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Ao estar prestes a receber um ataque, você rapidamente forma um domo de água ao seu redor, bloqueando e o mantendo para proteger-se. Como uma reação, ao ser alvo de um ataque, você ergue o domo, anulando o dano do ataque. Após anular o ataque, o domo continua ao seu redor, impossibilitando que você seja alvo de ataques; é necessário destruir o domo, o qual possui 120 pontos de vida."},{"tec":"Marés do Desastre","n":"MARÉ DO DESASTRE","nv":5,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"","alvo":"","dur":"Imediata","area":"15 Metros","custo":"","d":"Convocando o ápice da sua técnica, você cria uma onda digna de ser a própria maré do desastre. Você libera uma onda colossal de água, a qual afeta uma linha de 24 metros com 4,5 metros de largura, a partir de você. Toda criatura na área afetada deve realizar um TR de Fortitude, recebendo 9d12 de dano de força, ou apenas metade em um sucesso. Uma criatura que falhe no teste também fica Atordoada por uma rodada. Toda a área afetada pela habilidade fica coberta de água, a qual está em uma correnteza, transformando a área em terreno difícil."},{"tec":"Marés do Desastre","n":"Expansão de Domínio: Horizonte Cativante","nv":6,"pas":false,"k":"Domínio","exec":"Ação Comum","alc":"Esfera de 9 m","alvo":"","dur":"3 + nível de aptidão em Domínio (rodadas)","area":"","custo":"25 PE","d":"Horizonte Cativante é a expansão de domínio de Dagon, a qual transporta todos aqueles presos nela para uma grande ilha paradisíaca, onde um enxame constante de criaturas marinhas atua como acerto garantido.\n\nHorizonte Cativante [Expansão Completa] Sua expansão cria um espaço próprio, o qual por fora ocupa uma área esférica de 9 metros e dura uma quantidade de rodadas igual a 3 + seu nível de aptidão em domínio. Ela pode possuir os seguintes efeitos:\n\n• Efeito Especial: Ilha Paradisíaca. Embora tenha um exterior comum, o interior da sua expansão é uma ilha tropical e paradisíaca, com 100 metros de extensão. Metade dessa área é o mar.\n• Efeito Ambiental: Lentidão. A parte do mar de sua expansão faz com que a mobilidade seja reduzida para toda criatura hostil, tendo seu movimento reduzido em 3 metros.\n• Acerto Garantido: Enxame Mortal. Caso tenha a aptidão amaldiçoada Acerto Garantido, você pode imbuir o Enxame Mortal como acerto garantido. No começo de toda rodada seis criaturas marinhas são criadas, as quais você pode dividir para atacar as criaturas presentes no seu domínio, cada uma causando 1d10+5 de um dano físico a sua escolha. Você também pode utilizar ações para criar mais shikigamis: uma ação completa cria 6; uma ação comum cria 4; uma ação bônus cria 2.","reg":"Expansão Completa letal: 20 PE + 5 PE de Acerto Garantido = 25 PE."},{"tec":"Milagres","n":"MILAGRE DA SORTE","nv":0,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Um dos milagres que o afeta é o milagre da própria sorte, que o acompanha. Você recebe o talento “Favorecido pela Sorte”."},{"tec":"Milagres","n":"POR POUCO","nv":1,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Por pouco um golpe não o acerta. Ao ser alvo de um ataque, você pode usar sua reação para evitar ser acertado por um ataque. Utilizar esta habilidade gasta 1 milagre."},{"tec":"Milagres","n":"SUCESSO MILAGROSO","nv":2,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Um sucesso milagroso e inesperado o alcança, melhorando a situação. Como uma reação, você pode transformar o resultado do próximo dado que você rolar no valor máximo dele (20 em 1d20, 10 em 1d10 etc.).\n\nUtilizar esta habilidade gasta 2 milagres."},{"tec":"Milagres","n":"MILAGRE INACREDITÁVEL","nv":4,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Algo inacreditável entrou na sua vida, impedindo que ela acabasse tão cedo. Caso você fosse morrer ou ficar debilitado, em uma situação muito ruim (receber dano suficiente para morrer de uma vez, falhar no último teste de morte ou outra situação desastrosa) você pode gastar 5 milagres para evitar esta situação, através de algo inacreditável e inesperado. Você, juntamente do mestre, deve descrever como tal milagre acontece."},{"tec":"Milagres","n":"MILAGROSO","nv":5,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Sua própria existência já parece atrair milagres, sendo impossível negar que você é um ser milagroso. Seu máximo de energia amaldiçoada reduz em 10, mas você recebe +3 milagres por descanso longo."},{"tec":"Nulificação de Técnicas","n":"CRIAR LUZ","nv":0,"pas":false,"k":"Técnica","exec":"Variável","alc":"9 Metros","alvo":"","dur":"10 Minutos","area":"","custo":"","d":"Você realiza uma criação básica de luz. A luz ilumina normalmente, como uma lâmpada forte, além de poder assumir o formato de objetos pequenos, como instrumentos ou orbes de iluminação. Você pode tanto escolher atrelar a criação de luz a um objeto quanto deixa-lo flutuando no ar, acompanhando uma pessoa a sua escolha."},{"tec":"Nulificação de Técnicas","n":"FLECHA RADIANTE","nv":0,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"9 Metros","alvo":"Uma Maldição","dur":"Imediata","area":"","custo":"","d":"Você cria uma flecha composta de luz purificadora e a dispara contra uma maldição. Realize um teste de ataque contra o alvo e, caso acerte, causa 1d10 de dano radiante."},{"tec":"Nulificação de Técnicas","n":"GRACIOSIDADE ANGELICAL","nv":0,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Seu aspecto angelical e divino o concede uma graciosidade única, amplificando nas características de uma existência tão pura. Você recebe 3 metros de movimento de voo adicionais, além de poder escolher receber vantagem em rolagens de Persuasão ou Performance."},{"tec":"Nulificação de Técnicas","n":"PROTEÇÃO DIVINA","nv":0,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"9 Metros","alvo":"3 Criaturas","dur":"Sustentada, Concentração","area":"","custo":"","d":"Você cobre três criaturas a sua escolha com a sua luz, protegendo-as daquilo que é maldito enquanto conseguir se concentrar. Quando uma criatura protegida realizar um teste de resistência para resistir a um efeito provindo de energia amaldiçoada, ela pode adicionar 1d4 ao resultado final. Para cada rodada após a primeira, você deve pagar 1PE para sustentar a habilidade; caso você perca a concentração ela é cancelada antecipadamente."},{"tec":"Nulificação de Técnicas","n":"AMARRAS SAGRADAS","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Maldição","dur":"Variável","area":"","custo":"","d":"Você cria amarras de luz, buscando prender uma maldição com elas, agarrandoa no lugar. A maldição alvo deve realizar um teste de resistência de Fortitude, recebendo a condição Agarrado em uma falha. Enquanto estiver agarrada pelas amarras sagradas, a maldição recebe 1d10 de dano radiante no começo de todo turno dela. Para se libertar das amarras, a maldição pode repetir o teste de Fortitude no começo de todo turno dela, libertando-se em um sucesso."},{"tec":"Nulificação de Técnicas","n":"ARMA CELESTE","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"3 Metros","alvo":"Uma Arma","dur":"Sustentada","area":"","custo":"","d":"Você cobre uma arma com luz, reforçando a sua capacidade de dano contra maldições enquanto o revestimento persistir. A arma causa 1d10 de dano radiante adicional sempre que for utilizada para atacar uma maldição. Para cada rodada após a primeira, você deve pagar 1 ponto de energia amaldiçoada para mantê-la ativada."},{"tec":"Nulificação de Técnicas","n":"ARMADURA SACRA","nv":1,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Você constantemente cobre o seu corpo com uma fina camada de luz, formando uma armadura sacra contra o amaldiçoado. Você recebe 4 de redução de danos contra dano provindo de energia amaldiçoada. Seu máximo de energia amaldiçoada é diminuído em 2."},{"tec":"Nulificação de Técnicas","n":"REJEITAR O PECADO","nv":1,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Você rejeita a energia amaldiçoada, criando uma resistência constante aos prejuízos dela, devido a sua nulificação. Sempre que você realiza um teste de resistência para resistir a um efeito provindo de energia amald
