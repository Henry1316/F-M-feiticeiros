reação, a sua escolha, enquanto usar uma habilidade de técnica copiada mantém o seu custo em ação da original.\n• Você só pode manter uma habilidade copiada por vez. Porém, você pode optar por memorizar uma habilidade copiada, aprendendo-a e adicionando ela na sua lista de habilidades de técnica, respeitando o limite de habilidades de técnica máximas do seu personagem. Caso não memorize, a habilidade copiada dura até ser substituída por outra. Enquanto uma habilidade de técnica estiver copiada, caso o Funcionamento Básico seja uma parte essencial da técnica da qual a habilidade deriva, você também recebe acesso aos benefícios dele. Por exemplo, enquanto uma habilidade da Manipulação de Maldições estiver copiada, você poderia absorver maldições seguindo o funcionamento básico dela.\n\nAo optar por memorizar a habilidade, os benefícios essenciais do Funcionamento Básico ficam memorizados também, podendo ser ativados com o uso de uma ação comum, dentro de combate. Você só pode manter uma quantidade de funcionamentos básicos memorizados igual a metade do seu bônus de maestria, podendo substituir caso tente memorizar outro enquanto seu limite já tiver sido atingido.\n\nDiante certas técnicas, a cópia do Funcionamento Básico pode necessitar de adaptações a discrição do jogador juntamente do narrador, podendo inibir certas partes dele. Vale notar também que as habilidades seguem especificações do funcionamento básico mesmo que não o copie, como a Fala Amaldiçoada com seus detalhes no uso.\n\nVocê só pode utilizar habilidades de técnica copiadas e se beneficiar de funcionamentos básicos copiados enquanto Rika estiver invocada.\n\nNa próxima página você encontra uma referência de técnicas da Enciclopédia Amaldiçoada cujo funcionamento básico pode ser copiado, por padrão. Caso vá copiar a técnica de criaturas que utilizem uma ficha de inimigo, há uma diferença no processo, visto que não possuem Habilidades de Técnica propriamente, mas sim diferentes ações e características.\n\nUma vez que o inimigo tenha sido acertado por uma ação de Mordida de Rika, você pode utilizar sua ação bônus ou reação normalmente para copiar, mas, ao invés de copiar uma habilidade de técnica, você copia uma Ação ou Característica, adaptando-a como uma habilidade de técnica. Ações e características só podem ser copiadas caso estejam diretamente ligadas com a técnica do inimigo.\n\nO Funcionamento Básico de técnicas de inimigos é copiado apenas caso ele seja também essencial, sendo adaptado devidamente para o formato padrão da Criação de Técnicas.\n\n▸ Funcionamentos\nBásicos Copiáveis Aqui você encontrará uma breve referência das técnicas das quais você se beneficia do Funcionamento Básico enquanto manter uma habilidade dela copiada, sendo elas: → Boneco de Palha → Ilimitado → Manipulação de Maldições → Manipulação de Pássaros Negros → Milagres → Transfiguração Inerte\n\n▸ Versões da Rika\nComo mencionado, o shikigami da Rika se desenvolve junto do seu portador, recebendo melhorias sempre que o seu bônus de maestria aumentar. Cada melhoria é visível através de uma nova ficha para a invocação, que atualiza não só o seu custo, mas também as suas capacidades gerais.\n\nAo atingir maestria +3, sua ficha de invocação se torna:\n\n• Fortitude +8\n• Luta +9 Ao atingir maestria +4, sua ficha de invocação se torna:\n• Fortitude +12\n• Luta +14 Ao atingir maestria +5, sua ficha de invocação se torna:\n• Fortitude +16\n• Luta +18 Ao atingir maestria +6, sua ficha de invocação se torna:\n• Fortitude +22\n• Luta +22\n• Reflexos +17","tipo":"Amaldiçoada inata","res":["Cópia tem duas partes: o shikigami Rika e a capacidade de copiar técnicas.","Rika: ao escolher a técnica, você troca uma habilidade de técnica inicial pela invocação Rika. Ela tem turno próprio (pode agir junto do seu ou ter a própria iniciativa) e faz uma ação, um movimento e uma reação por rodada. Guarda itens (espaços iguais ao mod. de Força dela) e você retira um item dela como ação bônus.","Evolução da Rika: a ficha muda conforme o seu bônus de maestria: +2 (2 PE), +3 (5 PE), +4 (8 PE), +5 (10 PE) e +6 (12 PE). Veja as cinco fichas em Feitiços → Invocações (\"Rika — Maestria N\").","Copiar: com Rika invocada, a Mordida dela precisa acertar o portador da técnica. Copiar custa uma ação bônus ou reação. Só dá para copiar habilidades de um nível que você já alcança, e usar a habilidade copiada mantém o custo em ação da original.","Memorizar: você mantém uma habilidade copiada por vez, até copiar outra. Se memorizar, ela entra na sua lista de habilidades de técnica (respeitando o limite). Funcionamentos básicos memorizados: no máximo metade do bônus de maestria; ativar um custa uma ação comum em combate.","Habilidades copiadas e funcionamentos básicos só funcionam com Rika invocada. Funcionamentos básicos copiáveis por padrão: Boneco de Palha, Ilimitado, Manipulação de Maldições, Manipulação de Pássaros Negros, Milagres e Transfiguração Inerte. O Seis Olhos não pode ser copiado.","Contra inimigos com ficha (sem habilidades de técnica), você copia uma Ação ou Característica ligada à técnica dele, adaptada como habilidade de técnica.","Depois da escolha você não recebe mais habilidades de técnica diretas: só copia e aprende pela cópia, e outras habilidades seriam passivas que fortalecem Rika. Com Treinamento em Controle, você pode dar comandos a Rika.","Domínio: Puro Amor Mútuo, expansão completa letal (katanas que guardam as técnicas copiadas e armazenadas, usadas sem custo de energia)."]},{"n":"Criatura Mística Âmbar","dono":"Hajime Kashimo","pg":45,"intro":"Criatura Mística Âmbar é a técnica amaldiçoada de Hajime Kashimo que, quando usada, o permite remodelar o seu corpo, convertendo a sua energia amaldiçoada para que ela possa manifestar qualquer fenômeno. Além da técnica em si, que é custosa para o corpo, a própria energia amaldiçoada e aura do usuário possui as propriedades de uma corrente elétrica, em constante estado de eletrificação.\n\nDentro de Feiticeiros e Maldições, a técnica amaldiçoada e as propriedades da energia estão colocadas em conjunto, manifestando-se no funcionamento básico e nas habilidades de técnica que envolvem tanto a aura elétrica quanto a ativação da Criatura Mística Âmbar.\n\nA Criatura Mística Âmbar atende um propósito com cada uma das suas partes: as características da aura e o uso de raios e correntes elétricas adiciona um novo fator ao leque de capacidades do seu usuário, além de servir como um bom intensificador de golpes corpo-a-corpo, enquanto a ativação da técnica leva o seu usuário a extrair muito mais do seu corpo e das suas capacidades, em troca de um sacrifício corporal.\n\nFunciona bem, principalmente, com as especializações Lutador ou Especialista em Combate, as quais permitem um acúmulo de rápido de cargas em inimigos, além de se beneficiar mais de um corpo que transcende os limites humanos. Fornece risco e recompensa, podendo criar um combatente poderoso.","f":"Sua própria energia amaldiçoada e aura possuem propriedades únicas elétricas que se manifestam constantemente e o concedem certas capacidades. Você recebe a aptidão amaldiçoada “Aura Elemental” do tipo Chocante. Em certos níveis, a habilidade é melhorada:\n\n• No nível 5 você recebe gratuitamente a aptidão amaldiçoada “Aura Elemental Aprimorada”, com o mesmo elemento (Chocante). Além disso, o bônus em dano é aumentado em um nível.\n• No nível 10 você se torna imune a dano Chocante e tem o bônus de dano da aura aumentado em mais um nível.\n• No nível 15 o bônus de dano da aura é aumentado em mais um nível.","tipo":"Amaldiçoada"},{"n":"Dez Sombras","dono":"Megumi Fushiguro","pg":53,"intro":"Dez Sombras é a técnica herdada de Megumi Fushiguro, vinda do clã Zenin. Ela concede ao seu usuário um leque de dez shikigamis poderosos, os quais devem ser obtidos através de um ritual, exceto pelos dois primeiros. Além disso, garante poderes que envolvem sua sombra e a dos outros.\n\nCom o seu funcionamento baseado em shikigamis, é uma técnica que se beneficiará principalmente de um usuário que seja Controlador. Entretanto, ela pode ser utilizada por qualquer personagem, embora possa ter as suas capacidades limitadas e sendo difícil extrair 100% do seu potencial. Cada um dos shikigamis possui um papel e abre oportunidades de combinações e controle, esbanjando versatilidade e adaptabilidade.","f":"Um usuário da Dez Sombras recebe acesso a um leque especial de shikigamis, os quais são também conseguidos de maneira única. Ser um usuário da Dez Sombras te concede as seguintes características:\n\n• O seu máximo de invocações é aumentado para dez, e se limita a esse valor, exceto por habilidades externas.\n• Você pode realizar um Ritual de Exorcismo para dominar outros shikigamis.\n• Você começa com duas invocações, sendo eles dois cães divinos, um branco e outro negro. Caso seja um Controlador, eles são suas duas invocações iniciais.\n\nConsiderando as regras padrão das invocações, os shikigamis da Dez Sombras são classificados também em diferentes graus, com aqueles mais fortes e avançados estando em um grau superior. Entretanto, esse é o grau padrão deles, dentro da técnica, podendo ser tanto reduzido quanto aumentado após domados. Entretanto, alguns shikigamis têm exceções às regras padrão.\n\n▸ Ritual de Exorcismo\nVocê pode iniciar um Ritual de Exorcismo, cujo custo é uma Ação Comum, dentro de combate. Ao escolher o realizar, você escolhe um dos shikigamis da Dez Sombras na lista de invocações, com o custo para iniciar o ritual sendo igual ao custo da invocação. Ao iniciar o ritual, uma área esférica de 18 metros se torna a área do ritual, com uma barreira invisível, delimitada apenas por uma linha feita de tinta negra. Quando inicia o ritual, você pode escolher expulsar todas as criaturas para fora, exceto você e os seus shikigamis. Você inicia em uma extremidade da barreira, e o seu shikigami invocado em outra. A barreira só é desfeita quando você ou o shikigami invocado para o ritual tiver seus pontos de vida reduzidos a 0 ou for morta. Caso você consiga exorcizar o shikigami invocado, sem interferência externa de outras criaturas além de você e os seus shikigamis já dominados, o ritual é um sucesso e você a recebe como invocação.\n\n▸ Heranças das Sombras\nUma vez exorcizados, os shikigamis das Dez Sombras não podem ser recuperados. Entretanto, o seu poder é herdado para outras sombras. Caso uma das suas invocações da técnica seja exorcizada, você pode escolher transferir suas forças para outra invocação, fortalecendo-a. Um exemplo de fortalecimento estará presente, na forma do Cão Divino: Totalidade.\n\n▸ Lista de Invocações\nOs shikigamis que podem ser obtidos pela técnica são:\n\n• Cão Divino, que oferece duas versões, um cão negro e um cão branco. Estão disponíveis desde o começo.\n• Nue, um shikigami alado rápido e carregado com poderes elétricos.\n• Sapo, um sapo maior do que o comum, com uma longa língua.\n• Grande Serpente, um shikigami com formato de uma serpente grande e ágil.\n• Elefante Máximo, um elefante robusto e grande, capaz de liberar litros de água.\n• Cervo Circular, um grande cervo que produz energia reversa.\n• Touro Perfurante, um touro forte capaz de realizar investidas poderosas.\n• General Divino Mahoraga, o mais poderoso shikigami da técnica, capaz de se adaptar a qualquer fenômeno.\n\nO único requisito para invocar um shikigami da Dez Sombras é possuir energia amaldiçoada suficiente para o trazer. As fichas estão listadas a seguir. As invocações adaptadas na Dez Sombras são as invocações em forma básica, existindo ainda as várias possíveis quimeras e heranças das sombras, onde um shikigami se torna mais forte e herda aspectos de outro.\n\nUm fator importante é: as fichas das invocações ainda dependem do seu invocador. Logo, embora os aspectos que dependem apenas do grau já estejam acertados, aqueles que dependem do nível e bônus de maestria do usuário, como o bônus de perícias deve ser ajustado. Por padrão, as fichas consideram um usuário nível 1 (metade do nível = 0, bônus de maestria +2).\n\n▸ Invocações Adicionais\nAlém das invocações que já foram apresentadas, a Dez Sombras também conta com algumas adicionais, sendo elas formadas a partir da herança das sombras, quimeras ou que ainda não foram apresentadas.\n\nSão elas:\n\n• Cão Divino – Totalidade, o qual surge quando um dos dois cães divinos morre, sendo usado como herança para o outro.\n• O Abismo Desconhecido do Poço, sendo uma quimera entre Nue e Sapo.\n• Tigre Fúnebre, uma invocação que ainda não foi revelada dentro da obra, com uma versão original para a técnica em Feiticeiros & Maldições, com intuito de permitir o uso de Agito.\n• Nue: Totalidade – Besta Quimera: Agito, uma versão do Nue que herdou a Grande Serpente, Tigre Fúnebre e Cervo Circular.\n\nEmbora Agito seja oficial, o Tigre Fúnebre é uma versão própria, então não é garantida sua fidelidade com a Dez Sombras original. Caso seja revelado, a técnica será atualizada.\n\nA ficha de quimera de Abismo Desconhecido do Poço considera que ambas as invocações que compõem ela – Nue e Sapo – estão como invocações de 4° grau, assim como o usuário da técnica tem seu bônus de maestria como +2. Para criala é necessário ter a habilidade de especialização Quimera. Agito é um caso especial, sendo uma sombra que herdou outras três, o que necessitou do uso de algumas regras próprias para realizar de maneira balanceada a “união” de quatro sombras em uma só. Você pode conferir as regras usadas para criar Agito logo abaixo da sua ficha, as quais também podem servir como uma referência para outros casos onde uma sombra receba várias heranças.\n\nTotalidade é obtido caso um cão divino morra, com o outro se tornando a invocação acima. Soma-se metade da vida, o modificador de Destreza na CA, +1,5 metros de movimento, +1 dado de dano e o dobro do modificador em ataque, dano e perícias.\n\nEsta versão do Tigre Fúnebre não é oficial, sendo apenas uma especulação de como ele poderia ser. Seria um enorme tigre com uma aparência que remeta a morte, que também é emanada em suas presas que conseguem sugar a vitalidade de uma criatura mordida.\n\nAgito é uma versão da invocação Nue que herdou a Grande Serpente, Tigre Fúnebre e Cervo Circular, fortalecendo-se grandemente. Devido a necessidade de possuir uma invocação de 2° grau para conseguir Agito, a ficha base considera que o próprio Nue – que recebe as heranças das sombras – está como uma invocação de 2° grau.\n\nAgito é um caso especial, herdando a força de três sombras mortas. Logo, foi montado da seguinte maneira: 1. Metade dos pontos de vida das três sombras foram somados à vida do Nue, depois subtraindo 10 para cada sombra herdada. 2. O maior modificador de Destreza entre os três foi somado na sua CA. 3. O movimento aumentou em 1,5 metros para cada sombra herdada cuja Destreza fosse maior que 10. 4. Metade do valor de um atributo de uma das sombras foi somado aos de Agito, sendo escolhido o Carisma do Cervo Circular. 5. Os valores de dano e cura foram aumentados em 1 dado para cada sombra herdada, até um máximo igual a metade do grau da sombra que recebeu as heranças, arredondado para cima (o 2° grau é o terceiro na evolução, logo 3 ÷ 2 = 1,5 que arredonda para 2). 6. Soma-se +1 nas perícias para cada sombra herdada.","tipo":"Herdada","res":["Ritual de Exorcismo: é como se obtém um shikigami. Custa uma Ação Comum em combate, e o custo é o da invocação. Cria uma área esférica de 18 m com barreira invisível; você pode expulsar todas as criaturas, menos você e seus shikigamis.","No ritual você fica numa extremidade e o shikigami na outra. A barreira só cai quando você ou ele chega a 0 PV. Se você exorcizar sozinho (só com seus shikigamis já dominados), o ritual dá certo e ele passa a ser sua invocação.","Heranças das Sombras: um shikigami exorcizado não pode ser recuperado, mas o poder dele pode ser transferido a outra invocação, fortalecendo-a (exemplo: Cão Divino – Totalidade).","Os shikigamis estão em Feitiços → Invocações: 8 base (o Cão Divino está disponível desde o início) e 4 adicionais. O único requisito para invocar é ter energia suficiente."]},{"n":"Fala Amaldiçoada","dono":"Toge Inumaki","pg":72,"intro":"Fala Amaldiçoada é a técnica amaldiçoada de Toge Inumaki, a qual reforça as palavras do usuário com energia amaldiçoada, transformando-as em comandos que compelem e afetam quem escuta.\n\nCom um potencial enorme, visto que consegue trazer a realidade os comandos ditos pelo seu usuário, também pode vir a se encaixar bem com qualquer especialização, embora demonstre uma sinergia maior com Especialistas em Técnica ou Suportes, conseguindo prestar grande ajuda aos aliados em campo, administrando a batalha de longe.\n\nDevido ao seu natural poder, também é exaustiva para o usuário, demonstrando consequências devido ao seu uso, assim como depende muito da capacidade de energia dele, afetando inimigos mais fracos com mais facilidade.","f":"Você pode imbuir suas palavras com energia, transformando-as em comandos. Seus comandos, porém, possuem certas peculiaridades:\n\n• Caso use um comando contra uma criatura que não use energia amaldiçoada, ela não pode resistir, falhando automaticamente no teste. A única exceção são Restringidos, que ainda podem resistir.\n• Caso use o seu comando em uma criatura cujo nível ou ND seja 4 inferiores ao seu, ela falha automaticamente no teste; caso a criatura seja 4 níveis superiores ao seu, ela terá vantagem para resistir.\n• Sempre que utilizar uma habilidade de nível 3 ou superior, você deve realizar um TR de Fortitude, perdendo vida igual ao custo da habilidade em uma falha, devido ao peso do comando. A dificuldade do teste é igual a sua CD padrão, aumentada em 3 para cada nível da habilidade após o 3.","tipo":"Amaldiçoada"},{"n":"Formação de Gelo","dono":"Uraume","pg":78,"intro":"Formação de Gelo é a técnica inata de Uraume, a qual permite ao usuário criar e manipular gelo, variando desde pequenas formações até quantidades excessivas. Além disso, o gelo criado pode ser manipulado, controlado pela mente do usuário.","f":"Você é capaz de diminuir a temperatura ao seu redor até níveis extremos de frio, criando gelo a vontade, sendo capaz até mesmo de manifestar outras formas como as nuvens e névoas. Podendo também ser controlado mentalmente por você, podendo também levitar.\n\nCertas habilidades causam congelamento, uma condição própria da técnica, que é dividida em três etapas diferentes:\n\n• Congelamento Leve. A criatura recebe as condições Desprevenido e Lento.\n• Congelamento Médio. A criatura recebe as condições Desprevenido, Lento e possui desvantagem em testes físicos.\n• Congelamento Total. A criatura recebe as condições Imóvel e Incapacitado, falha automaticamente em testes físicos e, caso receba um ataque, ele será um crítico e forçará a criatura a realizar um teste na tabela de consequências extremas, quebrando o gelo e o corpo junto.\n\nNormalmente, o congelamento irá progredir de um passo ao outro. A condição dura até que o gelo seja quebrado ou derretido.","tipo":"Inata"},{"n":"Ilimitado","dono":"Satoru Gojo","pg":84,"intro":"Ilimitado é a técnica herdada de Satoru Gojo, a qual traz para a realidade o conceito de “Infinito”, permitindo o seu usuário manipular e distorcer o espaço. Qualquer um do clã Gojo pode herdar a técnica, mas para usá-la de maneira apropriada é necessário ter os Seis Olhos, um raro jujutsu ocular.\n\nO Ilimitado é uma técnica naturalmente poderosa e versátil, com diversas aplicações, o que permite que o seu usuário possa escolher qualquer caminho como especialização; seja um lutador ou especialista em combate que constantemente reforça seus golpes e mantém a distância deseja ou um especialista em técnica que aproveita das incontáveis maneiras de se utilizar a técnica para afetar os inimigos ao redor.\n\nO Seis Olhos é um jujutsu ocular complementar, não sendo necessário para o uso da técnica, apenas servindo como um reforço a adicional. O seu personagem pode possuir o Seis Olhos caso seja permitido pelo narrador, visto que serve como um reforço direto no personagem, mas não é obrigatório para o funcionamento da técnica.\n\n▸ Considerações sobre a Técnica\nO Seis Olhos, quando unido com o Ilimitado, permite um nível de poder absoluto, resultando em um gasto quase nulo de energia e em um feiticeiro intocável. Entretanto, sendo um sistema de RPG, não seria justo para o jogo adaptá-lo de maneira completamente fiel.\n\nPor isso, a versão padrão do jujutsu ocular e da técnica presentes no livro não correspondem completamente com o que é visto na obra. O Seis Olhos é muito forte, mas tenta trazer prejuízos e peso em seu uso; a técnica tem um Funcionamento Básico superior ao comum – não devendo ser usado como base – e algumas habilidades de técnica fortes, mas visa ser utilizável sem quebrar completamente o equilíbrio dentro de jogo.\n\nCaso queira uma experiência diferente, sinta-se livre para modificar a técnica como desejar, desde que seja algo acordado entre você e o Narrador.\n\n▸ Seis Olhos\nSendo um raro jujutsu ocular do Clã Gojo, o Seis Olhos se manifesta como um par de olhos azuis brilhantes, os quais garantem ao usuário uma grande percepção. Dentro dessa percepção, inclui-se a capacidade de ver o fluxo de energia com muitos detalhes e controlar sua própria energia em um nível extremamente preciso, assim reduzindo grandemente o uso de energia. O Seis Olhos é um traço passivo, o qual o usuário não pode desativar. Porém, deixá-los expostos pode causar fadiga ao usuário. Devido a isso, os benefícios que um usuário do Seis Olhos recebe variam de acordo com o estado deles,","f":"O conceito básico - assim como estado neutro - da sua técnica é o Infinito, sendo este o poder de parar. Um usuário do Ilimitado está coberto por este infinito, reduzindo ou negando os efeitos de golpes e dano ao parar ou desacelerar perigos. O Infinito fornece as seguintes características ao seu usuário:\n\n• Uma quantidade de vezes igual ao seu bônus de maestria, por descanso, você pode anular completamente o dano de um ataque ou habilidade, fazendo com que o Infinito o freie por completo. Esta característica não pode ser usada dentro de uma expansão de domínio, contra ataques imbuídos pela amplificação de domínio ou ferramentas amaldiçoadas que negam ou perturbam técnicas amaldiçoadas.\n• Ataques de ameaças menores são automaticamente impedidos por completo: você é imune a dano de ataques ou habilidades provindos de criaturas cuja ND seja igual ou inferior a metade do seu nível de personagem, com o Infinito os impedindo completamente, a menos que estejam sob as mesmas condições da primeira característica.\n• Nem sempre é possível aparar golpes por completo, mas há uma constante proteção: você recebe um aumento de 2 na CA e 2 de redução de dano contra todos os tipos, exceto na alma. Nos níveis 5, 9, 13 e 17 os bônus aumentam em 2.","tipo":"Herdada"},{"n":"Love Rendezvous","dono":"Kirara Hoshi","pg":103,"intro":"Love Rendezvous é a técnica inata de Kirara Hoshi, que permite ao usuário marcar energia amaldiçoada com estrelas da constelação do cruzeiro do sul, limitando o movimento daqueles marcados.\n\nÉ uma técnica complexa, peculiar e versátil, podendo ser utilizada tanto de maneira defensiva quanto ofensiva, atendendo a diferentes propósitos.","f":"Você pode marcar energia amaldiçoada com as estrelas que formam a constelação Cruzeiro do Sul. Para marcar com uma estrela, o usuário deve fazer contato físico com a energia de alguém, o qual perceberá uma luz brilhante sobre a sua cabeça quando a técnica é ativada. As estrelas são: Imai, Acrux, Mimosa, Ginan e Gracrux.\n\nApenas uma estrela por vez pode ser colocada na energia amaldiçoada de uma pessoa, mas a mesma estrela pode ser colocada na energia de múltiplas pessoas. Para marcar objetos, é necessário que eles estejam imbuídos com energia. Caso um objeto esteja imbuído com a sua energia, ele terá a mesma marca que está na sua energia.\n\nUma criatura marcada pode encontrar o nome da estrela com a qual foi marcado escrito em algum canto do seu corpo, assim como em objetos.\n\nQualquer um marcado com uma estrela deve seguir uma ordem sequencial caso queira se aproximar de outra estrela, a qual é: Imai → Acrux → Mimosa → Ginan → Gracrux. Ao se mover sem seguir essa ordem, ele será impossibilitado de se aproximar e um alvo com a mesma estrela será atraído para ele e incapaz de se separar.\n\nA técnica tem alguns detalhes em seu funcionamento:\n\n• A energia amaldiçoada compartilhada entre um feiticeiro e seu shikigami é considerada a mesma pela técnica, podendo marcar tanto o usuário do shikigami quanto a invocação ao mesmo tempo.\n• Aquele que tiver a maior liberação de energia é quem puxará o outro quando ocorrer atração.\n\nPara ser usável de maneira apropriada, as duas habilidades iniciais de um usuário de Love Rendezvous são fixas.","tipo":"Inata"},{"n":"Manipulação de Fantoches","dono":"Kokichi Muta","pg":107,"intro":"Manipulação de Fantoches é a técnica inata de Kokichi Muta, a qual o permite controlar remotamente vários corpos amaldiçoados. Ela é impulsionada pela sua restrição congênita, que afeta o seu corpo.\n\nA sua técnica está adaptada considerando que o personagem possua a restrição congênita e a técnica ao mesmo tempo, com uma mecânica única.\n\n▸ Restrição Congênita\nVocê possui uma restrição congênita que sacrifica o seu corpo em troca de um controle superior sobre a energia e uma quantidade maior dela em seu estoque. Você tem as seguintes características:\n\n• Seus valores de atributos físicos (força, destreza e constituição) são limitados a 4, sendo impossível aumentá-los. Você também recebe desvantagem em rolagens de perícias com estes atributos.\n• Seus valores de atributos mentais (inteligência e sabedoria) são aumentados em 4, e tem como limite natural 30.\n• Seu máximo de energia é aumentado em 1,5 vezes o valor normal.","f":"Sua técnica o permite controlar remotamente corpos amaldiçoados fantoches, os quais podem receber e descarregar a energia amaldiçoada do seu mestre, assim como usar algumas habilidades de energia. Devido a sua restrição, não há um limite de alcance para a sua técnica, permitindo-o controlar um fantoche específico como representante da sua pessoa, sendo uma versão mais poderosa dos fantoches comuns.\n\nDurante missões, ao invés de controlar o seu personagem comum, você controla um Fantoche Definitivo. O Fantoche Definitivo possui uma ficha própria de personagem, utilizando as regras padrões de criação de personagens, mas usando a origem própria, fantoche definitivo.\n\n▸ Origem: Fantoche Definitivo\nCaso você seja um Fantoche Definitivo, você recebe as seguintes características:\n\n• Bônus em Atributo. Um fantoche definitivo recebe 3 pontos adicionais para distribuir entre seus atributos.\n• Ligado ao Mestre. Você é ligado ao seu mestre. Sua visão é compartilhada com o mestre. O seu armazenamento de energia amaldiçoada possui um valor igual ao do seu mestre, sendo compartilhado. Você pode usar as aptidões amaldiçoada que o seu mestre possuí, em troca de não receber nenhuma.\n• Fantoche Amaldiçoado. Você é um fantoche, sendo uma forma sintética de vida. Você é imune a dano venenoso e na alma, além da condição envenenado, mas você não recebe os efeitos de refeição nem de itens do tipo Medicina.\n• Modificações de Combate. Você não possui uma técnica amaldiçoada, mas pode receber várias modificações diferentes, que servem como as suas habilidades de técnica.\n\nHá diversas interações entre o Fantoche Absoluto e o personagem principal, as quais ocorrem através de habilidades e atributos. Como o Fantoche não possui uma consciência própria, sendo controlado diretamente por você em tempo integral, assim como compartilhando a visão, alguns pontos a se notar são:\n\n• Você pode realizar testes que envolvam atributos mentais como Investigação ou Percepção utilizando os atributos e perícias do seu personagem, ao invés do Fantoche, observando tudo através dos olhos dele.\n• Algumas habilidades do seu personagem podem passar a considerar o Fantoche como fonte, adaptando o alcance para ser a partir dele. Por exemplo Análise Profunda do Suporte, a qual permite analisar um inimigo para revelar fatores dele.\n• Certos talentos devem ser adaptados para a situação de ser um fantoche como, por exemplo, um talento que conceda Aliados, com eles acompanhando o Fantoche ao invés do seu personagem. Além de considerar que ou o seu personagem ou o Fantoche o possuirá, não permitindo o acúmulo de dois talentos iguais.","tipo":"Inata"},{"n":"Manipulação de Maldições","dono":"Suguru Geto","pg":114,"intro":"Manipulação de Maldições é a técnica inata de Suguru Geto, a qual tem um extremo potencial e poder, funcionando de maneira peculiar ao permitir o seu usuário absorver e controlar os seus inimigos, que são as maldições. É uma técnica que fornece um leque amplo de oportunidades.\n\nEnvolvendo a manipulação e controle, esta técnica consegue ter todo o seu potencial extraído enquanto nas mãos de um personagem Controlador, o qual poderá utilizar cada uma das maldições conquistadas ao máximo.","f":"A técnica o permite consumir maldições conquistadas em batalha e depois as manipular de diferentes maneiras. Você recebe as seguintes características:\n\n• Toda maldição derrotada em combate, contra a qual você tenha causado algum dano, transforma-se em uma pequena esfera negra após exorcizada. Você pode consumir a esfera, recebendo a maldição exorcizada como uma invocação. A ficha de inimigo da maldição absorvida deve ser convertida para uma ficha de invocação.\n• Caso você seja dois graus superior a uma maldição, você pode a absorver livremente. Dentro de combate, ela deve realizar um teste de resistência de vontade, sendo absorvida em uma falha. Tentar absorve uma maldição é uma ação comum.\n• Você pode trocar uma habilidade de técnica que receberia por um aumento de 1 no seu número máximo de invocações.\n• Caso uma maldição absorvida possua uma técnica, você pode usar as suas habilidades, pagando um custo de energia equivalente a ela.\n\nAo absorver uma maldição, sua ficha de atributo deve ser adaptada para o modelo das invocações. Ela receberá suas ações comuns como ações complexas e ações mais rápidas como ação simples.","tipo":"Inata"},{"n":"Manipulação de Pássaros Negros","dono":"Mei Mei","pg":119,"intro":"Manipulação de Pássaros Negros é a técnica amaldiçoada de Mei Mei, a qual permite que ela imbua corvos com a sua energia amaldiçoada, assim conseguindo os controlar à vontade.\n\nNo geral, a manipulação de pássaros negros é uma técnica complementar, não sendo extremamente poderosa por si só, o que necessita de um usuário que também seja capaz de se virar sem depender exclusivamente dela. Justamente por ser complementar, também é possível encaixá-la com qualquer especialização, desde que seus usos sejam adaptados para o que o usuário desejar trazer a campo.","f":"Você se torna capaz de imbuir corvos com a sua energia amaldiçoada, controlando-os à vontade. Assim que imbuídos, os pássaros se tornam completamente obedientes, seguindo-o sem questionamentos. Para o uso da sua habilidade, é essencial ter pássaros ao seu dispor: ao iniciar uma missão, você recebe uma quantidade de pássaros igual ao dobro do seu bônus de maestria. Seus pássaros podem ser mortos, possuindo 12 de CA e 5 pontos de vida cada.","tipo":"Amaldiçoada"},{"n":"Manipulação Sanguínea (Kamo)","dono":"Noritoshi Kamo","pg":125,"intro":"A Manipulação Sanguínea é uma técnica herdada do clã Kamo, sendo possível a ver ser usada por Noritoshi Kamo, a qual permite ao seu usuário manipular o próprio sangue, controlando-o e o fazendo assumir o formato que desejar, muito além do natural. Tanto o sangue interno quanto externo pode ser manipulado, desde que seja do usuário da técnica.\n\nA técnica apenas trás o sangue como um material para ser utilizado de várias maneiras distintas, dependendo da criatividade e capacidade do seu usuário. Logo, pode servir bem com qualquer especialização, seja usando-a como um reforço para um combate corpo-a-corpo próximo e constante ou focando no sangue como matéria para ataques e técnicas elaboradas.\n\nEmbora possua uma grande versatilidade, a técnica utiliza do sangue do próprio usuário, apresentando um risco e necessitando de cuidado com a perda de sangue.","f":"Você se torna capaz de manipular o seu próprio sangue, moldando-o a sua vontade, seja ele o sangue no seu corpo ou fora dele. A partir da manipulação, ele serve como matéria para seus ataques. Entretanto, por usar do seu sangue, as habilidades possuem um custo adicional em pontos de vida, o qual depende do seu nível:\n\n▸ Nível da Habilidade\nCusto em Pontos de Vida Nível 0 1 Ponto de Vida Nível 1 3 Pontos de Vida Nível 2 5 Pontos de Vida Nível 3 8 Pontos de Vida Nível 4 12 Pontos de Vida Nível 5 20 Pontos de Vida O custo em pontos de vida pode ser contornado de certas maneiras, como utilizando de bolsas de sangue. Sendo uma perda direta de sangue, o custo ignora qualquer redução ou resistência a dano.\n\nAlém disso, o sangue de um usuário da Manipulação Sanguínea é tóxico para as maldições. Sempre que causar dano em uma maldição, utilizando uma habilidade de técnica, você pode optar por fazer com que esse dano se torna do tipo Venenoso.","tipo":"Herdada"},{"n":"Manipulação Sanguínea (Choso)","dono":"Choso","pg":132,"intro":"Manipulação Sanguínea é a técnica amaldiçoada utilizada por Choso, sendo uma técnica do clã Kamo que acabou nas mãos de um feto amaldiçoado. Devido a sua constituição física especial, Choso consegue a utilizar de maneira única, criando uma nova vertente do como se controlar o sangue.\n\nA versão utilizada por Choso só pode ser utilizada por um personagem com origem Feto Amaldiçoado Híbrido. Suas habilidades focam em atacar e se revestir, possibilitando um proficiente combate corpo-a-corpo ou a distância, funcionando bem com Lutador, Especialista em Combate ou Especialista em Técnicas, ao focar nos usos a distância.","f":"Você se torna capaz de manipular o próprio sangue, moldando-o a sua vontade, seja dentro ou fora do seu corpo. A partir da manipulação, ele serve como material para diversos ataques e usos, assim como alterações corporais. Devido a constituição peculiar de um feto amaldiçoado, você é capaz de criar sangue a partir da energia, fazendo com que a falta de sangue deixe de ser uma preocupação em seu uso.","tipo":"Amaldiçoada"},{"n":"Marés do Desastre","dono":"Dagon","pg":140,"intro":"Marés do Desastre é a técnica amaldiçoada de Dagon, que permite a criação e o controle de água a partir da energia do usuário","f":"Você é capaz de produzir água a partir da sua energia amaldiçoada, controlando-a também mentalmente. Toda a água criada pela sua energia se torna água real, além de você ser capaz de puxá-la novamente após criada, carregando consigo todos que estejam nela.\n\nSempre que criar água com suas habilidades você pode, posteriormente, utilizar uma ação bônus para puxar a água na sua direção, cobrindo uma distância a sua escolha. Toda criatura que estiver na água também é levada com ela, movendo-se a força.","tipo":"Amaldiçoada"},{"n":"Milagres","dono":"Haruta Shigemo","pg":146,"intro":"Milagres é a técnica inata de Haruta Shigemo, a qual armazena pequenos milagres do cotidiano e os libera quando sua vida está em perigo. Para a adaptação sistemática, além de o salvar, os milagres são convertidos em sorte nos momentos certos.\n\nDe um ponto narrativo, os milagres acontecem de maneira inesperada, e o personagem não tem noção deles. Sistematicamente, você os usa voluntariamente, em certas habilidades.\n\nSem ser algo específico, Milagres pode encaixar com qualquer personagem, apenas adicionando um fator de sorte para seja quem for seu usuário.","f":"Ao ver um pequeno milagre, como o relógio estar com todos os dígitos iguais, ele é apagado da sua memória e armazenado. Você recebe uma quantidade de Milagres igual a 1 + seu bônus de maestria. Você recupera todos seus milagres após um descanso longo.\n\nSeus milagres são visíveis através de pequenas marcas abaixo dos seus olhos.","tipo":"Inata"},{"n":"Nulificação de Técnicas","dono":"Anjo","pg":149,"intro":"Nulificação de Técnicas é a técnica do Anjo, um feiticeiro do passado guiado pela sua fé, sendo capaz de anular o jujutsu, sejam técnicas amaldiçoadas, barreiras ou muito mais.\n\nÉ uma técnica que serve como antítese do que abastece a todos, a energia amaldiçoada, sendo especialmente forte contra maldições e aqueles que dependem das técnicas. Funciona bem, principalmente, com um Suporte ou Especialista em Técnica, embora possa ser útil para outras especializações.","f":"O usuário é capaz de anular técnicas amaldiçoadas, incluindo selos, barreiras e outras formas de jujutsu. A ativação da técnica gera luz purificadora, que extingue maldições com as quais entre em contato, normalmente tendo o formato de cruzes com a ponta afiada. A luz também pode cobrir o usuário ou produzir instrumentos.\n\nAo ser usuário da técnica, você recebe as seguintes características:\n\n• Você consegue passar livremente por barreiras e cortinas, não podendo ser impedido ou barrado.\n• Você recebe uma auréola e um par de asas, os quais o permitem usar o seu movimento padrão para voar.","tipo":"Técnica"},{"n":"Plantas do Desastre","dono":"Hanami","pg":157,"intro":"Plantas do Desastre é a técnica inata de Hanami, que permite ao usuário formar e controlar diferentes plantas amaldiçoadas, variando em tamanho, formato e fisiologia.","f":"Você é capaz de formar e controlar uma flora amaldiçoada a partir da sua energia, com capacidade de ativar tanto telepaticamente quanto fisicamente, surgindo do seu corpo. As plantas variam em formato, tamanho e propósito, desde pequenas flores até grandes raízes.","tipo":"Inata"},{"n":"Projeção","dono":"Naobito Zenin","pg":163,"intro":"O feitiço de Projeção é uma técnica herdada do clã Zenin, usada primeiramente por Naobito Zenin. Ela divide um segundo em 24 quadros, e muda a visão do usuário para que ele seja capaz de perceber e rastrear os movimentos. Quando a técnica é ativa, o usuário pode traçar um conjunto de movimentos pré-determinados para realizar nos 24 quadros, divididos em apenas 1 segundo. Enquanto ativa, tudo tocado pelo usuário deve seguir a mesma regra dos 24 quadros ou ficará congelado por 1 segundo. Ela gera grande velocidade para o usuário, com um movimento antinatural, mas tem suas restrições, sendo impossível se mover de um jeito que quebra excessivamente a trajetória ou as leis da física.\n\nA Projeção coloca seu usuário em uma percepção de mundo distinta, que possibilita uma locomoção mais ágil e rápida, colocando-o com poucos rivais quando a questão é velocidade. Por esse motivo, pode vir a ser melhor aplicada nas mãos de um usuário que foque no combate físico, atacando de maneira rápida e devastadora, imperceptível para a maioria.","f":"A partir da sua visão, um segundo é dividido em 24 quadros, que você é capaz de acompanhar. Ao ativar a técnica, você traça um conjunto de movimentos que irá realizar neste segundo, o qual não pode ser alterado.","tipo":"Herdada"},{"n":"Proporções","dono":"Kento Nanami","pg":169,"intro":"O Feitiço de Proporções é a técnica inata de Kento Nanami, a qual lhe garante a habilidade de dividir o seu alvo em linhas e forçar a criação de um ponto fraco, com proporção de sete para três.\n\nCom uma potencialização de dano e acertos críticos, Proporções é uma técnica que se encaixa bem nas mãos de um Especialista em Combate que utilize de uma boa arma e uma boa capacidade de produzir golpes extremamente fortes e letais.","f":"Você consegue marcar o corpo de um alvo com várias linhas divididas em dez partes, com um ponto fraco no exato ponto de sete por três (7:3), aumentando significativamente o dano.","tipo":"Inata"},{"n":"Santuário","dono":"Sukuna","pg":174,"intro":"Santuário é a técnica inata de Sukuna, ainda circundada de mistérios e dúvidas sobre seu funcionamento, sabendo-se apenas da sua absoluta letalidade manifestada através de dois tipos de cortes diferentes.\n\nEmbora ainda não tenha sido revelada e explicada por completo, a técnica de Sukuna estará adaptada em partes na Enciclopédia Amaldiçoada, atualizada conforme mais for introduzido.","f":"Você é capaz de produzir cortes invisíveis a partir da sua energia amaldiçoada, divididos em dois tipos: Clivar e Desmantelar. No primeiro nível, você recebe as habilidades de técnica de cortes nível 0, junto das variações de liberação nível 1.","tipo":"Inata"},{"n":"Sentença Mortal","dono":"Hiromi Higuruma","pg":183,"intro":"Sentença Mortal é a técnica inata de Hiromi Higuruma, cujo fundamento é a justiça, conferindo ao usuário acesso a uma expansão de domínio onde se conduz um julgamento contra uma criatura, a qual atenderá penas a depender do resultado.\n\nEmbora o domínio seja o principal da técnica, há alguns complementos. Entretanto, o foco estará em ser capaz de prender um inimigo em seu domínio e o levar a receber uma penalidade, recebendo uma sentença.\n\nPossuindo uma proposta distinta, a técnica pode se encaixar com diferentes especializações, não possuindo uma em específico com a qual seja superior.","f":"Sua técnica amaldiçoada é baseada na justiça e em julgamentos, com seu fator principal sendo a expansão, embutida em sua técnica: ao atingir o 4° nível, você recebe a aptidão amaldiçoada Expansão de Domínio Completa, com o seu custo de uso reduzido para 10 pontos de energia amaldiçoada, sendo inclusive já configurada para a expansão de domínio Sentença Mortal, explicada mais à frente.\n\nAlém disso, no primeiro nível, você recebe a habilidade de técnica Martelo da Justiça e a invocação Juiz, a qual ocupa como uma das suas habilidades iniciais. Nos próximos níveis, você recebe habilidades de técnica normalmente.\n\n• Intuição +5\n• Percepção +5\n• Vontade +3","tipo":"Inata"},{"n":"Transfiguração Inerte","dono":"Mahito","pg":190,"intro":"Transfiguração Inerte é a técnica inata de Mahito, a qual o permite distorcer o formato de almas, consequentemente transfigurando corpos. É possível tanto distorcer o próprio corpo quanto o corpo de outras criaturas que sejam tocadas. Envolvendo, essencialmente, a manipulação do próprio ser, é uma técnica amaldiçoada com grande versatilidade, possibilitando dezenas de aplicações diferentes, seja modificando o próprio corpo o ou o de outras criaturas ao seu redor. É possível se potencializar, aumentar danos, adaptar-se, curar outros indivíduos, melhorar a capacidade de aliados e até mesmo criar novas formas e seres.\n\nÉ uma técnica, também, complexa, pois envolve a distorção na alma. Certas habilidades dela causam dano na alma, o que não é comum para personagens de jogadores, gerando uma nova camada para o balanceamento, então é recomendado tomar cuidado ao liberar as habilidades que envolvem a transfiguração, existindo a alternativa de utilizá-la apenas com usos no próprio personagem. Além disso, a ideia de ser necessário distorcer outros seres para permitir o uso efetivo de certas habilidades da técnica reforça o fato de que é uma técnica que pertence a uma maldição: um ser maligno.\n\nBasta se atentar aos aspectos variáveis dela, assim conseguindo a utilizar de maneira apropriada e balanceada. Logo, é necessária uma conversa entre jogador e narrador para a resolução do uso de dano na alma.","f":"Você pode remodelar a sua alma e a alma daqueles que toca, distorcendo o seu formato, o que é refletido no corpo. Sempre que você transformar o seu corpo, a transformação dura até que você a reverta, o que pode ser feito como uma ação livre dentro de combate, no seu turno. Além disso, caso você reduza a integridade de um ser humano até 0 utilizando sua técnica, você pode o transformar em uma versão compacta de um humano transfigurado. Cada dois humanos transfigurados ocupam meio espaço em seu inventário, e podem ser utilizados em certas habilidades.","tipo":"Inata"},{"n":"Trem do Puro Amor","dono":"Kinji Hakari","pg":200,"intro":"Trem do Puro Amor é a técnica amaldiçoada de Kinji Hakari, a qual se baseia em jogos de pachinko, aplicada primariamente através da sua expansão de domínio, a qual manifesta o jogo Trem do Puro Amor, inspirado em um mangá de romance com o mesmo nome. Entretanto, também é possível invocar os indicadores visuais do jogo tanto dentro do domínio quanto fora.\n\nEsta técnica funciona de maneira peculiar, com o seu funcionamento sendo baseado na expansão de domínio, recebida antecipadamente pelo usuário e atuando como a principal força dela.\n\nDependendo do físico do usuário e o potencializando com as recompensas do jogo, Trem do Puro Amor serve melhor para um Lutador ou Especialista em Combate, que terá acesso a uma quantidade infinita de energia para se manter vivo e destruir com o máximo de liberação.","f":"Sua técnica amaldiçoada é baseada no jogo de pachinko Trem do Puro Amor, possuindo uma aplicação geral, ao manifestar os efeitos visuais do jogo, e uma aplicação dentro da expansão de domínio, a qual já é inerente a técnica, acessível desde mais cedo: ao atingir o 4° nível, você recebe a aptidão amaldiçoada Expansão de Domínio Completa, com o seu custo de uso reduzido para 10 pontos de energia amaldiçoada, sendo inclusive já configurada para a expansão de domínio Aposta Mortal Indolente, explicada mais à frente.\n\nAntes de possuir a expansão de domínio, você ainda recebe habilidades de técnica normalmente, de acordo com as regras padrão. E, mesmo sem a possuir, você estará ciente sobre o seu funcionamento e capacidade, necessitando apenas de desenvolver suas habilidades o suficiente para conseguir ativá-lo.\n\nA descrição que você encontrará a frente é o Efeito Especial da sua expansão de domínio, sendo automaticamente o primeiro. Além disso, ela possui como segundo efeito, o efeito especial Expansão Rápida: Aposta Mortal Indolente é naturalmente mais rápida, demorando apenas 0.2 segundos para ser criada, assim vencendo qualquer confronto de domínio com base em sua velocidade.","tipo":"Amaldiçoada"},{"n":"Arsenal Marcial","dono":"Restringidos","pg":206,"intro":"","f":"","tipo":""}],"SPL":[{"tec":"Boneco de Palha","n":"DISPARO DE PREGOS","nv":0,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"9 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você levita pregos no ar, cobrindo-os com energia e disparando contra um inimigo. Ao usar essa habilidade, você pode disparar até uma quantidade de pregos igual ao seu bônus de maestria: para cada prego além do primeiro, gasta-se 1 ponto de energia por prego disparado. Após isso, você realiza uma rolagem de Luta ou Pontaria contra a criatura alvo e, caso acerte, você causa 1d8 de dano perfurante para cada prego disparado. Uma criatura atingida pela habilidade deve realizar um teste de resistência de Fortitude e, caso falhe, fica com metade dos pregos disparados presos nela."},{"tec":"Boneco de Palha","n":"Redirecionamento Constante","nv":0,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Utilizando quantidades otimizadas de energia, você visa um constante redirecionamento de pregos que venham a errar os seus alvos, para melhor aproveitá-los futuramente. Após utilizar Disparo de Pregos, você pode escolher redirecionar uma quantidade de pregos que não tenham ficado presos no alvo, a qual é igual ao seu bônus de maestria, fixando-os em um lugar ou objeto inanimado a sua escolha dentro de 3 metros do alvo do ataque."},{"tec":"Boneco de Palha","n":"GRAMPO DE CABELO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Pregos","dur":"Imediata","area":"","custo":"","d":"Você explode um prego que esteja imbuído com energia amaldiçoada. Escolha um prego dentro do alcance da habilidade: o prego explode, fazendo com que toda criatura dentro de 4,5 metros dele realize um teste de resistência de Reflexos, recebendo 2d8 de dano de força, ou apenas metade em um sucesso. Uma vez que tenha escolhido um prego como alvo, ele é destruído, não podendo ser recuperado ou utilizado como alvo para habilidades. Caso exploda um prego preso a uma criatura, você pode trocar o teste de Reflexos por Fortitude."},{"tec":"Boneco de Palha","n":"RESSONÂNCIA","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Infinito","alvo":"Boneca de Palha","dur":"Imediata","area":"","custo":"","d":"Você causa danos na sua boneca de palha, a qual o permite criar ligações com criaturas ou objetos a partir de vestígios dela. Para isso, você precisa ter algo em sua posse que o permita afetar o ser ou objeto (sangue, um pedaço de corpo, um fragmento do objeto) e o coloca junto da boneca. Essa habilidade não tem um limite de alcance, desde que você possua o item para conectar.\n\nVocê realiza um ataque contra a boneca, e o dano dele é refletido na criatura ou objeto, causando também 3d6 de dano adicional de força. Uma criatura que receba um ataque feito por esta habilidade estará desprevenida contra você, caso não possa te ver; caso possa ver, ela realiza um teste de resistência de Reflexos, ficando desprevenida caso falhe."},{"tec":"Boneco de Palha","n":"EXPLOSÃO REPENTINA","nv":2,"pas":false,"k":"Técnica","exec":"Reação","alc":"Infinito","alvo":"Boneca de Palha","dur":"Imediata","area":"","custo":"","d":"Com um vestígio em mãos e a oportunidade de influenciar no ataque de um aliado, você causa uma explosão repentina no inimigo. Quando um aliado que você possa ver for atacar um inimigo do qual você possua vestígios, você pode usar sua reação para o golpear com a ressonância. O inimigo afetado deve realizar um teste de resistência de Astúcia, ficando Desprevenido contra o ataque do seu aliado em uma falha. Além disso, ele também recebe o dano do ataque realizado contra a boneca."},{"tec":"Boneco de Palha","n":"DECEPAR","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você concentra energia em um único prego e o dispara contra uma criatura, focando também em arrancar um pedaço dela. Realize um teste de Luta ou Pontaria contra a criatura alvo e, caso acerte, causa 15d8 de dano perfurante. Além disso, uma criatura atingida por esse ataque deve realizar um TR de Fortitude e, caso falhe, um pedaço pequeno do corpo dela é arrancado (dedo, pedaço de carne etc.); caso você ou um aliado estejam dentro de 4,5 metros da criatura, pode-se usar uma ação livre para agarrar o pedaço."},{"tec":"Boogie Woogie","n":"TROCA DE POSIÇÃO","nv":0,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"9 Metros","alvo":"Uma Criatura ou Objeto","dur":"Imediata","area":"","custo":"","d":"Ao bater palmas, você troca a posição de dois alvos dentro do seu alcance imediatamente, incluindo você mesmo. O movimento da troca de posição não causa ataques de oportunidade e, caso você realize um ataque contra uma criatura movida ou após ser movido, o alvo deve realizar um TR de Reflexos, ficando desprevenido em uma falha."},{"tec":"Boogie Woogie","n":"TROCA EMERGENCIAL","nv":0,"pas":false,"k":"Técnica","exec":"Reação","alc":"6 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Ao perceber uma ameaça para um aliado, você tenta o trocar de lugar com um alvo válido para a sua técnica: como uma reação, realize um teste de Reflexos e, caso o resultado do seu teste seja maior do que o resultado do teste de ataque, você bate palmas a tempo e o troca com outro alvo. Caso seja criatura seja colocada no lugar, ela se torna o novo alvo do ataque que foi evitado no aliado."},{"tec":"Boogie Woogie","n":"AJUSTE DE ALVO","nv":1,"pas":false,"k":"Técnica","exec":"Reação","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você realiza um ajuste surpresa de alvo para um ataque ou habilidade de um aliado, podendo adicionar um fator de choque. Caso você seja alvo de um ataque ou habilidade de técnica de um aliado, você pode utilizar sua reação para se trocar de lugar com um alvo válido dentro de 12 metros, o qual se tornará o novo alvo do ataque ou técnica; caso necessite de rolagem de acerto, o atacante possuirá vantagem e, caso necessite de um teste de resistência, aquele que está resistindo terá desvantagem."},{"tec":"Boogie Woogie","n":"COMBO SURPRESA!","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Variável","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você se prepara para combinar golpes e sua técnica para abrir uma brecha para encaixar uma grande surpresa em forma de combo. Ao utilizar esta habilidade, você realiza um ataque com uma arma de arremesso contra uma criatura dentro do alcance da dela e, quando a arma acerta ou se aproxima, você troca de lugar com ela, tornando-se adjacente ao alvo do ataque. Ao trocar de lugar, você pode também usar sua reação para realizar um ataque corpo-a-corpo contra a criatura, que estará desprevenida caso falhe em um teste de resistência de Astúcia."},{"tec":"Boogie Woogie","n":"TROCA COM OBJETO IMBUÍDO","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Um Objeto","dur":"Imediata","area":"","custo":"","d":"Você agarra um objeto pequeno qualquer, cobrindo-o com energia e o joga próximo a uma criatura dentro de 12 metros, realizando um ataque surpresa ao trocar de lugar com o objeto imbuído. Após trocar de lugar, você realiza uma ação de ataque contra o alvo, realizada com vantagem. O alvo também estará desprevenido e sua margem de crítico é reduzida em 1 durante o ataque. Você pode usar ataque extra com esta habilidade, ainda recebendo os seus benefícios no ataque adicional."},{"tec":"Boogie Woogie","n":"SEQUÊNCIA IMPREVISÍVEL","nv":3,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"12 Metros","alvo":"Duas Criaturas","dur":"Imediata","area":"","custo":"","d":"Ao usar esta habilidade, você deve escolher duas criaturas dentro do alcance: um aliado para o acompanhar e uma criatura para ser alvo da sequência de ataques. O aliado deve gastar a reação dele para acompanhar a sequência. Você e o aliado escolhido avançam até a criatura alvo, trocando de lugar constantemente para atacar de maneira imprevisível. Ao chegar na criatura, você e o aliado realizam dois ataques corpo-a-corpo cada, ambos considerando que a criatura está desprevenida."},{"tec":"Chamas do Desastre","n":"CRIAR CHAMA","nv":0,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"9 Metros","alvo":"","dur":"Imediata","area":"","custo":"","d":"Você cria um pequeno foco de chamas em um ponto dentro de 9 metros. O fogo criado por esta habilidade se torna fogo real, podendo iluminar, incendiar objetos ou criar pequenas chamas em pessoas. Caso incendeie uma pessoa, ela deve realizar um teste de resistência de Fortitude, recebendo 1d8 de dano queimante em uma falha; o teste é repetido todo turno até que as chamas sejam apagadas."},{"tec":"Chamas do Desastre","n":"DISPARO ARDENTE","nv":0,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"9 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você forma um cisco flamejante e dispara contra uma criatura dentro do alcance, realizando um teste de ataque, causando 1d10 de dano queimante em um acerto."},{"tec":"Chamas do Desastre","n":"REVESTIMENTO ABRASADOR","nv":0,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Seu corpo é revestido com chamas em uma fina camada, mantendo-o em constante calor. Você se torna resistente a dano congelante."},{"tec":"Chamas do Desastre","n":"AURA DE CALOR","nv":1,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"As chamas são incorporadas na sua aura, deixando-a ardente. Toda criatura que iniciar o seu turno dentro de 3 metros de você deve realizar um teste de resistência de Fortitude, recebendo 2d6 de dano queimante em uma falha. Seu máximo de energia diminui em 2."},{"tec":"Chamas do Desastre","n":"ORBE DE FOGO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Concentrando fogo, você cria uma orbe explosiva e a projeta contra um alvo. A criatura alvo deve realizar um teste de resistência de Reflexos, recebendo 3d8 de dano queimante ou apenas metade em um sucesso."},{"tec":"Chamas do Desastre","n":"TOQUE QUEIMANTE","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Sustentada","area":"","custo":"","d":"Você cobre sua mão ou arma em posse com chamas, aumentando seu poder destrutivo. Enquanto a habilidade estiver ativa, todo ataque corpo-a-corpo causa 1d10 adicional de dano queimante. Para cada rodada após a primeira, você deve pagar 1 ponto de energia amaldiçoada para sustentar a habilidade."},{"tec":"Chamas do Desastre","n":"COMBUSTÃO IMEDIATA","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Telepaticamente, você causa a combustão de uma criatura a sua escolha dentro do alcance. A criatura deve realizar um teste de resistência de Fortitude, recebendo 4d8 de dano queimante ou apenas metade em um sucesso. Além disso, a criatura afetada pela habilidade se incendeia. Uma criatura incendiada deve realizar um teste de resistência de Fortitude no começo de todo turno dela, recebendo 3d8 de dano queimante em uma falha ou se livrando das chamas em um sucesso. Caso a criatura tenha falhado no primeiro teste para resistir a habilidade, ela terá -2 em rolagens para resistir às chamas. O efeito de incendiado pode ser encerrado previamente ao apagar o fogo."},{"tec":"Chamas do Desastre","n":"EXPLOSÃO FLAMEJANTE","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"","dur":"Imediata","area":"4,5 Metros Esférica","custo":"","d":"Usando a si mesmo como foco, você cria uma explosão flamejante. A explosão afeta uma área esférica de 4,5 metros, considerando o usuário como ponto de origem. Toda criatura dentro da área afetada deve realizar um teste de resistência de Fortitude, recebendo 4d8 de dano queimante ou apenas metade em um sucesso."},{"tec":"Chamas do Desastre","n":"FOGO VERDADEIRO","nv":2,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Você reforça grandemente a temperatura das suas chamas, tornando-as em um fogo destrutivo. Sempre que causar dano queimante com a sua técnica, você ignora redução de dano igual ao dobro do seu bônus de maestria. Seu máximo de energia amaldiçoada diminui em 4."},{"tec":"Chamas do Desastre","n":"INSETOS DE BRASA","nv":2,"pas":false,"k":"Técnica","exec":"Variável","alc":"9 Metros","alvo":"","dur":"Imediata","area":"","custo":"","d":"Você cria uma quantidade variável de insetos de brasa, com capacidade explosiva. Ao conjurar como uma ação completa, você cria 6 insetos; como ação comum cria 4 e como ação bônus cria 2. Você pode dividir como desejar os insetos entre alvos dentro de 9 metros. Cada inseto irá tentar ferroar o alvo selecionado, realizando uma rolagem de ataque com Pontaria e causando 1d8 de dano perfurante em um acerto; após a ferroada, os insetos também irão explodir, forçando um alvo afetado a realizar um teste de resistência de Reflexos, recebendo 2d8 de dano queimante ou apenas metade em um sucesso."},{"tec":"Chamas do Desastre","n":"RAIO DE CHAMAS","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"","dur":"Imediata","area":"4,5 Metros Cone","custo":"","d":"Unindo a palma das suas mãos, você dispara um grande raio de chamas, afetando uma área cônica de 4,5 metros a partir de você. Toda criatura dentro da área deve realizar um teste de resistência de Fortitude, recebendo 4d8 de dano queimante ou apenas metade em um sucesso. Uma criatura que falhe no teste também é incendiada, devendo realizar um teste de resistência de Fortitude no começo de todo turno dela, recebendo 2d8 de dano queimante em uma falha ou se livrando das chamas em um sucesso."},{"tec":"Chamas do Desastre","n":"BOLA DE FOGO","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"","dur":"Imediata","area":"9 Metros Esférica","custo":"","d":"Você começa a concentrar chamas em uma área de maneira absurda, criando uma bola de fogo em um ponto dentro de 24 metros, a qual se expande em uma área esférica de 9 metros. Todas as criaturas dentro da área devem realizar um teste de resistência de Fortitude, recebendo 4d12 de dano queimante ou apenas metade em um sucesso. A bola de fogo incendeia objetos dentro da área e toda criatura que falhar se incendeia, devendo realizar um teste de resistência de Fortitude no começo de todo turno dela, recebendo 2d6 de dano queimante em uma falha ou se livrando das chamas em um sucesso."},{"tec":"Chamas do Desastre","n":"ERUPÇÃO VULCÂNICA","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"","dur":"Imediata","area":"","custo":"","d":"Você forma um vulcão em uma superfície dentro de 18 metros, o qual dispara um raio de lava em linha reta. O raio de lava avança em uma linha de 13,5 metros, com 1,5 metros de largura. Toda criatura atingida pelo raio deve realizar um teste de resistência de reflexos, recebendo 5d12 de dano queimante ou apenas metade em um sucesso."},{"tec":"Chamas do Desastre","n":"PAREDE INCADESCENTE","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"","dur":"5 Turnos, Concentração","area":"","custo":"","d":"Você cria uma grande parede de fogo, a qual cobre uma área de 9 metros de linha em um formato a sua escolha, com 3 metros de altura e 1,5 metros de largura. Toda criatura dentro da área em que a parede é criada deve realizar um teste de resistência de Reflexos, recebendo 3d12 de dano queimante ou apenas metade em um sucesso. Passar pela parede conta como terreno difícil e causa 2d12 de dano queimante. Além disso, ao criar a parede você pode escolher um dos lados dela para estar em constante explosão, forçando toda criatura deste lado a realizar um teste de resistência de Reflexos no começo do seu turno, recebendo 2d12 de dano queimante, ou apenas metade em um sucesso."},{"tec":"Chamas do Desastre","n":"EXPLOSÃO ATRASADA","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"30 Metros","alvo":"","dur":"Concentração, 1 Minuto","area":"","custo":"","d":"Você escolhe um ponto dentro de 30 metros para criar uma enorme concentração de chamas, compacta na forma de uma esfera que será mantida no local. Quando a habilidade acabar, seja pela sua concentração ser quebrada ou você a encerrar voluntariamente, a esfera irá se propagar em uma enorme explosão, afetando uma área esférica de 12 metros. Uma criatura dentro da área deve realizar um teste de resistência de Fortitude, reduzindo o dano a metade em um sucesso. A explosão causa 6d10 de dano queimante, aumentando em 1d10 para cada turno que a habilidade for mantida antes da explosão."},{"tec":"Chamas do Desastre","n":"RIO DE LAVA","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"","dur":"Imediata","area":"","custo":"","d":"Você une suas mãos e começa a projetar um rio de lava à sua frente, causando uma correnteza de destruição. Uma área retangular de 12 metros a sua frente é coberta por lava. Toda a área coberta é terreno difícil, uma criatura que esteja na área que você cobriu deve realizar um teste de resistência de Fortitude, recebendo 6d10 de dano queimante ou apenas metade em um sucesso. Uma criatura que iniciar seu turno dentro da área deve repetir o teste de Fortitude, recebendo 4d10 de dano queimante ou apenas metade em um sucesso. O rio de lava dura até que você o dissipe ou seja, de alguma maneira, contido."},{"tec":"Chamas do Desastre","n":"DEVASTAÇÃO ESCALDANTE","nv":5,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"30 Metros","alvo":"","dur":"Imediata","area":"","custo":"","d":"Você cria três vulcões em pontos distintos dentro de 30 metros, disparando raios de lava de cada um. Cada vulcão dispara em um cone de 9 metros a partir de si mesmo e toda criatura na área deve realizar um teste de resistência de Fortitude, recebendo 6d10 de dano queimante ou apenas metade em um sucesso."},{"tec":"Chamas do Desastre","n":"INCINERAR","nv":5,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"6 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você foca em uma criatura e libera seu máximo de chamas imediatamente, buscando a incinerar e queimar até a morte. A criatura alvo deve realizar um teste de resistência de Fortitude, recebendo 16d12 de dano queimante, ou apenas metade em um sucesso. A criatura também se incendeia com chamas duradouras, realizando um teste de resistência de fortitude no começo de todo turno dela, recebendo 6d12 de dano queimante em uma falha ou metade em um sucesso; em um sucesso crítico, ela se livra das chamas. As chamas desta habilidade não podem ser apagadas por meios comuns.\n\nTÉCNICA MÁXIMA: METEORO"},{"tec":"Chamas do Desastre","n":"METEORO","nv":6,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"","alvo":"","dur":"Imediata","area":"50 Metros Esférica","custo":"25 PE","d":"Você leva a sua técnica ao máximo, formando um enorme meteoro no céu, o qual cairá para devastar uma área esférica de 50 metros. Você pode formar o meteoro em um ponto no céu dentro de 48 metros, e ele cairá após uma rodada. Ao cair, toda criatura na área deve realizar um teste de resistência de Fortitude com desvantagem, recebendo 30d10 de dano queimante, ou apenas metade em um sucesso. Além disso, toda a área afetada pelo meteoro se torna terreno difícil, ao ser completamente destruída. A formação rochosa do meteoro continua existindo, ocupando uma área esférica de 12 metros. (Habilidades como Técnica Cuidadosa não podem ser aplicadas nela.)","reg":"Técnica Máxima: 25 PE. Depois de usar, não pode ser usada de novo durante a mesma cena."},{"tec":"Chamas do Desastre","n":"Expansão de Domínio: Caixão Da Montanha de Ferro","nv":6,"pas":false,"k":"Domínio","exec":"Ação Comum","alc":"Esfera de 9 m","alvo":"","dur":"3 + nível de aptidão em Domínio (rodadas)","area":"","custo":"25 PE","d":"Caixão da Montanha de Ferro [Expansão Completa] Sua expansão cria um espaço próprio que ocupa uma área esférica de 9 metros, o qual dura uma quantidade de rodadas igual a 3 + seu nível de aptidão em domínio. Ela pode possuir os seguintes efeitos:\n\n• Efeito Ambiental: Dano. Sua expansão se assemelha ao interior de um vulcão. Toda criatura, exceto você, que iniciar seu turno dentro da expansão, recebe 1d10 + 5 de dano queimante.\n• Amplificação de Técnica: Aumento de Dano. Toda habilidade de técnica que você utilizar dentro da expansão causa +1 dado e +5 de dano.\n• Amplificação de Técnica: Negação de Redução de Dano. Toda habilidade de técnica que você utilizar dentro da expansão negam 3 de redução de dano.\n• Acerto Garantido. Caso possua a aptidão Acerto Garantido, ele pode ser implementado na expansão.","reg":"Expansão Completa letal: 20 PE + 5 PE de Acerto Garantido = 25 PE."},{"tec":"Cólera das Estrelas","n":"PUNHO PESADO","nv":0,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Sustentada","area":"","custo":"","d":"Você aumenta sua massa levemente para impulsionar os seus golpes físicos. Enquanto Punho Pesado estiver ativada, todo ataque corpo-a-corpo que você realizar causa 1 dado de dano adicional. Para cada turno que a habilidade estiver ativa, após o primeiro, você deve pagar 1 ponto de energia amaldiçoada para a sustentar."},{"tec":"Cólera das Estrelas","n":"TRANSFORMAR GARUDA","nv":0,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Toque","alvo":"Garuda","dur":"Ilimitada","area":"","custo":"","d":"Você transforma seu shikigami Garuda em uma ferramenta amaldiçoada em formato de chicote. Você trata como se tivesse maestria com ela e a transformação dura uma quantidade de tempo a sua escolha, sendo possível a reverter como uma ação livre. Enquanto em forma de chicote, Garuda causa 1d8 de dano e tem as características Estendida e Pesada."},{"tec":"Cólera das Estrelas","n":"PUNHO PESADO: AMPLIFICAÇÃO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Sustentada","area":"","custo":"","d":"Um aumento maior de massa para impulsionar seus golpes. Enquanto Punho Pesado: Amplificação estiver ativada, todo ataque corpo-a-corpo que você realizar causa 1 dado de dano adicional e soma +2 ao total. Para cada turno que a habilidade estiver ativa, após o primeiro, você deve pagar 1 ponto de energia amaldiçoada para a sustentar."},{"tec":"Cólera das Estrelas","n":"LAÇO PESADO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você comanda Garuda a avançar contra um alvo e tentar o prender, laçando-o e usando da sua massa para diminuir o movimento dele. A criatura alvo deve realizar um teste de resistência de Reflexos: caso falhe, a criatura recebe as condições Agarrado e Caído, com Garuda se laçando nele. Para escapar, a criatura deve repetir o TR no começo de todo turno dela, livrando-se de Garuda em um sucesso."},{"tec":"Cólera das Estrelas","n":"PUNHO PESADO: AMPLIFICAÇÃO DUPLA","nv":2,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Sustentada","area":"","custo":"","d":"Um aumento maior de massa para impulsionar seus golpes. Enquanto Punho Pesado: Amplificação Dupla estiver ativada, todo ataque corpo-a-corpo que você realizar causa 2 dados de dano adicionais. Para cada turno que a habilidade estiver ativa, após o primeiro, você deve pagar 1 ponto de energia amaldiçoada para a sustentar."},{"tec":"Cólera das Estrelas","n":"ESMAGAMENTO","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você usa Garuda como um chicote, reforçado, para esmagar um alvo. Você realiza uma rolagem de ataque contra o alvo, a qual usa a sua perícia de Luta, e caso acerte você causa 8d8 de dano de impacto. Uma criatura acertada por Esmagamento deve realizar um teste de resistência de Fortitude e, caso falhe, é derrubada."},{"tec":"Cólera das Estrelas","n":"PUNHO IMPARÁVEL","nv":2,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Enquanto amplificado, nada pode impedir o poder dos seus punhos e da massa imbuída neles. Enquanto estiver com alguma habilidade de Punho Pesado ativa, seus ataques corpo-a-corpo ignoram redução de dano igual ao dobro do seu bônus de maestria. Seu máximo de energia amaldiçoada diminui em 4."},{"tec":"Cólera das Estrelas","n":"PUNHO PESADO: AMPLIFICAÇÃO TRIPLA","nv":3,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Sustentada","area":"","custo":"","d":"Aumenta grandemente a massa para seus próximos golpes. Enquanto Punho Pesado: Amplificação Tripla estiver ativada, todo ataque corpo-a-corpo que você realizar causa 3 dados de dano adicionais. Para cada turno que a habilidade estiver ativa, após o primeiro, você deve pagar 2 pontos de energia amaldiçoada para a sustentar."},{"tec":"Cólera das Estrelas","n":"CHUTE DEVASTADOR","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Reforça a si mesmo e Garuda com massa imaginária e depois utiliza do shikigami como um projétil, chutado com o máximo de força. O alvo do ataque deve realizar um teste de resistência de Reflexos, recebendo 12d8 de dano de impacto, ou apenas metade em um sucesso."},{"tec":"Cólera das Estrelas","n":"DESTRUIÇÃO ABSOLUTA","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"","dur":"Imediata","area":"Linha de 18 Metros","custo":"","d":"Você usa de Garuda como ferramenta para criar uma onda de destruição absoluta em uma linha. Todas as criaturas em uma linha de 18 metros a sua frente devem realizar um teste de resistência de Reflexos, recebendo 10d10 de dano de impacto, ou apenas metade em um sucesso. Caso deseje, você pode transformar toda a área afetada pela habilidade em terreno difícil."},{"tec":"Cólera das Estrelas","n":"BURACO NEGRO","nv":5,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"Próprio","alvo":"","dur":"3 Rodadas","area":"Variável","custo":"","d":"Você quebra o limite da densidade através da sua massa imaginária, criando um buraco negro. Ao usar essa habilidade, você gera um buraco negro a partir de você, o qual afeta uma área esférica de 18 metros: toda criatura dentro da área deve imediatamente realizar um teste de resistência de Fortitude, recebendo a condição Imóvel em uma falha; Lento em um sucesso comum ou nenhuma em um sucesso crítico. No começo de toda rodada, uma criatura dentro da área é puxada 9 metros na direção do centro do buraco negro e recebe 12d12 de dano de força. O buraco negro dura 3 rodadas e, no final de cada rodada, sua área aumenta em 9 metros. Entretanto, com você sendo o centro do buraco negro, é impossível fugir dos danos: você também recebe o dano causado pela habilidade."},{"tec":"Cópia","n":"Expansão de Domínio: Puro Amor Mútuo","nv":6,"pas":false,"k":"Domínio","exec":"Ação Comum","alc":"Esfera de 9 m","alvo":"","dur":"3 + nível de aptidão em Domínio (rodadas)","area":"","custo":"25 PE","d":"Puro Amor Mútuo é a expansão de domínio da Cópia, utilizada por Yuta Okkotsu. Levando ao máximo a técnica, concede ao usuário um grande leque de habilidades para utilizar, sendo uma expansão completa letal Puro Amor Mútuo [Expansão Completa] Sua expansão cria um espaço próprio que ocupa uma área esférica de 9 metros, a qual dura uma quantidade de rodadas igual 3 + seu nível de aptidão em domínio. O domínio é uma área cheia de estruturas no formato de cruzes, as quais possuem várias katanas fincadas, circundada por cordas amarradas em nós que simbolizam o amor. Ela pode possuir os seguintes efeitos:\n\n• Efeito Especial: Infinitas Cópias. Técnicas que você tenha copiado e armazenado são manifestadas nas espadas espalhadas pelo seu domínio, as quais apenas você pode usar. Enquanto no domínio, pegar uma katana é uma ação livre, a qual pode ser repetida várias vezes na mesma rodada, e utilizar a habilidade de técnica na katana é uma ação comum. Uma habilidade usada desta maneira não tem nenhum custo em energia. Após utilizar uma katana, ela desaparece, mas, logo depois, outra katana surge, tendo uma quantidade infinita delas enquanto o domínio estiver ativo.\n• Acerto Garantido. Caso possua a aptidão amaldiçoada Acerto Garantido, ela pode ser colocada na expansão. Você pode escolher qualquer técnica que tenha copiado para ser imbuída como acerto garantido, modificando seu efeito.","reg":"Expansão Completa letal: 20 PE + 5 PE de Acerto Garantido = 25 PE."},{"tec":"Criatura Mística Âmbar","n":"ACÚMULO DE CARGA","nv":0,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Você se torna capaz de criar tensão elétrica, transferindo carga positiva para os inimigos para depois liberar a carga negativa acumulada em seu corpo, assim conseguindo liberar raios. Sempre que acertar um ataque em uma criatura, ela recebe um ponto de carga positiva, os quais duram até o final da cena ou serem gastos. Além disso, você inicia um combate com dois pontos de carga negativa acumulados em si mesmo e, a cada rodada, você recebe mais dois pontos de carga negativa, necessários para utilizar suas habilidades de eletricidade."},{"tec":"Criatura Mística Âmbar","n":"LIBERAÇÃO DE RAIO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você libera sua carga negativa acumulada em um alvo também carregado para criar um raio. Para usar esta habilidade, você deve possuir pelo menos dois pontos de carga negativa acumulados em você, que são gastos. Como uma ação comum, você escolhe uma criatura que tenha pelo menos um ponto de carga positiva para criar um raio nela. A criatura alvo deve realizar um teste de resistência de Fortitude, reduzindo o dano a metade em um sucesso. A habilidade causa 2d8 de dano chocante, aumentando em 1d8 para cada ponto de carga positiva além do primeiro que a criatura tiver acumulada, até um máximo de 3 dados adicionais."},{"tec":"Criatura Mística Âmbar","n":"APRIMORAMENTO DE CARGAS","nv":1,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Você foca em aprimorar o seu domínio sobre as cargas elétricas, otimizando a concentração e uso das propriedades elétricas de sua técnica. Uma vez por rodada, ao receber uma carga negativa ou implementar uma carga positiva, você pode escolher receber/implementar uma carga adicional. Além disso, Liberação de Raio tem o seu limite de dados adicionais dobrados. Seu máximo de energia amaldiçoada diminui em 2."},{"tec":"Criatura Mística Âmbar","n":"DESTRUIÇÃO INEVITÁVEL","nv":2,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"A destruição e impacto dos seus golpes é inevitável, conseguindo sempre ultrapassar defesas e resistência de alguma maneira enquanto atacando fisicamente. Seus golpes corpo-a-corpo que causem dano chocante ou de força passam a ignorar redução de dano igual ao dobro do seu bônus de maestria. Seu máximo de energia amaldiçoada diminui em 4."},{"tec":"Criatura Mística Âmbar","n":"CONDENAÇÃO VOLTAICA","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"30 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Após acumular muitas cargas, você causa a liberação de um raio extremamente concentrado, condenando o alvo a ficar paralisado. Para usar esta habilidade, você deve possuir pelo menos quatro pontos de carga negativa acumulados em você. Como uma ação comum, você escolhe uma criatura que tenha pelo menos quatro pontos de carga positiva para ser alvo. A criatura alvo deve realizar um teste de resistência de Fortitude, recebendo 8d10 de dano chocante ou apenas metade em um sucesso. Caso a criatura falhe no teste, ela também recebe a condição Paralisado por uma rodada."},{"tec":"Criatura Mística Âmbar","n":"PRESA DO DEUS DO RAIO","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"30 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Estabelecendo uma conexão elétrica forte, você produz um raio direcionado a uma parte do corpo do alvo, buscando a destruir. Para usar esta habilidade você deve possuir pelo menos quatro pontos de carga negativa acumulados em você. Como uma ação comum, você escolhe uma criatura que tenha pelo menos quatro pontos de carga positiva para ser alvo do raio. A criatura deve realizar um teste de resistência de Fortitude, recebendo 8d10 de dano chocante ou apenas metade em um sucesso. Caso a criatura passe no teste, ela perde um membro aleatório, utilizando a tabela de consequências extremas do Livro Básico, página 283; caso a criatura falhe, você pode escolher qual consequência infligir nela, conseguindo utilizar do raio com destruição absoluta.\n\n▸ Ativação de Técnica\nDiferente do padrão, Criatura Mística Âmbar tem uma ativação peculiar, a qual acaba por trazer consequências para o seu usuário. Ao ativar a técnica, o corpo do usuário passa a ser reconstruído a partir da conversão da energia amaldiçoada, assim manifestando diferentes fenômenos.\n\nEntretanto, justamente tal reconstrução é aquela que traz a maior consequência: um corpo que ultrapassa o reino humano é fadado a colapsar. Embora, dentro da obra só tenha sido mostrada uma ativação completa, em Feiticeiros e Maldições é possível utilizar manifestações parciais, que apenas trazem um desgaste maior.\n\nAo realizar a ativação, você pode escolher quais fenômenos manifestar, a partir da sua lista de fenômenos conhecidos, os quais ocupam espaços de habilidades de técnica, além de ter os mesmos requ
