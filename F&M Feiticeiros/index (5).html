tes de ver as consequências. Quando um inimigo conseguir um 20 em uma jogada de ataque para o acertar, você recupera 1 ponto de sorte. Você recupera seus pontos de sorte após um descanso longo."},{"c":"Geral","n":"GUARDA INFALÍVEL","d":"Você nunca baixa a sua guarda, mesmo em uma situação que pode ser vista como catastrófica. Em caso de um desastre em um teste de ataque, você não causa um ataque como reação. Caso um efeito imposto sobre você tente reduzir sua Defesa ou impor modificadores negativos em testes de resistência, você terá +3 para resistir."},{"c":"Geral","n":"INCREMENTO DE ATRIBUTO","d":"Buscando se tornar mais forte, você aumenta um de seus atributos através do treino e esforço. Ao obter esse talento, você aumenta o valor e o limite de um atributo à sua escolha em 2. Você pode pegar este talento várias vezes, mas apenas uma vez para cada atributo."},{"c":"Geral","n":"INVESTIDA APRIMORADA","d":"Você domina a arte de realizar uma investida, otimizando-a para extrair o potencial máximo da ação. Ao realizar uma ação de investida, seu movimento aumenta em 3 metros durante ela; o bônus de acerto aumenta de +2 para um valor igual ao seu bônus de treinamento e, caso acerte o ataque, o alvo deve realizar um teste de Atletismo contra o seu, sendo derrubado em uma falha."},{"c":"Geral","n":"MESTRE DAS ARMAS","d":"Você desenvolve suas capacidades e potencial para manejar armas. Ao obter este talento, você escolhe aumentar o valor de sua Força ou Destreza em 2 e pode escolher entre se tornar treinado em quatro armas quaisquer à sua escolha ou receber acesso ao efeito de crítico de um grupo de armas à sua escolha."},{"c":"Geral","n":"MESTRE DEFENSIVO","d":"Você desenvolve suas capacidades de defesa e resistência. Ao obter este talento, você escolhe aumentar o valor de sua Força ou Constituição em 2 e se torna treinado em escudos. Caso já seja treinado, você recebe Redução de Dano adicional com o escudo igual a metade do valor base de RD dele (um Escudo Pesado concederia 9 ao invés de 6)."},{"c":"Geral","n":"PERCEBER OPORTUNIDADE","d":"Você possui uma facilidade sem igual para realizar golpes oportunos, sendo quase como uma segunda natureza para você. Você ignora a regra de repetição de reação para Golpes de Oportunidade, podendo repeti-lo duas vezes por rodada ao invés do comum. Todo golpe de oportunidade que você realiza possui vantagem."},{"c":"Geral","n":"PROVOCAÇÃO DESAFIADORA","d":"Não só provocar, mas você é capaz de se transformar no centro da atenção daquele que você deseja desafiar. Uma criatura que seja afetada por uma ação de Provocar sua, além de receber desvantagem para atacar outras criaturas, deve sempre realizar pelo menos um ataque contra você. Além disso, uma quantidade de vezes igual a metade do seu modificador de Presença, você pode utilizar Provocar como uma Ação Livre."},{"c":"Geral","n":"RESILIÊNCIA MELHORADA","d":"Você refina suas estratégicas e habilidade para resistir a um nicho específico de ameaças. Ao obter este talento, escolha um teste de resistência, exceto Integridade: você se torna treinado nele ou, caso já seja treinado, se torna mestre. O valor do atributo usado no TR escolhido aumenta em 1."},{"c":"Geral","n":"SALTADOR CONSTANTE","d":"Você é extremamente acostumado a saltar, movendo-se mais através de pulos do que correndo. Ao pular, caso você esteja no alcance toque de uma parede ou objeto no fim do seu movimento, você pode utilizar a ação pular mais uma vez como ação livre, cortando seu pulo pela metade, ao terminar o movimento com um alvo dentro do seu alcance corpo a corpo, caso realize um ataque contra ele, você recebe +2 na jogada de ataque e, caso acerte, causa dano adicional igual ao seu modificador de Força."},{"c":"Geral","n":"TÉCNICAS AGRESSIVAS DE ESCUDO","d":"Você aperfeiçoa o uso do seu escudo para colocá-lo no seu ataque. Ao atacar no seu turno, você pode usar sua Ação Bônus para Empurrar com o escudo. Caso o alvo seja empurrado com sucesso, ele recebe Xd6 + seu Modificador de Força de dano de impacto, onde X é igual ao seu Modificador de Força. Além disso, você pode escolher aumentar a distância que a criatura é empurrada em 4,5 metros ou a derrubar."},{"c":"Geral","n":"TÉCNICAS DE ARREMESSO","d":"Você se aprofunda em técnicas para manusear armas de arremesso no seu potencial máximo e evitar desperdiçar uma delas. Sempre que atacar com uma arma de arremesso, você recebe um bônus de +2 para acertar e +3 no dano."},{"c":"Geral","n":"TÉCNICAS DE REAÇÃO RÁPIDA","d":"Preparado para agir sob pressão e urgência, você sabe como reagir o mais rápido possível. Você recebe +5 de Iniciativa. Após a rolagem de iniciativa, caso você não seja o primeiro, você pode rolar novamente, ficando com o melhor resultado."},{"c":"Geral","n":"TÉCNICAS DEFENSIVAS DE ESCUDO","d":"Você aperfeiçoa o uso do seu escudo para colocá-lo por completo na sua defesa. Ao invés de receber penalidade, você adiciona o bônus padrão do escudo em TRs de Reflexos. Além disso, uma quantidade de vezes igual ao seu Bônus de Treinamento, por descanso longo, você pode, antes de saber o resultado de um TR de Reflexos, escolher usar sua Reação para reduzir o valor necessário para um sucesso crítico em 3."},{"c":"Geral","n":"TEMPESTADE DE IDEIAS","d":"Você decide extrair ao máximo o seu potencial, obtendo melhorias e novas maestrias. Aumenta um atributo a sua escolha em 1. Você se torna treinado em uma perícia e uma ferramenta à sua escolha. Além disso, escolha uma perícia na qual seja treinado: uma quantidade de vezes igual a metade do seu bônus de treinamento, por descanso curto, você pode escolher receber vantagem em um teste com ela."},{"c":"Geral","n":"ADEPTO DE MEDICINA","d":"Estudando em seu tempo livre, você aprendeu sobre primeiros socorros em busca de ajudar sua equipe em momentos de desespero. Ao obter este talento, você recebe acesso ao segundo efeito da habilidade Suporte em Combate, de Suporte (p.102), com o valor da cura sendo baseado em seu nível de personagem, mas a quantidade de usos é reduzida pela metade. [Pré-Requisito: Mestre em Medicina, não possuir mais que dois talentos com o nome \"Adepto\"]"},{"c":"Geral","n":"ADEPTO DE BRIGA","d":"Para sempre ter uma opção, você treinou seus punhos o suficiente para ajudar nas situações mais precárias. Enquanto não estiver com nenhum equipamento do grupo Pugilato, você recebe +3 em jogadas de ataque desarmado e o dano de seus golpes desarmados aumenta em 2 níveis. Além disso, caso acerte um ataque desarmado mas não cause nenhum dano, você pode Agarrar, Derrubar ou Empurrar o alvo como uma Ação Livre, recebendo um bônus igual a metade do seu Bônus de Treinamento no teste. [Pré-Requisito: Mestre em Atletismo, não possuir mais que dois talentos com o nome \"Adepto\"]"},{"c":"Geral","n":"ADEPTO DE COMBATE","d":"Estudando e refletindo, você consegue adotar um estilo de combate específico, compreendendo e incorporando seus detalhes. Ao obter este talento você aprende um dos estilos de combate da especialização Especialista em Combate, o qual considera seu Nível de Personagem para os efeitos. [Pré-Requisito: Mestre em Intuição, não possuir mais que dois talentos com o nome \"Adepto\"]"},{"c":"Geral","n":"ADEPTO DE FEITIÇARIA","d":"Com um treinado mais focado em técnica e como a utilizar de maneira melhor, você descobre mais sobre a feitiçaria como um todo. Ao obter este talento, você recebe uma Mudança de Fundamento da habilidade Domínio dos Fundamentos de Especialista em Técnica (p.78), com exceção de Técnica Rápida. Você pode reduzir o custo da Mudança de Fundamento em 1 uma quantidade de vezes igual ao seu bônus de treinamento por cena. [Pré-Requisito: Mestre em Feitiçaria, possuir Feitiços, não possuir mais que dois talentos com o nome \"Adepto\"]"},{"c":"Geral","n":"ALMA INQUEBRÁVEL","d":"Sua alma é mais resistente do que o normal, com sua consciência e perseverança tornando-a difícil de se quebrar. Você se torna treinado em Integridade e recebe Redução de Dano contra Dano na Alma igual a 1/4 do seu Nível de Personagem. [Pré-Requisito: Constituição 14]"},{"c":"Geral","n":"APAZIGUADOR DE TÉCNICA","d":"Preparado para impedir seus inimigos de utilizarem técnicas no meio de combate, você sabe o momento perfeito para esgueirar golpes entre conjurações. Ao ver um inimigo usar uma técnica com a conjuração de Ação Comum ou maior em seu alcance corpo-a-corpo, você pode realizar um golpe de oportunidade contra ela, forçando-a a fazer um teste de concentração. Caso a criatura falhe, ela perde 5 em rolagens de acerto/ CD caso seja um Feitiço de dano, tem os benefícios do Feitiço cortados pela metade caso seja auxiliar ou tem o Feitiço completamente anulado caso seja especial ou não se encaixe em nenhum dos outros parâmetros. Caso o Feitiço seja anulado, o alvo recupera a ação e não gasta o PE, mas não pode realizar o Feitiço anulado. [PréRequisito: Treinado em Astúcia, Nível 8]"},{"c":"Geral","n":"APTIDÃO DESENVOLVIDA","d":"Você desenvolve uma de suas aptidões e capacidade de uso da energia amaldiçoada. Ao obter este talento, escolha uma aptidão amaldiçoada para ter o seu nível de aptidão aumentado em 1. Você pode pegar esse talento múltiplas vezes, mas apenas uma vez para cada Aptidão. [Pré-Requisito: Nível 4]"},{"c":"Geral","n":"DETERMINADO A VIVER","d":"Mesmo de frente a perigos e ameaças sem limites, você mantém sua vontade de viver e seguir em frente. Uma vez por dia, na primeira vez que fosse para os testes de morte, você pode escolher ficar com 1 de vida ao invés disso. Todo teste de morte que você realiza, a partir do segundo, possui vantagem. [Pré-Requisito: PréRequisito: Treinado em Vontade e Constituição 16]"},{"c":"Geral","n":"DISCURSO MOTIVADOR","d":"Você pode gastar 10 minutos, fora de combate, ou gastar uma Ação Completa ,dentro de combate, para inspirar seus aliados: todas as criaturas amigáveis na cena, que possam te ouvir, recebem HP temporário igual ao dobro do seu nível + seu modificador de Presença multiplicado pela metade do seu bônus de treinamento, arredondado para cima. Uma criatura só pode receber esse bônus uma vez por descanso curto ou longo. [Pré-Requisito: Treinado em alguma perícia de Presença]"},{"c":"Geral","n":"ESPECIALISTA EM CONCUSSÃO","d":"Seu valor de força ou constituição aumenta em 1. Sempre que causar Dano de Impacto em um ataque corpo a corpo, ele é aumentado em um nível. Uma vez por turno, ao acertar uma criatura e infligir dano de impacto, você pode mover ela até 3 metros para um espaço desocupado, desde que o alvo não seja duas categorias de tamanho acima de você. [Pré-Requisito: Nível 8]"},{"c":"Geral","n":"ESPECIALISTA EM CORTES","d":"Seu valor de força ou destreza aumenta em 1. Sempre que causar Dano Cortante em um ataque corpo a corpo, ele é aumentado em um nível. Uma vez por turno, ao acertar uma criatura e infligir dano cortante, você pode reduzir o movimento dela em 4,5 metros até o começo do seu próximo turno. [Pré-Requisito: Nível 8]"},{"c":"Geral","n":"ESPECIALISTA EM PERFURAÇÃO","d":"Seu valor de força ou destreza aumenta em 1. Sempre que causar Dano Perfurante em um ataque corpo a corpo, ele é aumentado em um nível. Uma vez por turno, ao acertar uma criatura e infligir dano perfurante você pode rolar novamente os dados de dano, usando o melhor resultado total. [Pré-Requisito: Nível 8]"},{"c":"Geral","n":"MESTRE DA CRIAÇÃO","d":"Praticando e estudando, você consegue otimizar o seu tempo para poder produzir mais itens em menos tempo. Quando escolher o foco Criação de Itens durante um interlúdio, você pode criar 2 itens adicionais. Caso escolha o foco Criação de Itens mais de uma vez no mesmo interlúdio, você recebe as oportunidades adicionais para cada foco. Além disso, você recebe um bônus de +2 em duas perícias de ofício a sua escolha. [Pré-Requisito: Treinado em dois Ofícios, Nível 4]"},{"c":"Geral","n":"MESTRE DO ARREMESSO","d":"Dominando ainda mais as armas de arremesso, você consegue as levar até o seu limite, tornando-se um efetivo mestre dos arremessos. Toda arma de arremesso que você utilizar tem o seu dano aumentado em um dado; o seu bônus em ataques com armas de arremesso se torna +4 para acertar e +6 no dano, e o alcance de ataques com armas de arremesso aumenta em 6 metros. [Pré-Requisito: Técnicas de Arremesso, Nível 8]"},{"c":"Geral","n":"MESTRE DOS CHICOTES","d":"Os chicotes são um tipo de arma exótico e único, recompensando aqueles que dominam o seu manejo com um novo potencial. Suas rolagens de ataque com chicotes causam +4 de dano e o alcance aumenta em 1,5 metros. Além disso, uma vez ao turno, quando acertar uma criatura com um ataque com chicote, você pode a forçar a realizar um TR de Fortitude e, caso falhe, você pode a puxar até 3 metros para sua direção. [Pré-Requisito: Nível 5]"},{"c":"Geral","n":"MOVIMENTOS ACROBÁTICOS","d":"Não é hora de ficar parado no chão! Você se move agilmente sempre, e não para no lugar! Ao ser derrubado ou receber a condição caído, você pode fazer um teste de acrobacia contra o atletismo da criatura que te derrubou ou CD da criatura que aplicou a condição caso seja uma técnica, caso isso aconteça, você pode se levantar como uma ação livre, sem gastar sua ação de movimento e se mover 3m sem ativar golpes de oportunidade. Ao fazer isso, você também recebe um bônus de metade do seu modificador de destreza na Defesa por 1 rodada. [Pré-Requisito: Treinado em Acrobacia]"},{"c":"Geral","n":"ROBUSTEZ APRIMORADA","d":"Seus pontos de vida máximos aumentam em um valor igual ao seu nível ao obter esse talento. Sempre que subir de nível e tiver esse talento, você recebe +1 ponto de vida máximo. Além disso, você recebe +2 em testes de Fortitude. [Pré-Requisito: Constituição 14]"},{"c":"Geral","n":"TÉCNICAS DE EMPUNHADURA DUPLA","d":"Você recebe um bônus de +1 na sua Defesa quando estiver empunhando uma arma em cada mão. Você pode lutar com duas armas mesmo que as armas não sejam leves, desde que não possuam a propriedade pesada ou duas mãos. Você pode utilizar a ação Sacar para sacar duas armas gastando apenas metade do movimento da sua próxima ação de Andar. [Pré-Requisito: Força ou Destreza 14]"},{"c":"Geral","n":"TÉCNICAS DE MOBILIDADE","d":"Seu movimento aumenta em 3 metros. Uma vez por rodada, ao atacar uma criatura, você pode realizar um teste de Reflexos contra um teste de Reflexos do alvo e, caso suceda, o alvo não pode realizar ataques de oportunidade contra você pelo resto do seu turno. [Pré-Requisito: Destreza 14]"},{"c":"Geral","n":"TÉCNICAS DE OCULTAMENTO","d":"Você recebe um bônus adicional em testes de Furtividade igual ao seu Bônus de Treinamento e, quando deixar uma criatura Desprevenida através de um ataque surpresa, o prejuízo é aplicado em todos os Testes de Resistência ao invés de apenas Reflexos. [Pré-Requisito: Treinado em Furtividade]"},{"c":"Geral","n":"TÉCNICAS DO SENTINELA","d":"Ao acertar uma criatura com um ataque de oportunidade, o movimento dela é reduzido em 4,5 metros até o final do turno dela. Quando uma criatura a 1,5 metros de você faz um ataque contra um alvo além de você, você pode como uma reação realizar um ataque contra essa criatura. [Pré-Requisito: Nível 5]"},{"c":"Geral","n":"WRESTLING","d":"Você sabe técnicas de agarramento melhor do que ninguém, fazendo com que os agarrados nunca escapem de suas garras. Ao agarrar um alvo, caso ele tente escapar de um agarrão que você esteja fazendo, você pode forçá-lo, ao invés de fazer um teste de perícia normal contra você, fazer um teste de modificador de força contra o seu teste de modificador de força, uma vez por rodada. Ao realizar uma Jogada de Ataque, você pode escolher soltar o alvo do agarrão como parte do ataque para causar metade do valor de força em dano adicional, fazendo o alvo ficar caído, sem necessidade de teste. Você pode escolher, ao invés de deixá-lo caído, joga-lo, arremessando-o em uma distância de 3m*MOD de For, se ele atingir algo, ele recebe dano de fonte variável (p.327) de Objeto Pesado ou de Extremamente Pesado, a depender de onde ele acertar, a escolha do Narrador. [Pré-Requisito: Nível 4]"},{"c":"Geral","n":"VOTO MALEVOLENTE","d":"Você sabe como manter sua cabeça fria mesmo nos momentos mais tensos, lembrando-se da malícia ao criar votos. Ao realizar votos emergenciais, o voto não precisa ter um maleficio maior que o beneficio, sendo realizado normalmente. [Pré-Requisito: Nível 12]"},{"c":"Origem","n":"FAMILIARIDADE COM TÉCNICA","d":"Com a sua técnica amaldiçoada sendo parte da sua individualidade, você se torna cada vez mais e mais familiar com ela, otimizando-a em custo ou poder. Seu Feitiço escolhido primeiro como Marca Registrada tem a redução de custo em PE aumentada de 1 para 2 ou, caso seja Sustentada, você pode escolher reduzir o custo para sustentar em 1. Além disso, você pode escolher uma quantidade de Feitiços adicionais como Marca Registrada igual a metade do seu bônus de treinamento. [Pré-Requisito: Origem Inato, Nível 12]"},{"c":"Origem","n":"MANUAL DE TÉCNICA","d":"Sua técnica já está registrada há muito tempo, com direito a um manual explicando seu funcionamento e uso. Ao obter este talento, você pode criar um Feitiço de um nível acima ao maior que você possui acesso, mas ele tem o custo aumentado em 50% (metade do custo padrão a mais). Quando você receber acesso ao nível do Feitiço criado com o Manual, você deve obrigatoriamente o aprender quando ganhar um novo Feitiço e, após isso, pode criar outro Feitiço de nível superior com Manual de Técnica. Caso você já possua acesso a Feitiços de Nível 5, o tempo de recarga da sua Técnica Máxima é reduzido em 1 rodada. [Pré-Requisito: Origem Herdado, Treinamento em História ou Ocultismo e Nível 5] específicas, evoluindo em aspectos ligados r exemplo, desenvolvimentos do núcleo de tomia peculiar um feto amaldiçoado. Estes ra que um talento comum, mas limitados a"},{"c":"Origem","n":"EXPANSÃO DE RESERVA","d":"Você expande a sua reserva de energia, a qual fica oculta em seu ser, apenas aguardando seu uso. Sua característica energia antinatural recebe as seguintes melhorias: recuperar energia da sua reserva se torna uma ação livre e, ao recuperar, você também recebe uma quantidade de pontos de energia temporários igual a metade do seu bônus de treinamento. Além disso, você passa a poder utilizar a característica uma vez por descanso longo ao invés de por dia. [PréRequisito: Origem Derivado, Nível 8]"},{"c":"Origem","n":"QUEBRA DE LIMITES","d":"Você continua quebrando os seus limites a partir de um desenvolvimento fora da curva ordinária. Ao obter este talento, você aumenta o valor de dois atributos diferentes à sua escolha em 2, com exceção do seu atributo com maior limite. Além disso, o limite dos dois atributos escolhidos é aumentado em 2. [Pré-Requisito: Origem Derivado, Nível 6]"},{"c":"Origem","n":"FÍSICO APERFEIÇOADO","d":"O seu corpo se torna específico e desenvolvido para uma área em peculiar, ligando-se mais firmemente a certos aspectos. Ao adquirir este talento, escolha um dos efeitos abaixo para receber: • • • • Seu Deslocamento aumenta em 4,5 metros. Você recebe um bônus de +2 em testes de Acrobacia ou Atletismo, escolhendo um entre eles. Caso empurre uma criatura ou arremesse um objeto (Desarmar ou Empurrar), a distância é aumentada em 3 metros. A distância de todo pulo que você realizar aumenta em um valor igual a metade da distância total. [PréRequisito: Origem Feto Amaldiçoado Híbrido, Nível 6]"},{"c":"Origem","n":"REPOSIÇÃO SANGUÍNEA","d":"Além de um vigor maldito, ele se desenvolve para uma capacidade única de repor o seu sangue e saúde. Sua cura do Vigor Maldito passa a poder ser utilizada tanto como ação bônus quanto reação ao receber dano, além de aumentar em 5. [Pré-Requisito: Origem Feto Amaldiçoado Híbrido, Nível 6]"},{"c":"Origem","n":"ESTUDO AMALDIÇOADO","d":"Você estuda sobre a energia amaldiçoada ao máximo, conseguindo descobrir uma nova maneira de a utilizar. Ao obter este talento, você pode escolher dois Níveis de Aptidão diferentes para serem aumentados em 1. [Pré-Requisito: Origem Sem Técnica, Nível 8]"},{"c":"Origem","n":"NOÇÃO E PREPARAÇÃO","d":"Embora você esteja privado do acesso a uma técnica e certas aplicações da energia, você tem noção e preparação suficiente para o proteger diante certos problemas. Você recebe um bônus de +2 para testes de resistências contra efeitos de aptidões amaldiçoadas. Nos níveis 8, 12 e 16 o bônus aumenta em +1. [Pré-Requisito: Origem Sem Técnica, Nível 4]"}],"APT":[{"c":"Aura","n":"AURA ANULADORA","d":"A aura que o cobre obtém uma propriedade anuladora, capaz de protegê-lo de certos efeitos. Uma quantidade de vezes igual ao seu bônus de treinamento, caso você fosse sofrer uma condição, você pode pagar uma quantidade variável de energia para ignorá-la, a depender do nível da condição. Esta aptidão não pode anular manobras e efeitos físicos, como a ação Agarrar ou Ferimentos Complexos. Anular uma condição fraca custa 2PE; anular uma média custa 4PE; uma forte custa 6PE e uma extrema custa 10PE. Você recupera esses usos em um descanso longo."},{"c":"Aura","n":"AURA CHAMATIVA","d":"Você cria uma aura ao seu redor que é chamativa, atraente e mágica, cativando a atenção facilmente. Toda criatura que não for seu aliado, e começar um turno dentro de 4,5 metros de você, precisa realizar um teste de resistência de vontade (atributo principal da técnica). Em uma falha, ela fica enfeitiçada, podendo repetir o teste no próximo turno dela, deixando de estar enfeitiçada em um sucesso. Para cada vez que a criatura falhar no TR, ela recebe um bônus de +2 para resistir a esta aptidão ou deixar de estar enfeitiçada, até o final da cena. [Pré-Requisito: Presença 18 e Nível 6]"},{"c":"Aura","n":"AURA CONTROLADA","d":"Você refinou seu controle sobre a aura, impedindo que ela se revele quando é inconveniente, ajudando-o a se ocultar e esconder sua presença. Você soma metade do seu Nível de Aptidão em Aura em testes de Furtividade. Sempre que realizar uma rolagem de Furtividade, você pode gastar 1 ponto de energia amaldiçoada para receber o seu nível de aptidão de aura por completo, ao invés de metade, controlando ainda mais a sua aura. [Pré-Requisito: Treinado em Furtividade e Destreza 16]"},{"c":"Aura","n":"AURA DE CONTENÇÃO","d":"Com foco em conter, tem-se uma aura mais pesada e densa. Sempre que for agarrar um alvo, você adiciona metade do seu Nível de Aptidão em Aura na rolagem de Atletismo, assim como na rolagem para evitar que uma criatura escape. Uma quantidade de vezes por cena igual a metade do seu Nível de Aptidão em Aura, você pode também gastar 1 ponto de energia amaldiçoada para receber vantagem para agarrar ou impor desvantagem na criatura que tentar escapar. [Pré-Requisito: Força ou Constituição 16]"},{"c":"Aura","n":"AURA DO BASTIÃO","d":"Sua aura é protetiva e auxilia seus aliados a não serem acertados. Todo aliado dentro de 4,5 metros de você recebe um bônus na Defesa igual ao seu Nível de Aptidão em Aura."},{"c":"Aura","n":"AURA DO COMANDANTE","d":"Refletindo uma personalidade ou presença forte, estar coberto pela sua aura parece ser uma grande motivação para aliados. Você pode, como uma Ação Bônus, expandir sua aura para cobrir todo aliado dentro de 4,5 metros, os quais recebem 1 + metade do seu Nível de Aptidão em Aura em rolagens de dano e testes de perícia dentro do combate. Para cada turno que você manter a aura ativa, você paga 2 pontos de energia amaldiçoada. [PréRequisito: Presença 16 e Nível 8]"},{"c":"Aura","n":"AURA DO COMANDANTE EVOLUÍDA","d":"Sua presença como comandante se torna ainda mais forte e significante. Quando utilizar Aura do Comandante, você pode optar por somar seu Nível de Aptidão em Aura total ao invés de 1 + metade e, também, conceder um bônus de +2 em jogadas de ataques e TRs. Entretanto, o custo para manter aumenta de 2 para 4 PE. [Pré-Requisito: Aura do Comandante e Nível 12]"},{"c":"Aura","n":"AURA DRENADORA","d":"Uma aura vampiresca e capaz de drenar a partir da vida que é arrancada dos seus alvos. Sempre que matar um inimigo, você recebe PV temporários igual a Xd8 + seu modificador de Constituição, onde X é igual ao seu Nível de Aptidão em Aura. Eles podem acumular. [Pré-Requisito: Nível de Aptidão em Aura 2 e Nível 6]"},{"c":"Aura","n":"AURA ELEMENTAL","d":"Você converte as propriedades da sua aura, imbuindo-a com um elemento, para assim ser capaz de alterar o tipo de dano causado pelos seus ataques com armas. Ao obter essa habilidade, você pode escolher um tipo de dano da categoria Elementais para ser o novo tipo de dano dos seus ataques que não sejam de técnica amaldiçoada. Além disso, seus ataques causam 1d4 de dano adicional do tipo escolhido nesta aptidão. Com Nível de Aptidão em Aura 2, o dano adicional se torna 1d6; com nível de aptidão 3, se torna 1d8 e, com nível de aptidão 5, se torna 1d10. Dentro de combate, como uma ação livre, você pode desabilitar a aura elemental, retornando os seus ataques ao tipo de dano padrão. [Pré-Requisito: Nível 6]"},{"c":"Aura","n":"AURA ELEMENTAL REFORÇADA","d":"Você reforça sua familiaridade com o elemento da sua aura, resistindo melhor a ele. Ao obter essa aptidão, você recebe RD ao tipo de dano da sua aura elemental igual a redução de Aura Reforçada somado ao seu Nível de Aptidão em Aura. [Pré-Requisito: Aura Elemental e Aura Reforçada]"},{"c":"Aura","n":"ABSORÇÃO ELEMENTAL","d":"Uma aura pronta para absorver e armazenar elementos, podendo depois liberá-los em seus próprios ataques. Sempre que você receber dano elemental, você pode usar sua reação para absorver parte dele e guardar. Isso não reduz o dano, mas, na próxima vez em que você realizar um ataque você pode adicionar Xd6 de dano do mesmo tipo. X é igual ao seu Nível de Aptidão em Aura. Esta habilidade não é cumulativa. No Nível de Aptidão em Aura 3, o dado aumenta para d8; no nível 5, aumenta para d10. [Pré-Requisito: Aura Elemental]"},{"c":"Aura","n":"AURA EMBAÇADA","d":"Você desenvolve uma maneira de deixar a sua aura embaçada e borrada, criando uma chance de um ataque inimigo simplesmente errar. Como uma ação bônus, você pode pagar 2 pontos de energia amaldiçoada para ativar a aura embaçada, a qual você deve gastar 2 PE por rodada para manter, encerrando-se caso opte por não pagar. Enquanto a aura estiver ativa, todo ataque corpo-a-corpo ou a distância tem 20% de chance de falhar (1 ou 2 em 1d10). [Pré-Requisito: Nível 6]"},{"c":"Aura","n":"AURA INOFENSIVA","d":"Sua aura amaldiçoada é moldada para aparentar ser menor e menos intensa do que realmente é, dificultando até mesmo que te notem. Quando iniciar um combate, realize um teste de Feitiçaria contra a Atenção de todos os inimigos que poderiam o detectar pela sua energia amaldiçoada: você fica automaticamente escondido contra toda criatura cuja Atenção seja superada pelo resultado do seu teste. Estar escondido por meio desta aptidão segue as regras comuns de Furtividade, descritas na página 297. [Pré-Requisito: Presença 16]"},{"c":"Aura","n":"CASULO DE ENERGIA","d":"Evoluindo ao limite o fluxo da aura, você consegue a deixar tão densa e maciça que se torna um casulo protetivo. Ao obter essa habilidade você pode, como uma Ação Comum, formar um casulo de energia por 1 rodada, gastando 6 pontos de energia amaldiçoada. Enquanto o casulo estiver ativo, você recebe imunidade a dano cortante, perfurante e de impacto provindo de fontes mundanas (como armas ou quedas). Caso seja originário de técnica, você apenas recebe RD adicional igual ao dobro do seu Nível de Aptidão em Aura. [Pré-Requisito: Aura Impenetrável, Nível de Aptidão em Aura 5 e Nível 16]"},{"c":"Aura","n":"AURA EXCESSIVA","d":"O fluxo de energia da sua aura se torna excessivo, liberando quantidades tão exageradas que consegue resistir a danos além dos físicos. No começo de toda rodada você pode escolher pagar 2 PE. Caso o faça, você recebe RD contra todos os tipos de dano, exceto na alma, igual ao valor de redução fornecido por Aura Reforçada. [Pré-Requisito: Aura Reforçada, Constituição 16 e Nível 8]"},{"c":"Aura","n":"CONCENTRAR AURA","d":"Você consegue concentrar a sua aura em um único ponto, que é a sua arma, sacrificando as propriedades dela em troca de um segundo impacto. Como uma ação livre, você pode escolher por desabilitar uma certa quantidade de aptidões de aura passivas por 1 rodada. Para cada aptidão passiva desabilitada, após acertar um ataque desarmado ou com arma, o alvo recebe 1d8 de dano energético. Você pode desabilitar até uma quantidade de aptidões igual a 1 + seu Nível de Aptidão em Aura. O dano desta Aptidão não é aplicado em Feitiços."},{"c":"Aura","n":"ENGANAÇÃO PROJETADA","d":"Usando de agilidade e rapidez, você consegue projetar a sua aura antes de um ataque, criando uma ilusão de quando ele acontecerá. Quando atacar uma criatura, ela deve realizar um teste de resistência de astúcia (atributo principal da técnica), e caso falhe, você terá vantagem nesse ataque. Para cada ataque após o primeiro, no mesmo turno, você deve pagar 1 ponto de energia amaldiçoada para projetar a ilusão. [Pré-Requisito: Treinado em Enganação, Destreza 18 e Nível 4]"},{"c":"Aura","n":"GOLPE COM AURA","d":"Ao invés de simplesmente deixar a sua aura fluir com um aspecto específico, você coloca esse aspecto no seu próximo golpe, dificultando a resistência. Você pode gastar 1 ponto de energia para imbuir um golpe com uma aptidão de aura que force um teste de resistência: a criatura realiza o teste de resistência caso o ataque acerte, e a CD aumenta em um valor igual ao seu Nível de Aptidão em Aura. Caso seja uma aptidão de aura que cause dano, o dano é considerado após ataque. Não é possível utilizar Golpe com Aura em Feitiços."},{"c":"Aura","n":"TRANSFERÊNCIA DE AURA","d":"Utilizando da sua energia, você se torna capaz de transferir a sua aura para outra pessoa. Como uma ação bônus, você pode pagar 2 pontos de energia amaldiçoada e escolher uma criatura dentro de 9 metros para transferir uma Aptidão de Aura específica. Você escolhe qual aptidão deseja transferir, e a pessoa recebe os efeitos dela durante uma rodada. Você pode manter a aura transferida por mais rodadas, pagando 1 ponto de energia para cada rodada após a primeira."},{"c":"Aura","n":"AURA LACERANTE","d":"Sua aura é afiada, causando danos apenas com o contato. Você pode ativar sua aura lacerante por 1 rodada, como ação livre. Enquanto ativa, uma criatura que iniciar seu turno dentro de 3 metros de você deve realizar um teste de resistência de Fortitude (atributo principal da técnica). Em uma falha, ela recebe Xd6 + seu modificador do atributo principal de dano energético, onde X é o seu Nível de Aptidão em Aura. No Nível de Aptidão em Aura 3, o dado aumenta para d8; no nível 5, aumenta para d10."},{"c":"Aura","n":"AURA MACABRA","d":"Maldita e vil, sua aura é macabra e perturba aqueles que estejam sendo afetados por ela. Toda criatura agressiva que começar um turno dentro de 1,5 metros de você precisa realizar um teste de resistência de vontade (atributo principal da técnica). Em uma falha, ela fica Abalada, podendo repetir o teste no próximo turno dela, deixando de estar Abalada em um sucesso. Como uma ação livre, você pode pagar 1 ponto de energia amaldiçoada para expandir esse alcance para 4,5 metros por 1 rodada. A partir do Nível de Aptidão em Aura 3, você inflige Amedrontado ao invés de Abalado."},{"c":"Aura","n":"AURA MACIÇA","d":"Sua aura é tão densa que parece começar a tomar uma forma maciça, dificultando os inimigos a conseguirem realmente acertálo. Sua Defesa aumenta em um valor igual a seu Nível de Aptidão em Aura. [PréRequisito: Constituição 16]"},{"c":"Aura","n":"AURA MOVEDIÇA","d":"Você molda a sua aura para atrapalhar a movimentação em suas proximidades. Ao obter esta Aptidão, todo quadrado adjacente a você se torna terreno difícil. No Nível de Aptidão em Aura 2, todo quadrado dentro de 3 metros se torna terreno difícil; no Nível 4, aumenta para 4,5 metros e, no Nível 5, aumenta para 6 metros. A área afetada por esta aptidão não pode ser aumentada por Expandir Aura."},{"c":"Aura","n":"AURA REDIRECIONADORA","d":"Você descobre como imbuir parte da sua aura em um projétil ou arma de arremesso, conseguindo-o redirecionar caso erre. Você pode gastar 2 pontos de energia amaldiçoada para imbuir um projétil ou arma de arremesso antes de realizar um ataque: caso erre o ataque com um projétil ou arma imbuída, você pode realizar a rolagem de ataque outra vez, tendo como alvo uma criatura dentro de 6 metros do primeiro alvo, conforme o projétil ou arma é redirecionada. Além disso, a segunda rolagem de ataque recebe um bônus no acerto igual a 1 + metade do seu Nível de Aptidão em Aura. [PréRequisito: Destreza 16]"},{"c":"Aura","n":"AURA REFORÇADA","d":"Reforçando o fluxo da sua aura, você se torna capaz de pausar e anular uma parcela do dano que recebe fisicamente, tornando mais difícil de realmente atingir seu corpo. Você recebe redução contra danos físicos — cortes, perfurações e impactos — igual ao dobro do seu Nível de Aptidão em Aura."},{"c":"Aura","n":"AURA IMPENETRÁVEL","d":"Melhorando ainda mais o fluxo, você se torna capaz de transformar a sua aura em uma fortaleza impenetrável contra simples golpes físicos. Ao obter essa habilidade, você pode, como uma Ação Bônus, transformar a sua aura em impenetrável por 1 rodada, gastando 3 pontos de energia amaldiçoada. Enquanto sua aura estiver impenetrável, você recebe resistência a dano cortante, perfurante e de impacto. [Pré-Requisito: Aura Reforçada, Nível de Aptidão em Aura 3 e Nível 10]"},{"c":"Controle e Leitura","n":"CANALIZAÇÃO AVANÇADA","d":"Você aperfeiçoa a prática de canalizar energia em golpes, conseguindo a realizar mais rapidamente e com mais poder. Canalizar energia em um golpe também pode ser feito como uma reação ao realizar um ataque, e o bônus passa de 1d6 para 1d8. A habilidade continua funcionando apenas por um ataque e não é consumida em um erro. [Pré-Requisito: Canalizar em Golpe, Nível de Aptidão em Controle e Leitura 2 e Nível 8]"},{"c":"Controle e Leitura","n":"CANALIZAÇÃO MÁXIMA","d":"Você alcança o ápice da técnica de canalizar energia nos seus golpes, levando-a para um nível superior. Você pode gastar 1PE adicional para Canalizar em Golpe e o bônus por ponto gasto aumenta de 1d8 para 1d10. Além disso, você soma seu Nível de Aptidão em Aura ao total de dano concedido pela Aptidão. [Pré-Requisito: Canalização Avançada, Nível de Aptidão em Controle e Leitura 4 e Nível 16]"},{"c":"Controle e Leitura","n":"LE E LEITURA COBRIR-SE","d":"Você se torna capaz de concentrar sua energia amaldiçoada em seu corpo, assim amenizando os impactos em troca de um consumo imediato de energia. Como uma Reação, quando receber dano, você pode gastar uma quantidade de PE igual a 2 + o dobro do seu CL para receber pontos de vida temporários: para cada ponto gasto, você recebe 4 PVs temporários. Estes PVs temporários são avulsos a outras fontes e não seguem o limite comum para PVs temporários, durando até o final do turno da criatura contra a qual você usou a Reação."},{"c":"Controle e Leitura","n":"COBERTURA AVANÇADA","d":"Você desenvolve a sua capacidade de revestir e cobrir seu corpo com energia amaldiçoada, resistindo a golpes. Ao usar sua Reação para cobrir-se, cada ponto gasto passa a conceder 8 pontos de vida temporários. [Pré-Requisito: Cobrir-se, Nível de Aptidão em Controle e Leitura 2 e Nível 10]"},{"c":"Controle e Leitura","n":"ESTÍMULO MUSCULAR","d":"Você se torna proficiente em utilizar da energia para estimular e reforçar o seu corpo, apurando força e agilidade. Quando realizar uma ação de movimento ou uma ação com as perícias Acrobacia ou Atletismo você pode, como parte da mesma ação, utilizar energia para os seguintes estímulos: • Caso seja uma ação de movimento, você pode gastar 1 PE para aumentar a distância em um valor igual a metade do seu deslocamento. • Caso seja um teste (comum ou oposto), você pode gastar até uma quantidade de PE igual a seu Nível de Aptidão em Controle e Leitura, recebendo um bônus de +1 para cada PE gasto. O bônus dura até o começo do seu próximo turno. • Caso seja uma ação que empurre uma criatura ou arremesse um objeto (Desarmar ou Empurrar), você pode gastar 2 PE para aumentar a distância em um valor igual ao seu Nível de Aptidão em Controle e Leitura multiplicado por 1,5 metros. • Caso seja a ação de Pular, você pode gastar 1PE para dobrar a distância percorrida. Você só pode utilizar cada estímulo uma vez por rodada."},{"c":"Controle e Leitura","n":"ESTÍMULO MUSCULAR AVANÇADO","d":"Seu controle para imbuir os músculos com energia torna-se ainda mais apurado. Você passa a poder utilizar cada estímulo duas vezes por rodada e eles recebem as seguintes melhorias: • Caso gaste PE para aumentar seu deslocamento, você pode escolher gastar 2PE ao invés de 1PE para que ele seja aumentado em um valor igual ao seu Deslocamento total, ao invés de metade. • Caso gaste para receber bônus em um teste, cada PE gasto passa a somar +2 no teste. • Caso gaste para aprimorar uma ação de empurrar criatura ou arremessar objeto, a distância é aumentada em um valor igual ao seu Nível de Aptidão multiplicado por 3 metros. [PréRequisito: Estímulo Muscular, Nível de Aptidão em Controle e Leitura 3 e Nível 4]"},{"c":"Controle e Leitura","n":"EXPANDIR AURA","d":"Você se torna capaz de controlar bem a sua energia, incluindo a que compõe sua aura, podendo assim a expandir com uma descarga de energia. No seu turno, como uma ação livre, você pode gastar 2 pontos de energia amaldiçoada para expandir a sua aura, dobrando o alcance de todas as suas aptidões de aura passivas por uma rodada. Para cada rodada após a primeira, você deve pagar mais 1 ponto de energia para a manter expandida. [Pré-Requisito: Nível 6]"},{"c":"Controle e Leitura","n":"LEITURA DE AURA","d":"Compreendendo bem a energia e as propriedades que ela pode assumir em auras, você consegue ler auras e identificar os seus efeitos. Ao ver uma criatura que possua uma aura amaldiçoada, você pode realizar uma rolagem de Feitiçaria para tentar a ler e descobrir suas propriedades, cuja CD é igual a CD Amaldiçoada da criatura. Caso suceda no teste, você descobre quais as propriedades passivas e ativas da aura da criatura."},{"c":"Controle e Leitura","n":"LEITURA RÁPIDA DE ENERGIA","d":"Treinando e se adaptando a ler rapidamente auras, você adquire uma maior capacidade de prever a próxima ação dos usuários de energia amaldiçoada, o que te favorece não só ofensivamente, mas defensivamente também. Você pode, como uma Ação de Movimento, realizar um teste de Percepção contra a CD Amaldiçoada de uma criatura, recebendo um bônus igual ao seu CL. Caso suceda, você não pode receber desvantagem ou prejuízos para acertar o inimigo por causa de aura e ignora aumentos de Defesa fornecidos por auras, até o final da cena."},{"c":"Controle e Leitura","n":"PROJETAR ENERGIA","d":"Ao invés de canalizar energia em um objeto, você a concentra e libera como um projétil explosivo. Você pode gastar uma quantidade de pontos de energia amaldiçoada igual 1 + seu nível de aptidão em Controle e Leitura e o transformar em um projétil, o qual você dispara como uma ação comum. Para cada ponto gasto, o projétil causará 1d10 de dano energético, somando o modificador do seu maior atributo no total. O alcance do projétil é igual a 9 metros + 1,5 metros x bônus de treinamento. Você pode escolher tanto fazer uma rolagem de ataque amaldiçoada (a qual não pode ser um crítico), ou forçar o alvo a realizar um teste de resistência de reflexos (maior atributo), anulando o dano em um sucesso."},{"c":"Controle e Leitura","n":"PROJEÇÃO AVANÇADA","d":"Dominando a prática de concentrar e disparar projéteis a partir da sua energia, você eleva sua projeção. O dano causado por ponto gasto aumenta para 2d8, além de passar a somar o dobro do seu modificador ao total. Caso use como um ataque, você recebe +2 para acertar ou, caso force um teste de resistência, a dificuldade aumenta em 2. [Pré-Requisito: Projetar Energia, Nível de Aptidão em Controle e Leitura 2 e Nível 8]"},{"c":"Controle e Leitura","n":"PROJEÇÃO MÁXIMA","d":"Você leva a prática de disparar energia projetada até o ápice dela, criando projéteis devastadores. O dano por ponto aumenta de 2d8 para 3d8. O bônus para acertar se torna +6 e o aumento na dificuldade do teste de resistência 4, além de reduzir o dano à metade ao invés de anular em um sucesso, ao escolher forçar um TR. [PréRequisito: Projeção Avançada, Nível de Aptidão em Controle e Leitura 4 e Nível 16]"},{"c":"Controle e Leitura","n":"PROJEÇÃO DIVIDIDA","d":"Você descobre uma nova maneira de disparar sua energia projeta, dividindo-a em dois projéteis no meio do caminho. Ao realizar um disparo de energia contra um alvo, você pode pagar até metade da energia gasta no disparo para o duplicar como parte da mesma ação. A duplicata do projétil deve ter como alvo uma criatura dentro de 4,5 metros do alvo original e causa dano equivalente à quantidade de energia gasta nele, seguindo o cálculo padrão de Projetar Energia; o projétil duplicado sempre segue o método de Teste de Resistência da aptidão. [Pré-Requisito: Projeção Avançada, Nível de Aptidão em Controle e Leitura 3 e Nível 12]"},{"c":"Controle e Leitura","n":"PUNHO DIVERGENTE","d":"Uma técnica peculiar de controle do fluxo da energia. O impacto de seus golpes diverge e se divide em dois momentos: ao acertar o golpe, e após um curto período de tempo. Ao acertar um ataque desarmado, você pode escolher causar apenas metade do dano, e guardar a outra metade para ser causada no turno seguinte. Esta aptidão não pode ser utilizada em um ataque que seja um raio negro, devido a aplicação extremamente rápida da energia. Caso escolha que o resto do dano seja causado no turno seguinte, a criatura que recebeu o ataque deve realizar um teste de resistência de Fortitude (maior atributo físico) e, caso falhe, o dano será causado como se o inimigo tivesse vulnerabilidade. Além disso, conforme maior a potência do primeiro golpe, mais difícil é se preparar para resistir ao segundo impacto: para cada 5 pontos de dano na primeira metade do dano, a CD aumenta em 1."},{"c":"Controle e Leitura","n":"EMOÇÃO DA PÉTALA DECADENTE","d":"Uma arte secreta transmitida entre as três grandes famílias Jujutsu como uma contra medida para expansões de domínio, entretanto, esta não é sua única utilização. O usuário se cobre com energia e contra-ataca quando um ataque de acerto garantido fosse o acertar. Como uma reação a uma expansão de domínio ser ativada ou como uma ação bônus, você pode usar emoção da pétala decadente. Enquanto estiver com a aptidão ativa, sempre que você receber um acerto garantido físico de uma expansão de domínio, você pode gastar uma quantidade de pontos de energia igual ao nível de DOM da criatura que expandiu o domínio, se o fizer o acerto garantido é anulado. Esta aptidão é um efeito de Concentração. Caso uma criatura entre no seu alcance corpo a corpo ou você comece seu turno com uma criatura dentro desse mesmo alcance, como uma ação livre, você pode gastar 5PE para realizar um ataque corpo a corpo com sucesso garantido, sem a necessidade de um teste. Se utilizar a aptidão de forma ofensiva você não pode se proteger contra acertos garantidos até o começo do seu próximo turno. [PréRequisito: Nível 5, aprender de um dos Três Grandes Clãs (Zenin, Gojo ou Kamo), Cobrir-se e Nível de Aptidão em Controle e Leitura 3]"},{"c":"Controle e Leitura","n":"RASTREIO AVANÇADO","d":"Você refina e amplia suas capacidades de detectar e rastrear energia amaldiçoada. Quando estiver em uma cena em que energia amaldiçoada tenha sido usada ou deixada (Feitiços, aptidões, presença de maldições), você consegue detectar imediatamente vestígios e, caso já conheça de quem eles originam, você descobre na hora. Caso não conheça, você pode realizar um teste de Investigação ou Percepção contra a CD Amaldiçoada de quem originou o vestígio e, em um sucesso, você percebe as características daquela energia (se é de um humano ou maldição, um período aproximado em que esteve lá e outros) e é capaz de seguir o rastro até onde ele acaba."},{"c":"Domínio","n":"ANULAR TÉCNICA","d":"Você aprimora o seu domínio simples para ser efetivo não só contra expansões de domínio, mas contra técnicas amaldiçoadas no geral, conseguindo anulálas se usado rapidamente. Quando você for alvo ou submetido a um Feitiço, você pode usar sua reação para tentar anulála; você só pode tentar anular um Feitiço que seja de um nível que você tem ou teria acesso a. Você gasta uma quantidade de energia amaldiçoada igual à que foi usada para conjurar a habilidade, e realiza um teste Feitiçaria contra a Feitiçaria de quem usou o Feitiço. Caso a habilidade que você deseja anular seja em área, nenhuma das criaturas submetidas sofrem o efeito, desde que você a anule. Por ser algo cansativo e complexo, você pode usar essa habilidade uma quantidade de vezes igual ao Nível de Aptidão em Domínio, por descanso longo. [Pré-Requisito: Domínio Simples, Nível de Aptidão em Domínio 3 e Nível 8]"},{"c":"Domínio","n":"EXPANSÃO DE DOMÍNIO INCOMPLETA","d":"Iniciando-se na parte mais complexa do Jujutsu, você passa a ser capaz de expandir o seu domínio interno, embora ainda de maneira incompleta. Como uma ação comum, desde que tenhas as duas mãos livres, você pode pagar 15PE para expandir seu domínio incompleto, o qual se espalha por uma área igual a 4,5 metros multiplicado pelo seu bônus de treinamento, adaptando-se também ao ambiente ao seu redor. Enquanto estiver com a expansão ativa, certos efeitos são aplicados, os quais devem ser montados de acordo com o Guia de Criação de Expansões de Domínio. Uma expansão de domínio incompleta dura, por padrão, uma quantidade de rodadas igual a 1 + seu nível de aptidão em domínio. [PréRequisito: Nível de Aptidão em Domínio 1 e Nível 8]"},{"c":"Domínio","n":"EXPANSÃO DE DOMÍNIO COMPLETA","d":"Aperfeiçoando na técnica da expansão, alcança-se um patamar superior, conseguindo fechar uma barreira e prender seus alvos dentro dela. Como uma ação comum, desde que tenhas as duas mãos livres, você pode pagar 20PE para expandir seu domínio completo, o qual cria uma área esférica de 9 metros. Enquanto estiver com a expansão ativa, certos efeitos são aplicados, os quais devem ser montados de acordo com o Guia de Criação de Expansões de Domínio. Uma expansão de domínio completa dura, por padrão, uma quantidade de rodadas igual a 3 + seu nível de aptidão em domínio. [Pré-Requisito: Técnicas de Barreira, Expansão de Domínio Incompleta, Nível de Aptidão em Barreira e Domínio 3 e Nível 10]"},{"c":"Domínio","n":"ACERTO GARANTIDO","d":"Você alcança o ápice das técnicas de domínio, conseguindo usar o acerto garantido, que define uma expansão de domínio letal. Ao obter esta aptidão, você pode adicionar o efeito Acerto Garantido em sua expansão de domínio, o qual não conta para o máximo, imbuindo sua técnica nas barreiras criadas. O funcionamento do Acerto Garantido deve ser elaborado de acordo com o guia de criação de domínios. Adicionar acerto garantido em uma expansão completa aumenta o seu custo em 5 pontos de energia amaldiçoada. [Pré-Requisito: Expansão de Domínio Completa, Treinamento em Feitiçaria, Nível de Aptidão em Barreira e Domínio 4 e Nível 14]"},{"c":"Domínio","n":"EXPANSÃO DE DOMÍNIO SEM BARREIRAS","d":"Assim como conter água sem um recipiente ou desenhar no céu sem uma tela, existe uma forma de expandir um domínio que exige um controle sobre a energia amaldiçoada extremo, sendo possível apenas para os mais talentosos e habilidosos. A expansão sem barreiras possui os mesmos efeitos e custo de uma expansão completa com acerto garantido, mas não levanta barreiras, tendo um alcance superior para o acerto garantido em troca, o qual pode até mesmo superar as barreiras de outras expansões de domínio, atacando-os por fora. [PréRequisito: Acerto Garantido, Mestre em Feitiçaria, Nível de Aptidão em Barreira e Domínio 5, e Nível 20]"},{"c":"Domínio","n":"CONFRONTO DE DOMÍNIOS","d":"Existem várias medidas contra expansões de domínio, mas a mais efetiva é expandir o seu próprio domínio, engajando-se em um Confronto de Domínios. Diante uma Expansão de Domínio sendo ativada, você pode utilizar sua Reação para tentar expandir seu próprio domínio e confrontar. Após utilizar essa Reação, você perde sua Ação Comum no seu próximo turno. Para definir como o confronto será decidido, siga os passos abaixo: 1. Caso ambos os envolvidos possuam um Nível de Aptidão em Domínio igual, eles devem realizar um teste decisivo, jogando 1d10 + metade do nível de personagem + nível de aptidão em domínio + outros bônus. Se o resultado de um dos participantes superar o do oponente por 5 ou mais, ele vence o confronto, cancelando a expansão do oponente e completando a sua. Porém, se nenhum dos dois vencer no teste, o confronto se torna um Confronto Estendido. Não existem sucessos ou falhas críticas no teste de confronto. 2. Caso um dos envolvidos no Confronto possua um Nível de Aptidão em Domínio superior ao do oponente, ele vence o confronto imediatamente, possuindo um refino superior. Entretanto, caso aquele que esteja buscando confrontar possua um bônus superior por 5 ou mais nos testes de confronto e uma diferença no Nível de Aptidão de apenas 1, ele é capaz de confrontar normalmente com um teste, ao invés de perder imediatamente. Caso o confronto se torne um Confronto Estendido, ambos os domínios são expandidos, mas possuem o Acerto Garantido e Efeitos de Expansão cancelados, os quais podem ser restaurados ao derrubar o domínio do oponente. Enquanto em combate, todo dano que você causar ao usuário (desconsiderando Redução de Dano e Resistência) também é direcionado ao domínio, considerando como causado pelo interior, podendo o destruir; caso você consiga deixar o usuário oponente inconsciente, o domínio dele é derrubado imediatamente. Assim que um dos lados vencer através do combate físico, o acerto garantido dele se torna efetivo imediatamente. Também é possível iniciar um confronto contra um inimigo que já possua o domínio expandido, seguindo os passos abaixo: 1. Caso ambos os participantes possuam o mesmo Nível de Aptidão em Domínio, realize-se um teste de confronto. Porém, aquele que já possuir a expansão ativa recebe um bônus de +2, conforme listado na página 240. Se não houver uma vitória nos testes, inicia-se um Confronto Estendido. 2. Caso os participantes possuam Nível de Aptidão em Domínio diferentes, aquele que expandiu seu domínio dentro da expansão inimiga inicia uma Contestação ao invés de um Confronto. Uma Expansão de Domínio Incompleta não pode ser utilizada em um Confronto de Domínios, pois sempre perderia imediatamente, sendo limitada à Contestação de Domínio. Uma Expansão Completa só pode confrontar uma Expansão Sem Barreiras caso o usuário da sem barreiras fosse preso dentro da expansão com barreiras."},{"c":"Domínio","n":"CONTESTAÇÃO DE DOMÍNIO","d":"Em certas situações, é impossível confrontar diretamente o domínio inimigo, mas ainda existe a possibilidade de o contestar e conseguir escapar. Uma Contestação é iniciada quando você utiliza uma Expansão Incompleta contra um domínio que já esteja ativo ou utiliza uma Expansão Completa contra um domínio ativo e possua um Nível de Aptidão em Domínio inferior ao do oponente. Quando expandir para contestar, você cria uma área equivalente à metade do padrão da sua expansão, possuindo os seguintes efeitos: • O Acerto Garantido da expansão sendo contestada é desativado dentro da área criada por você, enquanto você estiver contestando. • A área afetada pela sua expansão se torna um possível caminho de fuga: no começo de toda rodada, você causa dano na barreira da expansão igual ao seu Nível de Aptidão em Domínio multiplicado por 25 se for Incompleta ou 50 se for Completa. Se a vida do domínio atingir 75% (3/4), apenas uma pessoa pode sair ou entrar da expansão através daquela área, como uma Ação de Movimento; se a vida atingir 50% (2/4), qualquer um pode sair ou entrar como uma Ação de Movimento. Contestar um domínio exige Concentração, as duas mãos livres (ou uma, caso possa) para manter o símbolo da sua expansão. Caso sua Concentração se quebre ou você deixe de ter as mãos livres, a Contestação é encerrada e você recebe Exaustão de Técnica como normal."},{"c":"Domínio","n":"EXAUSTÃO DE TÉCNICA","d":"Sendo complexas e custosas, as expansões de domínio causam exaustão na técnica do seu usuário, travando-a por certo tempo. Esse tempo depende de qual tipo de expansão foi usado: • Expansão Incompleta, por ser mais simples, deixa a técnica inutilizável por uma rodada. • Expansão Completa, sendo mais complexa, deixa a técnica inutilizável por duas rodadas. • Expansão Completa (Acerto Garantido), beirando o ápice, deixa a técnica inutilizável por quatro rodadas. • Expansão sem Barreiras, ultrapassando o máximo, deixa a técnica inutilizável por cinco rodadas. A exaustão só é aplicada após o domínio ser desmanchado, seja a força ou por realmente ter tido o seu efeito finalizado. Enquanto dentro do domínio, considera-se que a técnica funciona normalmente."},{"c":"Domínio","n":"RESISTÊNCIA DE EXPANSÕES DE DOMÍNIO","d":"Expansões de Domínio são criadas a partir de barreiras imbuídas com técnica amaldiçoada. Logo, formando um domo, é possível o invadir, ainda mais levando em conta que a resistência é maior no interior do que no exterior. O domo de uma expansão de domínio tem pontos de vida igual ao dobro do total de seis paredes da aptidão amaldiçoada Técnicas de Barreira, baseado no seu usuário. Caso a expansão seja atacada pelo seu interior, ela é resistente a todos os tipos de dano. A resistência do interior de domínios não pode ser ignorada. Não é possível atacar fisicamente a barreira de uma expansão de domínio por dentro. Você pode danificá-la apenas com Feitiços nível 3 ou superior. Entretanto, há uma exceção para o uso da Energia Reversa: usá-la contra uma barreira sempre causará dano e, caso seja pelo exterior, ela é vulnerável; pelo interior, sendo necessário saber onde está o limite da barreira, ela perde a resistência."},{"c":"Barreira","n":"PAREDES RESISTENTES","d":"As paredes que você confecciona se tornam mais resistentes. Os pontos de vida de cada parede passam a ser 10 + seu nível de aptidão em Barreiras multiplicado pelo seu nível de personagem. [Pré-Requisito: Técnicas de Barreira, Nível de Aptidão em Barreira 2 e Nível 4]"},{"c":"Barreira","n":"BARREIRA RÁPIDA","d":"Com treino e repetição, você se torna capaz de erguer barreiras de maneira ainda mais ágil. Erguer ou manipular barreiras se torna uma ação bônus. [Pré-Requisito: Técnicas de Barreira, Nível de Aptidão em Barreira 3 e Nível 6] A"},{"c":"Barreira","n":"CESTA OCA DE VIME","d":"Uma antiga e esotérica técnica amaldiçoada utilizada contra domínios, antes mesmo do Domínio Simples ser criado. Como ação bônus ou reação a uma expansão de domínio, você pode gastar 3 PE para criar um trançado de vime ao seu redor e receber os efeitos desta aptidão. Enquanto estiver com a Cesta Oca de Vime ativa, você não é afetado pelo efeito de acerto garantido de uma expansão de domínio. Esta aptidão usa de Concentração e possui Durabilidade igual ao seu Nível de BAR + 1. Sempre que falhar em um teste de concentração, a Durabilidade da sua Cesta Oca de Vime desce em 1. No inicio do seu turno, caso você deveria ter sido atingido por um Acerto Garantido, sua Cesta Oca de Vime perde 1 de durabilidade. No inicio do seu turno, você pode manter o selo desta aptidão, ocupando as suas duas mãos, ao fazer isso, a Cesta Oca de Vime não pode perder durabilidade por qualquer efeito que não seja a falha de concentração. Caso a Cesta Oca de Vime quebre, você recebe o efeito do Acerto Garantido instantaneamente. [Pré-Requisito: Ser de uma época onde ela era utilizada ou Mestre em História, Nível de Aptidão em Barreira 1 e Nível 5]"},{"c":"Barreira","n":"CORTINA","d":"A cortina é uma técnica de barreira comum, sendo um grande campo de força negro que isola uma área específica, impossibilitando pessoas de fora de ver seu interior. Seu funcionamento básico é de ocultamento, mas podem ser postas condições que expandem sua utilidade. Ao criar uma cortina, você gasta 1 ponto de energia para cada 9 metros que a área dela irá cobrir, e não há um custo para mantêla. Você também pode colocar condições em uma cortina, ao criá-la, de acordo com as regras sobre cortinas. [Pré-Requisito: Técnicas de Barreira]"},{"c":"Energia Reversa","n":"CURA AMPLIFICADA","d":"Sua capacidade de cura é amplificada quando utilizando energia reversa. O dado da cura se torna d8 e você passa a somar o dobro do seu modificador de presença ou sabedoria. A quantidade máxima de pontos que podem ser gastos passa a ser igual a 1 + seu nível de aptidão. [Pré-Requisito: Energia Reversa, Nível de Aptidão em Energia Reversa 3 e Nível 12]"},{"c":"Energia Reversa","n":"FLUXO CONSTANTE","d":"Tendo uma maior dominância sobre a energia reversa, você estabelece um fluxo contínuo dela no seu corpo, preservando-o e restaurando-o assim que sua integridade é reduzida. Assim sendo, você pode manter uma cura contínua: no começo do seu turno, você pode se curar com energia reversa seguindo as mesmas regras da cura básica, porém como uma ação livre. Caso não o faça, você pode se curar como reação ao ter sua vida reduzida. [Pré-Requisito: Energia Reversa, Nível de Aptidão em Energia Reversa 3 e Nível 12]"},{"c":"Energia Reversa","n":"REGENERAÇÃO APRIMORADA","d":"Aumentando seu domínio sobre a energia reversa, você se torna mais capaz de se regenerar com ela. Você pode, como uma ação comum, regenerar Ferimentos Complexos, gastando 8 pontos de energia reversa por ferimento. Entretanto, caso seja um desmembramento, só é possível regenerar membros que tenham sido perdidos há menos de um dia ou não tenham sido cicatrizados ainda (p.315). Ao utilizar a aptidão, pode-se gastar mais para recuperar diferentes membros e feridas com o mesmo custo inicial. Se possuir o membro em mãos, a ação diminui para Bônus e o custo para recuperar o membro se torna 3 PER, conforme você coloca o membro no lugar. Além disso, você pode remover os efeitos de um veneno ao gastar uma Ação Bônus e 4PER. Ao atingir Nível de Aptidão em Energia Reversa 5, você passa a poder gastar 10PER ao invés do normal para utilizar a aptidão como uma ação livre. Quando você regenerar uma ferida, você se cura no equivalente de metade dos PER gastos para isso (caso gaste 8 para regenerar, você se cura o equivalente de 4PER gastos na aptidão Energia Reversa). [Pré-Requisito: Cura Amplificada, Nível de Aptidão em Energia Reversa 4 e Nível 15]"},{"c":"Energia Reversa","n":"LIBERAÇÃO DE ENERGIA REVERSA","d":"Além de ser capaz de se curar com a energia reversa, você aprende como a liberar para curar outras pessoas, o que é mais complexo e difícil. Você se torna capaz de curar outras criaturas utilizando a habilidade Energia Reversa, desde que estejam dentro do seu alcance de toque. [Pré-Requisito: Energia Reversa e Nível 10]"},{"c":"Energia Reversa","n":"CANALIZAR ENERGIA REVERSA","d":"A energia reversa é nociva a maldições, então você se torna capaz de canalizá-la e usá-la de maneira agressiva. Como uma Ação de Movimento, você pode gastar uma quantidade de pontos de energia reversa igual ao seu bônus de treinamento para adicionar dano de energia reversa a um ataque: para cada ponto gasto, você causa 2d6 de dano de energia reversa adicional. Essa habilidade funciona apenas por um ataque, o qual deve ser contra uma maldição e não pode ser utilizada em Feitiços. Errar um ataque não consome esse uso. Não é possível utilizar Canalizar em Golpe e Canalizar Energia Reversa simultaneamente, podendo aplicar apenas um deles em um mesmo ataque. [Pré-Requisito: Liberação de Energia Reversa e Canalizar em Golpe]"},{"c":"Energia Reversa","n":"CURA EM GRUPO","d":"Ao invés de curar apenas uma criatura, você se torna capaz de projetar a energia reversa entre diferentes componentes de um grupo. Ao invés de decidir um alvo, você pode optar por realizar a rolagem de cura e dividir o total do resultado entre todas as criaturas dentro de um alcance igual a 4,5 + 1,5 para cada Nível de Aptidão em Energia Reversa. A quantidade máxima de pontos que podem ser gastos aumenta em 2. [Pré-Requisito: Liberação de Energia Reversa]"},{"c":"Especiais","n":"ABENÇOADO PELAS FAÍSCAS NEGRAS","d":"Embora o raio negro seja algo incontrolável, você se foca tanto nisso que parece começar a conseguir cativar as faíscas negras, as quais te abençoam. Você passa a usar o kokusen, por padrão, em um 19 e em um 20 no dado. Ao estar em Estado de Consciência Absoluta, você pode reduzir o valor necessário para Kokusen 1 vez a mais. Além disso, após acertar um kokusen, você recebe um bônus igual a metade do seu Nível de Aptidão em Controle e Leitura em jogadas de ataque e o nível total de aptidão em rolagens de dano pelo resto da cena. [Pré-Requisito: Raio Negro, Nível de Aptidão em Controle e Leitura 4, Nível de Aptidão em Aura 3 e Nível 15]"},{"c":"Especiais","n":"DOMÍNIO SIMPLES","d":"Conhecido originalmente como o “Domínio dos Fracos”, o Domínio Simples ergue uma barreira ao redor do usuário juntamente de seu domínio, neutralizando os efeitos e Acerto Garantido de uma expansão. Você pode, com uma Reação contra a expansão de um domínio ou como Ação Bônus no seu turno, gastar 5 PE e criar uma esfera de X metros de raio a sua volta (onde X é igual a: 1,5m + Nível de DOM x 1,5 metros). Você e toda criatura dentro do Domínio Simples não são afetados pelo Acerto Garantido e os efeitos de ambiente de um domínio. Esta aptidão usa de Concentração e possui Y de Durabilidade (onde Y é igual ao seu Nível de BAR + 1). Sempre que falhar em um teste de concentração, a Durabilidade de seu domínio simples desce em 1. No inicio do seu turno, caso você deveria ter sido atingido por um acerto garantido, seu Domínio Simples perde 1 de durabilidade. Toda vez que seu Domínio Simples perder durabilidade, ele também tem sua área deteriorada em 1,5m. Caso a Durabilidade ou A Área do Domínio sejam deterioradas a 0, o Domínio Simples quebra, fazendo você e todos dentro receber o Acerto Garantido instantaneamente. [Pré-Requisito: Nível de Aptidão em Barreira 1 e Nível 5]"},{"c":"Especiais","n":"REVERSÃO DE TÉCNICA","d":"Em um processo complexo, você passa a ser capaz de utilizar energia reversa para abastecer a sua técnica, possibilitando assim um efeito contrário ao padrão e com maior potência. Quando obtiver um novo Feitiço, você pode escolher criar uma Reversão de Técnica no lugar: uma Reversão tem o seu custo aumentado em um valor igual ao nível do Feitiço e deve, também, ser criada como algo que reverte o conceito da sua técnica (o Vermelho, Reversão de Técnica do Ilimitado, empurra ao invés de puxar). Ao obter esta aptidão, você recebe um Feitiço adicional, a qual obrigatoriamente deve ser uma reversão. [Pré-Requisito: Energia Reversa e Nível 12]"},{"c":"Especiais","n":"TÉCNICA MÁXIMA","d":"Dentre os feiticeiros jujutsu, existe a possibilidade de levar o potencial da sua técnica ao máximo, criando uma habilidade definitiva a partir dela. É uma arte suprema, com grande complexidade e necessidade de conhecimento sobre a própria técnica. Ao obter esta habilidade, você se torna capaz de criar uma Técnica Máxima: você recebe um novo Feitiço o qual, caso você possua acesso apenas aos de Nível 4, utiliza os valores de Nível 5 para sua criação e, quando receber acesso ao Nível 5, sua Técnica Máxima passa a seguir os valores próprios de uma. Uma Técnica Máxima custa 25 PE e, após ser usada, você deve esperar uma quantidade de rodadas igual a 6 – metade do seu Bônus de Treinamento para poder utilizá-la novamente. [Pré-Requisito: Mestre em Feitiçaria, Capacidade de Conjurar Feitiços Nível 4]"},{"c":"Domínio","n":"TÉCNICA ESOTÉRICA: CESTA OCA DE VIME","d":"Uma antiga técnica utilizada contra domínios, antes mesmo do domínio simples ser criado. Como reação a uma expansão de domínio ser utilizada, você pode pagar 6 pontos de energia amaldiçoada para usar a cesta oca de vime, realizando um sinal de mão que cria um escudo com forma semelhante a uma cesta ao redor do usuário. Enquanto estiver com a cesta oca de vime ativa, você não é afetado pelo efeito de acerto garantido de uma expansão, mas não evita outros efeitos do domínio e não funciona contra domínios incompletos. Para cada rodada que a cesta oca de vime for mantida, você deve pagar mais 2PE para sustentar; a cesta oca de vime pode ser destruída, seguindo as mesmas regras do domínio simples.","pre":"Nível 4","src":"Enciclopédia"},{"c":"Domínio","n":"EMOÇÃO DA PÉTALA DECADENTE","d":"Uma arte secreta transmitida entre as três grandes famílias jujutsu como uma contramedida para expansões de domínio. Ao invés de levantar um domínio, o usuário se cobre com energia e contra-ataca quando um ataque de acerto garantido fosse o acertar. Como uma reação a uma expansão de domínio ser ativada ou como uma ação bônus, você pode usar emoção da pétala decadente, cobrindo-se de energia. Enquanto estiver com a aptidão ativa, sempre que você fosse receber um ataque provindo do acerto garantido de uma expansão de domínio, você pode gastar uma quantidade de pontos de energia igual ao dobro do nível da habilidade (em um inimigo, pode-se considerar que suas ações são de um nível igual ao seu grau) para anular o ataque contra você. Utilizando de um fluxo e liberação constante de energia, ela requer foco: a aptidão dura até você perder a sua concentração ou a sua energia amaldiçoada acabar.","pre":"Nível 6, Cobrir-se e Nível de Aptidão em Controle e Leitura 3","src":"Enciclopédia"},{"c":"Adicionais","n":"QUEBRA DE LIMITE [REGRA OPCIONAL: LIMITE DE ENERGIA]","d":"Você ultrapassa os limites no controle de energia, aumentando a sua liberação imediata. Ao obter esta aptidão, o seu máximo de energia gasto por turno aumenta em um valor igual ao seu bônus de maestria.","pre":"Nível 6","src":"Enciclopédia"}],"CON":[{"n":"Condenado","g":"Média","d":"Um personagem condenado tem o custo em PE de todas as suas habilidades aumentado em 1."},{"n":"Engasgando","g":"Média","d":"O alvo fica mudo e precisa segurar o Ar."},{"n":"Enjoado","g":"Média","d":"Um personagem enjoado não pode converter suas ações dentro da Hierarquia de Ações."},{"n":"Envenenado","g":"Média","d":"Recebe -2 em jogadas de ataque, testes de resistência e testes de perícia enquanto o veneno durar."},{"n":"Sangramento","g":"Variável","d":"Um personagem com sangramento recebe perda de vida no início de seu turno, e deve realizar um teste de resistência de Fortitude no final dele. Em uma falha, a condição persiste; em um sucesso, a condição se encerra. A CD e a perda de vida do sangramento dependem do causador da condição (veja página 213)."},{"n":"Sofrendo","g":"Leve","d":"Você está sofrendo de uma dor horrível. Você recebe -5 em testes de concentração e em testes de Prestidigitação para realizar rituais e perde 3 metros de movimento."},{"n":"Atordoado","g":"Extrema","d":"O personagem fica desprevenido e não pode realizar ações ou reações."},{"n":"Inconsciente","g":"Extrema","d":"O personagem não pode realizar ações ou reações e fica caído. Larga tudo que estiver segurando e não pode falar. Falha automaticamente em testes de resistência de Reflexos, todo ataque realizado contra ela acerta e é considerado um acerto crítico. Uma criatura inconsciente que não esteja nas portas da morte é desperta se tomar dano ou uma criatura gastar uma ação comum para a chacoalhar."},{"n":"Paralisado","g":"Extrema","d":"O personagem não pode realizar ações ou reações, exceto ações completamente mentais. O personagem recebe -10 de Defesa, falha automaticamente em testes de resistência de Reflexos e todo ataque corpo a corpo que acerte o personagem é considerado um acerto crítico."},{"n":"Indefeso","g":"Especial","d":"Uma criatura fica Imóvel e atordoado. Se estiver com uma criatura indefesa ao seu alcance de toque você pode gastar uma ação completa e, se o fizer, pode matá-la ou causar um Ferimento Complexo na criatura indefesa."},{"n":"Abalado","g":"Fraca","d":"O personagem sofre -1 em jogadas de ataque e testes de perícia."},{"n":"Amedrontado","g":"Média","d":"O personagem sofre -3 em jogadas de ataque e testes de perícia. Os prejuízos desta condição não se acumulam com os de Abalado, sendo uma evolução direta dela."},{"n":"Aterrorizado","g":"Forte","d":"Não pode se aproximar voluntariamente da criatura que infligiu a condição."},{"n":"Confuso","g":"Média","d":"Um personagem confuso se comporta da maneira aleatória. Você sofre -4 em testes de Fortitude e Atletismo para se manter de pé e, logo após se movimentar 1,5 metros rode 1d4 (1: frente, 2: trás, 3: direita ou 4: esquerda) você se move 3 metros nessa direção. Repita o processo em um intervalo de 1,5 metros de movimento voluntário entre as rolagens. Se sua movimentação permitir, rode 1d6 ao invés de 1d4 (onde 5 é para baixo e 6 para cima)."},{"n":"Enfeitiçado","g":"Média","d":"A criatura enfeitiçada recebe um prejuízo de -2 em todos os testes que realizar contra quem a enfeitiçou."},{"n":"Agarrado","g":"Média","d":"Enquanto agarrado, o personagem fica desprevenido e imóvel. Um personagem fazendo um ataque à distância contra uma criatura envolvida em uma ação de agarrar, tem 50% de chance de acertar o alvo errado (1 a 5 em 1d10). Se um personagem agarrando se mover a criatura agarrada acompanha ele."},{"n":"Caído","g":"Fraca","d":"O personagem sofre -3 em ataques corpo a corpo e só pode se mover 4,5 metros, rastejando, ou utilizar uma ação de movimento para se levantar. Além disso, se estiver caído no chão você tem -3 de Defesa contra ataques corpo a corpo, mas recebe +3 de Defesa contra ataques a distância. Um personagem caído que esteja voando imediatamente perde seu deslocamento de voo até que fique de pé."},{"n":"Enredado","g":"Média","d":"Tem o deslocamento reduzido à metade e recebe -2 na sua Defesa e em rolagens de ataque."},{"n":"Imóvel","g":"Forte","d":"A criatura se torna incapaz de utilizar as Ações de Movimento Andar, Esgueirar, Levantar e Pular, porém pode usar Sacar e ações que gastem seu movimento, mas que não te deslocam para outro ponto, como a aptidão Canalizar em Golpe. Além disso, você não pode receber Deslocamento de qualquer fonte."},{"n":"Lento","g":"Média","d":"Toda forma de movimento do personagem — como seu valor de Deslocamento — é reduzida pela metade."},{"n":"Cego","g":"Forte","d":"O personagem fica Surpreso e Lento, falha em qualquer teste envolvendo a visão e sofre -5 em Percepção. Todos os alvos de seus ataques recebem"},{"n":"Desorientado","g":"Fraca","d":"Fica incapaz de utilizar reações contra a próxima ação ofensiva realizada contra você ou ataques de oportunidade. A condição se encerra após seu efeito ser realizado."},{"n":"Desprevenido","g":"Fraca","d":"O personagem sofre -3 na Defesa e em Testes de Resistência de Reflexos. Você fica desprevenido contra inimigos que não possa ver mas saiba que estão perto."},{"n":"Invisível","g":"Especial","d":"O personagem não pode ser visto, recebe +10 em testes de Furtividade e, ao receber a condição, pode utilizar Esconder como uma Ação Livre. Caso esteja Invisível durante a rolagem de Iniciativa, você possui vantagem nela."},{"n":"Surdo","g":"Média","d":"O personagem falha em qualquer teste envolvendo a audição e sofre -5 em rolagens de Iniciativa. Caso já esteja em combate, seu valor atual de Iniciativa também é reduzido em -5, alterando a ordem dos turnos."},{"n":"Surpreso","g":"Especial","d":"O personagem fica Desprevenido e não pode realizar reações contra uma criatura que o deixou surpreso. Uma criatura Surpreendida ou que não saiba da existência do perigo fica surpresa contra ele."},{"n":"Exposto","g":"Forte","d":"Jogadas de Ataque contra a criatura recebem +4 e, caso acertem, seus ataques causam dano adicional igual ao nível do atacante, em cada rolagem de dano."},{"n":"Fragilizado","g":"Forte","d":"Seus valores de Redução de Dano são reduzidos a zero, assim como suas resistências são anuladas (imunidades não são anuladas). Enquanto possuir esta condição, você não pode ter sua Redução de Dano aumentada e nem se tornar resistente a nada."}],"TEC":[{"n":"Boneco de Palha","dono":"Nobara Kugisaki","pg":10,"intro":"Boneco de Palha é a técnica inata de Nobara Kugisaki, a qual é utilizada através de um conjunto de equipamentos – um martelo, pregos e um boneco de palha – que recebem energia amaldiçoada e permitem diferentes usos, como compartilhar dano entre a boneca de palha e o alvo.\n\nÉ uma técnica versátil e com muitas aplicações, possuindo boas sinergias com especializações corpo-a-corpo, como Lutador e Especialista em Combate, assim como pode se beneficiar das habilidades e possibilidades de um Especialista em Técnica.\n\nSuas principais mecânicas envolvem o uso de pregos imbuídos com energia amaldiçoada, os quais permitem ataques a distância, explodindo-os com a sua energia de maneira surpreendente e debilitante, além da possibilidade de utilizar o boneco de palha para causar danos mesmo a distância e sem visão de um alvo, desde que consiga obter um vestígio dele para criar uma ligação.","f":"Junto da sua técnica, você recebe um conjunto de equipamentos essenciais para ela, composto por três itens diferentes:\n\n• Um martelo, com o qual você obrigatoriamente trata como se tivesse maestria com. Ele tem as mesmas características da arma Martelo, e pode ser melhorada como uma ferramenta amaldiçoada.\n• Um boneco de palha, o qual serve como um meio para causar danos no alvo, desde que uma conexão seja estabelecida.\n• Pregos, os quais você cobre de energia amaldiçoada para serem usados como projéteis. No começo de uma missão, você tem uma quantidade de pregos igual ao seu bônus de maestria multiplicado por 5, sendo repostos no começo da próxima.","tipo":"Inata"},{"n":"Boogie Woogie","dono":"Aoi Todo","pg":14,"intro":"Boogie Woogie é a técnica amaldiçoada de Aoi Todo, que o permite trocar o lugar de objetos ou pessoas ao bater palmas. Seu funcionamento é simples, mas efetivo.\n\nÉ uma técnica auxiliar, servindo bem nas mãos de alguém que tenha habilidades de combate bem desenvolvidos, complementando suas possibilidades, além de conseguir interagir bem com aliados, seja conseguindo a ajuda deles ou salvando-os de situações ruins.\n\nServe bem com as especializações Lutador e Especialista em Combate, que focam em permitir o desenvolvimento de uma grande proficiência em lutas por si só. Entretanto, com a devida criatividade, é possível inovar nos seus usos.","f":"Ao bater palmas, você pode trocar de posição com algo ou alguém que quiser, assim como pode trocar a posição de outros dois alvos a sua escolha. Um alvo só é válido para a sua técnica caso tenha um nível mínimo de energia.","tipo":"Amaldiçoada"},{"n":"Chamas do Desastre","dono":"Jogo","pg":19,"intro":"Chamas do Desastre é a técnica da maldição do desastre Jogo, fornecendo ao usuário habilidades de chamas poderosas, formando e controlando tanto fogo quanto lava, sendo ambos extremamente letais e destrutivos.\n\nÉ uma técnica focada em dano e agressividade, funcionando bem com aqueles que buscam a capacidade de causar destruição massiva. Devido a capacidade de ser usada tanto em curto alcance quanto a distância, telepaticamente, serve tanto para combatentes corpo-a-corpo quanto a distância.","f":"Você é capaz de formar e controlar tanto fogo quanto lava, o que pode ser fisicamente ou telepaticamente, rapidamente criando chamas devastadoras.","tipo":"Técnica"},{"n":"Cólera das Estrelas","dono":"Yuki Tsukumo","pg":28,"intro":"Cólera das Estrelas é a técnica amaldiçoada de Yuki Tsukumo, que a permite infundir massa imaginária em si mesma, além de ser acompanhada de um shikigami ligado à sua técnica, chamado de Garuda.\n\nÉ uma técnica que foca na amplificação de ataques corpo-a-corpo, permitindo danos massivos devido ao acréscimo da massa imaginária. Funciona bem com as especializações Lutador e Especialista em Combate, fortalecendo muito seus golpes e dano.","f":"Você se torna capaz de conceder massa imaginária para si mesmo, o que amplifica as suas capacidades físicas, com a força crescendo proporcionalmente à massa adicional. Além disso, você troca uma das suas habilidades de técnica inicial pela invocação Garuda.\n\nGaruda é um shikigami ligado à sua técnica, podendo ser afetado por maioria das suas habilidades e pelo funcionamento básico da técnica. Você segue as regras padrão de controle e custo para invocações.\n\n• Luta +5 A ficha de invocação de Garuda considera que ele será uma invocação de quarto grau, assim como seu dono é um personagem nível 1. Sempre que o seu bônus de maestria aumentar, você pode transformar Garuda em uma invocação de grau superior, seguindo as regras padrão do Capítulo 10: Invocações, Livro Básico, para o melhorar.","tipo":"Amaldiçoada"},{"n":"Cópia","dono":"Yuta Okkotsu","pg":36,"intro":"Cópia é a técnica amaldiçoada inata de Yuta Okkotsu, dependente também do espírito amaldiçoado Rika. É uma técnica composta de duas partes principais: o shikigami Rika e a capacidade de copiar.\n\nSendo mais dependente de fatores externos – o que você pode encontrar para copiar – é uma técnica versátil e que pode se encaixar com qualquer especialização e personagem. O seu usuário também é armado com o shikigami Rika, o qual segue um crescimento específico e poderoso, servindo como uma fonte adicional de poder, além de agir por si só enquanto invocada. Com a cópia, é possível tanto se adaptar a situações dentro de combate, utilizando as habilidades de inimigos e aliados, quanto formar um leque de habilidades memorizadas, montando o seu arsenal da maneira que desejar. Embora seja complexo e variável, a cópia no geral prioriza as habilidades de técnica, possuindo uma interação distinta com os funcionamentos básicos. Entretanto, fatores adicionais como o Seis Olhos não podem ser copiados.","f":"Ao escolher essa técnica amaldiçoada, você troca uma das suas habilidades de técnica inicial pela invocação Rika, a qual é um shikigami. Rika serve como armazém externo não só para técnicas amaldiçoadas copiadas, mas também para ferramentas amaldiçoadas, podendo ser rapidamente invocada e utilizada. Embora seja controlável, ela é imatura e emocional, às vezes usando do seu poder mesmo sem ser requisitado para proteger seu usuário.\n\nRika não segue as regras padrão de controle, possuindo um turno próprio e conseguindo agir sem a necessidade de comandos diretos: você pode optar que Rika realize o turno dela juntamente do seu, ou tenha seu próprio número na iniciativa. Dentro de um turno, Rika pode realizar uma ação e se mover, além de ter uma reação por rodada, recuperando-a no começo de todo turno dela. Sendo uma exceção, a progressão de Rika depende do bônus de maestria do usuário da técnica, seguindo seus próprios custos, características e ações/habilidades. Certas habilidades são passivas, não necessitando que Rika esteja invocada, enquanto outras dependem da presença dela em campo. Abaixo está a primeira ficha de invocação de Rika:\n\n• Fortitude +3\n• Luta +5 Você não recebe mais habilidades de técnica diretas, podendo apenas copiar e aprender novas a partir da cópia. Outras habilidades que possa criar seriam passivas, aprimorando Rika.\n\nCaso tenha a habilidade Treinamento em Controle, você pode dar comandos à Rika normalmente, seguindo o padrão da habilidade como se ela fosse um shikigami comum, com suas ações sendo equivalentes a uma ação complexa.\n\n▸ Cópia\nJuntamente de Rika, você pode usar a parte de Cópia da técnica, a qual o permite utilizar das técnicas amaldiçoadas de outras criaturas.\n\nEnquanto Rika estiver invocada, você pode copiar técnicas amaldiçoadas através das seguintes regras:\n\n• Para poder copiar uma técnica, Rika deve ter acertado um ataque de Mordida no portador da técnica que você deseja copiar.\n• Você só pode copiar uma habilidade de técnica que seja de um nível ao qual você já possua acesso. Copiar uma habilidade de técnica custa uma ação bônus ou
