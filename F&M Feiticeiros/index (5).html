":1,"grp":"Besta"},{"g":"Complexas","s":"À Distância","n":"Escopeta","dano":"2d6 Pf","crit":"20","p":"Alcance [9/18m], duas mãos, emperrar, especial, recarga [2]","e":2,"k":2,"grp":"Tiro"},{"g":"Complexas","s":"À Distância","n":"Metralhadora","dano":"1d12 Pf","crit":"19","p":"Alcance [30/60m], duas mãos, emperrar, especial, recarga [30]","e":4,"k":3,"grp":"Tiro"},{"g":"Complexas","s":"À Distância","n":"Rifle","dano":"2d8 Pf","crit":"20","p":"Alcance [60/120m], duas mãos, emperrar, recarga [20]","e":2,"k":2,"grp":"Tiro"},{"g":"Complexas","s":"À Distância","n":"Rifle de Precisão","dano":"2d10 Pf","crit":"19","p":"Alcance [120/240m], duas mãos, emperrar, recarga [5]","e":4,"k":3,"grp":"Tiro"},{"g":"Complexas","s":"Arremesso","n":"Chakram","dano":"2d4 Ct","crit":"20","p":"Arremessável [12/24m], especial, leve","e":1,"k":1,"grp":"Faca"},{"g":"Complexas","s":"Arremesso","n":"Kunai","dano":"1d6 Pf","crit":"19","p":"Apunhaladora, arremessável [9/18m], fineza, leve","e":1,"k":1,"grp":"Dardo"},{"g":"Complexas","s":"Arremesso","n":"Rede","dano":"-","crit":"-","p":"Alcance [9/27m], especial","e":1,"k":2,"grp":"-"},{"g":"Complexas","s":"Arremesso","n":"Shuriken","dano":"1d4 Ct","crit":"18","p":"Arremessável [12/24m], mortal d8, leve","e":1,"k":1,"grp":"Dardo"}],"PROP":{"ampla":"A arma é boa para ataques amplos ou giratórios. Uma vez por rodada, quando atacar com ela, você pode escolher outro alvo adjacente a criatura, caso a Defesa dela seja menor do que o resultado do seu crítico, ela recebe metade do dano causado.","aparar":"A arma pode ser usada de maneira defensiva, bloqueando ataques. Enquanto empunhando a arma, caso seja treinado, você pode usar uma ação de movimento para posicioná-la defensivamente, recebendo +2 em sua Defesa até o começo do próximo turno.","apunhaladora":"A arma é boa para apunhalar discretamente. Quando atingir uma criatura desprevenida, a arma causa dano adicional igual ao seu bônus de treinamento.","arremessável":"A arma pode ser usada em ataques de arremesso na distância especificada juntamente dos traços.","duas mãos":"A arma só pode ser manuseada de maneira apropriada com as duas mãos.","dupla":"A arma pode ser usada com Lutando com Duas Armas, Estilo Duplo (e similares) para fazer ataques adicionais, como se fosse uma arma de uma mão e uma arma leve.","emperrar":"Em um desastre (1 natural em uma jogada de ataque), a arma emperra. A arma para de funcionar, sendo necessário uma ação comum para fazê-la funcionar novamente.","enérgica":"A arma acumula impulso para ficar mais poderosa. Quando realizar mais de um ataque com ela no mesmo turno, o segundo ataque recebe um bônus de dano igual à quantidade de dados de dano da arma. A cada outro ataque subsequente o bônus de dano aumenta em +1.","especial":"A arma possui um traço único dela.","estendida":"A arma tem um alcance maior. O alcance de seus ataques corpo a corpo com a arma aumenta em 1,5 metros.","fatal":"A arma é perigosa ao atingir o ponto certo. Junto do traço, é especificado um tamanho de dado. Em um acerto crítico, o dado de dano da arma aumenta para esse tamanho listado, o qual é considerado também para calcular o dano adicional do crítico. Caso o dado da arma se torne maior que o dado listado por aumento de níveis de dano, ao invés do normal, adicione 1 dado da categoria indicada no dano do acerto crítico.","fineza":"A arma tem certa fineza, permitindo-lhe escolher como manejar. Você pode escolher utilizar Destreza ao invés de Força em suas jogadas de ataque e rolagens de dano com a arma.","leve":"Uma arma leve pode ser usada no manuseio de duas armas.","marcial":"A arma é integrada ao uso do corpo, podendo se beneficiar de diversas habilidades de caminhos focados em formar um Lutador.","modular":"A arma pode ser moldada para causar um tipo diferente de dano. Junto do traço, será especificado um tipo de dano, o qual você pode optar por causar em ataques com a arma. Por exemplo, a Adaga tem como dano Perfurante, mas é Modular Ct, podendo causar dano cortante.","mortal":"A arma é especialmente mortal. Em um acerto crítico, a arma adiciona um dado de dano adicional do tamanho listado.","oscilante":"A arma permite aproveitar um impulso errado em seu próximo ataque. Quando erra um ataque com esta arma você recebe +2 em sua próxima rolagem de ataque realizada antes do final do seu turno.","pesada":"A arma requer uma Força maior para usar. Quando manejando uma arma pesada, caso você não tenha um valor de Força igual ou superior ao especificado [X], você recebe desvantagem em rolagens de ataque com ela.","recarga":"Uma arma com a propriedade Recarga irá exigir o uso de munições. Após realizar um número de ataques [X] você deve gastar uma ação bônus para recarregar a arma. Após recarregada ela pode atirar o mesmo número de vezes até precisar ser recarregada novamente.","versátil":"Uma arma versátil pode ser manuseada com uma mão ou com duas, modificando seu dano de acordo com a maneira usada. O primeiro dado mostrado é o dano com uma mão e o segundo é quando a arma é segurada com duas mãos. O alcance de uma arma é listado em metros nas suas propriedades, caso seja uma arma a distância, de arremesso ou que possua a propriedade arremessável. Por padrão, uma arma corpo-a-corpo tem o seu alcance dependente do tamanho da criatura a manejando (veja página 298). Caso seja uma criatura de tamanho Média, o alcance é de 1,5 metros. Lembre-se também de conferir as regras sobre munição, caso vá usar uma arma a distância ou de arremesso.","adagas duplas":"Sendo duas adagas ligadas uma à outra e presas ao portador, você não pode ser desarmado. Além disso, contam como uma única arma de duas mãos.","alabarda":"De lâmina curva e amplo alcance, concede +2 em testes da manobra Derrubar.","bazuca":"Ao atacar um inimigo, compare seu teste contra a Defesa de todos os alvos a 7,5 metros do alvo original, causando o dano do ataque a todos cujo seu teste superar a Defesa. Recarregar uma bazuca custa uma Ação Completa. As munições da bazuca tem Custo e Espaço 1.","chakram":"Feito para facilmente retornar ao portador. Sempre que realiza um ataque de arremesso com o Chakram a arma retorna para sua mão após o ataque.","chicote":"Você pode usar a manobra Agarrar mesmo com a mão ocupada pelo chicote, desde que o alvo esteja dentro do seu alcance com a arma. Você recebe +2 em testes de Agarrar usando o chicote.","chicote de corrente":"Pesado e robusto, possui o traço especial de chicote. Além disso, como uma ação bônus você pode enrolar a corrente em volta do cabo de uma arma corpo a corpo que esteja empunhando. Enquanto uma arma está acoplada a uma corrente você passa a poder utilizar o alcance do chicote e efeito de crítico dele para os ataques dela e você ocupa duas mãos para se beneficiar deste efeito. Tirar uma corrente de uma arma gasta outra ação bônus.","chicote espinhento":"Devido a sua estrutura, o chicote espinhento causa 1d6 de dano cortante e 1d6 de dano perfurante. Ao subir o nível de dano de um chicote espinhento, sobe-se o nível de cada dado individualmente. Apenas o menor RD/ Resistência é contado para efeitos de diminuição de dano. Ele possui o traço especial de chicote.","dardo":"O dardo é especialmente efetivo para aplicar venenos. Se o dardo atingir uma criatura, enquanto coberto por veneno, a CD do veneno aumenta em +2.","escopeta":"Ao realizar um ataque com uma escopeta, além do alvo original, criaturas em um cone de 3 metros a sua frente também são afetadas. Compare o resultado de sua jogada de ataque com a Defesa de cada uma das criaturas na área. Você causa dano igual aos dados de dano da arma em todas aquelas em que acertar. Recarregar uma escopeta custa uma ação comum.","espada de gancho":"Um modelo específico e peculiar de espadas, cuja ponta tem forma de gancho. Ao acertar um ataque você pode puxar o alvo 1,5 metros na sua direção, não podendo entrar no quadrado. Caso você esteja equipando duas, as duas espadas de gancho passam a receber o traço Estendida.","espada colossal":"Uma espada de tamanho excessivo, naturalmente mais forte. Como o efeito de Amplo, mas escolha uma terceira criatura adjacente ao alvo do primeiro ataque para também sofrer os efeitos.","faixas":"Simples faixas enroladas na mão do portador. As faixas não são consideradas armas, mas sim equipamentos, e ataques realizados com elas são considerados como ataques desarmados, possuindo o mesmo dano deles e se beneficiando de habilidades que afetam esse tipo de ataque. Você pode utilizar uma ou duas faixas, embora o item seja um conjunto. Embora não sejam consideradas armas, você pode transformar Faixas em Ferramentas Amaldiçoadas, recebendo os benefícios comuns da tabela para armas.","kusarigama":"A kusarigama permite o uso tanto da foice, que causa dano cortante quanto do peso, que causa dano de impacto. Uma kusarigama concede +2 em testes de manobra. Ao subir o nível de dano de uma kusarigama, sobe-se o nível de cada dado individualmente.","leque":"Você pode alternar entre usar o leque fechado, que causa dano de impacto, ou o leque aberto, que causa dano cortante. Alternar dentro de combate é uma ação livre. Enquanto fechado, conta como parte do grupo bastão; enquanto aberto, conta como parte do grupo faca. O leque também concede +2 em testes de Enganação para Fintar.","manoplas":"Manoplas que ocupam completamente as duas mãos. Contam como arma para todos os efeitos, mas usam do seu dano desarmado base para ser aplicado. É possível carregar itens e agarrar e levantar pessoas enquanto usa as manoplas, mas não é possível manejar outras armas. Seu dano desarmado aumenta em 1 nível para cada 2 no seu modificador de força.","metralhadora":"Uma metralhadora possui uma cadência superior de disparo. Quando realizar um ataque com a metralhadora, você pode também utilizar a sua ação bônus para realizar um ataque adicional, consumindo mais uma munição. Utiliza uma ação comum para recarregar.","rede":"Caso acerte um ataque com uma rede, o alvo recebe a condição Enredado. Uma criatura enredada dessa maneira pode tentar escapar como uma Ação Completa, realizando um teste de Atletismo ou Acrobacia com CD20. Uma rede pode também ser atacada, possuindo 5 Pontos de Vida e, caso destruída, a criatura presa é solta.","soco inglês":"Um soco inglês destrutivo, colocado em uma mão. Conta como arma para todos os efeitos, mas usa do seu dano desarmado para ser aplicado. É possível agarrar e levantar pessoas enquanto usa o soco inglês, mas não é possível manejar outras armas ou itens. Enquanto usando soco inglês, seus ataques com ele também aplicam os efeitos críticos do grupo Faca e testes de resistência para resistir a efeitos de crítico têm a CD aumentada em 1 para cada 2 no modificador de força ou destreza."},"KIT":[{"n":"Ferramentas de Alfaite","d":"O kit de ferramentas de alfaiate é focado na criação de acessórios especiais e uniformes, feitos sob medida com o uso de habilidade manual e jujutsu. Entretanto, criar acessórios amaldiçoados é complexo e custoso: do nível 1 ao 9, você só pode criar 1 acessório por interlúdio; a partir do nível 10 você pode criar 2 acessórios por interlúdio. Você pode criar um uniforme com revestimento por interlúdio."},{"n":"Ferramentas de Alquimia","d":"O kit de ferramentas de alquimia possibilita misturar elementos e substâncias para criar algo novo, podendo ser tanto venenos quanto misturas com efeitos diferenciados. Possuir treinamento em ferramentas de alquimia permite criar itens especiais do tipo Mistura; não há um limite de quantas misturas podem ser criadas."},{"n":"Ferramentas de Canalizador","d":"O kit de ferramentas de canalizador é um conjunto de peculiares amuletos, pérolas e outros itens espirituais, que permitem canalizar energia amaldiçoada e alguns espíritos amaldiçoados menores em itens. Possuir treinamento em ferramentas de canalizador permite criar itens especiais do tipo Espiritual; não há um limite de quantos itens espirituais podem ser criados."},{"n":"Ferramentas de Cozinheiro","d":"O kit de ferramentas de cozinheiro dá a capacidade de extrair ao máximo habilidades culinárias, criando refeições da maior qualidade, as quais passam a até mesmo conferir benefícios para aqueles que as consumirem. Ser treinado em Ofício (cozinheiro) permite produzir refeições com propriedades especiais. Durante um descanso, um personagem treinado pode preparar uma refeição que concede benefícios especiais. Produzir uma refeição com um benefício exige sucesso em um teste de Ofício (Cozinheiro) CD 15. A CD aumenta em +5 para cada benefício adicional. Falhar no teste implica que a comida foi estragada e desperdiçada. Todos os benefícios duram até o próximo descanso longo e uma mesma refeição pode beneficiar um número de criaturas igual ao seu bônus de treinamento. • Energética. Consumir uma refeição energética concede energia amaldiçoada temporária igual ao bônus de treinamento do cozinheiro. • Leve. Consumir uma refeição leve concede um aumento no Deslocamento de 3 metros para cada grau do cozinheiro. 3 para quarto, 6 para terceiro, 9 para segundo, 12 para primeiro e 15 para especial. • Nutritiva. Consumir uma refeição nutritiva concede um bônus de +2 em um número de TRs igual a metade do bônus de treinamento do cozinheiro. • Picante. Consumir uma refeição picante concede +2 em jogadas de ataque. • Reforçada. Consumir uma refeição reforçada concede +2 na Defesa. • Refrescante. Consumir uma refeição refrescante permite a quem a comeu escolher realizar um teste com vantagem. Após isso, este benefício se encerra. • Revigorante. Consumir uma refeição revigorante concede 5 pontos de vida temporários para cada grau do cozinheiro."},{"n":"Ferramentas de Entalhador","d":"O kit de ferramentas de entalhador junta instrumentos e utensílios utilizados na arte de se entalhar e encravar, a qual quando unida a energia amaldiçoada permite criar amuletos e talismãs. Possuir treinamento em ferramentas de entalhador permite criar itens especiais do tipo Talismã; não há um limite de quantos talismãs podem ser criados."},{"n":"Ferramentas de Ferreiro","d":"O kit de ferramentas de ferreiro é utilizado na criação e melhoria de armas e escudos, eventualmente utilizando do jujutsu para as transformar em ferramentas amaldiçoadas. Possuir treinamento nas ferramentas de ferreiro permite criar tanto armas e escudos comuns quanto ferramentas amaldiçoadas. Ao se tentar criar ou melhorar uma ferramenta amaldiçoada, segue-se o guia e as dificuldades especificadas no Capítulo 6: Itens e Ferramentas Amaldiçoadas. É o principal para se manter os equipamentos em um bom estado, realizando a sua manutenção e otimização, permitindo assim que o máximo do seu potencial seja extraído. Durante um descanso curto, um personagem com treinamento em ferramentas de ferreiro pode melhorar temporariamente uma quantidade de equipamentos igual a metade do seu bônus de treinamento; em um descanso longo, essa quantidade é igual ao bônus de treinamento. Uma arma melhorada adiciona +2 em jogadas de ataque realizadas com ela; um escudo melhorado adiciona metade do bônus de treinamento do ferreiro na RD concedida enquanto empunhado. As melhorias duram até o próximo descanso."},{"n":"Ferramentas de Farmacêutico","d":"O kit de ferramentas de farmacêutico permite cuidar efetivamente da saúde, além de sintetizar substâncias medicinais refinadas, criando antídotos ou remédios. Possuir treinamento nas ferramentas de farmacêutico permite criar itens especiais do tipo Fármacos; não há um limite de quantas medicinas podem ser criadas."}],"ITE":[{"n":"Antídoto Simples","tipo":"Fármaco","custo":1,"d":"Um simples antídoto, capaz de neutralizar venenos mais leves. O antídoto pode ser consumido como uma ação bônus, curando da condição envenenado e/ou qualquer veneno de custo 1 ou que venha de uma maldição de quarto grau."},{"n":"Brinco da Comunicação","tipo":"Acessório","custo":1,"d":"Um par de brincos imbuídos com uma técnica de comunicação. Usar um desses brincos permite que o usuário sintonize com até 6 outras pessoas que também estejam usando um. Todos sintonizados na mesma conexão conseguem se comunicar mentalmente desde que estejam dentro de 30 metros. Sintonizar um brinco dentro de combate é uma ação completa, e enquanto se comunica o brinco brilha em um brilho perceptível por qualquer pessoa."},{"n":"Chaveiro Canalizador","tipo":"Acessório","custo":1,"d":"Um chaveiro que canaliza energia amaldiçoada, refinando-a e dificultando resistir. Um personagem com o chaveiro canalizador tem a sua CD Amaldiçoada aumentada em 1."},{"n":"Injeção Estimulante","tipo":"Fármaco","custo":1,"d":"Uma injeção criada a partir de uma mescla de medicina e controle de energia amaldiçoada. Ela tem uma única carga e a injetar faz com que você receba +2 de bônus em toda rolagem de perícia usando um atributo a sua escolha durante 10 minutos. Dentro de combate, injetar é uma ação bônus."},{"n":"Mix Energético Pequeno","tipo":"Fármaco","custo":1,"d":"Um conjunto de suplementos e substâncias que conseguem recuperar a energia e vigor físico, concentrados em uma cápsula. Como uma ação bônus, é possível consumir o mix, recuperando 3 pontos de estamina."},{"n":"Óleo Amolador","tipo":"Mistura","custo":1,"d":"Um pequeno recipiente cheio de um óleo que aumenta o potencial de uma arma, amolando-a. Pode ser aplicado em duas armas antes de acabar; uma arma coberta com óleo amolador recebe o traço Mortal d6. O óleo dura um dia."},{"n":"Óleo Flamejante","tipo":"Mistura","custo":1,"d":"Um óleo que deixa a arma extremamente inflamável, cobrindo-se de chamas com o menor dos esforços. Pode ser aplicado em duas armas antes de acabar; uma arma coberta com óleo flamejante recebe o traço Modular Queimante. O óleo dura 10 minutos."},{"n":"Pérola Carregada","tipo":"Espiritual","custo":1,"d":"Uma pequena pérola carregada com energia amaldiçoada, usada para recuperar do próprio estoque. Como uma ação bônus, é possível consumir a pérola, recuperando 3 pontos de energia amaldiçoada."},{"n":"Remédio Simples","tipo":"Fármaco","custo":1,"d":"Um simples remédio, capaz de forçar uma reação regenerativa do corpo. Como uma ação comum, é possível consumir o remédio e gastar seus dados de vida para se curar, com um limite igual a quatro dados de vida."},{"n":"Símbolo da Vida","tipo":"Talismã","custo":1,"d":"Uma espécie de pequena ficha ou amuleto, encravado em madeira e imbuído com energia reversa. Como uma ação bônus, é possível o destruir para liberar a energia em si mesmo, curando-se em 10 pontos de vida."},{"n":"Talismã de Barreira","tipo":"Talismã","custo":1,"d":"Um pequeno talismã que armazena uma barreira amaldiçoada. Pode usá-lo como uma ação bônus, invocando quatro paredes, cada uma possuindo 15 pontos de vida e ocupando 1,5 metros cada. Após usado, o talismã se esvai."},{"n":"Veneno Debilitante","tipo":"Mistura","custo":1,"d":"Um pote de veneno cujo foco é atingir o corpo, debilitando-o. Contato, o alvo terá seu deslocamento reduzido pela metade."},{"n":"Veneno Intenso","tipo":"Mistura","custo":1,"d":"Um pote de veneno intenso e concentrado, com o propósito de invadir o corpo do alvo. Contato, o alvo ficará Envenenado durante uma rodada."},{"n":"Amuleto do Vislumbre","tipo":"Acessório","custo":2,"d":"Um amuleto amaldiçoado que fornece ao portador capacidade de vislumbrar tudo ao seu redor com perfeição. O usuário deste item recebe visão no escuro com alcance de 9 metros, além de um bônus de +2 em rolagens de Percepção. Uma vez ao dia, você pode, como uma ação bônus, se tornar capaz de enxergar com os olhos fechados em 9 metros de diâmetro por 1 minuto."},{"n":"Antídoto Intermediário","tipo":"Fármaco","custo":2,"d":"Um simples antídoto, capaz de neutralizar venenos mais leves. O antídoto pode ser consumido como uma ação bônus, curando da condição envenenado e/ou qualquer veneno de custo 2 ou que venha de uma maldição de terceiro grau ou inferior."},{"n":"Apanhador de Saúde","tipo":"Acessório","custo":2,"d":"Um pequeno amuleto com formato semelhante ao de um apanhador de sonhos, o qual atrai boas energias. Sempre que um portador do acessório for curado, recebe +1 de cura por dado, com um limite de cura adicional igual a metade do seu nível."},{"n":"Bracelete do Vigor","tipo":"Acessório","custo":2,"d":"Um bracelete que entra em sintonia com o corpo e acentua o físico, concedendo um maior vigor para o seu portador. Enquanto estiver utilizando o bracelete do vigor, os seus pontos de vida máximos aumentam em 10."},{"n":"Conjunto de Pérolas Carregadas","tipo":"Espiritual","custo":2,"d":"Um conjunto de pérolas carregadas com energia amaldiçoada. Como uma ação bônus, é possível consumir o conjunto de pérolas, recuperando 6 pontos de energia amaldiçoada."},{"n":"Faixa de Foco","tipo":"Acessório","custo":2,"d":"Uma faixa que quando presa ao seu portador o permite focar e manter a concentração. Você recebe um bônus de +2 em testes para manter a concentração e, uma vez por dia, você pode escolher não perder a concentração ao invés de realizar um teste."},{"n":"Injeção de Adrenalina","tipo":"Fármaco","custo":2,"d":"Uma injeção com uma dose considerável de adrenalina, que o faz esquecer temporariamente do cansaço. Usar a injeção é uma ação bônus; ao usar ela, seu nível de Exaustão é reduzido em 1 até o final da cena, voltando imediatamente após o término dela."},{"n":"Mix Energético Médio","tipo":"Fármaco","custo":2,"d":"Um conjunto reforçado de suplementos e substâncias que aumentam a recuperação do vigor físico. Como uma ação bônus, é possível consumir o mix, recuperando 6 pontos de estamina."},{"n":"Pulseira Magistral","tipo":"Acessório","custo":2,"d":"Uma pulseira cujas propriedades conseguem extrair mais as capacidades de quem a usa, melhorando uma perícia. Enquanto estiver usando a pulseira magistral, o usuário se torna treinado em uma perícia a sua escolha."},{"n":"Remédio Intermediário","tipo":"Fármaco","custo":2,"d":"Um remédio mais complexo, capaz de forçar uma reação regenerativa avançada no corpo. Como uma ação comum, é possível consumir o remédio e gastar seus dados de vida para se curar, com um limite igual a oito dados de vida."},{"n":"Símbolo de Vida Florescente","tipo":"Talismã","custo":2,"d":"Uma ficha ou amuleto encravado em madeira e com quantidades modestas de energia reversa, o que dá um sutil brilho e calor. Como uma ação bônus, é possível o destruir para liberar energia em si mesmo, curando-se em 25 pontos de vida."},{"n":"Talismã de Barreira Superior","tipo":"Talismã","custo":2,"d":"Melhorando no talismã de barreira, ela é tecida com mais cuidado e foco em uma maior agilidade. Pode usá-lo como uma ação bônus ou como uma reação, invocando quatro paredes, cada uma possuindo 25 pontos de vida e ocupando 1,5 metros cada. Após usado, o talismã se esvai."},{"n":"Veneno Desnorteante","tipo":"Mistura","custo":2,"d":"Um pote de veneno cuja composição foca em atingir o sistema nervoso de uma criatura. Contato, o alvo ficará Desprevenido durante uma rodada."},{"n":"Anéis do Conhecimento","tipo":"Acessório","custo":3,"d":"Um conjunto de peculiares anéis, forjados e imbuídos com energia amaldiçoada e conhecimentos, prendendo-se na pele e se conectando ao usuário. Os anéis aumentam o valor de Sabedoria do usuário em 2, podendo superar o seu limite de atributo, até o máximo de 30."},{"n":"Antídoto Superior","tipo":"Fármaco","custo":3,"d":"Um simples antídoto, capaz de neutralizar venenos mais leves. O antídoto pode ser consumido como uma ação bônus, curando da condição envenenado e/ou qualquer veneno de custo 3 ou que venha de uma maldição de segundo grau ou inferior."},{"n":"Bracelete da Força","tipo":"Acessório","custo":3,"d":"Firme e forjado a partir do mais forte aço, esse bracelete aumenta o valor de Força do usuário em 2, podendo superar o seu limite de atributo, até o máximo de 30."},{"n":"Chaveiro Absorsor","tipo":"Acessório","custo":3,"d":"Um pequeno adereço espiritual, semelhante a um chaveiro, o qual é capaz de absorver energia amaldiçoada a partir de vestígios. Sempre que eliminar um inimigo que possua energia amaldiçoada ou seja formado por energia, você recupera 2 pontos de energia amaldiçoada."},{"n":"Cinturão do Inabalável","tipo":"Acessório","custo":3,"d":"Um robusto cinturão metálico, com uma correnteza de energia amaldiçoada que é transmitida e reforça o físico do usuário. O cinturão aumenta o valor de Constituição do usuário em 2, podendo superar o seu limite de atributo, até o máximo de 30."},{"n":"Domínio Simples Contido","tipo":"Talismã","custo":3,"d":"Um pequeno tubo com um domínio simples armazenado. Pode ser usado como uma ação comum, erguendo um domínio simples sem custo de energia, o qual se mantém por até 2 rodadas, protegendo apenas o portador do item. Após ser usado, o tubo se torna inútil, com a técnica armazenada se esvaindo."},{"n":"Faixas Céleres","tipo":"Acessório","custo":3,"d":"Várias faixas leves e quase transparentes, as quais quando amarradas em uma pessoa, usam da energia imbuída para estimular os reflexos e agilidade. As faixas aumentam o valor de Destreza do usuário em 2, podendo superar o seu limite de atributo, até o máximo de 30."},{"n":"Mistura Profana","tipo":"Mistura","custo":3,"d":"Uma mistura feita a partir de energia amaldiçoada concentrada e em estado ativo, capaz de estimular o fluxo interno de energia de um feiticeiro, mas possuindo um preço. Como uma ação comum, pode-se consumir a mistura profana, reduzindo o custo de todas as habilidades que utilizem energia amaldiçoada em 1 ponto, durante uma cena. Após o fim da cena, o personagem recebe 1 nível de exaustão."},{"n":"Mix Energético Grande","tipo":"Fármaco","custo":3,"d":"Uma pílula robusta e com concentrações extremas de substâncias que recuperam o físico e vigor. Como uma ação bônus, é possível consumir o mix, recuperando 10 pontos de estamina."},{"n":"Ombreiras do Vigor Superior","tipo":"Acessório","custo":3,"d":"Ombreiras que quando usadas em conjunto dos Braceletes do Vigor, trazem todo o potencial de resistência de um feiticeiro. Enquanto estiver utilizando as Ombreiras do Vigor Superior, os seus pontos de vida máximos aumentam em 20."},{"n":"Ornamento Fascinante","tipo":"Acessório","custo":3,"d":"Um ornamento com joias e uma beleza notável, além de um toque do jujutsu para o conceder um aspecto agradável que um acessório não poderia alcançar normalmente. O ornamento aumenta o valor de Presença do usuário em 2, podendo superar o seu limite de atributo, até o máximo de 30."},{"n":"Pingente do Intelecto","tipo":"Acessório","custo":4,"d":"Leve, sutil e coberto de inscrições anciãs, esse pingente aumenta o valor de Inteligência do usuário em 2, podendo superar o seu limite de atributo, até o máximo de 30."},{"n":"Pulseira Primacial","tipo":"Acessório","custo":4,"d":"Uma pulseira especial, a qual consegue levar além uma perícia do usuário. Enquanto estiver usando a pulseira primacial, o usuário se torna mestre em uma perícia a sua escolha, desde que já seja treinado nela."},{"n":"Remédio Complexo","tipo":"Fármaco","custo":4,"d":"Um remédio de criação complexa. Como uma ação comum, é possível consumir o remédio e gastar seus dados de vida para se curar, com um limite igual a doze dados de vida."},{"n":"Terço de Pérolas Carregadas","tipo":"Espiritual","custo":4,"d":"Um terço criado a partir de pérolas carregadas com energia amaldiçoada. Como uma ação bônus, é possível consumir o terço, recuperando 10 pontos de energia amaldiçoada."},{"n":"Veneno Maldito","tipo":"Mistura","custo":4,"d":"Um veneno feito a partir de uma substância semelhante ao sangue de maldições, com propriedades extremamente nocivas. Contato, o alvo ficará Exposto (Envenenado) durante três rodadas. Abaixo estão listados todos os Itens Especiais de custo 4."},{"n":"Antídoto Absoluto","tipo":"Fármaco","custo":4,"d":"Um antídoto absoluto, confeccionado com a mais refinada medicina, capaz de neutralizar qualquer veneno ou toxina. O antídoto pode ser consumido como uma ação bônus, sendo curado da condição envenenado e/ou qualquer veneno de custo 4 ou que venha de uma maldição de primeiro grau ou inferior."},{"n":"Elixir da Vida","tipo":"Espiritual","custo":4,"d":"Sendo o suprassumo da energia amaldiçoada, o elixir da vida incita uma vitalidade sem precedentes naquele que o consumir, usando da essência de várias maldições e junção de energia reversa. Como uma ação bônus, é possível consumir o elixir da vida, podendo usar todos os seus dados de vida para se curar, somando o dobro do seu modificador de constituição em cada um; você recebe vantagem e +5 em testes de resistência de Fortitude pelo resto da cena, assim como em Integridade."},{"n":"Laço da Vida","tipo":"Acessório","custo":4,"d":"Um pequeno laço vermelho, imbuído com quantidades excessivas de energia reversa. Um feiticeiro que tenha o laço preso a si é capaz de se prender a vida: caso um personagem com um laço da vida vá morrer, tal morte é ignorada e o laço se desgasta, sumindo. Ao evitar a morte com este item, o personagem cura metade dos seus pontos de vida, mas recebe 1 nível de exaustão. O Laço da Vida não funciona caso o feiticeiro já esteja com 5 níveis de Exaustão."},{"n":"Lágrima de Shinigami","tipo":"Mistura","custo":4,"d":"O mais letal veneno já conhecido, capaz de imbuir uma arma com tamanha letalidade que passou a ser conhecido como a lágrima de um shinigami. Contato, o alvo perde 2d10 pontos de vida e tem sua Defesa reduzida em 4, e passa a gastar 2 PE adicionais sempre que usar energia amaldiçoada até o final da cena (perde 2d10 de vida, fica Amedrontado e Exposto por 2 rodadas)."},{"n":"Símbolo de Vida Absoluta","tipo":"Talismã","custo":4,"d":"Encravado e entalhado com os símbolos de absoluta saúde e vida, esse símbolo consegue canalizar em sua máxima a vida. Como uma ação livre, é possível o destruir para liberar energia em si mesmo, recuperando todos os seus pontos de vida, até o máximo, além de receber pontos de vida temporários igual ao triplo do seu nível de personagem."},{"n":"Talismã do Ápice","tipo":"Talismã","custo":4,"d":"Um talismã que quando destruído liberta uma quantidade excessiva de energia, a qual é direcionada a um atributo específico do usuário. Ao usar o talismã, o valor de um atributo a sua escolha se torna 30 durante um minuto (10 rodadas dentro de um combate) e ele se quebra."}],"ENC":[{"cat":"Arma","n":"Afiada","d":"A energia amaldiçoada se concentra na lâmina ou ponta da arma, deixando-a mais afiada e perigosa. A arma recebe o traço Fatal d8. Caso a arma já possua o traço, o dado dele aumenta em um nível.","pre":"A arma causa dano cortante ou perfurante"},{"cat":"Arma","n":"Amplificadora","d":"A sua ferramenta amaldiçoada se torna capaz de amplificar a capacidade da sua técnica, seja física ou marcial, estando conectada a ela. Após realizar um ataque com esta arma, o portador causa metade do bônus de treinamento em dados de dano a mais no próximo Feitiço de Dano ou Técnica Marcial de Ataque que cause dano que utilizar até o final do próximo turno (caso ela realize diversos golpes, é aplicado apenas no primeiro). O dano adicional deste Encantamento é considerado Após Ataque.","pre":""},{"cat":"Arma","n":"Armazenadora","d":"A ferramenta amaldiçoada é capaz de guardar energia e deixar a sua disposição. Durante um descanso longo você pode armazenar até 5 PE na arma, não gastando estes pontos de energia pois armazenou eles durante um longo período. Você pode, desde que esteja empunhando a arma, recuperar os cinco pontos de energia armazenados nela. Só é possível recuperar energia amaldiçoada de uma arma armazenadora por vez.","pre":""},{"cat":"Arma","n":"Balanceada","d":"Uma ferramenta perfeitamente balanceada para permitir uma mobilidade maior. Enquanto empunhar a arma você recebe um bônus de +2 em testes de manobras.","pre":""},{"cat":"Arma","n":"Canalizadora","d":"A ferramenta amaldiçoada serve como uma forma de canalizar a sua energia amaldiçoada. Enquanto empunhar a arma, a sua CD Amaldiçoada aumenta em 2.","pre":""},{"cat":"Arma","n":"Cano Alongado","d":"Enquanto modificando e encantando a arma, você estende o cano dela. A arma tem o seu alcance aumentado em 1/4 do total em metros.","pre":"Só pode ser aplicada em armas a distância"},{"cat":"Arma","n":"Certeira","d":"A arma se torna perfeitamente balanceada para golpes certeiros. Reduza a margem de crítico da arma em 1. Uma arma não pode ser certeira e destruidora ao mesmo tempo.","pre":""},{"cat":"Arma","n":"Compartimento","d":"Um compartimento é criado na arma, o qual pode armazenar um item de Mistura que seja um óleo ou um veneno que possa ser aplicado na arma. Durante um combate, você pode usar a arma com a mistura armazenada como uma ação livre, consumindo o veneno ou óleo imediatamente.","pre":""},{"cat":"Arma","n":"Complementar","d":"A arma se torna perfeita para suas capacidades e forças, complementando com eficiência. Enquanto empunhar esta arma o portador da arma recebe +2 na sua CD de Especialização e de Estilo Marcial.","pre":""},{"cat":"Arma","n":"Cruel","d":"A arma passa a ter espinhos e partes que aumentam o perigo dela. Uma arma com esta melhoria recebe +3 em rolagens de dano.","pre":""},{"cat":"Arma","n":"Defensora","d":"Esta arma lhe concede uma capacidade de defesa adicional. A arma recebe o traço de arma: Aparar. Se já possuir o traço o bônus em Defesa fornecido por Aparar aumenta em 1.","pre":"Esta melhoria apenas pode ser aplicada em armas corpo a corpo"},{"cat":"Arma","n":"Destruidora","d":"A arma causa um dado de dano adicional em um acerto crítico. Uma arma não pode ser destruidora e certeira ao mesmo tempo.","pre":""},{"cat":"Arma","n":"Discreta","d":"Uma arma com uma construção fácil de se esconder. Você recebe +5 em rolagens de Furtividade e Prestidigitação para esconder apenas a arma.","pre":""},{"cat":"Arma","n":"Drenadora","d":"A ferramenta se torna capaz de drenar energia de uma criatura após exorcizá-la. Uma vez por turno, ao matar uma criatura que utiliza energia amaldiçoada com esta arma, o portador recebe 2 pontos de energia amaldiçoada temporária para cada grau que a criatura possua (2 para Quarto grau, 4 para Terceiro, 6 para Segundo, 8 para Primeiro e 10 para Especial).","pre":""},{"cat":"Arma","n":"Elemental","d":"A arma é constantemente imbuída com um elemento, até alcançar um ponto em que esse elemento se torna característico dela. Você pode trocar o tipo de dano da arma para um dano elemental à sua escolha. Depois de feita essa escolha não pode ser mudada.","pre":"Ferramenta de Segundo Grau"},{"cat":"Arma","n":"Harmonizada","d":"Uma ferramenta harmonizada com a energia, permitindo que você administre o momentum dos seus golpes entre as suas habilidades. Sempre que acertar um ataque crítico, você reduz em 1 o custo da próxima habilidade que gaste PE ou Pontos de Estamina que você utilizar até o fim do seu próximo turno.","pre":""},{"cat":"Arma","n":"Horrenda","d":"Esta arma possui uma aura macabra e horripilante capaz de assustar até a prole da negatividade humana, as maldições. Enquanto empunhar esta arma toda habilidade que exige um TR e cause Abalado ou Amedrontado tem sua CD aumentada em um valor igual ao bônus de ferramenta da arma. [Pré-requisito: Já possuir outro encantamento.]","pre":""},{"cat":"Arma","n":"Longa","d":"O alcance da arma aumenta em 1,5 metros.","pre":"Esta melhoria apenas pode ser aplicada em armas corpo a corpo"},{"cat":"Arma","n":"Otimizada","d":"Uma arma cujo saque foi otimizado, para ser mais ágil e rápido. Sacar uma arma Otimizada é uma Ação Livre e, enquanto empunhar a arma, o portador recebe +2 em testes de Iniciativa.","pre":""},{"cat":"Arma","n":"Penetrante","d":"Uma ferramenta preparada para penetrar através de resistências. Todo ataque com uma ferramenta penetrante ignora redução de dano em um valor igual ao bônus de treinamento do portador.","pre":""},{"cat":"Arma","n":"Poderosa","d":"Adiciona +2 as rolagens de dano da arma.","pre":"Ter Cruel na arma"},{"cat":"Arma","n":"Potente","d":"Adiciona mais um dado de dano ao dano padrão da arma.","pre":"Primeiro Grau"},{"cat":"Arma","n":"Precisa","d":"A arma foi modificada e trabalhada para permitir um manejo mais preciso. Você recebe um bônus de +2 em jogadas de ataque manejando esta arma.","pre":""},{"cat":"Arma","n":"Reluzente","d":"Sua arma reluz, distraindo o inimigo. Enquanto empunhar esta arma, seu portador recebe +2 em testes para fintar e quando tem um acerto crítico com esta arma contra uma criatura ela deve realizar um TR contra a CD de especialização ou estilo marcial do portador, em uma falha ela fica Desprevenida (e se já estiver, fica Cega) por uma rodada. Enquanto estiver empunhando esta arma ela causa -5 de penalidade em testes de Furtividade em qualquer lugar minimamente iluminado.","pre":""},{"cat":"Arma","n":"Retorno","d":"Este encantamento apenas pode ser posto em uma arma de arremesso. Ao arremessar uma arma com este encantamento, desde que não esteja completamente presa, retorna para a mão do portador logo após completar o ataque.","pre":""},{"cat":"Arma","n":"Sintonizada","d":"Sua ferramenta amaldiçoada é sintonizada para um tipo de elemento em específico, ampliando seus danos. Escolha um tipo de dano, exceto danos físicos ou na alma; sempre que você causar dano desse tipo com algum Feitiço ou Aptidão, até o final do próximo turno, seus ataques com uma arma com este encantamento causam 1d8 de dano adicional do mesmo tipo.","pre":"Ferramenta de Segundo Grau"},{"cat":"Escudo","n":"Avassalador","d":"O escudo é levado ao limite, para ter um impacto avassalador. Caso seja usado para atacar, o dano dele conta como três níveis acima.","pre":"ter Destruidor no escudo"},{"cat":"Escudo","n":"Bloqueador","d":"O escudo é construído de forma a ser maior e mais pesado, permitindo-o bloquear para criaturas atrás de você. Qualquer criatura atrás de você a 1,5 metros recebe os efeitos de Meia Cobertura.","pre":""},{"cat":"Escudo","n":"Destruidor","d":"O escudo é reforçado ainda mais com o intuito de ataques. Caso seja usado para atacar, o dano dele conta como dois níveis acima.","pre":"ter Espinhoso no escudo"},{"cat":"Escudo","n":"Disco","d":"Construído como um disco e feito de materiais mais maleável em sua ponta o permitindo ser arremessado. Este escudo recebe o traço Arremesso (6/18).","pre":"Apenas pode ser colocada em escudos leves e médios"},{"cat":"Escudo","n":"Espinhoso","d":"O escudo tem espinhos colocados. Caso seja usado para atacar, o dano dele conta como um nível acima.","pre":""},{"cat":"Escudo","n":"Esponja","d":"Este escudo possui uma textura gelatinosa que se endurece nos momentos certos. Enquanto empunhar este escudo, sempre que cair ou sofrer dano de uma estrutura, o portador pode gastar sua reação para reduzir o dano recebido em 10. Se for uma ferramenta de segundo grau mude o dano reduzido para 15 e se for de primeiro o dano reduzido se torna 20.","pre":""},{"cat":"Escudo","n":"Expansão de Escudo","d":"Como uma ação bônus, o escudo se fragmenta em uma versão maior dele feito de pura energia. Escolha uma segunda criatura dentro de 1,5 metros para receber os benefícios do escudo.","pre":""},{"cat":"Escudo","n":"Intangível","d":"O escudo se manifesta como uma mera sombra, uma torrente de água sempre em movimento ou qualquer outro meio que permita ao portador mover sua mão com liberdade. Utilizar um escudo com esta propriedade não ocupa a mão do portador para propósitos de habilidades, mas ainda não o permite empunhar ou carregar outros objetos.","pre":""},{"cat":"Escudo","n":"Isolante","d":"A redução de dano do escudo passa também a ser aplicado a um tipo de dano elemental à sua escolha. Esta propriedade pode ser pega diversas vezes para tipos de dano diferentes.","pre":""},{"cat":"Escudo","n":"Polido","d":"O escudo foi polido, removendo pesos desnecessários e o dando uma forma e composição mais leve. A penalidade do escudo é reduzida em 2.","pre":""},{"cat":"Escudo","n":"Reforçado","d":"Recebe 2 de RD adicional contra dano físico.","pre":""},{"cat":"Uniforme","n":"Aeronauta","d":"Seu uniforme possui uma espécie de capa ou tecido extra que lhe permite planar no ar normalmente. Enquanto estiver caindo, como uma reação o portador pode puxar suas roupas e planar no ar, no final dos turnos do portador ele cai apenas 6 metros até chegar ao chão ou alguma superfície.","pre":""},{"cat":"Uniforme","n":"Ajustado","d":"Mesmo com modificações, o uniforme é ajustado perfeitamente para o seu próprio corpo, requerendo um sacrifício menor da agilidade. Ao utilizar um uniforme ajustado, a penalidade dele é reduzida em 1, caso possua. Se o uniforme já possuir 0 de penalidade ele concede um bônus em testes de Furtividade de +2.","pre":""},{"cat":"Uniforme","n":"Blindado","d":"Adiciona-se uma blindagem no uniforme, eliminando as possíveis brechas. A Defesa concedida pelo uniforme aumenta em 2.","pre":""},{"cat":"Uniforme","n":"Distorcivo","d":"Com o uso de uma peculiar imbuição amaldiçoada, a energia distorce o uniforme, permitindo que ele também distorça o espaço. Este Encantamento possui cargas. Uma vez por turno, como uma Ação Livre, você pode usar uma carga para se mover imediatamente para um lugar desocupado dentro de 6 metros, sem permitir ataque de oportunidade, você deve ver ou perceber de forma eficaz para onde se move.","pre":""},{"cat":"Uniforme","n":"Escaldante","d":"Coberto de energia altamente volátil e concentrada, o uniforme se torna quase escaldante, ferindo em caso de contato constante. Uma criatura agarrada ou que esteja agarrando o portador deve realizar um TR contra a CD de Especialização do portador, em uma falha ele receberá Xd6 de perda de vida ou metade disso em um sucesso (onde X é igual a metade do bônus de treinamento). Todo início de turno a criatura deve refazer o TR, recebendo o efeito do encantamento enquanto cumprir as condições dele.","pre":""},{"cat":"Uniforme","n":"Estimulante","d":"O uniforme passa a contar com um compartimento cheio de estimulantes, os quais podem ser diretamente aplicados no usuário. Este Encantamento possui cargas. Você pode gastar uma reação e uma carga para conceder vantagem a uma rolagem de Fortitude, Reflexos ou Vontade que esteja fazendo.","pre":""},{"cat":"Uniforme","n":"Furtivo","d":"Um uniforme que busca ocultar o fluxo de energia de um feiticeiro, além de ser mais fácil de se camuflar e eliminar o barulho de passos. O portador de um uniforme com esta melhoria recebe um bônus em rolagens de Furtividade igual ao custo do uniforme.","pre":""},{"cat":"Uniforme","n":"Impulso","d":"Você propulsiona o uniforme por meio de uma explosão de energia amaldiçoada. Este Encantamento possui cargas. O portador pode gastar uma carga e uma ação de movimento, então ele deve traçar uma linha com tamanho igual ao dobro do movimento dele. Ele se move até o final da linha. Se o movimento do portador por meio da linha passar por uma estrutura, objeto ou criatura ela deve realizar um TR de Reflexos e recebe 1d10 de dano de impacto para cada 6 metros percorrido até ela em uma falha ou metade disso em um sucesso.","pre":"Propulsor"},{"cat":"Uniforme","n":"Isolante","d":"Seu uniforme é feito de materiais únicos, propícios para resistir a altas e baixas temperaturas. Você recebe 5 de RD contra dano Queimante e Congelante.","pre":""},{"cat":"Uniforme","n":"Marcial","d":"Pensado e projetado perfeitamente para artes marciais. Um uniforme marcial concede um bônus de +2 em testes para realizar manobras.","pre":""},{"cat":"Uniforme","n":"Material Pesado","d":"Este uniforme possui mais camadas de tecido, pedaços de metal ou uma capa embutida nele. Este uniforme concede +2 em TRs de Fortitude. [Prérequisito: O uniforme precisa possuir revestimento médio ou robusto]","pre":""},{"cat":"Uniforme","n":"Propulsor","d":"Ao imbuir o uniforme com energia amaldiçoada, o fluxo constante parece acelerar o usuário. Enquanto vestir o uniforme o usuário recebe 3 metros de Deslocamento adicional.","pre":""},{"cat":"Uniforme","n":"Repulsor","d":"Ao armazenar recipientes lotados de energia amaldiçoada, possibilita os descarregar em resposta a uma tentativa de ataque. Este Encantamento possui cargas. Você pode consumir uma carga para, como uma Reação a um ataque corpoa-corpo, liberar um impulso de repulsão à sua volta. Toda criatura a 1,5 metros de você deve realizar um TR de Fortitude contra sua CD de Especialização. Em uma falha ela é empurrada 3 metros na direção contrária do portador, ou metade disso se for bem sucedido.","pre":"A ferramenta precisa ser de pelo menos segundo grau"},{"cat":"Uniforme","n":"Resiliente","d":"O uniforme é melhorado com foco em ser resistente a um tipo específico de danos. Concede redução de dano igual a 5 contra um tipo de dano (exceto os danos físicos, alma e energética). A RD aumenta para 10 se for uma ferramenta de Grau Especial.","pre":""},{"cat":"Uniforme","n":"Revestido com Espinhos","d":"O uniforme é revestido de espinhos. Sempre que o portador de um uniforme com esta Melhoria for alvo de um ataque corpo a corpo e o agressor estiver adjacente ao portador o agressor deve realizar um TR de Fortitude contra a CD de Especialização do portador, em uma falha ele recebe Xd6 + modificador de constituição do portador, de dano perfurante (onde X é igual ao bônus de treinamento) ou metade disso em um sucesso.","pre":""},{"cat":"Uniforme","n":"Ricochete","d":"Emanando uma densa aura, o uniforme passa a poder ricochetear projéteis. Você recebe 20% (2 ou menos em 1d10) de chance de falha contra todo ataque a distância que o tenho como alvo. Este é um Encantamento com cargas. Você pode consumir uma carga para, como uma reação a um ataque a distância, aumentar a porcentagem de falha para 50% (5 ou menos em uma rolagem 1d10) até o começo do seu próximo turno.","pre":""}],"UNI":[{"n":"Revestimento Leve","def":2,"pen":0,"k":1,"d":"Um revestimento leve é colocado no uniforme, concedendo um leve reforço defensivo."},{"n":"Revestimento Médio","def":4,"pen":-2,"k":2,"d":"O uniforme recebe placas e camadas adicionais, o que dá um peso considerável."},{"n":"Revestimento Robusto","def":6,"pen":-4,"k":3,"d":"Revestimento pesado, com placas fortes e camadas densas, com peso equivalente ao de uma armadura ou colete."},{"n":"Sob Medida","def":1,"pen":0,"k":2,"d":"Uniforme feito sob medida: você recebe +2 em testes de Acrobacia e Furtividade."}],"ESC":[{"n":"Escudo Pequeno","dano":"1d3","rd":2,"pen":0,"k":2,"d":"Otimizado para ser preso ao braço, mantendo uma mão livre; não ocupa uma das suas mãos."},{"n":"Escudo Leve","dano":"1d4","rd":2,"pen":-1,"k":1,"d":"Pequeno e leve, auxilia na defesa de golpes mais simples."},{"n":"Escudo Médio","dano":"1d6","rd":4,"pen":-2,"k":2,"d":"Equilibra boa defesa com um sacrifício mediano de agilidade."},{"n":"Escudo Pesado","dano":"1d8","rd":6,"pen":-4,"k":3,"d":"Maior e pesado, cobre boa parte do corpo, com dificuldade no manejo."}],"GRAU":{"Arma":[["Quarto","+1 de dano","—"],["Terceiro","+2 de dano","1 Encantamento"],["Segundo","+3 de dano","1 Encantamento"],["Primeiro","+4 de dano","2 Encantamentos"],["Especial","+5 de dano","Habilidade única"]],"Escudo":[["Quarto","RD físico 1","—"],["Terceiro","RD físico 2","1 Encantamento"],["Segundo","RD físico 3","1 Encantamento"],["Primeiro","RD físico 4","1 Encantamento"],["Especial","RD físico 5","Habilidade única"]],"Uniforme":[["Quarto","—","1 Encantamento"],["Terceiro","—","1 Encantamento"],["Segundo","—","1 Encantamento"],["Primeiro","—","1 Encantamento"],["Especial","—","Habilidade única"]]},"ESP":[{"n":"Lâmina da Totalidade","tipo":"espada longa","props":"certeira, harmonizada, longa e sintonizada","hab":"Totalidade Elemental","d":"sempre que realizar um ataque com a lâmina da totalidade você pode, como parte do ataque, escolher qualquer tipo de dano elemental para se tornar o tipo de dano causado por ela. Essa mudança também muda com qual tipo de dano a propriedade sintonizada está ligada.","fonte":"Enciclopédia","flav":"Uma espada cuja lâmina parece esbanjar todas as cores possíveis de se imaginar, estendendo-se para as receber."},{"n":"Véu da Noite","tipo":"adaga","props":"certeira, discreta, fidedigna e infalível","hab":"Véu Noturno","d":"o portador pode escolher, como uma ação bônus, cobrir-se com um manto de escuridão completa, tornando-se invisível por 1 minuto. Após usar essa habilidade, você não pode a usar novamente até a próxima noite.","fonte":"Enciclopédia","flav":"Uma pequena adaga completamente negra como o céu noturno."},{"n":"Égida do Vigia","tipo":"escudo pesado","props":"isolante (2x) e reforçado","hab":"Proteção Vigilante","d":"o portador do escudo, como uma ação bônus, pode fazer com que ele expanda uma aura calorosa de proteção, concedendo a RD do escudo para todos os aliados dentro de 4,5 metros, além de transformar a RD em redução contra qualquer tipo de dano. ARMADURAS/UNIFORMES DE GRAU ESPECIAL Nesta seção serão colocadas exclusivamente armaduras de grau especial, que possuem todos uma habilidade única, além de várias propriedades. Caso esteja utilizando uniformes ao invés de armaduras, pode-se utilizar as mesmas habilidades, apenas alterando para se encaixar neles.","fonte":"Enciclopédia","flav":"Um escudo chamativo, em sua maioria dourado, com aspecto firme e um pequeno brilho constante. O Égide Do Vigia é um escudo pesado de grau especial, com as seguintes propriedades: isolante (2x) e refor"},{"n":"Couraça do Guardião","tipo":"armadura massiva","props":"armadura de espinhos, blindada e resiliente","hab":"Ligação Protetiva","d":"uma pessoa vestindo a couraça do guardião pode escolher uma pessoa para estabelecer uma ligação protetiva com; todo dano causado contra a criatura com a qual a ligação esteja estabelecida é reduzida pela metade e direcionada para o usuário da armadura.","fonte":"Enciclopédia","flav":"Uma armadura extremamente pesada, a qual parece ter sido esculpida diretamente da pedra, exigindo força e vontade para se vestir."},{"n":"Manto Célere","tipo":"armadura ágil","props":"distorciva, furtiva e propulsora","hab":"Agilidade Superior","d":"uma pessoa vestindo o manto célere tem os seus reflexos apurados, tornando-se mais ágil, assim recebendo uma reação adicional por rodada.","fonte":"Enciclopédia","flav":"Um manto tão leve quanto o vento, quase imperceptível aos olhos. O Manto Célere é uma armadura ágil de grau especial, com as seguintes propriedades: distorciva, furtiva e propulsora. Sua habilidade es"},{"n":"Nuvem Brincalhona","tipo":"Nunchaku Pesado","props":"Encantamentos: Amplificadora, Balanceada, Destruidora e Potente","hab":"Potência Incomparável","d":"Para cada ponto em seu Modificador de Força, seus ataques com a Nuvem Brincalhona têm o dano aumentado em 1 nível. É a única Ferramenta Amaldiçoada de grau especial que não possui um Feitiço, dependendo da força bruta do usuário.","fonte":"Livro Básico","flav":"Um bastão dividido em três seções, conectadas por anéis entre as juntas."}]},"NIV":{"Lutador":{"r":{"1":"Habilidade Base – Corpo Treinado e Empolgação","2":"Reflexo Evasivo, Habilidade de Lutador","3":"Habilidade de Lutador","4":"2 Pontos de Atributo, Habilidade de Lutador","5":"Gosto pela Luta, Habilidade de Lutador","6":"Habilidade de Lutador","7":"Habilidade de Lutador","8":"2 Pontos de Atributo, Habilidade de Lutador","9":"Habilidade de Lutador","10":"Habilidade de Lutador","11":"Habilidade de Lutador","12":"2 Pontos de Atributo, Habilidade de Lutador","13":"Habilidade de Lutador","14":"Habilidade de Lutador","15":"Habilidade de Lutador","16":"2 Pontos de Atributo, Habilidade de Lutador","17":"Habilidade de Lutador","18":"Habilidade de Lutador","19":"Habilidade de Lutador","20":"Lutador Superior, 2 Pontos de Atributo, Habilidade de Lutador"},"n":["Ao invés de uma Habilidade de Lutador, você pode escolher receber um Talento.","Sempre que subir de nível, você recebe também uma aptidão amaldiçoada.","No 10º nível você se torna mestre em uma perícia a sua escolha.","Nos níveis 5, 9, 13 e 17 seu bônus de treinamento aumenta em +1."]},"Especialista em Combate":{"r":{"1":"Habilidade Base – Repertório do Especialista e Artes do Combate","2":"Habilidade de Especialista em Com  const Habilidades=()=>{
  const q=busca.toLowerCase(),esp=fe.esp||f.esp,mh=fm.hm==="minhas",pt=fm.pt||"poderes",KIND={hab:"Habilidades",tal:"Talentos",apt:"Aptidões"};
  const tem=(k,n,e)=>f.habs.some(h=>(h.k||"hab")===k&&h.n===n&&(k!=="hab"||h.e===e));
  const flt=a=>a.filter(x=>!q||x.n.toLowerCase().includes(q)||(x.d||"").toLowerCase().includes(q));
  const Tec=(o)=>{const L=[["Execução",o.execucao],["Custo",o.custo],["Alcance",o.alcance],["Gatilho",o.gatilho],["Pré-requisito",o.pre]].filter(x=>x[1]);return L.length>0&&<dl className="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1 text-xs bg-[#161626] rounded-lg p-2">{L.map(([a,b])=><div key={a}><dt className="inline text-gray-500">{a}: </dt><dd className="inline text-gray-200">{b}</dd></div>)}</dl>};
  const Item=(key,o,badge,bloq,idx)=><details key={key} className="group bg-[#12121f] border border-[#26263f] rounded-lg">
   <summary className="cursor-pointer list-none flex items-center justify-between gap-2 p-3">
    <span className="flex items-center gap-2 min-w-0 flex-wrap"><span className="text-violet-400 group-open:rotate-180 transition-transform">▾</span><b>{tc(o.n)}</b><ExecChip v={o.execucao}/></span>
    <span className="flex items-center gap-2 shrink-0">{o.custo&&<span className="text-xs font-bold text-violet-300 whitespace-nowrap">{o.custo}</span>}
     {idx==null?<button disabled={tem(o.k,o.n,o.e)||bloq} onClick={ev=>{ev.preventDefault();set("habs",[...f.habs,o])}} className="text-xs px-2 py-1 rounded bg-violet-600 disabled:bg-[#26263f] disabled:text-gray-500">{tem(o.k,o.n,o.e)?"Adicionada":bloq?"Nível "+o.l:"+ Adicionar"}</button>
      :<button className="text-red-300 text-xs" onClick={ev=>{ev.preventDefault();set("habs",f.habs.filter((_,j)=>j!==idx))}}>Remover</button>}</span></summary>
   <div className="px-3 pb-3 space-y-2"><div className="flex flex-wrap gap-1"><span className="px-2 py-0.5 rounded-full border border-[#3a3a3a] bg-[#222] text-[11px]">{badge}</span></div>{Tec(o)}<p className="text-sm text-gray-300 leading-relaxed">{o.d}</p></div></details>;
  const bd=o=>o.k==="hab"?(o.b?"Base":"Poder de Classe")+(o.l>1?" · Nível "+o.l:"")+" · "+o.e:(o.k==="tal"?"Talento · ":"Aptidão · ")+o.e;
  const tabBtn=(k,n)=><button key={k} onClick={()=>setSub(k)} className={"flex-1 py-2 rounded-lg text-sm font-semibold "+(sub===k?"bg-violet-600 text-white":"bg-[#161616] border border-[#2a2a2a] text-gray-300")}>{n}</button>;
  const Chip=(on,t,fn)=><button key={t} onClick={fn} className={"px-3 py-1 rounded-full text-xs "+(on?"bg-violet-600 text-white":"bg-[#161616] text-gray-300 border border-[#2a2a2a]")}>{t}</button>;
  const HABS=(DB.HAB[esp]||[]).map(x=>({...x,k:"hab",e:esp}));
  let lista=[];
  if(!mh){
   if(sub==="base")lista=flt(HABS.filter(x=>x.b)).map((x,i)=>Item("b"+i,x,bd(x),x.l>nivel));
   else if(sub==="poderes"){
    if(pt==="poderes")lista=flt(HABS.filter(x=>!x.b&&(!fm.lv||x.l===fm.lv))).map((x,i)=>Item("p"+i,x,bd(x),x.l>nivel));
    else if(pt==="tal")lista=flt(DB.TAL.filter(t=>!fm.tc||t.c===fm.tc)).map((t,i)=>Item("t"+i,{k:"tal",e:t.c,l:0,n:t.n,d:t.d},bd({k:"tal",e:t.c}),false));
    else lista=flt(DB.APT.filter(t=>!fm.ac||t.c===fm.ac)).map((t,i)=>Item("a"+i,{k:"apt",e:t.c,l:0,n:t.n,d:t.d,pre:t.pre||""},bd({k:"apt",e:t.c}),false));
   }
  }else{
   const L=f.habs.map((h,i)=>({...h,k:h.k||"hab",i}));
   const sel=sub==="base"?L.filter(h=>h.k==="hab"&&h.b):pt==="poderes"?L.filter(h=>h.k==="hab"&&!h.b):L.filter(h=>h.k===pt);
   lista=sel.map(h=>Item("m"+h.i,h,h.l===0&&h.e==="Própria"?"Própria":bd(h),false,h.i));
  }
  const levels=[...new Set(HABS.filter(x=>!x.b).map(h=>h.l))].sort((a,b)=>a-b);
  if(sub==="feiticos")return <div className="space-y-3"><div className="flex gap-1">{tabBtn("base","Habilidades de Base")}{tabBtn("poderes","Poderes de Classe")}</div></div>;
  return <div className="space-y-3">
   <div className="flex gap-1">{tabBtn("base","Habilidades de Base")}{tabBtn("poderes","Poderes de Classe")}</div>
   <div className="flex flex-wrap gap-2 items-center">
    {(sub==="base"||pt==="poderes")&&<select value={esp} onChange={e=>setFe({...fe,esp:e.target.value})}>{Object.keys(DB.HAB).map(k=><option key={k}>{k}</option>)}</select>}
    <input className="flex-1 min-w-[10rem]" placeholder="Buscar por nome ou texto..." value={busca} onChange={e=>setBusca(e.target.value)}/>
    {Chip(!mh,"Compêndio",()=>setFm({...fm,hm:"todas"}))}{Chip(mh,"Minhas ("+f.habs.length+")",()=>setFm({...fm,hm:"minhas"}))}
   </div>
   {sub==="poderes"&&<div className="flex flex-wrap gap-1">{[["poderes","Poderes"],["tal","Talentos"],["apt","Aptidões"]].map(([k,n])=>Chip(pt===k,n,()=>setFm({...fm,pt:k})))}</div>}
   {sub==="poderes"&&!mh&&pt==="poderes"&&<div className="flex flex-wrap gap-1">{[0,...levels].map(n=>Chip((fm.lv||0)===n,n===0?"Todos":"Nív. "+n,()=>setFm({...fm,lv:n})))}</div>}
   {sub==="poderes"&&!mh&&pt==="tal"&&<div className="flex gap-1">{["","Geral","Origem"].map(c=>Chip((fm.tc||"")===c,c||"Todos",()=>setFm({...fm,tc:c})))}</div>}
   {sub==="poderes"&&!mh&&pt==="apt"&&<div className="flex flex-wrap gap-1">{["","Aura","Controle e Leitura","Domínio","Barreira","Energia Reversa","Especiais","Adicionais"].map(c=>Chip((fm.ac||"")===c,c||"Todas",()=>setFm({...fm,ac:c})))}</div>}
   <p className="text-xs text-gray-500">{lista.length} item(ns). Os chips coloridos mostram como a habilidade é executada. Toque para ver custo, alcance, gatilho e o efeito. Habilidades só podem ser adicionadas até o seu nível.</p>
   <div className="grid md:grid-cols-2 gap-1 items-start">{lista}</div>
   {mh&&sub==="poderes"&&pt==="poderes"&&<div className="flex flex-wrap gap-2"><input className="flex-1 min-w-[8rem]" placeholder="Habilidade própria" value={f.custom.n} onChange={e=>set("custom",{...f.custom,n:e.target.value})}/><input className="flex-[2] min-w-[10rem]" placeholder="Efeito" value={f.custom.d} onChange={e=>set("custom",{...f.custom,d:e.target.value})}/><button className={BTN} onClick={()=>{if(f.custom.n.trim())setF(p=>({...p,habs:[...p.habs,{k:"hab",e:"Própria",l:0,n:p.custom.n,d:p.custom.d}],custom:{n:"",d:""}}))}}>Adicionar própria</button></div>}
  </div>};

 const Avatar=(sz)=>f.retrato?<img src={f.retrato} alt="" style={{width:sz,height:sz,borderColor:"var(--acc)"}} className="selo rounded-full object-cover object-top bg-white shrink-0"/>:<span style={{width:sz,height:sz,color:"var(--acc)",borderColor:"var(--acc)"}} className="selo rounded-full bg-[#12121f] flex items-center justify-center shrink-0"><Emblema k={f.esp} s={Math.round(sz*0.6)}/></span>;
 const LevelUp=()=>{
  const N=nivel+1,T=DB.NIV[f.esp]||{r:{},n:[]},row=T.r[N]||"",ptsTot=/2 Pontos de Atributo/i.test(row)?2:0,usados=Object.values(lv.pts).reduce((a,b)=>a+b,0);
  const at2={...f.attrs};ATTRS.forEach(([k])=>at2[k]=f.attrs[k]+(lv.pts[k]||0));
  const lim=k=>f.esp==="Restringido"&&["FOR","DES","CON"].includes(k)?30:20;
  const fx=VIDA[f.esp][2],dPV=Math.max(1,fx+mod(at2.CON)),dPE=PEN[f.esp],dEs=f.esp==="Restringido"?4:0,cota=Math.floor(N/2)+(N>=10?1:0)+(N>=20?1:0),cotaAnt=Math.floor(nivel/2)+(nivel>=10?1:0)+(nivel>=20?1:0);
  const novas=(DB.HAB[f.esp]||[]).filter(h=>(lv.prev?h.l<=N:h.l===N)&&!f.habs.some(x=>x.n===h.n&&x.e===f.esp&&(x.k||"hab")==="hab"));
  const confirmar=()=>{if(ptsTot&&usados!==ptsTot){alert("Distribua os "+ptsTot+" pontos de atributo.");return}
   const adds=novas.filter(h=>lv.sel.includes(h.n)).map(h=>({k:"hab",e:f.esp,l:h.l,n:h.n,d:h.d,custo:h.custo,execucao:h.execucao,alcance:h.alcance,gatilho:h.gatilho,pre:h.pre,b:h.b}));
   setF(p=>({...p,nivel:N,attrs:at2,pv:[p.pv[0]+dPV,p.pv[1]+dPV],pe:[p.pe[0]+dPE,p.pe[1]+dPE],est:[p.est[0]+dEs,p.est[1]+dEs],habs:[...p.habs,...adds]}));setLv(null)};
  return <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-3" onClick={()=>setLv(null)}><div className="bg-[#14142a] border border-violet-500 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-4 space-y-3 text-sm" onClick={e=>e.stopPropagation()}>
   {nivel>=20?<><h2 className="text-lg font-bold">Nível máximo</h2><p className="text-gray-300">Seu personagem já está no nível 20.</p><button className={BTN} onClick={()=>setLv(null)}>Fechar</button></>:<>
   <h2 className="text-lg font-bold">Subir para o nível {N}</h2>
   <section className="bg-[#161626] rounded-lg p-3 space-y-1"><b className="text-violet-300">Ganhos do nível {N} ({f.esp})</b><p>{row||"—"}</p></section>
   <section className="space-y-1"><b>Automático</b>
    <p className="text-gray-300">PV máximo +{dPV} ({f.pv[1]} → {f.pv[1]+dPV}) · {f.esp==="Restringido"?"Estamina +"+dEs+" ("+f.est[1]+" → "+(f.est[1]+dEs)+")":"PE máximo +"+dPE+" ("+f.pe[1]+" → "+(f.pe[1]+dPE)+")"} · Dados de vida {N}</p>
    {bt(N)!==B&&<p className="text-emerald-300">Bônus de treinamento sobe: +{B} → +{bt(N)}</p>}
    {cota>cotaAnt&&<p className="text-gray-300">Você recebe um novo Feitiço (cota base {cota}). Adicione na aba Feitiços.</p>}
    {N===10&&<p className="text-gray-300">Você se torna mestre em uma perícia à sua escolha (aba Perícias, toque no grau).</p>}
    <p className="text-gray-300">Aptidão amaldiçoada: o livro concede uma a cada nível (veja em Habilidades → Poderes de Classe → Aptidões).</p></section>
   {ptsTot>0&&<section className="space-y-1"><b>Pontos de atributo: <span className={usados===ptsTot?"text-emerald-400":"text-amber-300"}>{ptsTot-usados} restante(s)</span></b>
    <div className="grid grid-cols-3 gap-2">{ATTRS.map(([k])=><div key={k} className="bg-[#161626] rounded-lg p-2 text-center"><div className="text-xs text-gray-400">{k}</div><div className="font-bold">{f.attrs[k]}{(lv.pts[k]||0)>0&&<span className="text-emerald-400"> → {at2[k]}</span>}</div>
     <div className="flex justify-center gap-1 mt-1"><button className="w-7 h-7 rounded bg-[#26263f]" onClick={()=>setLv({...lv,pts:{...lv.pts,[k]:Math.max(0,(lv.pts[k]||0)-1)}})}>−</button><button className="w-7 h-7 rounded bg-[#26263f] disabled:opacity-40" disabled={usados>=ptsTot||at2[k]>=lim(k)} onClick={()=>setLv({...lv,pts:{...lv.pts,[k]:(lv.pts[k]||0)+1}})}>+</button></div></div>)}</div></section>}
   <section className="space-y-1"><div className="flex items-center justify-between"><b>Habilidades de {f.esp}</b><label className="text-xs text-gray-400 flex items-center gap-1"><input type="checkbox" style={{minWidth:"auto"}} checked={lv.prev} onChange={e=>setLv({...lv,prev:e.target.checked})}/>incluir níveis anteriores</label></div>

  </section>

  <section className="grid grid-cols-3 sm:grid-cols-6 gap-2 text-center">
   {[["Bônus Treino",sg(B)],["Defesa",defesa],["Atenção",atencao],["Deslocamento",(f.desloc-(sobre?4.5:0))+" m"],["Integridade Alma",f.pv[1]],["Iniciativa",sg(M("DES")+num(f.iniOutros))]].map(([l,v])=>
    <div key={l} className="bg-[#12121f] border border-[#26263f] rounded-xl p-2"><div className="text-[11px] text-gray-400">{l}</div><div className="text-xl font-bold">{v}</div></div>)}
  </section>
  <div className="flex flex-wrap gap-3 text-xs text-gray-400 items-center">
   <label>Outros Defesa <input type="number" className="w-14" value={f.defOutros} onChange={e=>set("defOutros",e.target.value)}/></label>
   <label>Outros Iniciativa <input type="number" className="w-14" value={f.iniOutros} onChange={e=>set("iniOutros",e.target.value)}/></label>
   <label>Deslocamento (m) <input type="number" className="w-14" value={f.desloc} onChange={e=>set("desloc",num(e.target.value))}/></label>
   <span className="flex items-center gap-1">Rolar Iniciativa <DiceBtn onClick={()=>rolar("Iniciativa",[["Mod. DES",M("DES")],...(num(f.iniOutros)?[["Outros",num(f.iniOutros)]]:[])])}/></span>
  </div>

  <section>
   <h2 className="font-bold mb-2">Atributos</h2>
   <div className="grid grid-cols-3 md:grid-cols-6 gap-2">
    {ATTRS.map(([k,n])=><div key={k} className="bg-[#12121f] border border-[#26263f] rounded-xl p-2 text-center">
     <div className="text-xs text-gray-400">{n}</div>
     <div className="text-2xl font-black text-violet-300">{sg(M(k))}</div>
     <div className="flex items-center justify-center gap-1 mt-1">
      <button className="w-6 h-6 rounded bg-[#26263f]" onClick={()=>set("attrs",{...f.attrs,[k]:Math.max(1,f.attrs[k]-1)})}>−</button>
      <input type="number" className="w-12 text-center" value={f.attrs[k]} onChange={e=>set("attrs",{...f.attrs,[k]:Math.max(1,Math.min(30,num(e.target.value)))})}/>
      <button className="w-6 h-6 rounded bg-[#26263f]" onClick={()=>set("attrs",{...f.attrs,[k]:Math.min(30,f.attrs[k]+1)})}>+</button>
     </div>
     <div className="text-[11px] text-gray-500 mt-1">{k}</div>
    </div>)}
   </div>
  </section>

  <div className="grid md:grid-cols-2 gap-4">
   <section>
    <h2 className="font-bold mb-2">Testes de Resistência</h2>
    <div className="space-y-1">
     {TRS.map(([n,a])=>{const g=f.graus["TR:"+n]||0,o=num(f.outros["TR:"+n]);
      return <div key={n} className="flex items-center gap-2 bg-[#12121f] border border-[#26263f] rounded-lg p-2">
       <button onClick={()=>set("graus",{...f.graus,["TR:"+n]:(g+1)%3})} className={"text-[11px] w-20 rounded py-1 "+(g===2?"bg-amber-500 text-black":g===1?"bg-violet-700":"bg-[#26263f] text-gray-400")}>{GRAUS[g]}</button>
       <div className="flex-1"><b>{n}</b> <span className="text-xs text-gray-400">({a})</span></div>
       <input type="number" title="Outros bônus" className="w-12 text-center" value={f.outros["TR:"+n]||0} onChange={e=>set("outros",{...f.outros,["TR:"+n]:e.target.value})}/>
       <span className="w-10 text-right font-bold">{sg(M(a)+meio+bonusGrau(g)+o)}</span>
       <DiceBtn onClick={()=>rolar("TR "+n,partesBase(a,g,o))}/>
      </div>})}
    </div>
   </section>

   <section>
    <h2 className="font-bold mb-2">Histórico</h2>
    <div className="space-y-1 text-sm max-h-72 overflow-y-auto">
     {hist.length===0&&<p className="text-gray-500">Nenhuma rolagem ainda.</p>}
     {hist.map((h,i)=><div key={i} className="flex justify-between bg-[#12121f] border border-[#26263f] rounded-lg px-3 py-1.5">
      <span>{h.nome}</span><span className="text-gray-400">{h.semD20?"dano":"d20 "+h.dado}{h.dados?` [${h.dados.join(",")}]`:""}</span><b className={h.dado===20?"text-emerald-400":h.dado===1?"text-red-400":""}>{h.total}</b></div>)}
    </div>
   </section>
  </div>

  </>}
  {tab==="pericias"&&<>
  <section>
   <h2 className="font-bold mb-1">Perícias</h2>
   <p className="text-xs text-gray-400 mb-2">Clique no grau para alternar Destreinado → Treinado → Mestre. Bônus = Mod. do atributo + ½ nível + treinamento (Mestre = 1,5× o bônus) + outros.</p>
   <div className="grid md:grid-cols-2 gap-1">
    {PERICIAS.map(([n,a,req,comp])=>{const g=f.graus[n]||0,o=num(f.outros[n]),bloq=req&&g===0;
     return <div key={n} className="flex items-center gap-2 bg-[#12121f] border border-[#26263f] rounded-lg p-2">
      <button onClick={()=>set("graus",{...f.graus,[n]:(g+1)%3})} className={"text-[11px] w-20 rounded py-1 "+(g===2?"bg-amber-500 text-black":g===1?"bg-violet-700":"bg-[#26263f] text-gray-400")}>{GRAUS[g]}</button>
      <div className="flex-1 leading-tight"><b>{n}</b> <span className="text-xs text-gray-400">({a})</span>
       <div className="text-[10px] text-gray-500">{req?"requer treino ":""}{comp?"· complementar":""}</div></div>
      <input type="number" title="Outros bônus" className="w-12 text-center" value={f.outros[n]||0} onChange={e=>set("outros",{...f.outros,[n]:e.target.value})}/>
      <span className="w-10 text-right font-bold">{sg(M(a)+meio+bonusGrau(g)+o)}</span>
      <DiceBtn onClick={()=>rolar(n,partesBase(a,g,o),bloq?"Esta perícia exige treinamento segundo o livro.":null)}/>
     </div>})}
   </div>
  </section>
  </>}
  <p className="text-xs text-gray-500 pb-6">Salvo automaticamente neste navegador (localStorage). Regras: Feiticeiros &amp; Maldições v2.5.2.</p>

  {lv&&LevelUp()}
  {res&&<div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50" onClick={()=>setRes(null)}>
   <div className="bg-[#14142a] border border-violet-500 rounded-2xl p-5 w-full max-w-sm text-center" onClick={e=>e.stopPropagation()}>
    <div className="text-sm text-gray-400">{res.nome}{res.modo&&res.modo!=="normal"&&" · "+res.modo}</div>
    <div className={"text-6xl font-black my-2 "+(res.total&&res.dado===20?"text-emerald-400":res.dado===1?"text-red-400":"text-white")}>{res.semTotal?"—":res.total}</div>
    {(res.tag||(res.dado===20?"20 natural!":res.dado===1?"1 natural":null))&&<div className={"text-sm font-bold "+(res.dado===1?"text-red-400":"text-emerald-400")}>{res.tag||(res.dado===20?"20 natural!":"1 natural")}</div>}
    
    <div className="mt-2 text-sm space-y-1">
     {!res.semD20&&<div>d20: <b>{res.dado}</b>{res.dados&&<span className="text-gray-400"> (dados: {res.dados.join(" e ")})</span>}</div>}
     {res.partes.map(([l,v],i)=><div key={i} className="text-gray-300">{l}: <b>{sg(v)}</b></div>)}
     {(res.linhas||[]).map((l,i)=><div key={"l"+i} className="text-violet-200">{l}</div>)}
    </div>
    {res.aviso&&<div className="mt-3 text-xs text-amber-300">{res.aviso}</div>}
    <button className="mt-4 px-4 py-2 rounded-lg bg-violet-600" onClick={()=>setRes(null)}>Fechar</button>
   </div>
  </div>}
 </div></>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
