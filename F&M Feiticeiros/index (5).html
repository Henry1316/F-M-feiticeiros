içoada, você recebe +2 na rolagem. Nos níveis 10 e 20 esse bônus aumenta em +1. Seu máximo de energia amaldiçoada é diminuído em 2."},{"tec":"Nulificação de Técnicas","n":"VÉU ABENÇOADO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"2 Criaturas","dur":"Imediata","area":"","custo":"","d":"Você forma dois véus de luz, cobrindo criaturas a sua escolha. As duas criaturas recebem 2d6 em pontos de vida temporários."},{"tec":"Nulificação de Técnicas","n":"CRUZ CELESTE","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Uma Maldição","dur":"Imediata","area":"","custo":"","d":"Você concentra luz na forma de uma cruz afiada, forçando-a cair como uma lâmina sobre uma maldição. A maldição alvo deve realizar um teste de resistência de Reflexos, recebendo 4d8 de dano radiante, ou apenas metade em um sucesso. Uma maldição que falhe no teste também recebe a condição Amedrontado por 1 rodada, sentindo o peso da luz purificadora."},{"tec":"Nulificação de Técnicas","n":"GUARDA DE QUERUBINS","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"","dur":"Sustentada","area":"","custo":"","d":"Você forma uma guarda de querubins, pequenos anjos com faces esqueléticas, para proteger os seus aliados. 3 querubins são criados, e você pode dividi-los como desejar entre seus aliados dentro de 12 metros. Para cada querubim protegendo uma criatura, ela recebe +2 de CA e 2 de RD. A cada rodada após a primeira, você deve pagar 1 ponto de energia amaldiçoada para sustentar."},{"tec":"Nulificação de Técnicas","n":"PURIFICAR","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Toque","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você toca uma criatura e utiliza da sua luz para a purificar de uma limitação. Ao tocar uma criatura, você pode remover uma condição que tenha sido causada por uma habilidade de energia amaldiçoada, removendo-a do corpo."},{"tec":"Nulificação de Técnicas","n":"DISSIPAR O MALDITO","nv":3,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"24 Metros","alvo":"","dur":"Imediata","area":"6 Metros","custo":"","d":"Você cria uma enorme esfera de luz, liberando-a para se espalhar por uma área esférica de 6 metros, a partir de um ponto a sua escolha dentro de 24 metros. Todas as formações compostas de energia, como barreiras e cortinas dentro da área são dissipadas ou destruídas, assim como qualquer habilidade de energia amaldiçoada concentrada ou sustentada será cancelada. Caso uma expansão de domínio seja afetada por essa habilidade, ela não é destruída, mas fica vulnerável a dano durante uma rodada."},{"tec":"Nulificação de Técnicas","n":"EXPLOSÃO LUMINOSA","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"","dur":"Imediata","area":"9 Metros","custo":"","d":"Você causa uma explosão de luz, a partir de um ponto a sua escolha dentro de 24 metros. A explosão se espalha em uma área esférica de 9 metros. Toda maldição dentro da área afetada deve realizar um teste de resistência de Fortitude, recebendo 2d12 de dano radiante ou apenas metade em um sucesso. Uma maldição que falhar no teste também recebe a condição cego por 1 rodada."},{"tec":"Nulificação de Técnicas","n":"O SOM DA SALVAÇÃO","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"","dur":"Imediata","area":"6 Metros","custo":"","d":"Você cria um instrumento e produz uma melodia suave e harmônica, alcançando uma área de 6 metros a partir de você. Todos os seus aliados dentro da área recebem 4d10 pontos de vida temporários. Além disso, todos os aliados afetados podem adicionar o seu modificador principal de técnica nas três próximas rolagens que realizarem."},{"tec":"Nulificação de Técnicas","n":"MELODIA DA PURIFICAÇÃO","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"","dur":"Imediata","area":"9 Metros","custo":"","d":"Você forma um instrumento de luz para tocar uma melodia que antecede a purificação do mal. Após tocar a melodia, várias cruzes se manifestam na área afetada, cortando e queimando qualquer maldição dentro da área esférica. Toda maldição afetada deve realizar um teste de resistência de Fortitude, recebendo 2d10 de dano radiante ou apenas metade em um sucesso. Caso falhe, a maldição também recebe as condições Fragilizado e Exposto por duas rodadas. No final de todo turno dela, uma maldição pode repetir o teste, livrando-se antecipadamente das condições em um sucesso."},{"tec":"Nulificação de Técnicas","n":"O PESO AVASSALADOR DO PECADO","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"30 Metros","alvo":"Uma Maldição","dur":"Imediata","area":"","custo":"","d":"Você consome uma maldição completamente com luz, forçando-a a sentir o peso devastador de sua existência. A maldição afetada deve realizar um teste de resistência de Vontade. Caso suceda, a maldição recebe as condições Amedrontado 1 rodada e Desorientado por 2 rodadas. Caso falhe, ela recebe também as condições Fragilizado por 2 rodadas e Paralisado por 1 rodada. No final de todo turno dela, uma maldição pode repetir o teste, livrando-se antecipadamente de condições ativas em um sucesso."},{"tec":"Nulificação de Técnicas","n":"ESCADA DE JACÓ","nv":5,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"30 Metros","alvo":"","dur":"Imediata","area":"18 Metros","custo":"","d":"Você cria um trompete de luz, ao mesmo momento que manifesta um ciclo de luz no céu com vários sigilos mágicos. Ao soar o trompete, o ciclo dispara uma grande quantidade de luz na forma de uma área cilíndrica de 18 metros, extinguindo toda a energia amaldiçoada que ali estiver. Toda estrutura de energia dentro da área é instantaneamente dissipada e destruída; qualquer objeto amaldiçoado dentro da área tem o seu efeito anulado e negado durante 2 rodadas; qualquer condição, efeito ou habilidade causada por energia amaldiçoada é extinguida e uma maldição dentro da área realiza um teste de resistência de Fortitude, recebendo 4d12 de dano radiante, o qual ignora qualquer fonte de imunidade, resistência ou redução de danos, ou apenas metade em um sucesso."},{"tec":"Nulificação de Técnicas","n":"JARDIM DE ÉDEN","nv":5,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"","dur":"Sustentada","area":"12 Metros","custo":"","d":"Você espalha luz purificadora de maneira a criar um recinto coberto por ela, onde a energia amaldiçoada é constantemente rejeitada. Maldições não podem entrar voluntariamente na área, assim como nenhuma habilidade dependente de energia amaldiçoada pode ser utilizada dentro dela; enquanto dentro da área, qualquer ferramenta ou objeto amaldiçoado se torna um item mundano. Uma maldição que seja forçada a entrar na área deve realizar um teste de resistência de Fortitude, recebendo 8d12 de dano radiante, além da área contar como terreno difícil. Para cada rodada após a primeira, você deve pagar 2 pontos de energia para sustentar.\n\n▸ Habilidades Adicionais\nAqui você pode encontrar uma variante de liberação máxima para a habilidade Escada de Jacó, utilizada durante a obra. Segue as regras para Liberação Máxima encontrada no Capítulo 8: Guia de Criação Avançado."},{"tec":"Nulificação de Técnicas","n":"LIBERAÇÃO MÁXIMA: ESCADA DE JACÓ","nv":5,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"30 Metros","alvo":"","dur":"Imediata","area":"24 Metros","custo":"30 PE","d":"Você cria um trompete de luz com o máximo de energia, ao mesmo momento que manifesta um ciclo de luz no céu com vários sigilos mágicos radiantes. Ao soar o trompete, o ciclo dispara uma grande quantidade de luz na forma de uma área cilíndrica de 24 metros, extinguindo toda a energia amaldiçoada que ali estiver. Toda estrutura de energia dentro da área é instantaneamente dissipada e destruída; qualquer objeto amaldiçoado dentro da área tem o seu efeito anulado e negado durante 3 rodadas; qualquer condição, efeito ou habilidade causada por energia amaldiçoada é extinguida e uma maldição dentro da área realiza um teste de resistência de Fortitude, recebendo 7d12 de dano radiante, o qual ignora qualquer fonte de imunidade, resistência ou redução de danos, ou apenas metade em um sucesso. Além disso, uma criatura afetada por esta habilidade perde 15 pontos de energia amaldiçoada do seu estoque atual.","reg":"Liberação Máxima: custo da habilidade +50% (tabela do livro: nível 1 = 3, 2 = 8, 3 = 12, 4 = 18, 5 = 30 PE)."},{"tec":"Plantas do Desastre","n":"ABSORÇÃO VITAL","nv":0,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Você se torna capaz de absorver a vida de plantas para recuperar energia amaldiçoada, amplificando suas capacidades de recuperação. Ao realizar um descanso curto em um lugar onde haja plantas, você recupera metade do seu bônus de maestria em pontos de energia temporários; caso seja um descanso longo, recupera um valor igual ao seu bônus de maestria. Além disso, uma vez por descanso, você pode utilizar uma ação comum para absorver a vida de plantas próximas, recuperando uma quantidade de pontos de energia igual ao seu bônus de maestria."},{"tec":"Plantas do Desastre","n":"CRIAR PLANTAS","nv":0,"pas":false,"k":"Técnica","exec":"Variável","alc":"9 Metros","alvo":"","dur":"Imediata","area":"","custo":"","d":"Você cria plantas em pontos dentro do alcance, podendo escolher seu tamanho e formato a vontade. O custo em ação é baseado na quantidade e variedade das plantas que você criar, assim como você pode as controlar telepaticamente enquanto presentes no campo."},{"tec":"Plantas do Desastre","n":"DISPARO DE RAMO","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você cria um ramo de madeira afiado, disparando-o como um espinho na direção de uma criatura dentro de 12 metros. Realize um teste de ataque de técnica (Feitiçaria ou Pontaria) contra a criatura e, caso acerte, causa 4d8 de dano perfurante."},{"tec":"Plantas do Desastre","n":"REVESTIMENTO DE ESPINHOS","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"3 Metros","alvo":"Um Equipamento","dur":"Sustentada","area":"","custo":"","d":"Você reveste um equipamento com espinhos, seja arma ou armadura. Caso utilize em uma arma, ela causará 1d10 de dano perfurante adicional; caso utilize em uma armadura, sempre que a criatura utilizando-a receber um ataque corpo-a-corpo, o atacante recebe 2d6 de dano perfurante. Para cada rodada após a primeira, você deve gastar 1PE para sustentar essa habilidade."},{"tec":"Plantas do Desastre","n":"BOLAS DE MADEIRA","nv":2,"pas":false,"k":"Técnica","exec":"Variável","alc":"12 Metros","alvo":"","dur":"Imediata","area":"","custo":"","d":"Através de madeira, você forma várias bolas, as quais podem ser disparadas em criaturas dentro do alcance. A quantidade de bolas depende da ação utilizada; 3 em uma ação completa, 2 em uma ação comum e 1 em uma ação bônus. Cada bola disparada força o alvo a realizar um teste de resistência de Reflexos, recebendo 4d8 de dano de impacto, ou apenas metade em um sucesso."},{"tec":"Plantas do Desastre","n":"PRISÃO DE RAÍZES","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você cria uma prisão feita de raízes, a qual rapidamente busca prender o alvo, que deve realizar um TR de Fortitude, recebendo 5d8 de dano perfurante, ou apenas metade em um sucesso. Caso falhe, a criatura também recebe a condição Agarrado, podendo repetir o teste no final de todo turno dela, escapando em um sucesso."},{"tec":"Plantas do Desastre","n":"BROTOS MALDITOS","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Duas Criaturas","dur":"Imediata","area":"","custo":"","d":"Você cria dois brotos malditos e os joga contra criaturas dentro do alcance, as quais devem realizar um TR de Reflexos para desviar e, caso falhem, o broto acerta e se fixa no corpo delas. Uma criatura que tenha um broto perde 1d8 de vida para cada ponto de energia que gastar, conforme ele se aprofunda no corpo. Para se livrar dos brotos, é necessário gastar uma ação comum para arrancá-los, ou uma ação completa caso a criatura afetada tenha usado energia."},{"tec":"Plantas do Desastre","n":"CAMPO FLORIDO","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"","dur":"Sustentada","area":"9 Metros Esférica","custo":"","d":"Disparando um broto, ele floresce em um grande campo de flores coloridas, cobrindo uma área esférica de 9 metros. Toda criatura na área, ao tentar realizar uma ação agressiva, deve fazer um TR de Vontade e, caso falhe, será pacificado, falhando na ação e a perdendo. Para cada rodada após a primeira, você deve pagar 2PE para manter a habilidade sustentada."},{"tec":"Plantas do Desastre","n":"BONECOS DE MADEIRA","nv":4,"pas":false,"k":"Técnica","exec":"Variável","alc":"9 Metros","alvo":"","dur":"Imediata","area":"","custo":"","d":"Você cria uma quantidade variada de bonecos de madeira, com aparência macabra e um instinto de combate. Como uma ação completa, você cria quatro bonecos; como uma ação comum três e como uma ação bônus cria dois.\n\nQuando criados, eles agem no seu turno, mas após agirem você pode escolher mantê-los agindo no seu turno ou dar um comando que seguirão até serem destruídos. Você encontra a ficha dos bonecos na próxima página."},{"tec":"Plantas do Desastre","n":"EMERGÊNCIA DAS RAÍZES","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"","dur":"Imediata","area":"Cone de 12 Metros","custo":"","d":"Você une suas mãos e a partir delas dispara uma massiva onda de raízes e ramos espinhentos, espalhando-se por uma área cônica de 12 metros a partir de você. Toda criatura na área deve realizar um TR de Reflexos, recebendo 12d8 de dano perfurante, ou apenas metade em um sucesso. Além disso, toda criatura que falhe recebe a condição Imóvel, podendo realizar um teste de Acrobacia ou Atletismo no final de todo turno dela, contra sua CD de técnica, escapando em um sucesso.\n\n▸ Boneco de Madeira\nPontos de Vida: 80 Classe de Armadura: 16 Movimento: 9 Metros Atributos: FOR 16 DEX 16 CON 16 INT 0 SAB 0 CAR 0 Testes de Resistência: Astúcia +3 Fortitude +9 Reflexos +3 Vontade +0 Iniciativa: +3 Atenção: 5 Perícias: Atletismo +7 Acrobacia +7 Ações (Possui 2 Ações):\n\n• Atacar. O boneco de madeira ataca com socos, chutes e mordidas.\n\nAlcance de 1,5 metros, +14 para acertar, causa 2d10+10 de dano de impacto."},{"tec":"Projeção","n":"MOVIMENTO EM 24 QUADROS","nv":0,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Possuindo 24 quadros em um segundo para poder realizar seus movimentos, sua locomoção é diferente do padrão, superando o comum. Seu valor de movimento aumenta em 3 metros e, sempre que se mover, caso uma criatura tente realizar um ataque de oportunidade contra você, ela deve realizar um TR de Reflexos e, caso falhe, o ataque é cancelado."},{"tec":"Projeção","n":"REFLEXOS APURADOS","nv":0,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Com uma percepção diferenciada, dividindo tudo em 24 quadros, seus reflexos são apurados. Você recebe um bônus de +2 em Reflexos."},{"tec":"Projeção","n":"CONJUNTO DE MOVIMENTOS RÁPIDOS","nv":1,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você estabelece uma sequência pré-determinada de movimentos rápidos e quase impossíveis de acompanhar com os olhos. Como uma ação completa, você inicia um conjunto de movimentos, movendo-se todo o seu valor de movimento. Durante o movimento, você pode utilizar sua ação comum e ação bônus normalmente, mas, sempre que realizar um ataque durante o conjunto de movimentos, o alvo deve realizar um TR de Reflexos e, caso falhe, estará desprevenido contra o ataque. Além disso, uma criatura que tente realizar uma reação contra você, durante o movimento, deve realizar um TR de Reflexos, perdendo a reação em uma falha."},{"tec":"Projeção","n":"ACÚMULO DE VELOCIDADE","nv":1,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Próprio","dur":"Sustentada","area":"","custo":"","d":"Uma vez por rodada, ao se mover, você pode utilizar esta habilidade para começar a acumular velocidade. Ao usar esta habilidade, o seu movimento aumenta em 3 metros. A cada turno após o primeiro, você deve a sustentar pagando 1 ponto de energia e, ao se mover novamente, seu movimento aumenta em +1,5 metros. Seu movimento pode ser aumentado por esta habilidade uma quantidade de vezes igual ao seu modificador de Destreza, retornando ao zero caso a habilidade deixe de ser sustentada."},{"tec":"Projeção","n":"MOVIMENTAÇÃO SUPERIOR","nv":2,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Com uma grande agilidade e velocidade, sua técnica o permite se mover de uma maneira superior, otimizando o seu tempo e movimento. Você possui duas ações de movimento por turno, mas seu máximo de energia amaldiçoada diminui em 4."},{"tec":"Projeção","n":"CONGELAMENTO DEFENSIVO","nv":2,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Tudo que você toca deve seguir a regra dos 24 quadros, e é possível usar isso de maneira defensiva, tocando uma possível ameaça ou ataque. Ao ser alvo de um ataque, você pode realizar um teste de Reflexos como reação e, caso o seu resultado seja maior do que a rolagem de ataque, você cancela o ataque, congelando o atacante. Você também pode utilizar esta habilidade ao ser alvo de um ataque em área que crie algum tipo de projétil ou efeito físico: você escolhe utilizar Reflexos para o teste de resistência e, caso suceda, você anula o dano por completo; caso ainda falhe, você recebe apenas metade do dano."},{"tec":"Projeção","n":"MOVIMENTO ILEGÍVEIS","nv":3,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Sua velocidade é inigualável e até mesmo seus movimentos mais simples são ilegíveis, assemelhando-se a borrões ou flashes. A Classe de Dificuldade para resistir aos efeitos de suas habilidades de técnica aumenta em 3, mas seu máximo de energia amaldiçoada diminui em 6."},{"tec":"Projeção","n":"TEMPO DE REAÇÃO ACELERADO","nv":3,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Com uma grande percepção e agilidade devido a sua técnica, você consegue perceber momentos dentro dos 24 quadros em que é possível reagir com ainda mais agilidade. Você passa a ser capaz de utilizar duas reações por rodada, mas seu máximo de energia amaldiçoada diminui em 6."},{"tec":"Projeção","n":"CONGELAMENTO DESTRUTIVO","nv":3,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Sustentada","area":"","custo":"","d":"Preparando-se para uma constante ativação da sua técnica durante os seus movimentos, você começa a usar do seu congelamento de maneira destrutiva. Enquanto a habilidade estiver ativa, sempre que você realizar um ataque o alvo deve realizar um TR de Reflexos. Caso o alvo falhe, seu ataque tem acerto garantido e o alvo é considerado como se estivesse Paralisado durante o ataque, congelado dentro de um quadro que é destruído ao golpear. Caso o alvo suceda, você apenas recebe vantagem para o ataque. O efeito de Paralisado só pode ser aplicado uma quantidade de vezes por cena igual ao seu bônus de maestria; após ser aplicado esta quantidade de vezes, se torna apenas um acerto garantido. Para cada turno após o primeiro, você deve pagar 2PE para sustentar a habilidade ativa."},{"tec":"Proporções","n":"DIVIDIR PROPORÇÃO","nv":0,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"9 Metros","alvo":"Uma Criatura","dur":"Um Ataque","area":"","custo":"","d":"Você rapidamente divide uma criatura em dez linhas, com um ponto fraco na 7:3. Ao realizar um ataque, enquanto ela estiver dividida, você pode optar por receber -2 no acerto, mirando no ponto fraco, mas, caso acerte, o golpe causa 1d8 adicional e soma +2 ao total. Após acertar o ponto fraco, a linha some, sendo necessário a dividir novamente com outro uso da habilidade."},{"tec":"Proporções","n":"PROPORÇÃO DESTRUIDORA","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"12 Metros","alvo":"Uma Criatura","dur":"Dois Ataques","area":"","custo":"","d":"Você divide uma criatura em dez linhas, com um ponto fraco no 7:3 para destruir com precisão. Ao realizar um ataque, enquanto ela estiver dividida, você pode optar por receber -4 no acerto, mirando no ponto fraco, mas, caso acerte, o golpe causa um 2d6 de dano adicional e soma +4 ao total. Além disso, um ataque focado na proporção tem a sua margem de crítico reduzido em 1. Após acertar o ponto fraco duas vezes, a linha some, sendo necessário a dividir novamente com outro uso da habilidade."},{"tec":"Proporções","n":"DIVISÃO RÁPIDA","nv":2,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Você já se acostumou com sua técnica, conseguindo criar partições e proporções rapidamente. Uma quantidade de vezes por descanso longo igual ao seu modificador de técnica, você pode usar uma habilidade de Proporção como ação livre. Você recupera metade dos usos em um descanso curto, ou todos em um longo. Seu máximo de energia amaldiçoada diminui em 4."},{"tec":"Proporções","n":"PROPORÇÃO LETAL","nv":2,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"12 Metros","alvo":"Uma Criatura","dur":"Dois Ataques","area":"","custo":"","d":"Você cria uma proporção letal em uma criatura, com um ponto fraco no 7:3 focado em matá-la o mais rápido possível. Ao realizar um ataque, enquanto ela estiver dividida, você pode optar por receber -6 no acerto, mirando no ponto fraco, mas, caso acerte, o golpe causa 3d8 de dano adicional e soma +6 ao total. Além disso, um ataque focado na proporção tem a sua margem de crítico reduzido em 1. Após acertar o ponto fraco duas vezes, a linha some, sendo necessário a dividir novamente com outro uso da habilidade."},{"tec":"Proporções","n":"LETALIDADE PROPORCIONAL","nv":2,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Sua letalidade é proporcional a sua precisão e destruição, conseguindo superar defesas ao atingir no ponto certo. Sempre que acertar um golpe em uma proporção, ele ignora redução de dano igual ao dobro do seu bônus de maestria. Seu máximo de energia amaldiçoada diminui em 4."},{"tec":"Proporções","n":"PROPORÇÃO ESPECÍFICA","nv":3,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"12 Metros","alvo":"Um Membro","dur":"Um Ataque","area":"","custo":"","d":"Você cria uma proporção não em uma criatura, mas em um membro dela a sua escolha. Ao realizar um ataque, enquanto o membro estiver dividido, você pode optar por receber -8 para acertar, mirando no ponto fraco do membro. Caso acerte o ataque, o membro é completamente destruído e o ataque causa 2d10 de dano adicional, do mesmo tipo da arma, e a proporção é desfeita."},{"tec":"Proporções","n":"COLAPSO","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Corpo-a-Corpo","alvo":"Área Esférica de 9 Metros","dur":"Imediata","area":"","custo":"","d":"Você divide toda uma área com proporção, que ao ser acertada em qualquer ponto causa um enorme colapso. Você ataca o ponto escolhido com um golpe corpo-a-corpo e toda a área esférica de 9 metros é afetada, começando a ser destruída. Toda criatura dentro da área, exceto você, deve realizar um teste de resistência de reflexos, recebendo 12d8 de dano de impacto, ou apenas metade em um sucesso, sendo amassada pelos detritos. Além disso, toda a área afetada se torna terreno difícil."},{"tec":"Santuário","n":"CLIVAR — Nível 0","nv":0,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Toque","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Ao tocar uma criatura, você cria um ataque cortante que se adapta a resistência do alvo, visando causar a maior quantidade de dano possível. O alvo deve realizar um teste de resistência de Fortitude, recebendo 2d10 de dano cortante, ou apenas metade em um sucesso. Devido à baixa liberação de energia nesta versão, sua adaptação a resistência do alvo não se demonstra efetiva."},{"tec":"Santuário","n":"CLIVAR — Nível 1","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Toque","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Ao tocar uma criatura, você cria um ataque cortante que se adapta a resistência do alvo, visando causar a maior quantidade de dano possível. O alvo deve realizar um TR de Fortitude, recebendo 3d8 de dano cortante, ou apenas metade em um sucesso. Além disso, esta habilidade causa 1d8 de dano adicional para cada ponto no modificador de Constituição do alvo, até um máximo de 2 dados adicionais de dano."},{"tec":"Santuário","n":"CLIVAR — Nível 2","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Toque","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Ao tocar uma criatura, você cria um ataque cortante que se adapta a resistência do alvo, visando causar a maior quantidade de dano possível. O alvo deve realizar um TR de Fortitude, recebendo 6d8 de dano cortante, ou apenas metade em um sucesso. Além disso, esta habilidade causa 1d8 de dano adicional para cada ponto no modificador de Constituição do alvo, até um máximo de 4 dados adicionais de dano."},{"tec":"Santuário","n":"CLIVAR — Nível 3","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Toque","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Ao tocar uma criatura, você cria um ataque cortante que se adapta a resistência do alvo, visando causar a maior quantidade de dano possível. O alvo deve realizar um TR de Fortitude, recebendo 10d8 de dano cortante, ou apenas metade em um sucesso. Além disso, esta habilidade causa 1d8 de dano adicional para cada ponto no modificador de Constituição do alvo, até um máximo de 6 dados adicionais de dano."},{"tec":"Santuário","n":"CLIVAR — Nível 4","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Toque","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Ao tocar uma criatura, você cria um ataque cortante que se adapta a resistência do alvo, visando causar a maior quantidade de dano possível. O alvo deve realizar um TR de Fortitude, recebendo 13d10 de dano cortante, ou apenas metade em um sucesso. Além disso, esta habilidade causa 1d10 de dano adicional para cada ponto no modificador de Constituição do alvo, até um máximo de 6 dados adicionais de dano."},{"tec":"Santuário","n":"CLIVAR — Nível 5","nv":5,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Toque","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Ao tocar uma criatura, você cria um ataque cortante que se adapta a resistência do alvo, visando causar a maior quantidade de dano possível. O alvo deve realizar um TR de Fortitude, recebendo 14d12 de dano cortante, ou apenas metade em um sucesso. Além disso, esta habilidade causa 1d12 de dano adicional para cada ponto no modificador de Constituição do alvo, até um máximo de 10 dados adicionais de dano."},{"tec":"Santuário","n":"DESMANTELAR — Nível 0","nv":0,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"9 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você dispara um projétil cortante e invisível. Realize um teste de ataque de técnica (Pontaria ou Feitiçaria) contra o alvo e, caso acerte, causa 1d10 de dano cortante."},{"tec":"Santuário","n":"DESMANTELAR — Nível 1","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você dispara um projétil cortante e invisível. Realize um teste de ataque de técnica (Pontaria ou Feitiçaria) contra o alvo e, caso acerte, causa 4d8 de dano cortante."},{"tec":"Santuário","n":"DESMANTELAR — Nível 2","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você dispara um projétil cortante e invisível. Realize um teste de ataque de técnica (Pontaria ou Feitiçaria) contra o alvo e, caso acerte, causa 8d8 de dano cortante."},{"tec":"Santuário","n":"DESMANTELAR — Nível 3","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"24 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você dispara um projétil cortante e invisível. Realize um teste de ataque de técnica (Pontaria ou Feitiçaria) contra o alvo e, caso acerte, causa 14d8 de dano cortante."},{"tec":"Santuário","n":"DESMANTELAR — Nível 4","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"30 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você dispara um projétil cortante e invisível. Realize um teste de ataque de técnica (Pontaria ou Feitiçaria) contra o alvo e, caso acerte, causa 16d10 de dano cortante."},{"tec":"Santuário","n":"DESMANTELAR — Nível 5","nv":5,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"48 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você dispara um projétil cortante e invisível. Realize um teste de ataque de técnica (Pontaria ou Feitiçaria) contra o alvo e, caso acerte, causa 20d12 de dano cortante."},{"tec":"Santuário","n":"DECEPAR","nv":4,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"15 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você utiliza do desmantelar focado completamente em decepar um membro da criatura alvo, sacrificando alcance por mais destruição. Realize um teste de ataque de técnica (Pontaria ou Feitiçaria) contra o alvo e, caso acerte, causa 8d10 de dano cortante. Além disso, você deve selecionar um dos membros na tabela de consequências extremas e uma criatura afetada por esta habilidade deve realizar um TR de Fortitude, perdendo o membro caso falhe."},{"tec":"Santuário","n":"TEIA DE ARANHA","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Toque","alvo":"","dur":"Imediata","area":"Esférica de 4,5 Metros","custo":"","d":"Utilizando do Clivar, você toca no chão e o destrói, criando um corte no formato de uma teia de aranha, ajustando-se à resistência do chão. Uma área esférica de 4,5 metros a partir de você é destruída, colapsando o terreno, além de transformá-lo em terreno difícil; criaturas que estivessem sobre ela recebem dano de queda e criaturas que estiverem abaixo recebem dano pelo desabamento."},{"tec":"Santuário","n":"CORTE AMPLIADO","nv":3,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Dominando o Desmantelar, você se torna capaz de o ampliar durante uma conjuração, tornando-o em uma varredura. Quando utilizar a habilidade de técnica Desmantelar, você pode usar sua reação para adicionar até dois alvos ao ataque desde que estejam adjacentes ao alvo primário, pagando um custo adicional igual a metade do custo do nível utilizado para cada um. Você pode utilizar esta habilidade uma quantidade de vezes igual ao seu bônus de maestria. Seu máximo de energia amaldiçoada é reduzido em 6."},{"tec":"Santuário","n":"CORTE RÁPIDO","nv":3,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Focando na agilidade, você se torna capaz de proporcionar um corte rápido. Quando utilizar uma habilidade de técnica você pode usar sua reação e pagar um custo igual a metade do custo da habilidade utilizada, para a utilizar novamente no mesmo alvo, como parte do mesmo ataque: caso exija um TR, ele é válido para ambos os cortes; caso seja um teste de ataque, ele será válido para ambos os cortes. Você pode utilizar esta habilidade uma quantidade de vezes igual ao seu bônus de maestria. Seu máximo de energia amaldiçoada é reduzido em 6."},{"tec":"Santuário","n":"CORTES VERDADEIROS","nv":4,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Nada pode escapar da letalidade de seus cortes, sendo apenas peixes na tábua. Suas habilidades de técnica de corte ignoram imunidade ao seu tipo de dano, reduzindo para resistência. Seu máximo de energia amaldiçoada é reduzido em 8."},{"tec":"Santuário","n":"DESMANTELAR IMPERCEPTÍVEL","nv":2,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Aproveitando da invisibilidade dos seus cortes de Desmantelar, você também os torna imperceptíveis a partir da ocultação de gestos. Sempre que realizar um teste de ataque para usar Desmantelar, você recebe +3 na rolagem de acerto. Seu máximo de energia amaldiçoada é reduzido em 4."},{"tec":"Santuário","n":"DESTRUIÇÃO MÁXIMA","nv":1,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Destruição e catástrofe acompanham você, devastando o ambiente ao seu redor. Sempre que causar dano em estruturas ou objetos, trate como se possuíssem vulnerabilidade ao seu dano, aumentando-a. Seu máximo de energia amaldiçoada é reduzido em 2."},{"tec":"Santuário","n":"Expansão de Domínio: Santuário Malevolente","nv":6,"pas":false,"k":"Domínio","exec":"Ação Comum","alc":"Sem barreira, alcance ampliado","alvo":"","dur":"3 + nível de aptidão em Domínio (rodadas)","area":"","custo":"25 PE","d":"A expansão de domínio da técnica Santuário é o Santuário Malevolente, capaz de causar absoluta devastação quando conjurado, compensando pela extrema dificuldade e refino necessário para o utilizar, sendo uma expansão sem barreiras.\n\nSantuário Malevolente [Sem Barreiras] Você une suas mãos e expande o seu domínio, surgindo a partir da construção de um santuário budista distorcido e macabro, com aspecto demoníaco. Não possuindo barreiras, sua expansão passa a afetar uma área de 200 metros a partir da localização do santuário, o qual é meramente uma representação; seu domínio dura uma quantidade de rodadas igual a 3 + seu nível de aptidão em domínio. Ela pode possuir os seguintes efeitos:\n\n• Efeito Especial: Cortes Incessantes. O próprio santuário auxilia em seus ataques: uma vez por rodada, você pode utilizar uma habilidade de técnica de corte como ação livre.\n• Amplificação de Técnica: Negação de Redução de Dano. Não existe nada que não possa ser cortado dentro de sua expansão. Todas suas habilidades de técnica ignoram 3 de redução de dano dentro contra alvos dentro da expansão.\n• Acerto Garantido. Caso possua a aptidão amaldiçoada Acerto Garantido, você pode o imbuir na expansão, com Desmantelar e Clivar possuindo acerto garantido e alcance igual a toda área da expansão.\n\nAlém disso, você pode optar por afetar todas as criaturas na área ao utilizar uma habilidade de técnica.","reg":"Expansão Sem Barreiras: mesmo custo da Completa com Acerto Garantido (20 + 5 = 25 PE)."},{"tec":"Sentença Mortal","n":"MARTELO DA JUSTIÇA","nv":0,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você é capaz de manifestar um martelo de madeira, semelhante ao utilizado em julgamentos, o qual se mostra como uma arma versátil.\n\nComo uma ação bônus, você cria uma arma com as mesmas propriedades de um Martelo, a qual dura até que você o dissipe. Enquanto estiver com o martelo, você pode usar uma ação bônus para mudar a forma dela para qualquer outra arma corpo-a-corpo de custo 1 a sua escolha."},{"tec":"Sentença Mortal","n":"LAÇAR","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você transforma o martelo em uma forma fluída, semelhante a um gancho, e tenta golpear e laçar alguém. O alvo deve realizar um teste de resistência de Reflexos e, caso falhe, fica Agarrado. Para se libertar do laço, a criatura pode realizar um teste de Atletismo contra você no começo de todo turno dela, libertando-se em um sucesso."},{"tec":"Sentença Mortal","n":"ESMAGAR","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"3 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você aumenta massivamente o tamanho do seu martelo e busca esmagar uma criatura. A criatura deve realizar um teste de resistência de Reflexos, recebendo 4d8 de dano de impacto, ou apenas metade em uma falha. Caso o alvo falhe, ele também começa a ser esmagado, ficando Caído, sem poder se levantar enquanto você manter o martelo sobre ele, e realizando um teste de resistência de Fortitude no começo de todo turno em que estiver sendo esmagado, recebendo 3d8 de dano de impacto em uma falha."},{"tec":"Sentença Mortal","n":"CONTROLE SUPERIOR","nv":2,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Seu controle sobre o martelo vinculado a sua técnica é grandemente aprimorado. Invocar o martelo e trocar sua forma passa a ser uma ação livre, além de poder o transformar em armas corpo-a-corpo de custo 2. Ele também passa a ser considerado como uma ferramenta amaldiçoada de grau equivalente ao seu, até um limite de primeiro grau. Seu máximo de energia amaldiçoada é reduzido em 4."},{"tec":"Sentença Mortal","n":"Expansão de Domínio: Sentença de Morte","nv":6,"pas":false,"k":"Domínio","exec":"Ação Comum","alc":"Esfera de 9 m","alvo":"","dur":"3 + nível de aptidão em Domínio (rodadas)","area":"","custo":"20 PE","d":"Sentença de Morte é a expansão da sua técnica amaldiçoada, a qual possui um forte aspecto narrativo, sendo ela uma expansão completa não-letal em que um julgamento é conduzido. Durante o processo, é necessária a participação não só do jogador, mas, também, do Narrador. Por isso, é recomendado que o Narrador confira a seção Guia para Narradores desta técnica, no final do livro. A seguir, você encontrará o funcionamento e detalhes da sua expansão, sendo este o seu Efeito Especial. É possível colocar outros efeitos caso assim deseje, mas o Efeito Especial será automaticamente o primeiro.\n\n▸ Efeito Especial: Julgamento\nAo utilizar sua expansão de domínio, você cria um espaço esférico de 9 metros, cujo interior reflete um pequeno tribunal com numerosas guilhotinas no fundo. Cada criatura é colocada em um lugar próprio, e o domínio força um estado de não-violência, válido para todos colocados no seu interior. Tentar realizar qualquer ato de violência fará com que o infrator seja imediatamente colocado de volta em seu lugar.\n\nDentro do domínio, seu shikigami Juiz é invocado, o qual deve ser controlado e interpretado pelo Narrador, seguindo o processo estipulado para o domínio. Você, usuário da técnica, irá cumprir o papel de promotor, recebendo uma prova/evidência na forma de um envelope, cujo conteúdo é imediatamente informado para você, mesmo enquanto selado.\n\nDiante isso, o domínio funciona conforme o seguinte processo: 1. Primeiramente, o Juiz irá anunciar quais são as acusações contra o acusado, que podem ser crimes que ele tenha cometido ou não. Vale recordar que o Juiz automaticamente saberá tudo sobre as pessoas dentro do domínio, mas não compartilhará informações além da prova/evidência para o usuário. 2. O promotor deve explicar as regras do domínio: o acusado deve se explicar, eliminar suspeita e fazer com que o Juiz o considere inocente; é possível argumentar apenas uma vez, o que é válido para o promotor e o acusado; primeiro o acusado deve realizar sua exposição, segundamente o promotor irá contra argumentar e, por fim, o Juiz irá dar seu veredito. 3. O acusado deve se pronunciar, possuindo três opções: ficar calado, confessar ou negar, sendo possível também negar utilizando de uma declaração falsa. 4. Após a pronunciação do acusado, o promotor deve contra argumentar, podendo utilizar da prova/evidência, a qual é manifestada como um envelope selado. A evidência não necessariamente é conclusiva da culpa do acusado. 5. Com ambos os argumentos dados, o Juiz dará um veredito diante a lei. Caso o acusado seja declarado culpado, ele é punido com uma sentença, da qual nem mesmo o usuário do domínio estará certo.\n\nApós o fim do julgamento, o domínio é imediatamente dissipado e, caso haja uma, a sentença afeta o culpado. Porém, caso o acusado tenha sido declarado culpado sem uma confissão aberta, ele pode requisitar outro julgamento, o qual o juiz não pode negar, erguendo a expansão novamente (sem custo para o usuário) e realizando outro julgamento, sobre um crime diferente.\n\nNa próxima página é possível encontrar as sentenças possíveis e os efeitos de cada uma delas. Considera-se que uma sentença dura uma cena inteira, a menos que o culpado requisite outro julgamento, podendo assim se livrar dela.\n\n▸ Sentenças Possíveis\nEmbora seja suposto que há um grande leque de sentenças possíveis, apenas três foram apresentadas na obra, sendo estas as que foram adaptadas. São elas:\n\n• Confisco, a qual faz com que o culpado seja temporariamente impossibilitado de utilizar técnicas amaldiçoadas. Se o alvo não possuir uma técnica amaldiçoada, ele é impedido de utilizar energia como um todo. Se estiver portando uma ferramenta amaldiçoada, Confisco irá priorizar confiscar a ferramenta ao invés de desabilitar a técnica.\n• Pena de Morte, a qual confere ao usuário da técnica uma arma exclusiva, a Espada do Carrasco, utilizada para executar a pena de morte, matando imediatamente qualquer um que seja acertado por ela. Caso múltiplas almas existam dentro de um mesmo alvo, apenas a alma sentenciada será morta.\n• Confisco + Pena de Morte, onde os efeitos de ambas as sentenças anteriores são aplicados juntamente.\n\nAs informações da espada são encontradas logo abaixo.\n\n▸ Espada do Carrasco\nA espada do carrasco é a arma conferida a você caso haja uma pena de morte, com o seu martelo se transformando nela. A Espada do Carrasco conta como uma Espada Longa, possuindo a seguinte habilidade: ao acertar um ataque com a espada, role um d10, definindo onde você acertou (1 a 5 – braços; 6 a 9 – pernas; 10 – torso ou cabeça) e, caso acerte o torso ou a cabeça, o alvo é imediatamente morto pelo ataque. Se os braços ou as pernas forem acertados, o alvo do ataque pode utilizar uma reação para arrancar aquele membro fora e escapar da morte, mas, caso ele não possua uma reação, ele morre igualmente. Caso consiga um 20 em uma rolagem de ataque, acerta-se o torso ou cabeça automaticamente.","reg":"Expansão Completa não-letal: 20 PE."},{"tec":"Transfiguração Inerte","n":"BRAÇOS DE ESPINHO","nv":0,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você remodela os seus braços para que se transformem em uma espécie de chicote com espinhos. Seus golpes desarmados passam a causar 1d6 de dano perfurante, além de ter o alcance aumentado em 1,5 metros."},{"tec":"Transfiguração Inerte","n":"PERNAS DE ANIMAL","nv":0,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você remodela as suas pernas, transformando-as em patas de animais. O seu movimento aumenta em 3 metros."},{"tec":"Transfiguração Inerte","n":"TOQUE TRANSFIGURADOR","nv":0,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Toque","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você toca uma criatura e transfigura a sua alma. Caso não seja um feiticeiro ou maldição (civil comum), ela deve realizar um teste de Integridade, tendo sua integridade reduzida pela metade em um sucesso ou a zero em uma falha. Caso seja um feiticeiro ou maldição, ela recebe 1d6 de dano na alma. Dentro de combate, é necessário realizar uma rolagem de ataque para tocar um alvo."},{"tec":"Transfiguração Inerte","n":"CRIAR ASAS","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você altera o formato da sua alma, criando asas. Seu movimento padrão se torna movimento de voo."},{"tec":"Transfiguração Inerte","n":"LÂMINAS CORPORAIS","nv":1,"pas":false,"k":"Técnica","exec":"Ação Bônus","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você transforma seu braço em uma sequência de três lâminas altamente cortantes. Seus golpes desarmados passam a causar 2d6 de dano cortante, além de ter o alcance aumentado em 1,5 metros."},{"tec":"Transfiguração Inerte","n":"TRANSFIGURAÇÃO APRIMORADA","nv":1,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Ampliando sua consciência sobre o traçado da alma, você aprimora sua capacidade de o distorcer, aumentando a letalidade do seu toque transfigurador. Seu máximo de energia amaldiçoada diminui em 2 pontos, mas o dano na alma da habilidade Toque Transfigurador aumenta de 1d6 para 1d10, além de passar a somar o seu modificador de atributo da técnica no total."},{"tec":"Transfiguração Inerte","n":"DEVASTAR","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"","alvo":"","dur":"Imediata","area":"Um cone de 4,5 metros a sua frente","custo":"","d":"Você cresce o seu braço, depois golpeando com ele, devastando tudo a sua frente. Toda criatura dentro da área deve realizar um teste de resistência de Reflexos, recebendo 4d8 de dano de impacto, ou apenas metade em um sucesso."},{"tec":"Transfiguração Inerte","n":"ENCOLHER E FUGIR","nv":2,"pas":false,"k":"Técnica","exec":"Reação","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Ao ser alvo de um ataque corpo-a-corpo, você pode usar sua reação para encolher o seu corpo: realize um teste de Reflexos contra o ataque do inimigo e, caso supere o resultado, você ignora o ataque. Você também pode, como parte da reação, mover-se até metade do seu movimento para longe."},{"tec":"Transfiguração Inerte","n":"RESTAURAR CORPO","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você começa a restaurar o seu corpo, alterando-o pelo formato da sua alma. Você recupera 6d6 pontos de vida."},{"tec":"Transfiguração Inerte","n":"REPELIR CORPO: LIBERAÇÃO CAÓTICA","nv":2,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Variável","dur":"Imediata","area":"","custo":"","d":"Utilizando dos humanos transfigurados guardados, você começa a unir almas para criar uma liberação caótica, a qual ataca de vários lados. Ao utilizar essa habilidade, você deve usar pelo menos 4 humanos transfigurados, escolhendo 2 alvos dentro do alcance para serem atacados, necessitando de realizar um teste de resistência de Reflexos, recebendo 4d8 de um tipo de dano físico à sua escolha, ou apenas metade em um sucesso."},{"tec":"Transfiguração Inerte","n":"RESTAURAÇÃO AVANÇADA","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você restaura o seu corpo de maneira avançada, remodelando a alma. Você recupera 3d12 pontos de vida, além de restaurar qualquer membro quebrado, decepado ou debilitado."},{"tec":"Transfiguração Inerte","n":"REPELIR CORPO: CONCENTRAÇÃO","nv":3,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"18 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você começa a concentrar diversas almas em uma só, criando uma enorme formação destruidora. Ao usar essa habilidade, você deve gastar 3 humanos transfigurados, forçando um alvo dentro do alcance a realizar um teste de resistência de Reflexos, recebendo 10d8 de um tipo de dano físico a sua escolha, ou apenas metade em um sucesso. Você pode gastar até dois humanos transfigurados adicionais, com cada um aumentando o dano em 3d8. Além disso, após usar a habilidade, você pode usar sua reação para se mover até o final da extensão da formação."},{"tec":"Transfiguração Inerte","n":"TRANSFIGURAÇÃO DEVASTADORA","nv":3,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Seu toque se torna devastador para a alma. Seu máximo de energia amaldiçoada diminui em 6 pontos, mas o dano na alma da habilidade Toque Transfigurador aumenta de 1d10 para 3d6. [Requer: Transfiguração Aprimorada.]"},{"tec":"Transfiguração Inerte","n":"DIVIDIR-SE","nv":4,"pas":false,"k":"Técnica","exec":"Ação Completa","alc":"Próprio","alvo":"Próprio","dur":"Imediata","area":"","custo":"","d":"Você se divide em dois, criando um clone. Ao criar o clone, ele possui metade dos seus pontos de vida e uma quantidade de pontos de energia igual ao que você gastou para o criar, com mínimo igual ao custo da habilidade. Dentro de combate, o clone possui sua própria rolagem de iniciativa, agindo de maneira separada de você, realizando ações a sua escolha. O clone pode usar suas habilidades de técnica apenas em si mesmo, mas não nos outros. Caso o clone receba dano na alma, ele é direcionado ao seu corpo principal. Você só pode ter um clone por vez."},{"tec":"Transfiguração Inerte","n":"ALMA POLIMÓRFICA ISÔMERA","nv":4,"pas":false,"k":"Técnica","exec":"Variável","alc":"Próprio","alvo":"","dur":"Imediata","area":"","custo":"","d":"Você combina a alma de vários humanos transfigurados, criando um único corpo estável e poderoso. Cada corpo criado consome 4 humanos transfigurados e 5 pontos de energia; criar um corpo é uma ação bônus, criar dois é uma ação comum e criar três é uma ação completa. Os corpos, ao serem criados, agem no seu turno, mas depois realizam os próprios turnos deles, normalmente tentando atacar um alvo que você tenha escolhido, até que sejam destruídos. Você encontra a ficha deles na próxima página.\n\n▸ Alma Polimórfica Isômera\nPontos de Vida: 50 Classe de Armadura: 24 Movimento: 12 Metros Atributos: FOR 26 DEX 18 CON 10 INT 10 SAB 0 CAR 0 Testes de Resistência: Astúcia +2 Fortitude +5 Reflexos +12 Vontade +2 Iniciativa: +3 Atenção: 10 Perícias: Atletismo +18 Acrobacia +13 Ações (Possui 2 Ações):\n\n• Golpear. A Alma Polimórfica Isômera golpeia brutalmente. Alcance de 1,5 metros, +21 para acertar, causa 4d8+14 de dano de impacto."},{"tec":"Transfiguração Inerte","n":"REGENERAÇÃO ABSOLUTA","nv":5,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"Próprio","alvo":"Próprio","dur":"Sustentada","area":"","custo":"","d":"Você se foca em regenerar a sua alma, refletindo no seu corpo, com intuito de aguentar golpes. Enquanto esta habilidade estiver ativa, todo dano que você receber é reduzido pela metade, exceto dano na alma. Para cada rodada após a primeira, você deve pagar metade do custo da habilidade para a manter sustentada."},{"tec":"Transfiguração Inerte","n":"TRANSFIGURAÇÃO MÁXIMA","nv":5,"pas":true,"k":"Técnica","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Sua noção sobre as almas alcançou o máximo, sendo capaz de quase distorcer por completo em um único toque. Seu máximo de energia amaldiçoada diminui em 10 pontos, mas o dano na alma da habilidade Toque Transfigurador aumenta de 3d6 para 3d10, além de passar a somar o dobro do seu modificador de atributo da técnica no total. [Requer: Transfiguração Devastadora]"},{"tec":"Transfiguração Inerte","n":"Expansão de Domínio: Auto-Personificação Da Perfeição","nv":6,"pas":false,"k":"Domínio","exec":"Ação Comum","alc":"Esfera de 9 m","alvo":"","dur":"3 + nível de aptidão em Domínio (rodadas)","area":"","custo":"25 PE","d":"Esta é a adaptação da Expansão de Domínio de Mahito, a qual é uma expansão completa letal.\n\n▸ Auto-Personificação da Perfeição\nVocê cria selos a partir de pequenas mãos formadas no interior de sua boca. Sua expansão cria um espaço próprio que ocupa área esférica de 9 metros, o qual dura uma quantidade de rodadas igual a 3 + seu nível de aptidão em domínio. O seu domínio possui várias mãos gigantes unidas em forma de uma flor, as quais também possuem vários braços agarrando uns aos outros, em um padrão de rede. Ela pode receber os seguintes efeitos:\n\n• Amplificação de Técnica: Aumento de CD. Dentro da sua expansão, a CD para resistir a sua transfiguração aumenta em 2.\n• Acerto Garantido. Caso possua a aptidão amaldiçoada Acerto Garantido, você pode colocá-la em sua expansão, fazendo com que suas habilidades de transfiguração possam afetar todas as criaturas na expansão e possuam contato constante.","reg":"Expansão Completa letal: 20 PE + 5 PE de Acerto Garantido = 25 PE."},{"tec":"Trem do Puro Amor","n":"Expansão de Domínio: Aposta Mortal Indolente","nv":6,"pas":false,"k":"Domínio","exec":"Ação Comum","alc":"Esfera de 9 m","alvo":"","dur":"3 + nível de aptidão em Domínio (rodadas)","area":"","custo":"20 PE","d":"Ao utilizar sua expansão de domínio, você cria um espaço esférico de 9 metros, o qual durará até que você vença o jogo, conseguindo um jackpot, ou seja derrotado dentro dele. Uma criatura levada ao domínio tem as regras do jogo depositada na mente dela.\n\nO jogo se inicia no modo normal, em um estágio neutro, o qual se resume a uma sala branca com várias catracas de metrô. Dentro do estágio neutro, você pode manifestar três tipos diferentes de indicadores de efeitos visuais: bolas, portas e efeitos consecutivos. Cada um dos indicadores são habilidades de técnica e podem variar em cor, gerando expectativa.\n\nConseguir um indicador arco-íris ou quatro efeitos consecutivos seguidos garantem um jackpot no próximo evento.\n\nAo gerar um ou mais indicadores de efeitos visuais, você pode utilizar sua ação bônus para desencadear um evento riichi. Ao desencadear um evento riichi, você deve rolar 1d100 para decidir qual evento irá ocorrer:\n\n• Evento 1 – Bilhete Único, obtido com resultado 1-45.\n• Evento 2 – Disputa por Assentos, obtido com resultado 46-70.\n• Evento 3 – Emergência de Banheiro no Trem Expresso, obtido com resultado 71-89.\n• Evento 4 – Último Trem de Sexta-Feira, obtido com resultado 90-100 ou mais.\n\nPara cada ponto de expectativa, você adiciona +5 na rolagem do d100. Após a rolagem o evento riichi acontece. Um evento dura 1 rodada e não pode ser impedido, a menos que o usuário seja morto durante essa rodada. No final da rodada do evento, realiza-se a rolagem dos números: você deve rolar 3d6, conseguindo um jackpot ao obter três números iguais. Entretanto, o evento conseguido irá influenciar na rolagem:\n\n• Bilhete Único permite rolar dados novamente 1 vez.\n• Disputa por Assentos permite rolar dados novamente 2 vezes.\n• Emergência de Banheiro no Trem Expresso permite rolar dados novamente 3 vezes.\n• Último Trem de Sexta-Feira permite rolar dados novamente 4 vezes. Após a resolução da rolagem, há dois cenários possíveis. Caso tenha conseguido os três números e entrado no jackpot, a expansão de domínio é desfeita e você recebe os benefícios do estado. Você encontra os benefícios do Jackpot na última página da técnica.\n\nCaso tenha falhado em conseguir o jackpot, o jogo volta ao estágio normal e tudo se repete até que a expansão de domínio seja desfeita.\n\n▸ Indicadores de Efeitos Visuais (Habilidades de Técnica)\nAs habilidades de técnica do Trem do Puro Amor são focadas, principalmente, nos efeitos visuais do jogo, permitindo a sua manifestação tanto fora quanto dentro da expansão de domínio. Caso os use fora da expansão de domínio, as habilidades ocorrem normalmente; caso seja usado dentro da expansão de domínio, eles geram expectativa, adicionando a rolagem de um d20 após o seu uso, definindo a cor do efeito com base no resultado:\n\n•\n•\n•\n• 1-10 gera um efeito visual verde e 1 ponto de expectativa. 11-16 gera um efeito visual vermelho e 2 pontos de expectativa. 17-19 gera um efeito visual dourado e 4 pontos de expectativa. 20 gera um efeito visual arco-íris e garante o jackpot.","reg":"Expansão Completa: 20 PE (o texto não cita Acerto Garantido; some +5 PE se o seu Narrador o considerar letal)."},{"tec":"Trem do Puro Amor","n":"INDICADOR: BOLA","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você manifesta um indicador em forma de uma pequena bola, disparando-a contra uma criatura dentro de 12 metros. Realize uma rolagem de ataque com pontaria, causando 4d8 de dano de impacto em um acerto. Caso use dentro da expansão de domínio, role um d20 para gerar expectativa."},{"tec":"Trem do Puro Amor","n":"INDICADOR: PORTAS","nv":1,"pas":false,"k":"Técnica","exec":"Ação Comum","alc":"12 Metros","alvo":"Uma Criatura","dur":"Imediata","area":"","custo":"","d":"Você cria duas portas de metrô, as quais se fecham em uma criatura dentro de 12 metros. A criatura alvo deve realizar um teste de resistência de Reflexos, recebendo a condição Agarrado em uma falha. No começo de todo turno da criatura, ela pode realizar um teste de Atletismo contra sua CD, livrando-se em um sucesso. Caso use dentro da expansão de domínio, role um d20 para gerar expectativa.\n\n▸ Estado de Jackpot\nAo conseguir um jackpot com a Aposta Mortal Indolente, o usuário adentra em um estado onde sua energia amaldiçoada é infinita. O estado de jackpot dura 5 rodadas, e você recebe os seguintes benefícios enquanto estiver nele:\n\n• No início de todo turno, seus pontos de energia amaldiçoada voltam para o seu máximo. Quando o estado de jackpot acabar, caso não esteja com o seu máximo de energia, seu valor atual retorna ao máximo.\n• Enquanto estiver no estado de jackpot, você tem acesso as aptidões amaldiçoadas Energia Reversa, Fluxo Constante e Regeneração Aprimorada e, caso tenha Cura Amplificada, ela também é considerada para a cura. Seu máximo de energia reversa gasta ao se curar se torna aumenta em 2. Além disso, uma vez por turno, você pode utilizar Fluxo Constante sem gastar a sua reação.\n\nApós encerrar o jackpot, você já pode utilizar sua expansão de domínio novamente, sem nenhuma restrição.\n\n▸ Galeria de Técnicas Originais\nEsta galeria, diferente da primeira, tem como foco apresentar técnicas amaldiçoadas originais, as quais foram desenvolvidas justamente para este livro, ampliando o leque de escolhas e possibilidades. O foco é que não possuam conceitos já apresentados dentro da obra de Jujutsu Kaisen, embora possam acabar tendo semelhanças.\n\nAssim como as adaptadas, um jogador é livre para criar novas habilidades, não se limitando apenas ao que é apresentado no livro, embora seja sempre necessário manter-se dentro do conceito e do funcionamento da técnica."},{"tec":"Arsenal Marcial","n":"ATACAR E AGARRAR","nv":1,"pas":false,"k":"Marcial","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Como uma ação comum, você desfere um ataque contra um inimigo e, logo após o ataque, você também realiza a ação de Agarrar. Caso tenha acertado o ataque no alvo, ele terá -5 no teste para resistir ao agarrão.","reg":"Técnica marcial: custo em Estamina por nível (1 = 2, 2 = 5, 3 = 8, 4 = 12)."},{"tec":"Arsenal Marcial","n":"CONTRA-ATAQUE","nv":1,"pas":false,"k":"Marcial","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Uma vez por rodada, quando for alvo de um ataque corpo-a-corpo, você pode usar sua reação para tentar o impedir: realize um teste de atletismo contra o teste de ataque da criatura e, se suceder, você consegue aparar o ataque. Caso consiga aparar com sucesso, você também pode realizar um ataque contra a criatura.","reg":"Técnica marcial: custo em Estamina por nível (1 = 2, 2 = 5, 3 = 8, 4 = 12)."},{"tec":"Arsenal Marcial","n":"ESTADO DE ATENÇÃO","nv":1,"pas":true,"k":"Marcial","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Você alcança um estado de constante atenção e preparo dentro de uma batalha, percebendo cada detalhe nos seus arredores. Você recebe um bônus de +2 em Percepção e Reflexos, mas seu máximo de pontos de vigor reduz em 2.","reg":"Técnica marcial: custo em Estamina por nível (1 = 2, 2 = 5, 3 = 8, 4 = 12)."},{"tec":"Arsenal Marcial","n":"GOLPEAR E DESARMAR","nv":1,"pas":false,"k":"Marcial","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Como uma ação comum, você realiza um golpe rápido contra um inimigo e, logo após o ataque, você também realizar a ação de Desarmar contra o mesmo alvo. Caso tenha acertado o ataque, ele terá -5 no teste para evitar ser desarmado.","reg":"Técnica marcial: custo em Estamina por nível (1 = 2, 2 = 5, 3 = 8, 4 = 12)."},{"tec":"Arsenal Marcial","n":"CORPO DE FERRO","nv":2,"pas":true,"k":"Marcial","exec":"Passiva","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Sacrificando parcela do seu vigor para deixar o seu corpo mais reforçado e resistente, você recebe 4 de redução de dano contra todos os tipos, exceto dano na alma, mas o seu máximo de pontos de vigor reduz em 4.","reg":"Técnica marcial: custo em Estamina por nível (1 = 2, 2 = 5, 3 = 8, 4 = 12)."},{"tec":"Arsenal Marcial","n":"GOLPE GIRATÓRIO","nv":2,"pas":false,"k":"Marcial","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"","d":"Você gira o seu corpo e golpeia tudo ao seu redor. Como uma ação completa, você realiza duas rolagens de ataque, causando dano em todas as criaturas dentro do seu alcance de ataque cuja Classe de Armadura seja inferior ao resultado das rolagens. Esta técnica marcial só pode ser utilizada com uma arma corpo-a-corpo.","reg":"Técnica marcial: custo em Estamina por nível (1 = 2, 2 = 5, 3 = 8, 4 = 12)."},{"tec":"Cólera das Estrelas","n":"Garuda","nv":7,"pas":false,"k":"Invocação","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"2 PE","reg":"Custo de invocação conforme a ficha.","d":"Pontos de Vida: 35 Classe de Armadura: 17 Movimento: 9 Metros\nForça 16 Destreza 12 Constituição 16 Inteligência 8 Sabedoria 8 Carisma 8\nAções:\n• Golpear [Complexa]. Garuda avança e golpeia uma criatura. Alcance de 1,5 metros, +5 para acertar, causa 2d8 + 3 de dano de impacto.\nCaracterísticas:\n• Componente de Técnica. Garuda é uma parte essencial se sua técnica, podendo ser alvo de suas habilidades de técnica com alvo próprio.\nPerícias:\n• Fortitude +4","grau":"4° Grau"},{"tec":"Cópia","n":"Rika — Maestria +2","nv":7,"pas":false,"k":"Invocação","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"2 PE","reg":"Rika tem turno próprio (uma ação, movimento e uma reação por rodada). A ficha evolui com o bônus de maestria do usuário.","d":"Pontos de Vida: 30 Classe de Armadura: 17 Movimento: 9 Metros\nForça 16 Destreza 12 Constituição 12 Inteligência 8 Sabedoria 8 Carisma 14\nAções:\n• Mordida. Rika avança e desfere uma potente mordida em uma criatura. Alcance de 1,5 metros, +5 para acertar, causa 2d8+3 de dano perfurante.\nCaracterísticas:\n• Armazém Amaldiçoado. Rika pode armazenar itens, com um limite de espaços igual ao modificador de Força dela. Você pode, como uma ação bônus, retirar um item dela. Para usar essa característica, não é necessário que ela esteja invocada.\nPerícias:\n• Atletismo +5","grau":"Maestria +2"},{"tec":"Cópia","n":"Rika — Maestria +3","nv":7,"pas":false,"k":"Invocação","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"5 PE","reg":"Rika tem turno próprio (uma ação, movimento e uma reação por rodada). A ficha evolui com o bônus de maestria do usuário.","d":"Pontos de Vida: 60 Classe de Armadura: 18 Movimento: 9 Metros\nForça 18 Destreza 12 Constituição 16 Inteligência 10 Sabedoria 10 Carisma 14\nAções:\n• Mordida. Rika avança e desfere uma potente mordida em uma criatura. Alcance de 1,5 metros, +9 para acertar, causa 2d12+4 de dano perfurante.\n• Disparo de Energia. Concentra energia e dispara em um raio. Alcance de 9 metros, +9 para acertar, causa 2d10+4 de dano de força.\nCaracterísticas:\n• Armazém Amaldiçoado. Rika pode armazenar itens, com um limite de espaços igual ao modificador de Força dela. Você pode, como uma ação bônus, retirar um item dela. Para usar essa característica, não é necessário que ela esteja invocada.\nPerícias:\n• Atletismo +9","grau":"Maestria +3"},{"tec":"Cópia","n":"Rika — Maestria +4","nv":7,"pas":false,"k":"Invocação","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"8 PE","reg":"Rika tem turno próprio (uma ação, movimento e uma reação por rodada). A ficha evolui com o bônus de maestria do usuário.","d":"Pontos de Vida: 90 Classe de Armadura: 20 Movimento: 10,5 Metros\nForça 22 Destreza 14 Constituição 18 Inteligência 10 Sabedoria 10 Carisma 16\nAções:\n• Mordida. Rika avança e desfere uma potente mordida em uma criatura. Alcance de 3 metros, +14 para acertar, causa 3d10+6 de dano perfurante.\n• Disparo de Energia. Alcance de 15 metros, +14 para acertar, causa 3d8+6 de dano de força.\nCaracterísticas:\n• Armazém Amaldiçoado. Rika pode armazenar itens, com um limite de espaços igual ao modificador de Força dela. Você pode, como uma ação bônus, retirar um item dela. Para usar essa característica, não é necessário que ela esteja invocada.\n• Paixão Raivosa. O laço de Rika com seu portador se torna mais intenso. Caso o usuário de Rika esteja com menos da metade da vida, Rika recebe um bônus de +5 em todas suas rolagens enquanto ele não for curado.\nPerícias:\n• Atletismo +14","grau":"Maestria +4"},{"tec":"Cópia","n":"Rika — Maestria +5","nv":7,"pas":false,"k":"Invocação","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"10 PE","reg":"Rika tem turno próprio (uma ação, movimento e uma reação por rodada). A ficha evolui com o bônus de maestria do usuário.","d":"Pontos de Vida: 130 Classe de Armadura: 22 Movimento: 12 Metros\nForça 26 Destreza 16 Constituição 22 Inteligência 10 Sabedoria 10 Carisma 16\nAções:\n• Mordida. Rika avança e desfere uma potente mordida em uma criatura. Alcance de 3 metros, +18 para acertar, causa 4d10+8 de dano perfurante.\n• Disparo de Energia. Alcance de 18 metros, +18 para acertar, causa 4d8+8 de dano de força.\n• Repor Energia. Rika repõe a energia do seu portador, recuperando uma quantidade de pontos de energia amaldiçoada igual a metade do nível de personagem do seu portador. Essa ação só pode ser usada uma vez por descanso longo.\nCaracterísticas:\n• Armazém Amaldiçoado. Rika pode armazenar itens, com um limite de espaços igual ao modificador de Força dela. Você pode, como uma ação bônus, retirar um item dela. Para usar essa característica, não é necessário que ela esteja invocada.\n• Paixão Raivosa. O laço de Rika com seu portador se torna mais intenso. Caso o usuário de Rika esteja com menos da metade da vida, Rika recebe vantagem em todas suas rolagens enquanto ele não for curado.\n• Proteção Apaixonada. Uma vez por descanso curto ou longo, caso o portador de Rika for ter os seus pontos de vida reduzidos a 0, Rika intervém, negando o dano do ataque o derrubaria e recebendo metade dele. Essa característica ativa mesmo se ela não estiver invocada.\nPerícias:\n• Atletismo +18","grau":"Maestria +5"},{"tec":"Cópia","n":"Rika — Maestria +6","nv":7,"pas":false,"k":"Invocação","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"12 PE","reg":"Rika tem turno próprio (uma ação, movimento e uma reação por rodada). A ficha evolui com o bônus de maestria do usuário.","d":"Pontos de Vida: 210 Classe de Armadura: 25 Movimento: 15 Metros\nForça 30 Destreza 20 Constituição 30 Inteligência 10 Sabedoria 10 Carisma 20\nAções:\n• Mordida. Rika avança e desfere uma potente mordida em uma criatura. Alcance de 4,5 metros, +22 para acertar, causa 4d12+20 de dano perfurante.\n• Disparo de Energia. Alcance de 36 metros, +22 para acertar, causa 4d10+20 de dano de força.\n• Repor Energia. Rika repõe a energia do seu portador, recuperando uma quantidade de pontos de energia amaldiçoada igual ao do nível de personagem do seu portador. Essa ação só pode ser usada uma vez por descanso longo.\nCaracterísticas:\n• Armazém Amaldiçoado. Rika pode armazenar itens, com um limite de espaços igual ao modificador de Força dela. Você pode, como uma ação bônus, retirar um item dela. Para usar essa característica, não é necessário que ela esteja invocada.\n• Paixão Raivosa. O laço de Rika com seu portador se torna mais intenso. Caso o usuário de Rika esteja com menos da metade da vida, Rika recebe vantagem em todas suas rolagens enquanto ele não for curado.\n• Proteção Apaixonada. Uma vez por descanso curto ou longo, caso o portador de Rika ha. Na Dez Sombras, é também o custo do Ritual de Exorcismo (Ação Comum) usado para obter o shikigami.","d":"Pontos de Vida: 25 Classe de Armadura: 18 Movimento: 9 Metros\nForça 16 Destreza 14 Constituição 10 Inteligência 6 Sabedoria 6 Carisma 6\nAções:\n• Segurar [Simples]. O sapo dispara a sua língua para tentar agarrar um alvo. Alcance de 9 metros, realiza uma rolagem de Luta contra o Atletismo do alvo e, caso vença, a criatura recebe a condição agarrado, podendo repetir o teste no começo de cada turno dela para escapar.\n• Arremessar [Complexa]. Após segurar uma criatura, o sapo pode a arremessar, jogando-a em um ponto desocupado dentro de 6 metros, desfazendo o agarrão. A criatura arremessada recebe 2d6+3 de dano de impacto e deve realizar um TR de Reflexos, ficando caída em uma falha.\n• Fora de Risco [Reação]. O sapo reage rapidamente para proteger uma criatura próxima de um ataque. Alcance de 4,5 metros. O sapo, como uma reação, tenta puxar a criatura para fora do rumo de um ataque, realizando uma rolagem de Reflexos contra o acerto do ataque e, caso supere, nega o ataque para a criatura e a deixa em um espaço desocupado dentro de 3 metros.\nPerícias:\n• Reflexos +4, Luta +5","grau":"4° Grau"},{"tec":"Dez Sombras","n":"Grande Serpente","nv":7,"pas":false,"k":"Invocação","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"4 PE","reg":"Custo da invocação, conforme a ficha. Na Dez Sombras, é também o custo do Ritual de Exorcismo (Ação Comum) usado para obter o shikigami.","d":"Pontos de Vida: 25 Classe de Armadura: 19 Movimento: 10,5 Metros\nForça 14 Destreza 16 Constituição 10 Inteligência 6 Sabedoria 6 Carisma 6\nAções:\n• Entrelaçar [Simples]. A grande serpente tenta se entrelaçar em um alvo, realizando uma rolagem de Luta contra o Atletismo do alvo, dando-o a condição agarrado caso suceda. Uma criatura agarrada pela grande serpente pode repetir o teste no começo do seu turno para tentar escapar, contra a acrobacia da serpente.\n• Mordida [Complexa]. A grande serpente avança para morder. Alcance 3 metros, +5 para acertar, causa 2d8+3 de dano perfurante.\nCaracterísticas\n• Flexível. A grande serpente tem um corpo muito flexível, recebendo +2 em rolagens de acrobacia.\n• Grande. A grande serpente conta como uma categoria acima, sendo uma criatura grande.\nPerícias:\n• Acrobacia +7, Reflexos +5, Luta +5","grau":"4° Grau"},{"tec":"Dez Sombras","n":"Elefante Máximo","nv":7,"pas":false,"k":"Invocação","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"7 PE","reg":"Custo da invocação, conforme a ficha. Na Dez Sombras, é também o custo do Ritual de Exorcismo (Ação Comum) usado para obter o shikigami.","d":"Pontos de Vida: 80 Classe de Armadura: 22 Movimento: 6 Metros\nForça 18 Destreza 7 Constituição 20 Inteligência 6 Sabedoria 6 Carisma 6\nAções:\n• Golpe com Tromba [Complexa]. Golpeia com a tromba. Alcance 3 metros, +6 para acertar, causa 2d12+4 de dano de impacto.\n• Torrente de Água [Complexa]. Dispara uma torrente potente de água. Alcance de 12 metros, o alvo deve realizar um teste de resistência de Fortitude, recebendo 2d10+4 de dano de impacto em uma falha, ou apenas metade em um sucesso. Caso falhe, a criatura também é empurrada 4,5 metros para trás.\nCaracterísticas\n• Defesa Alternativa (Constituição). O elefante máximo usa o seu valor de Constituição na sua Classe de Armadura, ao invés de destreza.\n• Grande. O elefante máximo conta como uma categoria acima, sendo uma criatura grande.\n• Robustez. O máximo de pontos de vida do elefante máximo aumenta em 10.\nPerícias:\n• Atletismo +6, Fortitude +7, Luta +6","grau":"3° Grau"},{"tec":"Dez Sombras","n":"Cervo Circular","nv":7,"pas":false,"k":"Invocação","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"7 PE","reg":"Custo da invocação, conforme a ficha. Na Dez Sombras, é também o custo do Ritual de Exorcismo (Ação Comum) usado para obter o shikigami.","d":"Pontos de Vida: 70 Classe de Armadura: 17 Movimento: 6 Metros\nForça 14 Destreza 8 Constituição 14 Inteligência 6 Sabedoria 10 Carisma 20\nAções:\n• Cura Concentrada [Complexa]. O Cervo concentra sua liberação de energia reversa em um único alvo dentro de 4,5 metros, curando-o em 3d10+5 pontos de vida.\n• Liberar Energia Reversa [Complexa]. O Cervo libera energia reversa dispersa, curando toda criatura dentro de 3 metros em 2d12+5 pontos de vida.\nCaracterísticas\n• Fluxo Reverso. Energia amaldiçoada não pode afetar objetos dentro de 3 metros do Cervo Circular. Toda criatura dentro do alcance também recebe +6 em testes para resistir a efeitos de técnicas amaldiçoadas.\n• Grande. O Cervo Circular conta como uma categoria acima, sendo uma criatura grande.\nPerícias:\n• Atletismo +5, Luta +5, Medicina +5, Vontade +7","grau":"2° Grau"},{"tec":"Dez Sombras","n":"Touro Perfurante","nv":7,"pas":false,"k":"Invocação","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"6 PE","reg":"Custo da invocação, conforme a ficha. Na Dez Sombras, é também o custo do Ritual de Exorcismo (Ação Comum) usado para obter o shikigami.","d":"Pontos de Vida: 85 Classe de Armadura: 17 Movimento: 16,5 Metros\nForça 24 Destreza 8 Constituição 18 Inteligência 6 Sabedoria 6 Carisma 6\nAções:\n• Investida Perfurante [Complexa]. O Touro avança em uma investida perfurante e selvagem. Alcance de 1,5 metros, +9 para acertar, causa 2d10+7 de dano perfurante. Para cada 3 metros que o Touro se mover em linha reta, antes de realizar o ataque, causa 1d10 de dano adicional.\nCaracterísticas\n• Movimento Alternativo (Força). O Touro Perfurante usa força para calcular seu movimento, no lugar de destreza.\n• Grande. O Touro Perfurante conta como uma categoria acima, sendo uma criatura grande.\nPerícias:\n• Atletismo +9, Fortitude +6, Luta +9","grau":"2° Grau"},{"tec":"Dez Sombras","n":"General Divino Mahoraga","nv":7,"pas":false,"k":"Invocação","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"18 PE","reg":"Custo da invocação, conforme a ficha. Na Dez Sombras, é também o custo do Ritual de Exorcismo (Ação Comum) usado para obter o shikigami.","d":"Pontos de Vida: 200 Classe de Armadura: 26 Movimento: 9 Metros\nForça 24 Destreza 14 Constituição 22 Inteligência 8 Sabedoria 12 Carisma 8\nAções:\n• Golpe com Punho [Complexa]. Mahoraga golpeia com seu punho, 3 metros de alcance, +9 para acertar, causa 4d12+7 de dano de impacto.\n• Espada da Exterminação [Complexa]. Mahoraga ataca com sua lâmina. Alcance de 3 metros, um alvo, +9 para acertar, causa 4d12+7 de dano de energia reversa ou de força, a depender do alvo.\n• Regeneração [Complexa]. Mahoraga se regenera, recuperando 5d10+6 pontos de vida.\nCaracterísticas\n• Adaptação Defensiva. Mahoraga se adapta a danos. Uma rodada após receber dano de um tipo específico, Mahoraga se tornará resistente ao tipo de dano recebido; após mais uma rodada, ele se tornará imune. A resistência provinda dessa característica não pode ser ignorada.\n• Adaptação Ofensiva. Mahoraga adapta sua capacidade ofensiva para atingir inimigos. Ao atacar um alvo que não consiga acertar, Mahoraga recebe +5 de acerto contra o alvo, o qual continuará acumulando até acertar o primeiro ataque, mantendo os bônus contra o alvo específico após acertá-lo.\n• Burlar Defesas. Ao atingir um inimigo que possua alguma resistência ao seu dano, Mahoraga começará a se adaptar. Após uma rodada, os ataques de Mahoraga irão ignorar um nível de resistência e, após outra rodada, irão ignorar completamente.\n• Defesa Alternativa (Constituição). O Mahoraga usa o seu valor de Constituição na sua Classe de Armadura, ao invés de destreza.\n• Grande. O General Divino Mahoraga conta como uma categoria acima, sendo uma criatura grande.\n• Robustez. O máximo de pontos de vida do Mahoraga aumenta em 40.\nPerícias:\n• Atletismo +9, Acrobacia +4, Fortitude +8, Integridade +8, Luta +9, Reflexos +4","grau":"Grau Especial"},{"tec":"Dez Sombras","n":"Cão Divino – Totalidade","nv":7,"pas":false,"k":"Invocação","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"3 PE","reg":"Cu metros, +11 para acertar, causa 5d10+6 de dano chocante.\n• Cura Concentrada [Complexa]. Agito usa de energia reversa para curar um único alvo dentro de 4,5 metros, curando-o em 5d10+3 pontos de vida.\nCaracterísticas\n• Grande. Agito conta como uma categoria de tamanho acima.\n• Regeneração Superior. A regeneração de Agito é melhorada; quando receber dano Agito pode, como uma reação, curar-se em um valor igual ao da ação Cura Concentrada.\nPerícias:\n• Acrobacia +11, Reflexos +11, Luta +11, Medicina +8","grau":"2° Grau"},{"tec":"Sentença Mortal","n":"Juiz","nv":7,"pas":false,"k":"Invocação","exec":"","alc":"","alvo":"","dur":"","area":"","custo":"2 PE","reg":"Custo de invocação conforme a ficha.","d":"Pontos de Vida: 15 Classe de Armadura: 14 Movimento: 6 Metros\nForça 6 Destreza 6 Constituição 6 Inteligência 12 Sabedoria 16 Carisma 12\nCaracterísticas:\n• Conhecimento do Juiz. O Juiz sempre tem os conhecimentos necessários para observar um julgamento e dar um veredito, sabendo todas as informações sobre qualquer criatura colocada na expansão de domínio Sentença Mortal.\n• Autonomia. O Juiz certo nível de autonomia, mesmo sendo um shikigami dependente de uma técnica. Ele é capaz de comunicação verbal clara, assim como apresentar emoções.\nPerícias:\n• Astúcia +5","grau":"4° Grau"}],"EQ":{"ARM":[{"g":"Simples","s":"Corpo a Corpo","n":"Adaga","dano":"1d6 Pf","crit":"18","p":"Apunhaladora, arremessável [6/18m], fineza, leve, marcial, modular Ct","e":1,"k":1,"grp":"Faca"},{"g":"Simples","s":"Corpo a Corpo","n":"Bastão","dano":"1d6/1d8 Im","crit":"19","p":"Amplo, dupla, marcial, versátil","e":2,"k":1,"grp":"Bastão"},{"g":"Simples","s":"Corpo a Corpo","n":"Clava","dano":"1d8/1d10 Im","crit":"20","p":"Versátil","e":1,"k":1,"grp":"Bastão"},{"g":"Simples","s":"Corpo a Corpo","n":"Espada Curta","dano":"1d6 Ct","crit":"19","p":"Fineza, leve, marcial, modular Pf","e":1,"k":1,"grp":"Espada"},{"g":"Simples","s":"Corpo a Corpo","n":"Faixas","dano":"-","crit":"-","p":"Especial","e
