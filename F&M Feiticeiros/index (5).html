 sustentado à sua escolha como Ação Livre, desde que ele possua um custo de Ação Bônus ou inferior.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"DESTRUIÇÃO AMPLA","d":"Quanto mais você conseguir abranger em sua conjuração, mais você é capaz de destruir. Quando utilizar um Feitiço em área, ela causa 5 de dano adicional para cada criatura além da primeira que estiver sendo afetada por ela.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"DESTRUIÇÃO FOCADA","d":"Quando utilizar um Feitiço de dano de alvo único, ela ignora RD igual ao seu Modificador de Inteligência ou Sabedoria e tem seu dano aumentado em uma quantidade de dados igual a metade do seu bônus de treinamento.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":12,"n":"ESGRIMISTA JUJUTSU","d":"Você pode também utilizar um Feitiço Auxiliar tendo você mesmo como alvo, desde que seu custo padrão seja uma Ação Bônus.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Quando utilizar Combate Amaldiçoado","pre":"Combate Amaldiçoado"},{"l":12,"n":"EXPANSÃO MAESTRAL","d":"Você pode utilizar expansões de domínio possuindo apenas uma mão livre e ataques a distância não causam ataques de oportunidade contra você enquanto expandindo.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Aptidão Expansão de Domínio Completa"},{"l":12,"n":"EXPLOSÃO MÁXIMA","d":"Para cada resultado máximo que conseguir, além de rolar um dado adicional, você soma +4 ao total de dano.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Explosão Encadeada"},{"l":12,"n":"ECONOMIA DE ENERGIA AVANÇADA","d":"Os dados da energia colocada na economia aumentam para d6 em um descanso curto e d8 em um descanso longo. Colocar energia da economia no estoque atual agora é uma ação bônus.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Economia de Energia"},{"l":12,"n":"SENTIDOS AGUÇADOS","d":"Sua atenção aumenta em um valor igual a metade do seu bônus de Inteligência ou Sabedoria, e você adiciona o mesmo bônus a rolagens de Percepção. Além disso, você pode, ao estar no ar, se manter estável nele, de pé, usando dos seus sentidos para perceber o ar como uma plataforma.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"","pre":"Mestre em Percepção"},{"l":12,"n":"MESTRE DAS APTIDÕES","d":"Você recebe PE temporários igual a metade do seu Bônus de Treinamento, os quais podem ser utilizados exclusivamente no uso de Aptidões Amaldiçoadas. Estes pontos não podem acumular, mas são contabilizados separadamente de outros PEs temporários.","execucao":"Passiva","custo":"","alcance":"","gatilho":"No começo de toda rodada","pre":""},{"l":12,"n":"VERSATILIDADE AMPLIADA","d":"Todos seus Feitiços recebem 1 variação de liberação e você pode escolher um deles para ter uma variação de cada nível que você possua acesso.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"MANIPULAÇÃO PERFEITA","d":"Seu conhecimento sobre a manipulação de energia é melhorado, permitindo que você escolha uma quantidade de Feitiços igual ao seu bônus de treinamento para terem seu custo reduzido em um valor igual a metade dele.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Dominância em Habilidade"},{"l":16,"n":"SUSTENTAÇÃO MESTRE","d":"Você pode manter três feitiços sustentados ao invés de dois. Além disso, seu custo para sustentar feitiços é diminuído em 1, com um mínimo de 1.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Sustentação Avançada"}],"Controlador":[{"l":1,"n":"TREINAMENTO EM CONTROLE","d":"Ao obter esta habilidade, você: •  Recebe duas Invocações iniciais, as quais podem ser tanto shikigamis quanto corpos amaldiçoados. Nos níveis 3, 6, 9, 10, 12, 15 e 18 você recebe uma Invocação adicional. • A quantidade de Invocações que você pode manter ativas em campo aumenta em 1. • Nos níveis 6, 12 e 18 a quantidade de comandos que você realiza com uma Ação Comum e Bônus aumenta em um (no nível 6, uma Ação Comum permitiria duas Invocações realizarem uma ação complexa ou uma Invocação realizar duas ações complexas). 90","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"CONTROLE APRIMORADO","d":"Você é naturalmente mais capaz em comandar invocações, aprimorando o desempenho e aplicação delas. Suas invocações recebem um bônus em testes que realizarem igual a +2, aumentando em +1 para cada grau acima do quarto (+3 para terceiro, +4 para segundo etc.) Além disso, você pode utilizar Aptidões Amaldiçoadas das categorias Controle e Leitura a partir de suas Invocações, fazendo com que elas recebam os efeitos, como o aumento de dano de Canalizar em Golpe; entretanto, não é possível utilizar Punho Divergente e Emoção da Pétala Decadente a partir de Invocações.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"APOGEU","d":"Escolha entre: •  Controle Concentrado. Você opta por concentrar suas forças e foco em uma única invocação, a qual sozinha se torna uma arma absoluta. Ao invés de invocar/ativar duas invocações como uma ação bônus, você pode invocar apenas uma como ação livre. • Controle Disperso. Você prefere controlar diversas invocações, mantendo a quantidade sempre em número superior. O número de invocações que você pode manter ativas em campo aumenta em 1, assim como a quantidade que você pode invocar/ativar com uma ação aumenta em 1. Além disso, você recebe acesso à ação Criar Horda (p.259). A partir do nível 12, o número de invocações que você pode manter ativas em campo e invocar/ativar com uma ação aumenta em 1, assim como você pode criar duas hordas como parte de uma mesma ação de Criar Horda. • Controle Sintonizado. Você prefere ficar em sintonia com suas invocações, não deixando que apenas elas lutem sozinhas. Uma vez por rodada, quando uma invocação em campo realizar um ataque contra um alvo dentro do seu alcance, você pode pagar 2PE para, como uma Ação Livre, realizar um ataque contra o mesmo alvo. Além disso, para cada invocação que possua em campo, você recebe +1 em acerto e dano, com elas te auxiliando.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":9,"n":"TESTE DE RESISTÊNCIA MESTRE","d":"Você se torna treinado em um segundo teste de resistência e mestre no concedido pela sua especialização.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"RESERVA PARA INVOCAÇÃO","d":"Uma vez por descanso curto, você pode optar por usar a ação Invocar para trazer duas invocações com o custo reduzido pela metade ou uma invocação sem custo. Caso utilize esta habilidade para Criar Horda, o custo total dela é reduzido pela metade.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":20,"n":"ÁPICE DO CONTROLE","d":"Suas invocações recebem duas ações/características adicionais, as quais não influenciam no custo delas; você passa a poder invocar ou ativar suas invocações como uma ação livre (caso ela já pudesse ser invocada como Ação Livre, ela tem seu custo reduzido em 2 PE). Além disso, conhecendo bem as táticas para utilizar invocações, você consegue prever parte dos movimentos delas: invocações de outras criaturas possuem desvantagem para realizar ações ofensivas contra você. 91","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"ACELERAÇÃO","d":"Estimulando-as com seus comandos, você é capaz de forçar uma aceleração maior em invocações. Uma vez por rodada, você pode fazer com que uma Invocação se mova duas vezes ao invés de uma.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"CAMUFLAGEM APRIMORADA","d":"Você pode camuflar-se em meio as suas invocações adjacentes a você: para cada Invocação, todo ataque feito contra você tem 10% de chance de errar (1 em 1d10). Essa camuflagem dura até que não haja mais invocações adjacentes, e a chance de erro é diminuída conforme as invocações deixam de estar adjacentes.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"CHAMADO DESTRUIDOR","d":"Um acerto preciso de uma invocação incentiva as outras a acompanhar, como um chamado destrutivo. Quando uma das suas invocações conseguir um acerto crítico em uma ação de ataque você pode fazer com que uma das suas invocações adjacentes ataque o mesmo alvo que recebeu o crítico.","execucao":"Ação Livre","custo":"2 PE","alcance":"","gatilho":"","pre":""},{"l":2,"n":"COMPANHEIRO AMALDIÇOADO","d":"Escolha uma invocação sua: ela se torna o seu companheiro amaldiçoado. Uma vez por rodada, a invocação escolhida pode utilizar Apoiar como Ação Livre. Durante um descanso ou interlúdio, você pode alternar a invocação que é seu companheiro amaldiçoado, caso a invocação escolhida anteriormente tenha sido exorcizada.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"DOR PARTILHADA","d":"Você e uma invocação conseguem criar um laço para partilhar dor, e isso pode acabar amenizando-a. Você pode escolher formar um laço com uma delas: caso você e a invocação escolhida com o laço fossem receber quantidades diferentes de dano de uma mesma habilidade em área, ambos recebem o menor entre os dois valores de dano.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Quando utilizar a ação Invocar","pre":""},{"l":2,"n":"FRENESI DA INVOCAÇÃO","d":"Uma vez por rodada, quando uma invocação realizar uma ação de ataque, você pode fazer com que ela realize essa ação duas vezes, ao invés de uma; com exceção de Ações com Custo. Mas, por uma rodada, ataques contra ela terão vantagem e ela terá a sua Defesa reduzida em 5 e -5 em testes de resistência.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"GUARDA VIVA","d":"Suas invocações atuam como uma guarda viva para você, auxiliando em sua defesa. Para cada Invocação que estiver, sua Defesa aumenta em 1.","execucao":"Passiva","custo":"","alcance":"3 m","gatilho":"","pre":""},{"l":2,"n":"INVOCAÇÕES MÓVEIS","d":"O Deslocamento de todas suas Invocações aumenta em 1,5 metros. Nos níveis 6, 12 e 18 elas recebem +1,5 metros. INVOCAÇÕES RESISTENTES Você torna suas invocações mais resistentes, amplificando a vitalidade delas. Os Pontos de Vida Máximos de todas suas Invocações aumentam em um valor igual ao seu Bônus de Treinamento multiplicado por cinco.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"INVOCAÇÕES TREINADAS","d":"Todas suas Invocações se tornam treinadas em uma quantidade de Perícias adicional igual a metade do seu bônus de treinamento.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"MELHORIA DE CONTROLADOR","d":"Ao obter esta habilidade, escolha uma das quatro melhorias especificadas no final da especialização. Você pode pegar essa habilidade quatro vezes, uma para cada melhoria.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"OTIMIZAÇÃO DE ENERGIA","d":"Você pode escolher uma habilidade com custo de cada invocação para ter esse custo reduzido em 1PE.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao adquirir essa habilidade e em um descanso curto ou longo","pre":""},{"l":2,"n":"PROTEGER INVOCAÇÃO","d":"Caso uma invocação sobre seu controle, dentro de um alcance igual a metade do Deslocamento de outra Invocação, vá receber dano suficiente para ser dissipada ou exorcizada, você pode gastar sua reação para fazer com que ela se mova até ficar adjacente a ela e receber esse dano por ela. Além disso, caso você esteja no alcance de ataque de uma invocação que foi atacada, você pode gastar sua reação também para reduzir o dano que ela receberá em um valor igual a Xd6 + seu modificador de Presença ou Sabedoria. X é igual ao seu bônus de treinamento.","execucao":"Reação","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"REDE DE DETECÇÃO","d":"Para cada invocação, você recebe +2 em rolagens de Percepção e seu valor de atenção aumenta em 2.","execucao":"Passiva","custo":"","alcance":"3 m","gatilho":"","pre":""},{"l":2,"n":"TÉCNICAS DE COMBATE","d":"Você pode escolher duas armas quaisquer para se tornar treinado, caso não seja, e para poder utilizar Presença ou Sabedoria nas jogadas de ataque e dano enquanto as manejando.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"VISIONÁRIO","d":"Você expande sua visão para a criação de invocações, conseguindo as conferir mais aspectos únicos. Sempre que for criar uma invocação, a quantidade de ações e/ ou características que ela pode receber aumenta em um valor igual a metade do seu bônus de treinamento. Colocar ações e/ou características adicionais através desta habilidade ainda aumenta o custo da invocação normalmente.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"AÇÃO CORRETIVA","d":"Quando uma invocação realizar uma rolagem de perícia e obter um valor menor do que 10 no dado, você pode transformar o resultado em um 10.","execucao":"Passiva","custo":"2 PE","alcance":"9 m","gatilho":"","pre":""},{"l":4,"n":"ACOMPANHAMENTO AMALDIÇOADO","d":"Uma das suas invocações pode ser colocada para o acompanhar de perto, reagindo aos seus golpes. Você pode escolher uma das invocações para o acompanhar. Quando realizar um ataque contra uma criatura que esteja dentro do seu alcance e do alcance da Invocação, ela pode gastar uma Reação para utilizar uma ação de ataque ou auxílio, tendo como alvo você ou a criatura atacada.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Quando utilizar Invocar","pre":""},{"l":4,"n":"ATAQUE EM CONJUNTO","d":"Uma vez por rodada você pode fazer com que todas as suas invocações ativas utilizem uma ação de ataque contra um mesmo alvo, cada invocação além da primeira. Para cada invocação participando do ataque em conjunto, todas recebem um bônus de +1 na jogada de ataque. Você pode, também, optar por participar do Ataque em Conjunto caso o alvo esteja no seu alcance. Você pode usar essa habilidade uma quantidade de vezes igual ao seu modificador de Sabedoria ou Presença por descanso longo.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"","pre":""},{"l":4,"n":"AUTONOMIA","d":"Assumindo uma abordagem diferente, você traz uma invocação a campo com autonomia, deixando-a agir de maneira independente enquanto foca em seu objetivo. Você pode pagar uma quantidade adicional de PE igual a 2 para cada grau dela (2 para quarto grau, 10 para grau especial). Caso o faça, aquela invocação recebe um turno próprio dentro de combate, no qual ela pode realizar uma ação por turno, além de se mover, sem a necessidade de comandos. A invocação irá seguir o que você desejar que ela faça, além de ainda contar para o seu número de invocações ativas e poder realizar outros comandos feitos durante o seu turno. COMPANHEIRO AVANÇADO O seu companheiro amaldiçoado se torna ainda mais avançado, conseguindo se versar em mais uma função, que é a de um aliado. Ao obter essa habilidade, o seu companheiro amaldiçoado se torna também um aliado de um tipo a sua escolha. Ele começa como um aliado iniciante. Os efeitos do companheiro como Aliado são aplicados a você ou ao aliado mais próximo da invocação, dentro de um alcance igual a metade do movimento dela. No nível 6 se torna um veterano e no nível 12 se torna um mestre. Pré-Requisito: Companheiro Amaldiçoado.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao ativar uma invocação","pre":""},{"l":4,"n":"CRÍTICO BRUTAL","d":"A brutalidade de um golpe bem encaixado por uma invocação é ampliada. Os acertos críticos da sua invocação causam 1 dado de dano adicional e, quando causar um crítico em uma criatura, você pode escolher diminuir o Deslocamento dela em um valor igual a 1,5 metros multiplicado pelo seu Bônus de Treinamento ou diminuir a Defesa dela em um valor igual a metade do seu Bônus de Treinamento. Qualquer um dos prejuízos dura até o começo do seu próximo turno.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"DOMADOR DE MALDIÇÕES","d":"Você possui vantagem em todas as rolagens envolvidas no processo, além de poder anular sua primeira falha, tendo outra chance.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Sempre que estiver no processo de domar uma maldição","pre":""},{"l":4,"n":"INVOCAÇÃO ÀS","d":"Seu companheiro amaldiçoado se torna também a sua invocação às, capaz de o ajudar grandemente. Quando obter esta habilidade, a Invocação escolhida como companheiro amaldiçoado recebe os benefícios detalhados no final da especialização. Pré-Requisito: Companheiro Amaldiçoado.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"INVOCAÇÃO PARCIAL","d":"Nem sempre é necessário trazer uma invocação por completo para se beneficiar de suas capacidades. Você pode utilizar de suas ações para realizar a ação de uma invocação que não esteja ativa; como uma ação comum, você utiliza uma ação complexa ou uma ação simples, de uma invocação a sua escolha.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"POTENCIAL SUPERIOR","d":"Todas suas invocações recebem 2 pontos de atributo adicionais por grau (2 para quatro grau, 10 para grau especial).","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"COMBATE EM ALCATEIA","d":"Enquanto manejando uma arma escolhida em Técnicas de Combate, você tem seu dano com ela aumentado em 1 nível para cada Invocação que esteja com a criatura no alcance de ataque dela.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Técnicas de Combate e Apogeu - Controle Sintonizado."},{"l":6,"n":"CONCENTRAR PODER","d":"Priorizando qualidade acima de quantidade, você consegue concentrar o poder em uma única invocação. Enquanto estiver com apenas uma invocação em campo, você recebe benefícios de acordo com o seu nível de personagem, indicando o quanto a quantidade reduzida a aprimora. Você pode encontrar os benefícios e detalhes no final da especialização.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Apogeu Controle Concentrado"},{"l":6,"n":"HOSTE AMALDIÇOADA","d":"Ao utilizar Criar Horda, durante o processo de criação você pode escolher por reduzir o limite de grau do Líder em 1 para criar duas hordas ao invés de uma. As hordas criadas desta maneira contam como apenas uma para o seu limite de hordas em campo.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Apogeu - Controle Disperso"},{"l":6,"n":"INVOCAÇÕES ECONÔMICAS","d":"Você pode escolher duas invocações para terem o seu custo da invocação ou ativação reduzido em 2. No nível 12 você pode escolher mais uma, assim como no nível 18.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"PROTEÇÃO AVANÇADA DE INVOCAÇÃO","d":"Você receberá apenas metade do dano total. Além disso, a reação para reduzir dano normal tem seu valor aumentado para Xd8. Caso esteja adjacente a invocação você pode, ao invés do padrão, utilizar o efeito como Ação Livre. Pré-Requisito: Proteger Invocação.","execucao":"Ação Livre","custo":"2 PE","alcance":"","gatilho":"Quando usar sua reação para receber dano por sua invocação","pre":""},{"l":6,"n":"TÁTICAS DE ALCATEIA","d":"Caso tenha uma criatura agressiva sendo flanqueada por uma das suas invocações, a Defesa dela diminui em um valor igual a metade seu bônus de treinamento, e ele recebe uma penalidade em todos os testes de resistência com o mesmo valor.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":8,"n":"APTIDÕES DE CONTROLE","d":"Você pode aumentar o seu nível de aptidão em Aura, Controle e Leitura ou Barreira em 1. Você pode pegar esta habilidade três vezes, uma para cada aptidão.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":8,"n":"ATACAR E INVOCAR","d":"Priorizando um combate próximo e em meio as suas invocações, você consegue trazê-las junto de um golpe. Você pode trazer uma invocação ao campo, considerando como se ela já estivesse presente para efeitos e uso de habilidades, como Acompanhamento Amaldiçoado.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"Quando você utilizar a ação Atacar","pre":""},{"l":10,"n":"BUCHAS DE CANHÃO","d":"Você não precisa mais pagar PEs adicionais para colocar invocações de quarto grau como membros de uma horda ou invocá-la.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"CRÍTICO APRIMORADO","d":"Um 19 se torna crítico também para suas invocações. Ao conseguir um crítico você pode, também, escolher entre os seguintes efeitos: diminuir o acerto do inimigo em um valor igual a metade do seu bônus de treinamento ou diminuir todas as RDs dele em um valor igual ao seu bônus de treinamento. Além disso, você escolhe dois efeitos ao invés de apenas um. PréRequisito: Crítico Brutal.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"GOLPES ÁGEIS","d":"Uma vez por rodada, quando uma Invocação sua utilizar o efeito de Acompanhamento Amaldiçoado, você pode realizar um ataque armado ou desarmado adicional.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"","pre":"Acompanhento Amaldiçoado"},{"l":10,"n":"TÉCNICAS DE OPORTUNIDADE","d":"Após obter essa habilidade, suas invocações passam a poder usar Ações de Ataque como uma reação, seguindo o mesmo gatilho de um ataque de oportunidade. Não é possível utilizar Ações com Custo como oportunidade.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"FLANCO AVANÇADO","d":"Caso tenha uma criatura agressiva dentro do alcance de ação de pelo menos duas de suas invocações, além de receber os efeitos da habilidade Táticas de Alcateia, sempre que essa criatura recebe um ataque, ela recebe 1d8 de dano adicional, aumentando em +1d8 para cada invocação além das duas primeiras. Pré-Requisito: Táticas de Alcateia.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"RESISTÊNCIA SOBRECARREGADA","d":"Você pode sobrecarregar a resistência das suas invocações a partir da sua própria energia amaldiçoada. Você pode gastar uma quantidade de PE igual a metade do seu bônus de treinamento e, para cada ponto gasto, a invocação tem seus pontos de vida aumentados em 10. Pré-Requisito: Invocações Resistentes.","execucao":"Passiva","custo":"Variável","alcance":"","gatilho":"Ao ativar ou invocar uma invocação","pre":""},{"l":16,"n":"FANTOCHE SUPREMO","d":"Durante um descanso, você é capaz de reforçar o poderio de uma invocação que pareça que será essencial. Você pode, durante um descanso longo, escolher uma Invocação para ser o seu Fantoche Supremo, o qual recebe os seguintes benefícios: os pontos de vida da invocação aumentam em um valor igual ao seu bônus de treinamento multiplicado por cinco; a Defesa da invocação aumenta em um valor igual ao dobro do seu bônus de treinamento; o movimento da invocação aumenta em 4,5 metros e ela pode realizar uma ação complexa adicional todo turno. Porém, você só pode Invocar o seu fantoche supremo uma vez por descanso longo.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"MESTRE DO CONTROLE","d":"Uma vez por rodada você pode fazer com que uma invocação sua se mova e realize uma ação complexa adicional.","execucao":"Ação Livre","custo":"2 PE","alcance":"","gatilho":"","pre":""}],"Suporte":[{"l":1,"n":"SUPORTE EM COMBATE","d":"Um suporte dispõe de um leque de capacidades que o permite auxiliar dentro do combate: •  Você pode usar Apoiar como uma ação bônus. • Você pode, como uma ação bônus, curar uma criatura em alcance de toque em um valor igual a 2d6 + seu modificador de Presença ou Sabedoria, uma quantidade de vezes igual ao seu modificador de Presença ou Sabedoria, por descanso curto ou longo. No nível 4, essa cura se torna 2d12, no nível 8, se torna 3d12, no nível 12 se torna 6d8, no nível 16 se torna 6d10.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":3,"n":"PRESENÇA INSPIRADORA","d":"Você pode fazer com que, durante uma cena, todo aliado fique inspirado. Um aliado inspirado recebe um bônus de +1 em toda rolagem de perícia. Ao utilizar esta habilidade, você pode gastar uma quantidade de PE adicional igual a metade do seu modificador de Presença, aumentando o bônus em +1 para cada PE gasto dessa maneira. 102","b":1,"execucao":"Passiva","custo":"2 PE","alcance":"9 m","gatilho":"","pre":""},{"l":5,"n":"VERSATILIDADE","d":"Você pode considerar como se fosse treinado. Você pode utilizar esta habilidade uma quantidade de vezes igual ao seu modificador de Sabedoria, por descanso curto ou longo.","b":1,"execucao":"Passiva","custo":"1 PE","alcance":"","gatilho":"Sempre que realizar uma rolagem com uma perícia na qual você não seja treinado","pre":""},{"l":9,"n":"TESTE DE RESISTÊNCIA MESTRE","d":"Você se torna treinado em um segundo teste de resistência e mestre no concedido pela sua especialização.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"MEDICINA INFALÍVEL","d":"Uma quantidade de vezes igual a metade do seu nível de Suporte + bônus de treinamento, você pode, quando realizar uma rolagem para curar uma criatura, maximizar o valor de um dos dados dessa cura; você pode gastar vários usos para maximizar mais de um dado da mesma cura. Você recupera os usos após um descanso curto ou longo. Além disso, você soma o seu bônus de treinamento no total de toda cura que realizar.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":20,"n":"SUPORTE ABSOLUTO","d":"Uma vez por rodada, você pode utilizar Apoiar como uma Ação Livre. Além disso, sua quantidade de usos da habilidade Suporte em Combate são dobrados e você soma seu modificador de atributo escolhido para CD de especialização em toda cura que realizar. 103","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"AMIZADE INQUEBRÁVEL","d":"Este aliado é considerado permanentemente seu “Amigo”. Você pode como ação livre realizar a Ação “Apoiar” no mesmo. Caso o Amigo morra, você só pode escolher outro amigo no próximo interlúdio.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao terminar seu turno ao lado de seu Amigo","pre":""},{"l":2,"n":"ANÁLISE PROFUNDA","d":"Você pode analisar uma criatura, realizando uma rolagem de Percepção com CD igual a 15 + ND da criatura. Caso você suceda, você descobre uma característica dela (pontos de vida, bônus em perícia ou ataque, por exemplo). Para cada 5 pontos excedentes no resultado do teste, você descobre uma característica adicional. Você só pode usar essa habilidade uma vez em cada criatura, por cena.","execucao":"Passiva","custo":"1 PE","alcance":"","gatilho":"","pre":""},{"l":2,"n":"APOIO AVANÇADO","d":"Você pode fortalecer seu apoio com um efeito à sua escolha, com as possibilidades listadas no final da especialização.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao utilizar a ação de Apoiar","pre":""},{"l":2,"n":"CONCEDER OUTRA CHANCE","d":"Você pode conceder a um aliado outra chance em um teste no qual ele falhou. Ao ver um aliado falhar em um teste, você pode fazer com que ele role novamente, ficando com o melhor resultado. Você pode utilizar essa habilidade uma quantidade de vezes igual ao seu bônus de treinamento, por descanso longo; em um descanso curto, você recupera metade dos usos. TE ebe uma habilidade de suporte a sua escolha. o para poder obter a habilidade.","execucao":"Passiva","custo":"3 PE","alcance":"6 m","gatilho":"","pre":""},{"l":2,"n":"COMANDO MOTIVADOR","d":"Sua presença é motivadora, e o mesmo vale para um comando dado por você. Você pode falar um comando para um aliado e que, quando o aliado realize a ação comandada, ele receba um bônus igual ao seu bônus de treinamento na rolagem usada na ação.","execucao":"Ação Livre","custo":"2 PE","alcance":"","gatilho":"","pre":""},{"l":2,"n":"DESVENDAR TERRENO","d":"Realize um teste de Percepção com CD definida pelo Narrador e, caso suceda, você percebe pontos estratégicos sobre ele (como coberturas, terrenos difíceis e outros) e, até o final da cena, recebe um bônus igual ao seu bônus de treinamento em testes de Percepção que envolvam procurar e encontrar coisas ou pessoas no terreno analisado.","execucao":"Ação de Movimento","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"EXPANDIR REPERTÓRIO","d":"Você se torna treinado em uma quantidade de perícias igual a metade do seu bônus de treinamento. Você recebe também um bônus de +2 em uma perícia qualquer.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"MOBILIDADE AVANÇADA","d":"Em prol de alcançar mais rapidamente o lugar onde seu suporte é requisitado você recebe um bônus de +3 metros em seu movimento. Além disso, caso um aliado caia nas portas da morte, você pode mover-se metade do seu movimento na direção dele.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"OTIMIZAÇÃO DE ESPAÇO","d":"Você recebe espaços de item adicionais no seu inventário, em um valor igual ao seu bônus de treinamento.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"PRONTO PARA AGIR","d":"Além disso, seus aliados recebem um bônus igual a metade do modificador.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"PROTETOR","d":"Quando um aliado é atacado, você pode diminuir o dano causado no ataque feito contra ele em Xd10 + seu modificador de Presença ou sabedoria, onde X é igual ao seu bônus de treinamento. É necessário estar com um escudo equipado para utilizar esta habilidade.","execucao":"Ação Livre","custo":"1 PE","alcance":"1,5 m","gatilho":"","pre":""},{"l":2,"n":"TÉCNICAS DE COMBATE","d":"Você pode escolher duas armas quaisquer para se tornar treinado, caso não seja, e para poder utilizar Presença ou Sabedoria nas jogadas de ataque e dano enquanto as manejando.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"TRANSMITIR CONHECIMENTO","d":"Durante um descanso, você pode transmitir conhecimento para seus aliados, preparando-os. Durante um descanso curto, você pode conceder treinamento temporário em perícias com as quais você seja treinado para seus aliados, com um limite igual a metade do seu bônus de treinamento. Durante um descanso longo, essa quantidade é igual a bônus de treinamento.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"APOIOS VERSÁTEIS","d":"No 10° nível você recebe outro apoio avançado.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"GUARDA SINCRONIZADA","d":"Você pode sintonizar a guarda de todos seus aliados que possam te ver ou ouvir: para cada aliado dentro do alcance, todos os outros recebem +1 na Defesa.","execucao":"Ação Bônus","custo":"","alcance":"7,5 m","gatilho":"","pre":""},{"l":4,"n":"INSPIRAR ALIADOS","d":"Você sabe como dar a inspiração necessária para os seus aliados. Uma vez por cena, você pode inspirar uma quantidade de aliados igual a metade do seu bônus de treinamento. Uma quantidade de vezes igual ao seu modificador de presença ou sabedoria, dentro de 10 minutos, esses aliados podem escolher adicionar 2d3 em uma jogada de ataque, teste de habilidade ou teste de resistência, mas apenas uma vez por teste.","execucao":"Ação Bônus","custo":"1 PE","alcance":"","gatilho":"","pre":""},{"l":4,"n":"INTERVENÇÃO","d":"Você pode encerrar uma condição fraca afetando um aliado dentro de alcance de toque. Nos níveis 6, 12 e 18 você se torna capaz de encerrar condições médias, fortes e extremas respectivamente, com o custo em PE aumentando em 3 para cada nível superior a fraca.","execucao":"Ação Comum","custo":"3 PE","alcance":"Toque","gatilho":"","pre":""},{"l":4,"n":"NEGAÇÃO CRÍTICA","d":"Uma quantidade de vezes igual a 1 + metade do seu bônus de treinamento, por cena, você pode negar uma falha crítica que você possa ver.","execucao":"Passiva","custo":"3 PE","alcance":"12 m","gatilho":"","pre":""},{"l":4,"n":"NO ÚLTIMO SEGUNDO","d":"Ao iniciar uma rodada com um ou mais aliados com 2 fracassos nos testes da porta da morte, aumente sua iniciativa atual em combate em +5. Caso você aja primeiro que um dos seus aliados nas portas da morte por causa deste bônus de iniciativa, você anula terreno difícil, tem seu movimento aumentado em 4,5m e recebe +5 de Defesa contra Ataques de Oportunidade durante a rodada.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"PRÉ-ANÁLISE","d":"Você inconscientemente analisa o território a sua volta, sendo assim você não pode ser surpreendido e seu valor de atenção recebe um bônus de +5. Você pode escolher um aliado para não ser surpreendido.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Treinado em Percepção"},{"l":4,"n":"RECOMPENSA PELO SUCESSO","d":"Você pode escolher reduzir o bônus fornecido por ela pela metade e, caso o aliado motivado ainda assim consiga suceder, ele ganha 2 PE.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao utilizar Comando Motivador","pre":"Comando Motivador"},{"l":4,"n":"SINTONIZAÇÃO VITAL","d":"Você pode que outra criatura (incluindo você) recupere uma quantidade de pontos de vida igual a metade da cura original.","execucao":"Passiva","custo":"3 PE","alcance":"3 m","gatilho":"Quando curar um aliado","pre":""},{"l":6,"n":"CONTRA-ATAQUE","d":"Uma quantidade de vezes igual ao dobro do seu modificador de Presença ou Sabedoria, por descanso curto ou longo, você pode, como uma reação, gastar 1 ponto de energia amaldiçoada para aumentar a Defesa de um aliado em um valor igual ao seu bônus de treinamento e, se você fizer com que um ataque que iria acertar se torne um erro, você ou o aliado protegido podem pagar 1 ponto de energia amaldiçoada para realizar um ataque contra o inimigo.","execucao":"Reação","custo":"1 PE","alcance":"","gatilho":"","pre":""},{"l":6,"n":"CURA AVANÇADA EM GRUPO","d":"Você pode usar sua habilidade de cura em grupo: quando a utilizar em um alvo, você pode curar mais um alvo, com um limite igual ao seu bônus de treinamento.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"","pre":""},{"l":6,"n":"DEVOLVER NA MESMA MOEDA","d":"Você pode fazer com que o próximo teste de resistência realizado por um inimigo para evitar uma condição do aliado possua desvantagem.","execucao":"Ação Livre","custo":"2 PE","alcance":"","gatilho":"Quando um aliado que você possa ver é afetado por uma condição","pre":""},{"l":6,"n":"DISSEMINAR CURA","d":"Você pode escolher um alvo adicional, gastando uma quantidade de PE igual ao nível da técnica adicional.","execucao":"Passiva","custo":"Variável","alcance":"","gatilho":"Ao utilizar um Feitiço de cura","pre":""},{"l":6,"n":"INCITAR VIGOR","d":"Você pode fazer com que uma criatura a alcance de toque possa gastar seus dados de vida para se curar.","execucao":"Ação Bônus","custo":"3 PE","alcance":"Toque","gatilho":"","pre":""},{"l":6,"n":"INIMIGO COMUM","d":"Você pode escolher um inimigo comum entre uma quantidade de pessoas igual ao seu modificador de Presença ou sabedoria. Sempre que uma pessoa atacar o inimigo em comum, adiciona-se metade do seu bônus de Presença ou sabedoria na rolagem de acerto e o modificador inteiro nas rolagens de dano. Caso uma das pessoas escolhida ataque uma criatura que não for o inimigo comum, e o inimigo comum estiver vivo, ela para de receber os bônus.","execucao":"Ação Bônus","custo":"2 PE","alcance":"","gatilho":"","pre":""},{"l":6,"n":"POSICIONAMENTO ESTRATÉGICO","d":"Durante o seu turno, você pode deixar de se mover (reduzir seu movimento a 0), para permitir que um dos seus aliados se mova, como Ação Livre.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":8,"n":"APTIDÕES DE SUPORTE","d":"Você pode aumentar o seu nível de aptidão em Aura, Controle e Leitura ou Energia Reversa em 1. Você pode pegar esta habilidade três vezes, uma para cada aptidão.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":8,"n":"CONTAMINAR COM DETERMINAÇÃO","d":"Uma vez por cena, você pode fazer com que você e dois aliados recebam vantagem em todo teste de resistência por duas rodadas. Você pode fazer com que mais aliados recebam vantagem, mas para cada aliado a mais, o custo da habilidade aumenta em 2 pontos de energia.","execucao":"Passiva","custo":"4 PE","alcance":"","gatilho":"","pre":""},{"l":8,"n":"CRIAR MEDICINA","d":"Durante um descanso curto, você pode escolher recuperar 2 pontos de energia a menos para criar uma quantidade de remédios igual a metade do seu bônus de treinamento; em um descanso longo, a quantidade é igual ao seu bônus de treinamento e você recupera 4 pontos de energia a menos. Um remédio cura em um valor igual a sua cura da habilidade Suporte em Combate, dura 1 dia e consome uma ação comum para ser usado.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Treinado em Ferramentas de Médico"},{"l":8,"n":"CURA APERFEIÇOADA","d":"Caso você tire 1 ou 2 em um dado de cura, você pode escolher rolar novamente o dado, ficando com o melhor resultado.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":8,"n":"ELEVAR SUCESSO","d":"Quando um aliado suceder em um teste de resistência você pode somar +5 ao resultado do teste dele, com a possibilidade de se tornar um sucesso crítico.","execucao":"Reação","custo":"2 PE","alcance":"4,5 m","gatilho":"Quando um aliado dentro de 4","pre":""},{"l":8,"n":"FÍSICO CONTROLADO","d":"Você passa a somar seu modificador de presença ou de sabedoria, ao invés de constituição, nos pontos de vida, mas com um limite de +4. Você calcula novamente a sua vida, levando em conta a alteração do atributo usado.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao adquirir essa habilidade","pre":"Treinado em Fortitude"},{"l":8,"n":"MOTIVAÇÃO PELO TRIUNFO","d":"Quando um inimigo tem seus pontos de vida reduzidos a 0 ou é morto por você ou um dos aliados presentes na cena, você pode conceder uma quantidade de pontos de vida temporários igual ao dobro do seu nível de Suporte para todos os aliados que tenham causado dano nesse inimigo. Caso o inimigo seja um Lacaio, essa quantidade é reduzida pela metade.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":8,"n":"PRESSÃO DO MÉDICO","d":"Você pode tentar se estabilizar sozinho com CD aumentada em +10, porém ao fazer isso, você recebe uma falha nos testes de morte.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao invés de não agir","pre":"Mestre em Medicina"},{"l":8,"n":"SUSTENTAÇÃO AVANÇADA","d":"Seu corpo agora é capaz de dividir a liberação de energia entre dois feitiços diferentes. Você pode manter um feitiço sustentado adicional e, no começo do combate, pode ativar um feitiço sustentado à sua escolha como Ação Livre, desde que ele possua um custo de Ação Bônus ou inferior.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"DESCARGA REANIMADORA","d":"Caso haja um aliado nas portas da morte, dentro do seu alcance de toque, você pode o estabilizar imediatamente, independente de quanta vida negativa ele tenha, e recupere pontos de vida igual a uma rolagem da sua cura de Suporte em Combate. Se o turno dele já tiver passado e ele não ter agido por estar nas portas da morte, ele pode realizar o turno imediatamente após o seu.","execucao":"Ação Completa","custo":"10 PE","alcance":"Toque","gatilho":"","pre":"Aptidão Cura Amplificada"},{"l":10,"n":"NECESSIDADE DE CONTINUAR","d":"Quatro vezes por cena, se você estiver com menos da metade da sua vida máxima, você recebe um valor de pontos de vida temporários igual ao seu bônus da perícia Medicina + seu modificador de Presença ou Sabedoria, no começo do seu turno.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Treinado em Vontade"},{"l":10,"n":"OLHAR AGUÇADO","d":"Seus olhos são treinados para encontrar os pontos fracos dos inimigos: você pode analisar um inimigo, descobrindo onde é melhor o acertar, fazendo com que o primeiro ataque de todo aliado cause dano adicional igual ao seu bônus de treinamento multiplicado por 5. Você só pode usar essa habilidade duas vezes por criatura.","execucao":"Ação Bônus","custo":"2 PE","alcance":"","gatilho":"","pre":"Treinado em Percepção"},{"l":10,"n":"TÁTICAS DEFENSIVAS","d":"Você pode escolher um tipo de dano Elemental para que você e dois aliados sejam resistentes. Em um descanso longo, você pode trocar esses tipos de dano e os aliados recebendo o benefício.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":12,"n":"AJUSTES EM EQUIPAMENTO","d":"Durante um descanso curto, você pode escolher uma quantidade de equipamentos igual ao seu Bônus de Treinamento, os quais recebem o efeito de um Encantamento que não possuam e atendam aos requisitos. Durante um Descanso Longo, essa quantidade se torna o dobro do seu Bônus de Treinamento. O efeito dos Encantamentos fica ativo até o próximo descanso.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Treinado em Ferramentas de Ferreiro"},{"l":12,"n":"INTERFERÊNCIA","d":"Você pode forçar um inimigo a rolar novamente um teste, ficando com o menor resultado. Além disso, após usar essa habilidade você pode conceder a um aliado vantagem na próxima rolagem dele. NÃO DESISTA! Ao ver um aliado atingir 0 ou menos de vida ao receber dano, você pode, gastando 3 de PE, fazer um teste de Persuasão contra a CD de estabilização. Caso você passe, o aliado continua de pé e não entra nas portas da morte, ficando com 0 de vida ao invés do normal, durante uma rodada. Enquanto essa rodada durar, a vida necessária para ele cair nas portas da morte se torna -100 ou a vida máxima negativa, o que for menor. Se a rodada acabar e ele ainda estiver com 0 de vida ou menos, ele caíra nas portas da morte, recebendo 1 falha. Caso o aliado possua uma habilidade que permita o mesmo continuar agindo mesmo depois de bater 0, como “Mesmo Morto” ou “Potência Antes de Cair”, ao invés disso, você anula o efeito negativo das habilidades (No caso de mesmo morto, seria receber uma falha, no caso de potência antes de cair, seria a exaustão). Esta habilidade pode ser utilizada para negar efeitos negativos de habilidades apenas uma quantidade de vezes igual a metade do seu bônus de treinamento.","execucao":"Reação","custo":"2 PE","alcance":"9 m","gatilho":"","pre":""},{"l":12,"n":"SOBRECURA","d":"Ao curar um aliado você pode fazer com que essa cura supere o máximo de vida dele: caso ele fique com o máximo de vida por meio da sua cura, ele recebe o dobro do excedente como vida temporária, com um limite igual ao dobro do seu nível de suporte. Você pode, também, escolher conceder 5 multiplicado por seu modificador de Presença ou Sabedoria de Vida Temporária a alguém que já esteja com a vida completa com um uso da sua cura.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":12,"n":"REAÇÃO NECESSÁRIA","d":"Você sabe que, em certos momentos, sua reação é necessária, mesmo que isso signifique ir além do esperado. Uma vez por rodada, caso não possua uma reação, você pode realizar uma reação adicional.","execucao":"Reação","custo":"3 PE","alcance":"","gatilho":"","pre":""},{"l":14,"n":"APOIO ABRANGENTE","d":"Você pode colocar dois efeitos ao invés de um só.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Quando utilizar Apoio Avançado","pre":"Apoio Avançado"},{"l":16,"n":"PURIFICAÇÃO DA ALMA","d":"Uma quantidade de vezes igual ao seu modificador de presença você pode restaurar a integridade de alguém em 50%. E, além disso, você domina ainda mais as técnicas de cura: o seu Bônus de Treinamento é adicionado ao número de usos da sua cura.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"SUSTENTAÇÃO MESTRE","d":"Você pode manter três feitiços sustentados ao invés de dois. Além disso, seu custo para sustentar feitiços é diminuído em 1, com um mínimo de 1.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Sustentação Avançada"},{"l":16,"n":"APOIOS AVANÇADOS","d":"Após obter a habilidade “Apoio Avançado”, escolha um dos apoios abaixo para ser capaz de aplicar quando utilizar a ação Apoiar: •  Apoio Curativo. Quando apoiar um aliado, você pode escolher gastar uma carga da habilidade Suporte em Combate para curar o aliado com ela como parte da ação. • Apoio Defensivo. Quando apoiar um aliado, você pode escolher aumentar a Defesa dele em um valor igual metade do seu bônus de treinamento até o começo do próximo turno. • Apoio Focado. Quando apoiar um aliado, você pode escolher, além da vantagem, conceder um bônus no teste que ele realizar igual a metade do seu modificador de Presença ou Sabedoria. • Apoio Ofensivo. Quando apoiar um aliado, você pode gastar 2 PE para realizar um ataque como parte da ação. • Apoio Estratégico. Ao utilizar a ação de apoio, você pode aumentar a CD do próximo teste que force TR do Aliado em um valor igual a metade do seu Bônus de Treinamento.  Você recebe acesso a um novo apoio avançado nos níveis 6 e 12.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Nível 6"}],"Restringido":[{"l":1,"n":"RESTRITO PELOS CÉUS","d":"Para compensar sua falta de energia amaldiçoada, um restringido recebe vários benefícios atrelados ao seu físico maior e aptidão ao combate: •  Você pode escolher adicionar também seu modificador de Força ou de Constituição na sua Defesa, limitado pelo seu nível. • Você começa com uma ferramenta amaldiçoada de quarto grau e um meio de ver maldições (óculos ou lente). A partir do segundo nível, você recebe acesso ao Arsenal Amaldiçoado, detalhado no final da especialização. • No 4° nível, e depois a cada 4 níveis, você recebe uma Dádiva do Céu, listadas no final desta especialização. • Por não ter energia amaldiçoada, você possui Pontos de Estamina, os quais são baseados na sua própria força vital, e são usados por certas habilidades. Você inicia com 4 pontos de estamina, e recebe mais 4 a cada nível. Você os recupera por completo em um descanso longo, ou metade em um descanso curto. Além disso, você possui um Estilo Marcial, explicado após as habilidades da especialização. 114","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"ATAQUE FURTIVO","d":"Uma vez por turno, ao realizar um ataque surpresa ou contra um inimigo desprevenido, você pode adicionar 1d8 ao dano dele. Caso você esteja flanqueando um inimigo, não é necessário ser um ataque surpresa ou um alvo desprevenido para aplicar o dano adicional. No nível 3, o dano se torna 2d8, no nível 6 se torna 3d8, no nível 9 se torna 4d8, no nível 12 se torna 5d8, no nível 15 se torna 6d8. No segundo nível você também recebe a habilidade Versatilidade: Versatilidade. Você pretende se tornar um pouco mais versátil em tudo. Você recebe +1 em todas as perícias. No 10° nível esse bônus se torna +2.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":3,"n":"ESQUIVA SOBRE-HUMANA","d":"Você recebe +1 em sua Defesa e em rolagens de Reflexos. No nível 9 e no nível 16, esse bônus aumenta em +1. Além disso, a partir do 10° nível, o valor necessário para obter um sucesso crítico nela reduz em um valor igual a metade do seu bônus de treinamento.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"IMPLEMENTO CELESTE","d":"Você recebe +2 na CD de suas habilidades de restringido e técnicas marciais. Esse bônus aumenta em 1 nos níveis 8° e 16° de Restringido.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":9,"n":"TESTE DE RESISTÊNCIA MESTRE","d":"Você se torna mestre nos dois Testes de Resistência conferidos por sua Especialização.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"RESTRIÇÃO DEFINITIVA","d":"Você recebe os seguintes benefícios: •  Você tem vantagem em testes de furtividade contra qualquer usuário de energia amaldiçoada e eles possuem desvantagem em testes para o perceber. • Você passa a ver o traçado da alma (veja página 312), assim como não necessita mais de uma ferramenta amaldiçoada para enxergar maldições. • Toda arma que você manejar conta como um nível de dano acima e seu valor de deslocamento aumenta em 3 metros. • Se for mestre em uma perícia ou teste de resistência que utilize Força, Destreza ou Constituição você soma seu bônus de treinamento inteiro ao invés de metade dele na perícia. • Você se torna imune a expansões de domínio, veja a página 246.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":20,"n":"LIBERTAÇÃO DO DESTINO","d":"Você recebe resistência a todo tipo de dano físico (cortante, perfurante e de impacto), além de mais um tipo de dano a sua escolha, exceto na alma. Você também recebe +5 em rolagens de ataque e soma metade do seu nível de personagem no total de dano. 115","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"ATAQUE INCONSEQUENTE","d":"Uma vez por rodada, ao realizar um ataque, você pode escolher atacar inconsequentemente: Você recebe vantagem na jogada de ataque e +5 na rolagem de dano dele. Porém, ao realizar um golpe inconsequente você fica Desprevenido por 1 rodada.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"APROPRIAR-SE","d":"Você recebe um bônus de +3 em testes para Desarmar ou evitar ser desarmado.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"APROXIMAÇÃO INSTINTIVA","d":"Quando um inimigo termina o turno dentro de uma distância igual a metade do seu deslocamento você pode se mover até metade do seu movimento para um espaço mais próximo do inimigo. Essa movimentação não causa ataques de oportunidade e ignora terreno difícil. Caso, com essa movimentação, a criatura acabe em seu alcance de ataque, você pode realizar uma manobra contra ela.","execucao":"Passiva","custo":"2 Estamina","alcance":"","gatilho":"","pre":""},{"l":2,"n":"EXISTÊNCIA IMPERCEPTÍVEL","d":"Você recebe um bônus de +2 em rolagens de Furtividade. Além disso, sua penalidade em Furtividade por atacar e fazer outras ações chamativas é reduzida para -4.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"FINTA MELHORADA","d":"Você passa a poder somar o seu Modificador de Destreza, ao invés de Presença, em rolagens de Enganação para fintar. Além disso, acertar um inimigo desprevenido pela sua finta causa um dado de dano adicional.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"NGIDO","d":"Ecebe uma habilidade de restringido a sua requisito para poder obter a habilidade.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"GOLPE IMPACTANTE","d":"Seu primeiro golpe encaixado é acompanhado de um grande impacto. Uma vez por rodada, ao realizar um ataque corpo a corpo contra um alvo, você pode também, como parte do mesmo ataque, realizar a ação de Empurrar contra o mesmo alvo. Caso tenha sucesso em empurrar, ele recebe Xd6 de dano adicional, onde X é igual a metade do seu modificador de Força.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"IMITAÇÃO","d":"Ao ver uma habilidade ativa de especialização marcial, manobra ou postura, você pode escolher a copiar como uma reação, e deve a usar no seu próximo turno, ou perderá a cópia. Você só pode manter uma coisa copiada por vez, e só usa uma vez cada uma delas. Porém, quando copiar algo, você pode tentar aprender aquilo, realizando um teste de percepção com CD35, a qual diminui em 2 para cada vez que você copiar a mesma habilidade e tentar a aprender. Se suceder em aprender, você não precisa ver alguém a usando para poder copiar, necessitando de uma ação bônus, e a quantidade de usos se torna a quantidade padrão da habilidade, ao invés de uma só. Você pode aprender uma habilidade ativa e uma postura ou manobra; durante um interlúdio você pode escolher trocar uma habilidade aprendida por outra que possa ver durante o interlúdio, tentando a copiar com o teste de percepção, o qual é feito com vantagem. Caso o que for copiado gaste energia amaldiçoada, você paga o custo em pontos de estamina.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"MANEJO SUPERIOR","d":"O dano de toda arma que você manejar conta como um nível acima e suas rolagens de dano recebem um bônus igual ao seu bônus de treinamento.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"ROUBO DE HABILIDADE","d":"Você pode aprender uma habilidade de Especialista em Combate ou Lutador, desde que tal não dependa do uso de energia amaldiçoada. Você usa seus níveis de Restringido para os requisitos. Você pode pegar essa habilidade uma quantidade de vezes igual ao seu bônus de treinamento, roubando habilidades diferentes. Você não pode roubar habilidades base das outras especializações, exceto Golpe Especial.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter essa habilidade","pre":""},{"l":2,"n":"SURTO DE ADRENALINA","d":"Você pode entrar em um estado onde seu corpo está no limite. Enquanto em um surto de adrenalina, você recebe os seguintes benefícios: você recebe redução de dano a todos os tipos de dano igual a metade do seu nível de personagem, você recebe um bônus igual a 1 + metade do seu bônus de treinamento em testes de resistência de fortitude e reflexos, e você recebe um bônus em percepção igual ao seu bônus de treinamento. Um surto dura uma rodada, e você pode gastar 1 ponto de estamina adicional para cada rodada após a primeira que deseje o manter ativo.","execucao":"Ação Livre","custo":"3 Estamina / 1 Estamina","alcance":"","gatilho":"","pre":""},{"l":2,"n":"VALORIZAR INVOCAÇÃO","d":"Tendo domado maldições, elas se tornam invocações úteis dentro de combate, e você passa a valorizar elas quando necessário. Caso uma das suas invocações dentro de 3 metros vá ser exorcizada, você pode gastar 1 ponto de estamina e usar sua reação para se colocar a frente dela, recebendo o golpe letal em troca de manter a invocação viva. Caso vá defender uma invocação, você recebe pontos de vida temporários igual ao seu nível de personagem.","execucao":"Reação","custo":"1 Estamina","alcance":"3 m","gatilho":"Quando necessário","pre":""},{"l":4,"n":"AÇÃO ÁGIL","d":"Você otimiza o seu tempo de ação. Uma vez por turno você pode gastar 2 PE para receber uma Ação Ágil, a qual pode ser utilizada para: Andar, Desengajar ou Esconder.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"","pre":""},{"l":4,"n":"ADRENALINA INTENSIFICADORA","d":"Ao entrar em um surto de adrenalina, você pode escolher pagar 2 pontos de estamina adicionais para poder distribuir um bônus de +4 entre as perícias de Atletismo e Acrobacia, da maneira que desejar (+3 em uma e +1 em outra, por exemplo), além de poder pagar 1 ponto de estamina para se conceder vantagem em uma rolagem de Atletismo e Acrobacia, uma vez por cena cada. Ao obter a Restrição Definitiva, o bônus de +4 se torna +8.","execucao":"Passiva","custo":"2 Estamina / 1 Estamina","alcance":"","gatilho":"","pre":""},{"l":4,"n":"CAÇADOR DE FEITICEIROS","d":"Sua especialização é conseguir lidar com feiticeiros, preparando-se para os caçar, tanto resistindo melhor quanto destruindo melhor. No começo de uma cena você pode receber 2 de RD, +1 em testes de resistência e ataques, além de causar +1d6 de dano contra todos os feiticeiros presentes na cena. A cada 5 níveis você pode gastar mais 2 pontos para aumentar os bônus; +2 de RD, +1 de bônus e +1d6 de dano para cada 2 pontos adicionais.","execucao":"Passiva","custo":"2 Estamina","alcance":"","gatilho":"","pre":""},{"l":4,"n":"DESENVOLVER IDEIAS","d":"Você recebe duas técnicas marciais adicionais ao obter essa habilidade.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"FOCO NO INIMIGO","d":"Você pode escolher um inimigo para ser seu foco. Ao atacar o inimigo que é seu foco você recebe um bônus de +2 para acertar e causa 1d6 de dano a mais, que aumenta para 1d8 no nível 6, 1d10 no nível 12 e 1d12 no nível 16, além de receber +5 em testes de Percepção para procurar o inimigo e em sua Atenção contra ele. Você pode passar o foco para outro inimigo. Caso ataque outra criatura que não seja seu foco, a habilidade se encerra.","execucao":"Reação","custo":"2 Estamina","alcance":"9 m","gatilho":"Ao iniciar um combate","pre":""},{"l":4,"n":"PONTO CEGO","d":"Se mover pelo espaço de um inimigo não conta como terreno difícil, e sempre que você estiver no espaço de um inimigo, você recebe camuflagem leve, fazendo com que ataques contra você tenham 20% de chance de falhar (1 ou 2 em 1d10). A partir do 10° nível, você pode realizar uma rolagem de furtividade contra um alvo o qual esteja dentro do espaço dele; caso seu resultado seja superior ao valor de atenção dele, você passa a receber uma camuflagem total, fazendo com seus ataques tenham 40% de chance de falhar (1 a 4 em 1d10).","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"RESILIÊNCIA PELA ADRENALINA","d":"Você pode adicionar 2d3 ao resultado. Caso seja um teste em que você não seja treinado, e se você falhar, você pode rolar novamente.","execucao":"Passiva","custo":"1 Estamina","alcance":"","gatilho":"Sempre que você realizar um teste de resistência durante um Surto de Adrenalina","pre":"Surto de Adrenalina"},{"l":4,"n":"TÉCNICAS DE MEMORIZAÇÃO","d":"Você pode aprender uma habilidade adicional a partir da Imitação. Caso tenha a habilidade Imitação Perfeita, você pode aprender mais uma habilidade adicional.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter essa habilidade","pre":"Imitação"},{"l":6,"n":"APRIMORAMENTO CELESTE","d":"Você passa a somar metade do modificador do seu atributo chave em sua CD de Especialização.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"ATAQUE EXTRA","d":"Você pode atacar duas vezes ao invés de uma. ATAQUE INCONSEQUENTE APRIMORADO O bônus em dano ao usar o ataque inconsequente aumenta para +10 e, ao utilizar a habilidade, você recebe 2d6+4 pontos de vida temporária.","execucao":"Passiva","custo":"2 Estamina","alcance":"","gatilho":"Ao realizar a ação Atacar","pre":"Ataque Inconsequente"},{"l":6,"n":"CORPO DE AÇO","d":"Seus pontos de vida máximos aumentam em um valor igual ao seu valor de Constituição, e você pode, durante uma cena, se curar em um valor igual a 2d8 + seu modificador de constituição no começo de todo turno seu. No nível 10, você pode pagar 1 ponto de estamina adicional para aumentar a cura em 1d8, assim como pode pagar mais 1 ponto no nível 15 para aumentar novamente.","execucao":"Passiva","custo":"2 Estamina / 1 Estamina","alcance":"","gatilho":"","pre":""},{"l":6,"n":"CORREDOR FANTASMA","d":"Você pode utilizar o movimento para andar em paredes, no entanto, não pode terminar seu turno em uma. Caso termine, você cai, respeitando as regras de queda. Você recebe um bônus de +2 em testes para reduzir dano de queda. Caso possua a dádiva Agilidade Exímia, você pode correr em tetos.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao se mover","pre":""},{"l":6,"n":"DISPARADA TROVEJANTE","d":"Você consegue usar da sua agilidade para disparar como um trovão em reação a um golpe. Você pode reduzir o dano a metade e se mover até 4,5 metros para longe do atacante.","execucao":"Passiva","custo":"3 Estamina","alcance":"","gatilho":"Ao receber um ataque corpoa-corpo","pre":""},{"l":6,"n":"FRENESI","d":"Durante o Surto de Adrenalina, você assume um frenesi intenso que aumenta o potencial ofensivo dos seus golpes: sempre que realizar um ataque, ele causa +4 de dano adicional. No 12° nível, esse bônus se torna +8, no 16° nível ele se torna +12.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Surto de Adrenalina"},{"l":6,"n":"MOVIMENTO REATIVO","d":"Uma vez por rodada, quando um oponente dentro de um alcance igual ao seu movimento iniciar a realização de uma ação que permitiria o uso de um ataque de oportunidade, você pode se locomover até ele com uma ação livre, e então gastar sua reação para executar o ataque de oportunidade.","execucao":"Ação Livre","custo":"2 Estamina","alcance":"","gatilho":"","pre":""},{"l":8,"n":"AINDA DE PÉ","d":"Uma vez por descanso curto ou longo, quando você for chegar a 0 pontos de vida e cair você pode escolher se manter de pé e curar em 3d10 + nível de personagem, aumentando em +1d10 nos níveis 12, 16 e 20. Caso o dano fosse suficiente para ser uma morte instantânea, você apenas resiste e fica com 1 de vida, caindo com uma falha no próximo dano que receber. Se você morrer, você morre de pé.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":8,"n":"ARREMETIDA ENCOBERTA","d":"Você recebe vantagem no golpe. Caso o acerto dele já tenha sido garantido por qualquer motivo, você recebe +1d no dano do Ataque Furtivo.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao realizar o Ataque Furtivo da rodada","pre":""},{"l":8,"n":"BARREIRA INAMOVÍVEL","d":"Você pode transformar o resultado natural do dado no seu modificador de Constituição. Você não pode ser movido a força e tem vantagem para resistir a ser agarrado.","execucao":"Passiva","custo":"2 Estamina","alcance":"","gatilho":"Sempre que você fizer um teste de resistência de Fortitude e o resultado natural do dado for menor do que seu modificador de Constituição","pre":""},{"l":8,"n":"FORÇA IMPARÁVEL","d":"Você pode transformar o resultado natural do dado no seu modificador de Destreza. Você se torna treinado em um teste de resistência à sua escolha e mestre em outro TR no qual já seja treinado.","execucao":"Passiva","custo":"2 Estamina","alcance":"","gatilho":"Sempre que você fizer um TR de Reflexos e o resultado natural do dado for menor do que seu modificador de Destreza","pre":""},{"l":8,"n":"IMITAÇÃO PERFEITA","d":"Você desenvolve a habilidade de imitação. Você se torna capaz de copiar habilidades passivas de especializações marciais e estilos de combate. Ao copiá-las, o efeito dura até o final do seu próximo turno. Você passa a poder aprender também uma habilidade passiva e um estilo de combate, mas é mais difícil, por ser algo sutil; a CD é igual a 40, e continua diminuindo em 2 por tentativa na mesma habilidade.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Imitação"},{"l":8,"n":"PRESENÇA AMEAÇADORA","d":"Você pode demarcar a sua presença, fazendo com que toda criatura que consiga o ver realize um teste de resistência de vontade. Em uma falha, a criatura fica amedrontada por 2 rodadas, em um sucesso, fica abalada. Você só pode usar essa habilidade uma vez por cena em cada criatura.","execucao":"Passiva","custo":"1 Estamina","alcance":"","gatilho":"","pre":""},{"l":8,"n":"REAÇÃO RÁPIDA","d":"Com um tempo de reação grandemente desenvolvido, você consegue incitar o seu corpo a reagir com uma rapidez extrema. Caso já tenha gasto a sua reação, você pode realizar uma reação adicional, uma vez por rodada.","execucao":"Reação","custo":"2 Estamina","alcance":"","gatilho":"","pre":""},{"l":8,"n":"RESPEITO CELESTE","d":"Você recebe uma dádiva do céu adicional. A partir do nível 12, você pode pegar esta habilidade outra vez.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter essa habilidade","pre":""},{"l":10,"n":"ASSASSINAR","d":"Durante a primeira rodada de um combate, ao atacar uma criatura desprevenida a partir da furtividade ou surpresa, seu primeiro ataque é um crítico garantido.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"MENTE LIMPA","d":"Você recebe vantagem para resistir às seguintes condições: Amedrontado, Cego, Enfeitiçado e Surdo.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"PERCEBER O AR","d":"Você é imune a danos de queda, conseguindo se apoiar no ar, desde que a altura não seja superior ao dobro do seu movimento. Ao pular você pode realizar outro pulo em seguida, no nível 13 você pode dar dois pulos em seguida, e no nível 17 pode dar três pulos em seguida. Você pode realizar um teste de acrobacia contra um teste de reflexos do atacante e, caso o resultado do seu teste supere o do atacante, você desvia do ataque.","execucao":"Reação","custo":"2 Estamina","alcance":"","gatilho":"Quando for alvo de um ataque","pre":""},{"l":10,"n":"PRECISÃO FORÇADA","d":"Você consegue usar do seu físico impecável para forçar precisão absoluta em um golpe. Uma vez por rodada, quando você faz um ataque corpo-a-corpo, você pode pagar 3 pontos de estamina. Se acertar o ataque, causa dano máximo, sem necessidade de rolar danos.","execucao":"Passiva","custo":"3 Estamina","alcance":"","gatilho":"","pre":""},{"l":10,"n":"RETALIAÇÃO","d":"Se você receber dano de um inimigo que esteja dentro de seu alcance, você pode realizar um ataque contra ele.","execucao":"Reação","custo":"2 Estamina","alcance":"","gatilho":"","pre":""},{"l":12,"n":"ADRENALINA ABSOLUTA","d":"Você pode escolher pagar 4 pontos para ativar e 2 por rodada para manter e, caso o faça, você recebe os seguintes benefícios: enquanto estiver em um surto de adrenalina, o seu ataque extra passa a custar 1 PE, você recebe +3 metros de Deslocamento e a sua DEF aumenta em 2.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao iniciar um surto de adrenalina","pre":""},{"l":12,"n":"PINÁCULO FÍSICO","d":"Você recebe +4 pontos de estamina máximos e pode escolher aumentar o valor de dois atributos entre Força, Destreza e Constituição em 2. No nível 16, o valor de ambos os atributos escolhidos aumentam novamente em 2.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"ENTRE AS SOMBRAS","d":"Além disso, quando for realizar um Ataque Furtivo, você pode ignorar parcialmente as regras de vantagem e acumular até uma vantagem adicional (totalizando 3d20). Caso ele seja um acerto garantido, além do efeito normal, a sua margem de crítico é reduzida em 2. Pré-Requisito: Arremetida Encoberta.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"INSTINTOS AGUÇADOS","d":"Enquanto seus pontos de estamina e de vida excederem metade do máximo deles, você recebe uma reação adicional por rodada. Pré-Requisito: Reação Rápida.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"REJEITAR A MORTE","d":"Você pode escolher receber uma falha garantida para fazer um teste de Fortitude contra a CD X, sendo X igual a 15 + 1 para cada 3 pontos de vida negativos. Se passar, você fica com 1 de vida e recebe 1 ponto de exaustão.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Quando estiver nas portas da morte","pre":"Ainda de Pé"},{"l":16,"n":"MESMO MORTO","d":"Ao cair para 0 de vida, sem possuir um uso de Ainda de Pé, ao invés de ir para as Portas da Morte você continua de pé e realizando seus turnos normalmente; porém, no final de todo turno, você deve realizar um teste de resistência de Fortitude com CD25 + 1 para cada 5 pontos de vida negativos que possuir. Caso falhe no teste, você cai imediatamente, com 1 falha nos testes de morte.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Rejeitar a Morte"},{"l":16,"n":"ESTILO MARCIAL","d":"Embora não possua uma técnica amaldiçoada, o Restringido ainda tem sua maneira distinta de lutar, a qual é manifestada através de seu Estilo Marcial, sendo o equivalente da criação de técnicas amaldiçoadas para ele. Um Estilo Marcial é dividido entre o Fundamento do Estilo, que seria equivalente ao Funcionamento Básico e nas Técnicas Marciais, que são as habilidades que aplicam o fundamento. Os estilos marciais podem tanto ser baseados em artes marciais reais, como karatê, muay thai e várias outras se basear em maneiras de abordar situações e confrontos, como o caso de Toji Fushiguro, que analisava seu alvo, cansava-o e depois atacava. No segundo nível, ao receber o Arsenal Amaldiçoado, é interessante mesclá-lo em seu estilo marcial, incorporando as armas e as técnicas no combate. As técnicas marciais, quando se trata de nível, variam de 1 até 4. Todo restringido começa com acesso a habilidades de nível 1, e recebe acesso ao 2°, 3° e 4° nos níveis 5, 9 e 15, respectivamente. O custo das técnicas marciais é: NÍVEL DA TÉCNICA MARCIAL","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"CUSTO","d":"Nível 1 2 Pontos de Estamina Nível 2 5 Pontos de Estamina Nível 3 8 Pontos de Estamina Nível 4 12 Pontos de Estamina Um restringido começa com 2 técnicas marciais, e recebe mais uma nos níveis 3, 5, 7, 9, 11, 13, 15, 17 e 19. Sempre que subir de nível pode as alterar livremente.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"CRIANDO TÉCNICAS MARCIAIS","d":"Por isso, é necessário se lembrar da ausência de energia. Dois exemplos de técnicas marciais são: uma rasteira acompanhada de um golpe com arma, o qual se torna mais preciso ou um golpe desarmado em um ponto que deixaria o alvo atordoado. O nível define o poder e a capacidade. Habilidades de nível 1, por exemplo, podem ser ataques melhorados ou manobras simples, enquanto as de nível 4 podem ser uma enorme sequência de golpes com técnicas especiais sendo utilizadas para os otimizar ao máximo. Você pode encontrar mais detalhes no capítulo Criação de Técnica, junto de referências e exemplos.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"ARSENAL AMALDIÇOADO","d":"Um Restringido recebe acesso a uma certa quantidade de ferramentas amaldiçoadas de graus específicos, as quais se tornam mais poderosas conforme o personagem sobe de nível, seguindo a tabela adiante: TREINAMENTO","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"DÁDIVAS DO CÉU","d":"Dádivas do Céu são benefícios que os Restringidos recebem do próprio céu, como parte e amplificação da sua restrição celeste. Consegue-se uma dádiva do céu a cada 4 níveis. São elas: •  Agilidade Exímia. Uma leveza anormal e agilidade extrema são traços do seu corpo. Sempre que fizer um teste de perícia ou resistência usando destreza, você recebe um bônus de +2, além de receber 3 metros adicionais de movimento e sempre ignorar terreno difícil. • Físico Robusto. Seu corpo é naturalmente mais robusto e resistente a todo dano que seja causado nele. Você recebe redução de dano contra todo tipo, cujo valor é igual a metade do seu nível de personagem, além de receber um bônus de +2 em testes de perícia ou resistência usando constituição. • Força Devastadora. Você foi dotado com uma força extrema, a qual permite que seus golpes sejam ainda mais potentes, assim como a capacidade física dos seus músculos. A distância de todo pulo ou salto que realizar aumenta em 3 metros, a distância padrão que você empurra com a ação Empurrar aumenta em 4,5 metros e recebe +2 em testes de perícia usando Força. • Indulgente a Feitiçaria. Seu corpo recusa a energia amaldiçoada e, consequentemente, as técnicas. Você recebe Redução de Dano contra danos provindo de técnicas ou aptidões amaldiçoadas igual à metade do seu nível de personagem e um bônus de +1 em TRs de Vontade contra efeitos dessas mesmas fontes. No nível 10, o bônus em TRs aumenta em +1 e, no nível 15, passa a contar também para Fortitude e Reflexos. • Mente Afiada. Você tem uma mente afiada que o permite desenvolver habilidades facilmente. Você se torna treinado em duas perícias adicionais e se torna mestre em uma perícia. Você também recebe um bônus de +2 em testes de perícia ou resistência usando inteligência. • Percepção Aguçada. Sua percepção e seus instintos são aguçados ao máximo, permitindo-o perceber cada detalhe dos seus arredores. Sua atenção aumenta em um valor igual a metade do seu nível de personagem e você recebe um bônus de +3 em rolagens de percepção. Você também recebe um bônus de +2 em testes de perícia ou resistência usando sabedoria. • Reposição Sanguinária. Você consegue repor o seu vigor a partir do sangue derramado. Sempre que um inimigo no qual você causou dano for morto, você recupera 3 pontos de estamina. Você não pode exceder a quantidade de pontos que possuía no início do combate. • Semblante Cativante. Um semblante mais cativante e chamativo foi lhe concedido, apurando seu carisma e presença. Sempre que realizar um teste de perícia utilizando Presença, caso você tire um resultado inferior a metade do seu valor de Presença, você pode optar por tratar o resultado como metade do seu valor de Presença. Além disso, você se torna mestre em uma perícia de Presença à sua escolha e recebe um bônus de +2 em testes de perícia usando Presença. • Vigor Infindável. Você foi dotado de um vigor amplo e infindável e consegue o repor ao triunfar. Seus pontos de vida máximos aumentam em um valor igual ao seu nível de personagem e, a cada 2 níveis, você recebe 1 ponto de estamina máximo adicional.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"EQUIPAMENTOS","d":"Mas, é inegável que existem incontáveis equipamentos úteis, os quais servem tanto como extensões de suas capacidades quanto novas possibilidades. Dentro de Feiticeiros & Maldições, você encontrará tudo que precisa saber sobre os equipamentos comuns neste capítulo, enquanto verá sobre Ferramentas Amaldiçoadas no próximo. Em suma, existem quatro tipos principais de equipamentos: •  Armas, as quais são divididas em simples e complexas, possuindo seus próprios valores de dano, peculiaridades de manejo e propriedades distintas. Maioria dos feiticeiros se beneficiará de pelo menos uma arma. • Uniformes, os quais servem não só como uma identificação para os feiticeiros – maioria dos personagens – como também podem receber modificações para os melhorar defensivamente. • Escudos, sendo equipamentos defensivos adicionais que, embora não muito comuns, ainda podem vir para o benefício de feiticeiros que decidam implementálos em seu estilo de combate. • Itens Especiais, divididos em várias categorias e possuindo muitas funções, como os acessórios, que concedem bônus, e as medicinas, que permitem se curar ou eliminar toxinas. Cada tipo de equipamento possui o seu papel dentro de jogo. Além dos equipamentos em si, é necessário compreender antes sobre o inventário e carregamento, pois é impossível que um personagem carregue uma quantidade massiva de itens consigo sem prejuízo. Os equipamentos iniciais de um personagem são padrões, assim como há um ganho definido por grau, ambos explicados nas próximas páginas. No final do capítulo você lerá sobre os Kits de Ferramentas, que são conjuntos de ferramentas e itens que permitem aos seus portadores confeccionar diferentes equipamentos, assim como realizar a manutenção deles ou outras ações exclusivas dentro de descansos.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"INVENTÁRIO E CARREGAMENTO","d":"Diferentes espadas podem ter pesos distintos, mas acabam enquadrando como ocupando um único espaço, com a especificidades sendo deixadas de lado para permitir um gerenciamento mais ágil e direto. Por padrão, um item ocupa um espaço, mas há exceções: •  Uniformes sem Revestimento, com Revestimento Leve ou Sob Medida não ocupam espaço. • Itens consumíveis como talismãs e misturas, ocupam meio espaço. • Armas de duas mãos, uniformes com Revestimento Médio, escudos e outros itens mais pesados ocupam dois espaços. • Armas massivas, uniformes com Revestimento Robusto e outros itens muito volumosos ocupam quatro espaços. Quando se trata dos equipamentos, você também pode encontrar quantos espaços um deles ocupa na sua descrição. Você tem um limite de carregamento de 8 espaços + o dobro do seu modificador de força (ou -2 por modificador de Força negativo). Caso ultrapasse esse limite, você fica sobrecarregado, recebendo -5 em sua Defesa e tendo o seu Deslocamento reduzido em 4,5 metros. É impossível carregar uma quantidade de itens superior ao dobro do seu limite de carga. Sendo assim, um personagem com +2 de Força poderia carregar 12 espaços em seu inventário, enquanto um personagem com -1 de Força poderia carregar apenas 6 espaços sem ficar sobrecarregado. Equipamentos continuam ocupando espaços do seu inventário mesmo se estiverem sendo manejados ou vestidos. Então, uma arma que você use e um uniforme que você vista continuarão ocupando espaços. Essa regra de carregamento tem a intenção de adicionar uma necessidade de se gerenciar quantos itens se pode carregar, visto que existem vários no sistema que são poderosos. O mestre pode escolher ignorar essa regra e apenas usar do senso comum como um limite para quantos itens podem ser carregados. A regra considera que você possui uma mochila onde carregar seu equipamento. A própria mochila não ocupa espaço. De forma similar, recipientes cuja única função seja carregar outros itens não ocupam espaço. Por exemplo, a bainha de uma espada está incluída no espaço da própria espada. Porém, recipientes que forneçam benefícios próprios ocupam espaço seguindo a métrica acima. É possível encontrar diferentes formas de contornar esse limite de carga, como a Maldição de Bolso, que consegue armazenar itens. A decisão do Narrador, itens pequenos, como cosméticos, não entram no cálculo do inventário, sendo apenas adicionais ao personagem.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""}]},"TAL":[{"c":"Geral","n":"TALEN","d":"Talentos podem ser obtidos no lugar de habil de outras fontes, como origens ou treinamen para complementar certos tipos de persona que podem ser úteis para todos. Nesse capítulo estão todos os talentos, sendo pré-requisitos que devem ser atendidos."},{"c":"Geral","n":"ARTESÃO AMALDIÇOADO","d":"A criação de ferramentas amaldiçoadas é um ofício no qual você busca se especializar. Ao obter este talento, você se torna capaz de criar Ferramentas Amaldiçoadas, de acordo com o guia na página 153. Além disso, você se torna treinado em Ofício (Ferreiro) ou Ofício (Canalizador), caso não seja treinado; caso já seja treinado em ambas, você se torna mestre em uma delas à sua escolha."},{"c":"Geral","n":"ATAQUE INFALÍVEL","d":"Uma vez por rodada, após a rolagem de dano de um ataque armado ou desarmado, você pode escolher a repetir, ficando com o novo resultado obrigatoriamente. Além disso, você não pode ter os níveis de dano da sua arma reduzidos."},{"c":"Geral","n":"ATENÇÃO INFALÍVEL","d":"Sua atenção para os arredores nunca falha, mantendo seus sentidos afiados. Você recebe um bônus de +5 em sua Atenção e não pode ser surpreendido caso consciente."},{"c":"Geral","n":"NTOS","d":"lidades de especialização ou obtidos através ntos. Eles são habilidades gerais que servem agens e oferecer ou ampliar em capacidades o que uma parcela considerável deles possui"},{"c":"Geral","n":"DEDICAÇÃO RECOMPENSADORA","d":"Você se dedica mais do que o normal em suas missões, imagem e desempenho, e recebe melhores recompensas, em troca. No quarto grau, você recebe dois itens de custo 1 a mais; no terceiro grau, você recebe dois itens de custo 2 a mais; no segundo grau, você recebe um item de custo 2 a mais e 2 de custo 3 a mais; no primeiro grau, você recebe dois itens de custo 3 a mais e um item de custo 4 a mais e, no grau especial, você recebe dois itens de custo 4 a mais. Os aumentos de itens não são cumulativos."},{"c":"Geral","n":"FAVORECIDO PELA SORTE","d":"Você tem uma sorte inexplicável, a qual o favorece nos momentos mais críticos. Você tem 3 pontos de sorte. Sempre que fizer uma rolagem, você pode gastar um ponto de sorte para rolar outro d20, podendo escolher usar qualquer um dos dois resultados. Você pode escolher rolar o outro dado após ver o resultado da primeira rolagem, mas an
