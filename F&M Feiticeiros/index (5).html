<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F&M: Feiticeiros</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:#0b0b14;color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
input,select{background:#161626;border:1px solid #2d2d4a;border-radius:6px;color:#fff;padding:4px 8px;min-width:0}
input:focus,select:focus{outline:2px solid var(--acc)}
:root{--acc:#7c3aed;--acc2:#8b5cf6;--accl:#a78bfa}
.bg-violet-600{background-color:var(--acc)!important}
.hover\:bg-violet-500:hover{background-color:var(--acc2)!important}
.bg-violet-700{background-color:var(--acc)!important;filter:brightness(.8)}
.text-violet-400,.text-violet-300{color:var(--accl)!important}
.border-violet-500{border-color:var(--acc)!important}
/* Decoração: personagens em traço de mangá tingidos pela cor da especialização */
body{background:radial-gradient(1200px 600px at 50% -10%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 70%),radial-gradient(circle at 1px 1px,rgba(255,255,255,.035) 1px,transparent 0) 0 0/14px 14px,#0b0b14;background-attachment:fixed;min-height:100vh}
.jp{font-family:"Shippori Mincho B1",serif}
.tinta{background:linear-gradient(180deg,var(--accl),var(--acc) 55%,color-mix(in srgb,var(--acc) 40%,#000));-webkit-mask:var(--img) center/contain no-repeat;mask:var(--img) center/contain no-repeat}
.tinta.base{-webkit-mask-position:bottom;mask-position:bottom}
.deco{position:fixed;bottom:0;height:min(88vh,860px);width:min(34vw,460px);pointer-events:none;z-index:0;opacity:.16;animation:surgir .7s ease both}
.deco.esq{left:-2vw}.deco.dir{right:-2vw;transform:scaleX(-1)}
@media (max-width:1100px){.deco{opacity:.08;width:46vw}}
@keyframes surgir{from{opacity:0;translate:0 24px}}
.palco{position:relative;z-index:1}
.bg-\[\#12121f\]{background-color:rgba(18,18,31,.86)!important;backdrop-filter:blur(3px)}
.heroi{position:relative;overflow:hidden;border:1px solid #26263f;border-radius:1rem;background:linear-gradient(110deg,rgba(18,18,31,.95) 35%,color-mix(in srgb,var(--acc) 28%,#12121f));box-shadow:0 0 40px -12px var(--acc)}
.heroi::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-55deg,transparent 0 10px,rgba(255,255,255,.025) 10px 11px);pointer-events:none}
.kanji{writing-mode:vertical-rl;letter-spacing:.2em;color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--accl) 55%,transparent)}
.selo{box-shadow:0 0 0 2px #0b0b14,0 0 0 3px var(--acc),0 0 18px -2px var(--acc)}
.retr{transition:transform .15s,box-shadow .15s}.retr:hover{transform:translateY(-2px);box-shadow:0 0 0 2px var(--acc)}
</style>
</head>
<body>
<div id="root"></div>
<script id="dados" type="application/json">{"HAB":{"Lutador":[{"l":1,"n":"CORPO TREINADO","d":"Sendo um lutador, você recebe as seguintes capacidades: •  Você sabe desferir golpes rápidos com o seu corpo. Quando realizar um ataque desarmado ou com uma arma marcial, você pode realizar um ataque desarmado como uma ação bônus. • Você treinou e se dedicou a fazer com que seu corpo fosse uma arma por si só. O dano dos seus ataques desarmados se torna 1d8. Nos níveis 5, 9, 13 e 17 seu dano desarmado aumenta para 1d10, 1d12, e 2d12, respectivamente. • 49 Versatilidade e adaptabilidade são importantes. Você pode escolher usar tanto Força quanto Destreza nos seus ataques desarmados e ataques com armas marciais. 2d8","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":1,"n":"EMPOLGAÇÃO","d":"Para isso, você precisa continuar acertando golpes: você começa um combate com Nível de Empolgação 1 e, caso acerte pelo menos um ataque ou manobra (agarrar, empurrar etc.) durante seu turno, no começo do seu próximo turno você sobe um nível de empolgação, até um máximo de 5 níveis. NÍVEL DE EMPOLGAÇÃO DADO DE EMPOLGAÇÃO Nível 2 1d4 Nível 3 1d6 Nível 4 2d4 Nível 5 2d6 A empolgação te permite realizar certas manobras especiais, as quais normalmente são fortalecidas por um bônus, que é o Dado de Empolgação, cujo valor varia com o nível, seguindo a tabela acima. Cada manobra pode ser realizada apenas uma vez por rodada. Caso passe uma rodada sem acertar um ataque, você desce um nível de empolgação. Você aprende duas das manobras abaixo, aprendendo outras no nível 6, 12 e 18. •  Ajuste. Às vezes um bom golpe só precisa de um ajuste. Uma vez por rodada, ao realizar um ataque, você pode adicionar seu dado de empolgação na rolagem de acerto e no dano. Você pode escolher adicionar o bônus antes ou depois de saber o resultado da rolagem de acerto. • Comando. Sua empolgação pode acabar contagiando seus aliados. Ao realizar um ataque, você comanda um aliado dentro de 1,5 metros a realizar um ataque corpoa-corpo o acompanhando no mesmo alvo, como uma reação dele. Você ou aliado deve pagar 1 ponto de energia amaldiçoada para realizar o ataque. Caso use essa habilidade, você não pode utilizar ataque extra. • Desarme. Uma boa luta não deve ser contida pelo porte de uma arma. Ao acertar uma criatura com um ataque você aproveita para tentar a desarmar. Você adiciona seu dado de empolgação ao dano desse ataque e o alvo deve fazer uma jogada de ataque corpo a corpo contra o resultado do seu ataque. Em uma falha ele larga um item à sua escolha que esteja manejando. • Esquiva. Com o sangue fervendo, é mais fácil se esquivar de ataques. Ao ser acertado por um ataque cor","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"REFLEXO EVASIVO","d":"Em busca de uma boa luta, e conseguir durar nela, você começa a desenvolver um reflexo para evitar danos. Você recebe redução de dano a todo tipo, exceto alma, igual a metade do seu nível de Lutador. 50","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"IMPLEMENTO MARCIAL","d":"Você recebe +2 na CD de suas Habilidades de Especialização, Feitiços e Aptidões Amaldiçoadas. Esse bônus aumenta em 1 nos níveis 8° e 16° de Lutador.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":5,"n":"GOSTO PELA LUTA","d":"Você passa a adicionar +2 em jogadas de ataque desarmadas ou com armas marciais e +1 em rolagens de Fortitude e de dano. Nos níveis 8, 12, 16 e 20 o bônus em jogadas de ataque aumenta em +1, enquanto nos níveis 9, 13 e 17 o bônus em Fortitude e dano aumenta em +1.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":9,"n":"TESTE DE RESISTÊNCIA MESTRE","d":"Você se torna treinado em um segundo teste de resistência e mestre no concedido pela sua especialização.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":11,"n":"EMPOLGAÇÃO MÁXIMA","d":"Os seus dados de empolgação se tornam 2d4, 2d6, 2d8 e 3d6, respectivamente.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":20,"n":"LUTADOR SUPERIOR","d":"Seus ataques desarmados causam 1 dado de dano adicional e uma vez por rodada, você pode realizar um ataque desarmado como uma ação livre gastando 2PE. Além disso, você inicia todo combate com um Nível de Empolgação a mais. 51","b":1,"execucao":"Ação Livre","custo":"2 PE","alcance":"","gatilho":"","pre":""},{"l":2,"n":"APARAR ATAQUE","d":"Você rebate um ataque com outro ataque, assim conseguindo aparar um golpe. Você pode realizar uma jogada de ataque contra o atacante. Caso seu teste supere o do inimigo, você evita o ataque.","execucao":"Reação","custo":"1 PE","alcance":"","gatilho":"Quando for alvo de um ataque corpo a corpo","pre":""},{"l":2,"n":"APARAR PROJÉTEIS","d":"Utilizando de sua agilidade e reflexos, você consegue tentar aparar projéteis em sua direção, reduzindo o dano deles. Você pode tentar aparar o projétil, reduzindo o dano recebido em 2d6 + modificador de atributo-chave + bônus de treinamento.","execucao":"Reação","custo":"1 PE","alcance":"","gatilho":"Quando receber um ataque à distância","pre":""},{"l":2,"n":"ATAQUE INCONSEQUENTE","d":"Você baixa a guarda para atacar de maneira inconsequente, aumentando seu potencial de dano. Uma vez por rodada, ao realizar um ataque, você pode escolher receber vantagem na jogada de ataque e +5 na rolagem de dano dele. Porém, ao realizar um ataque inconsequente, você fica Desprevenido por 1 rodada.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"CAMINHO DA MÃO VAZIA","d":"Todo ataque desarmado que você realizar causa dano adicional igual ao seu bônus de treinamento e você soma metade do seu bônus de treinamento em jogadas de ataque desarmados.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"COMPLEMENTAÇÃO MARCIAL","d":"Enquanto estiver desarmado ou empunhando uma arma marcial, você recebe um bônus de +2 em testes para Desarmar, Derrubar ou Empurrar, assim como para resistir a esses efeitos. R ebe uma habilidade de lutador a sua escolha. o para poder obter a habilidade.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"DEBOCHE DESCONCERTANTE","d":"Escolha uma criatura que possa te ver ou ouvir: realize um teste de Intimidação contra um teste de Vontade dela, no qual você recebe um bônus de +2. Caso você suceda, a criatura recebe uma penalidade igual ao seu bônus de treinamento em todos os testes que ela realizar até o começo do seu próximo turno.","execucao":"Ação Bônus","custo":"","alcance":"","gatilho":"","pre":"Treinado em Intimidação"},{"l":2,"n":"DEDICAÇÃO EM ARMA","d":"Escolha três armas para serem suas Armas Dedicadas, as quais não podem possuir as propriedades Duas Mãos ou Pesada, exceto caso já possuam a propriedade Marcial. Suas armas escolhidas passam a ser contadas como marciais, se não forem, e enquanto empunhar uma Arma Dedicada, o dano dela aumenta em 1 nível.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"ESQUIVA RÁPIDA","d":"Realize um teste de Acrobacia contra a Atenção de um inimigo dentro do seu alcance corpo a corpo. Caso suceda no teste, o alvo recebe metade do seu modificador de Destreza como penalidade em jogadas de ataque feitas contra você até o começo do seu próximo turno.","execucao":"Ação Bônus","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"FINTA MELHORADA","d":"Você pode optar por utilizar Destreza ao invés de Presença em testes de Enganação para fintar. Além disso, acertar um inimigo desprevenido pela sua finta causa um dado de dano adicional.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"IMPACTO MISTO","d":"Você recebe +2 em jogadas de ataque e dano desarmados até o começo do seu próximo turno. Nos níveis 5, 10, 15 e 20, o bônus em dano aumenta em +1, enquanto nos níveis 6, 12 e 18 o bônus em jogadas de ataque aumenta em +1.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Quando acertar uma criatura com um ataque com arma marcial","pre":""},{"l":2,"n":"KIAI INTIMIDADOR","d":"Sendo a exteriorização da energia e força corporal, um kiai é liberado diante um bom golpe, intimidando com um grito. Uma vez por rodada, quando conseguir um crítico em um ataque corpo a corpo você pode realizar um teste de Intimidação contra Vontade do alvo e, caso suceda, ela fica Abalada por uma rodada. Se aplicar esta habilidade em uma criatura que já está Abalada, ela fica Amedrontada.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"MÃOS AMALDIÇOADAS","d":"Você pode substituir a jogada de ataque de técnica por uma jogada de ataque corpo a corpo e, também, somar seu modificador de Força ou Destreza no total.","execucao":"Passiva","custo":"","alcance":"Toque","gatilho":"Quando utilizar um Feitiço ofensivo com alcance de Toque","pre":""},{"l":2,"n":"PUXAR UM AR","d":"Você pode realizar uma rolagem do seu dano desarmado e se curar nesse valor. Esta habilidade pode ser usada uma quantidade de vezes igual ao seu bônus de treinamento, por descanso curto ou longo.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"QUEBRANDO TUDO","d":"Como parte de um ataque, você pode agarrar um objeto pequeno ou menor adjacente a você. Objetos usados de arma improvisada (Página 326) recebem +1d no dano e são considerados armas marciais.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"RESISTIR","d":"Você pode utilizar da energia para fortalecer seu corpo e resistir com mais eficiência. Quando realizar um teste de resistência de Fortitude ou Reflexos, você pode gastar até 2PE para receber um bônus de +2 para cada PE gasto.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"","pre":""},{"l":4,"n":"AÇÃO ÁGIL","d":"Você otimiza o seu tempo de ação. Uma vez por rodada, você pode receber uma Ação Ágil, a qual pode ser utilizada para Andar, Desengajar ou Esconder.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"","pre":""},{"l":4,"n":"ACROBATA","d":"Você passa a utilizar Destreza como atributo para calcular sua distância de pulo, assim como pode utilizar Acrobacia no lugar de Atletismo em testes para aumentar a sua distância de salto.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"ATACAR E RECUAR","d":"Você consegue atacar e aproveitar a brecha do golpe para se afastar do inimigo. Uma vez por turno, quando acertar uma criatura com um ataque, você pode se mover até 4,5 metros para longe da criatura acertada. Este movimento não causa ataques de oportunidade.","execucao":"Passiva","custo":"1 PE","alcance":"","gatilho":"","pre":"Esquiva Rápida"},{"l":4,"n":"BRUTALIDADE","d":"Existe uma brutalidade guardada no seu interior, a qual pode ser canalizada como uma fúria para combate. Você pode adentrar no estado de Brutalidade: enquanto nesse estado, você recebe +2 em jogadas de ataque corpo a corpo e dano. Entretanto, enquanto estiver em Brutalidade, você não pode manter a concentração nem utilizar Feitiços ou Técnicas de Estilo. Caso já estivesse se concentrando em algo, a concentração quebra. A Brutalidade se encerra no final do seu turno caso você não tenha atacado ninguém nele ou caso você a encerre como uma Ação Livre. Nos níveis 8, 12, 16 e 20 você pode gastar 2 PE a mais para aumentar o bônus em jogadas de ataque e dano em +1.","execucao":"Ação Livre","custo":"2 PE","alcance":"","gatilho":"","pre":""},{"l":4,"n":"DEFESA MARCIAL","d":"Você é capaz de incorporar a leveza de seus movimentos em sua defesa. Enquanto estiver desarmado ou empunhando uma arma marcial, você soma 1 + metade do seu Bônus de Treinamento à sua Defesa.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Complementação Marcial"},{"l":4,"n":"DEVOLVER PROJÉTEIS","d":"O dado de Aparar Projéteis se torna 3d10 e soma também o seu Nível de Lutador. Caso você use Aparar Projéteis e o dano se torne nulo ou negativo, você pode devolver o projétil como parte da reação, causando no atacante o dano que você receberia.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Aparar Projéteis"},{"l":4,"n":"FLUXO","d":"A cada nível de empolgação que você subir, você recebe +1 em rolagens de dano e, no começo de toda rodada, recebe 4 pontos de vida temporários para cada nível de empolgação acima do primeiro.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"FÚRIA DA VINGANÇA","d":"Ao ver um personagem aliado (Invocações não são consideradas) chegar a 0 pontos de vida e cair, você recebe os seguintes benefícios durante uma rodada: seus ataques causam 4 de dano adicional; sua Defesa aumenta em 2; você recebe +2 em TRs de Fortitude e Vontade. Os benefícios são aplicados apenas contra o inimigo alvo da vingança e outras criaturas que tentarem o impedir de alcançá-lo.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"IMPRUDÊNCIA MOTIVADORA","d":"Você pode escolher lutar com uma restrição auto imposta, escolha um dos seus sensos ou membros (como não usar a visão ou não usar uma das pernas), até o final da cena, recebe as mesmas penalidades de perder um membro (Veja Ferimentos Complexos, página 315). Se vencer o combate com a restrição, você recupera uma quantidade de PE igual ao seu nível de personagem; recebe +2 em rolagens de ataque e tem sua margem de crítico reduzida em 1 até o fim da missão atual.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao iniciar uma cena de combate","pre":""},{"l":4,"n":"MÚSCULOS DESENVOLVIDOS","d":"Sua força o fez ter músculos desenvolvidos, os quais por consequência acabaram ficando mais preparados para receber golpes, sendo mais difícil o acertar de maneira efetiva. Você pode optar por somar seu Modificador de Força ao invés de Destreza em sua Defesa, modificando o cálculo padrão.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":4,"n":"REDIRECIONAR FORÇA","d":"Você consegue redirecionar um golpe direcionado a você, mudando o alvo. Quando um inimigo errar um ataque corpo a corpo contra você, você pode gastar 2PE e sua reação para tentar redirecionar o ataque: escolha outra criatura dentro do alcance do golpe e, caso o resultado da jogada de ataque dela seja superior à Defesa do novo alvo, ele recebe o ataque.","execucao":"Reação","custo":"2 PE","alcance":"","gatilho":"Quando um inimigo errar um ataque corpo a corpo contra você","pre":""},{"l":4,"n":"SEGURA PRA MIM","d":"Uma criatura agarrada pode ser utilizada como escudo. Você pode tentar colocar uma criatura que esteja agarrando na frente, faça um teste de Atletismo contra o Atletismo ou Acrobacia da criatura agarrada. Se for bem sucedido, a criatura recebe os efeitos do ataque ou habilidade no seu lugar e você imediatamente para de agarrar ela.","execucao":"Passiva","custo":"3 PE","alcance":"","gatilho":"Quando for alvo de um ataque corpo a corpo ou uma habilidade com alvo único","pre":""},{"l":4,"n":"SOBREVIVENTE","d":"Enquanto estiver com menos da metade dos seus pontos de vida máximos, sempre que começar seu turno, você recupera 1d6 + seu modificador de Constituição em pontos de vida. Esta habilidade não funciona caso esteja Inconsciente ou nos portões da morte. Nos níveis 8, 12, 16 e 20, a cura aumenta em 1d6.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Constituição 16"},{"l":4,"n":"VOADORA","d":"Quando realizar uma Investida, e estiver desarmado, você pode realizar uma Voadora. Caso o faça, você causa 1d8 de dano adicional para cada 3 metros que se deslocar até o alvo, limitado pelo seu modificador de Força ou Destreza.","execucao":"Passiva","custo":"3 PE","alcance":"","gatilho":"","pre":""},{"l":6,"n":"APRIMORAMENTO MARCIAL","d":"Você passa a somar metade do seu Bônus de Treinamento em sua CD de Especialização.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"ATAQUE EXTRA","d":"Você pode atacar duas vezes ao invés de uma.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"Ao realizar a ação Atacar","pre":""},{"l":6,"n":"BRUTALIDADE SANGUINÁRIA","d":"Enquanto no estado de Brutalidade, sempre que tiver um acerto crítico ou reduzir a vida de uma criatura a 0 ou menos, você aumenta o nível de dano dos seus ataques corpo a corpo em 1, acumulando até um limite igual ao seu bônus de treinamento. Esse aumento dura enquanto permanecer com o estado de Brutalidade ativo.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Brutalidade"},{"l":6,"n":"CORPO CALEJADO","d":"De tanto combater e receber golpes, todo seu corpo já está calejado e mais resistente. Você passa a adicionar metade do seu Modificador de Constituição na sua Defesa e recebe pontos de vida adicionais igual ao seu nível de Lutador.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"ELIMINAR E CONTINUAR","d":"Sempre que um inimigo ao qual você causou dano cair ou morrer, você recebe 2d6 + nível de personagem + modificador de atributochave em PV temporários, os quais acumulam. No nível 8, o valor aumenta para 3d6, no nível 12 aumenta para 4d6, no nível 16 aumenta para 4d8 e no nível 20 aumenta para 4d12.","execucao":"Passiva","custo":"","alcance":"9 m","gatilho":"","pre":""},{"l":6,"n":"FOGUETE SEM RÉ","d":"Você se mover até uma distância igual ao dobro do seu deslocamento; sempre que passar por uma criatura durante essa investida, ela deve realizar um teste de resistência de Reflexos, sofrendo Xd10 + modificador de Força ou Destreza (onde X é o seu bônus de treinamento) de dano de Impacto e não podendo realizar Ataques de Oportunidade contra você em uma falha. Você pode realizar um ataque contra ela.","execucao":"Ação Completa","custo":"6 PE","alcance":"","gatilho":"Ao terminar seu movimento adjacente a uma criatura","pre":""},{"l":6,"n":"GOLPE DA MÃO ABERTA","d":"Como uma ação comum, você pode gastar 4 PE para realizar um golpe de mão aberta. Você realiza um ataque desarmado contra um alvo dentro do seu alcance corpo a corpo e, em um acerto, ele deve realizar um teste de resistência de Fortitude e, em um fracasso, ele fica Desorientado, Enjoado e Exposto até o início do seu próximo turno. O Golpe da Mão Aberta conta como um ataque desarmado para propósitos de habilidades que apenas funcionam com ataques e você não pode usar ataque extra com esse golpe.","execucao":"Ação Comum","custo":"4 PE","alcance":"","gatilho":"","pre":""},{"l":6,"n":"IGNORAR DOR","d":"Você recebe redução de danos contra todos os tipos, menos alma, igual ao seu nível de empolgação atual. Contra danos físicos, a redução de dano é dobrada.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"MANOBRAS FINALIZADORAS","d":"Você libera acesso a novas manobras, listadas no final da especialização. Você pode realizar uma Manobra Finalizadora.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao realizar um ataque","pre":""},{"l":6,"n":"PODER CORPORAL","d":"O dano de seus ataques desarmados aumenta em 2 níveis e, uma vez por rodada, ao realizar um ataque desarmado, você pode escolher realizar uma Manobra como parte do ataque, aplicando seu efeito juntamente do dano.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Caminho da Mão Vazia"},{"l":6,"n":"POTÊNCIA SUPERIOR","d":"Quando Derrubar um inimigo com sucesso, ele também recebe 2d6 + seu modificador de Força de dano de impacto; quando Empurrar um inimigo, a distância padrão se torna 4,5 metros ao invés de 1,5 metros.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Complementação Marcial"},{"l":6,"n":"SEQUÊNCIA INCONSEQUENTE","d":"Você passa a receber o dano adicional em todos seus ataques realizados durante o turno.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Quando utilizar Ataque Inconsequente","pre":"Ataque Inconsequente"},{"l":6,"n":"UM COM A ARMA","d":"Uma quantidade de vezes igual a metade do seu nível de Lutador, por descanso curto, suas armas dedicadas conseguem superar resistência ao tipo de dano delas em um ataque. Caso erre o ataque, o uso não é consumido. Uma vez por rodada, ao ser desarmado de uma das suas armas dedicadas, você pode evitar, mantendo-se em posse da arma.","execucao":"Reação","custo":"","alcance":"","gatilho":"","pre":"Dedicação em Arma"},{"l":8,"n":"APTIDÕES DE LUTA","d":"Você pode aumentar o seu nível de aptidão em Aura ou Controle e Leitura em 1. Você pode pegar esta habilidade duas vezes, uma para cada aptidão.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":8,"n":"ATAQUES RESSOANTES","d":"Você pode que todos os inimigos adjacentes ao alvo, com a Defesa inferior ao resultado do seu ataque, recebam dano igual a metade do dano causado no alvo.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"Ao realizar um ataque contra um inimigo","pre":""},{"l":8,"n":"BRUTALIDADE APRIMORADA","d":"Você recebe uma quantidade de pontos de vida temporários igual ao seu nível + modificador do atributo para CD de Especialização. O bônus inicial em dano se torna +4 e o aumento no dano por ponto de energia adicional gasto se torna +2.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao entrar no estado de brutalidade","pre":"Brutalidade"},{"l":8,"n":"FEITIÇO E PUNHO","d":"Uma vez por rodada, quando utilizar um Feitiço de dano com alvo único, você pode realizar um ataque corpo a corpo contra o mesmo alvo, desde que ele esteja dentro do seu alcance.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"","pre":"Mãos Amaldiçoadas"},{"l":8,"n":"GOLPEAR BRECHA","d":"Você consegue aproveitar de um golpe aparado para atacar a brecha que se abre na defesa do inimigo. Você pode gastar 2PE adicionais para realizar um ataque contra o inimigo como parte da reação.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"Quando utilizar Aparar Ataque e conseguir aparar com sucesso","pre":"Aparar Ataque"},{"l":8,"n":"OPORTUNISTA","d":"Você sabe aproveitar bem brechas na defesa dos inimigos. Uma vez por rodada, quando um inimigo dentro do seu alcance corpo a corpo é atingido por um ataque de uma criatura o flanqueando, você pode fazer um ataque corpo a corpo contra a criatura.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"","pre":""},{"l":8,"n":"PANCADA DESNORTEANTE","d":"Você pode fazer com que o alvo do ataque receba desvantagem contra um TR à sua escolha, até o início do seu próximo turno.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Quando conseguir um acerto crítico em um ataque corpo a corpo","pre":""},{"l":8,"n":"PUNHOS LETAIS","d":"Enquanto estiver desarmado, sua margem de crítico diminui em 1 e seus ataques ignoram RD igual ao seu bônus de treinamento.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Poder Corporal"},{"l":10,"n":"ALMA QUIETA","d":"Você recebe vantagem para resistir às seguintes condições: Condenado, Enfeitiçado e Fragilizado.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Treinado em Vontade"},{"l":10,"n":"CORPO SINCRONIZADO","d":"Você recebe vantagem para resistir às seguintes condições: Caído e Exposto.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Treinado em Fortitude"},{"l":10,"n":"EMPOLGAR-SE","d":"Em certos momentos, a própria antecipação que você guarda para uma luta pode se transformar na empolgação necessária. Uma quantidade de vezes igual ao seu Bônus de treinamento, por descanso longo, você pode escolher subir dois níveis de empolgação, ao invés de um, no começo de um turno em que ele aumentaria.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"IMPACTO DEMOLIDOR","d":"Você consegue colocar tanta força em um golpe que o alvo se torna uma bola de demolição. Realize uma jogada de ataque corpo a corpo contra um alvo dentro do seu alcance corpo a corpo e, caso acerte, você causa o dano do ataque e realiza a ação Empurrar como parte dele: a distância total que o alvo será empurrado é dobrada e ele quebra todo objeto ou obstáculos em sua parede, como paredes ou contêiners, recebendo o Dano de Fontes Externas (p.327). Não é possível utilizar Ataque Extra nesta ação.","execucao":"Ação Comum","custo":"","alcance":"","gatilho":"","pre":"Potência Superior"},{"l":10,"n":"INSISTÊNCIA","d":"Uma vez por cena, caso você fosse ter os seus pontos de vida reduzidos a 0, você pode escolher retornar ao nível de empolgação 1 para continuar de pé, curando-se em um valor igual a uma rolagem de dano do seu ataque desarmado. Após usar essa habilidade, até que realize um descanso longo, o seu nível máximo de empolgação abaixa em 1.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Ignorar Dor"},{"l":10,"n":"MENTE EM PAZ","d":"Você recebe vantagem para resistir às seguintes condições Amedrontado, Atordoado e Confuso.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Treinado em Astúcia"},{"l":12,"n":"ARMAS ABSOLUTAS","d":"Enquanto estiver empunhando uma Arma Dedicada, você pode receber os seguintes bônus por uma rodada: você escolhe aumentar sua Defesa em 3 ou receber +3 em Jogadas de Ataque e, uma vez por ataque, ao errar com uma arma dedicada, você pode rolar novamente o ataque, ficando com o melhor resultado. Para cada rodada após a primeira, você deve gastar mais 2PE para manter, ou os bônus se encerram.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"","pre":"Um Com a Arma"},{"l":12,"n":"CORPO ARSENAL","d":"Você pode optar por infligir o efeito de um grupo adicional entre Bastão, Haste ou Martelo.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Quando realizar um acerto crítico com um ataque desarmado","pre":"Punhos Letais"},{"l":16,"n":"CORPO SUPREMO","d":"Você recebe mais 3 metros de movimento adicionais, +4 na sua Defesa e redução de dano igual a metade do seu nível de personagem contra dano cortante, perfurante e de impacto, além de mais um tipo à sua escolha, exceto alma. Contra os outros tipos de dano não escolhidos, a redução de dano é igual a 1/4 do seu nível.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"SEJA ÁGUA","d":"Seu Deslocamento aumenta em 3 metros, você ignora terreno difícil por fontes físicas (como detritos ou solo destruído) e, uma vez por rodada, pode evitar ser agarrado sem a necessidade de teste.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"TEMPESTADE SUFOCANTE","d":"Para cada ataque corpo a corpo desarmado ou com arma marcial que você acertar em um mesmo alvo, ele recebe -1 na Defesa e em Testes de Resistência realizados contra você, acumulando até um máximo igual ao seu bônus de treinamento. O prejuízo dura até o começo do próximo turno da criatura afetada.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":16,"n":"DURO NA QUEDA","d":"Você pode escolher receber uma falha garantida para fazer um teste de Vontade contra a CD X, sendo X igual a 15 + 1 para cada 3 pontos de vida negativos. Se passar, você levanta com 1 de vida e recebe 1 ponto de exaustão.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Quando estiver nas portas da morte","pre":"Treinado em Vontade"}],"Especialista em Combate":[{"l":1,"n":"REPERTÓRIO DO ESPECIALISTA","d":"Como um Especialista em Combate, você pode escolher um estilo principal para seguir em sua especialização. No primeiro nível, você recebe um dos estilos de combate abaixo: •  Estilo Defensivo. Você foca em aprimorar a sua defesa. Sua Defesa aumenta em 2 e, nos níveis 4, 8, 12 e 16 aumenta em +1. • Estilo do Arremessador. Você se versa em armas de arremesso. Você pode sacar uma arma de arremesso como parte do ataque, além de receber +2 em rolagens de dano com elas, o qual aumenta em +1 nos níveis 4, 8, 12 e 16. • Estilo do Duelista. Você foca em duelar com uma única arma em mãos. Ao usar uma arma em uma mão e ter a outra livre, você recebe +1 em rolagens de acerto e +2 em rolagens de dano. Nos níveis 4, 8, 12 e 16, o bônus em dano aumenta em +1; nos níveis 8 e 16, o bônus em acerto aumenta em +1. • Estilo do Interceptador. Você se dedica a utilizar de suas armas para interceptar ataques em seus aliados. Quando um aliado dentro do seu alcance receber um ataque, você pode usar sua reação para reduzir o dano causado em 1d10 + seu modificador de força, destreza ou sabedoria, aumentando em um dado nos níveis 4, 8, 12 e 16. 63","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":1,"n":"ARTES DO COMBATE","d":"Você recebe uma quantidade de Pontos de Preparo igual ao seu nível de Especialista em Combate + Modificador de Sabedoria, os quais são usados para realizar artes de combate. Você sabe as seguintes artes de combate: •  Arremesso Ágil. Ao realizar um ataque corpo-a-corpo, você pode gastar 1 ponto de preparo para, como uma ação livre, realizar um outro ataque, com uma arma de arremesso, contra um segundo alvo. • Distração Letal. Ao realizar um ataque, você pode gastar 1 ponto de preparo para fazer com que ele foque em distrair o alvo. Caso o ataque acerte, a criatura atingida tem a sua Defesa reduzida em um valor igual a metade do seu Modificador de Sabedoria por uma rodada. • Execução Silenciosa. Ao realizar um ataque em uma criatura desprevenida, você pode gastar 1 ponto de preparo para aumentar a letalidade do ataque, adicionando 1d6 de dano. A cada +2 no Modificador de Sabedoria, o dano aumenta em +1d6. • Golpe Descendente. Ao realizar um ataque corpo-a-corpo, você pode gastar 1 ponto de preparo para fazer com que ele venha por cima. Ao acertar um golpe descendente, sua Defesa aumenta em um valor igual a metade do seu Modificador de Sabedoria até o começo do seu próximo turno. • Investida Imediata. Ao realizar a ação de ataque, você pode gastar 2 pontos de preparo para tornar esse ataque em uma investida imediata, aproximando-se uma quantidade de metros igual ao seu Modificador de Sabedoria x 1,5m de um alvo e realizando o ataque logo após. Esse movimento não causa ataques de oportunidade. Sempre que eliminar um inimigo, você recupera um Ponto de Preparo; você pode usar sua ação comum para analisar o campo de batalha, recuperando dois Pontos de Preparo. Em um descanso curto, você recupera metade do seu máximo, enquanto em um descanso longo os recupera por completo. 64","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"GOLPE ESPECIAL","d":"Quando realizar um ataque, ou arte do combate que envolva um ataque, você pode o montar como um ataque especial, escolhendo entre as opções abaixo: •  Amplo. O ataque atinge uma criatura a mais. +2PE • Atroz. Em um acerto, o ataque causa 1 dado de dano adicional. +1PE • Impactante. Empurra o alvo em 1,5 metros para cada 15 pontos de dano causados. Fortitude reduz à metade. +1PE • Letal. Diminui em 1 a margem de crítico do ataque. +2PE • Longo. Aumenta o alcance da arma em 1,5 metros para corpo-a-corpo ou 9 metros para ataques a distância. +1PE • Penetrante. Ignora redução a dano em um valor igual a metade do seu nível de personagem. +2PE • Preciso. Recebe vantagem no ataque. Após o primeiro uso na rodada, o custo aumenta para 2PE. +1PE/+2PE • Sanguinário. Uma criatura atingida sofre sangramento leve (CD de Especialização). Pode ser pego uma segunda vez para causar sangramento médio ao invés de leve. +2PE • Lento. O ataque deve ser usado como ação completa. -2PE • Sacrifício. Recebe 15 de dano ao efetuar o ataque. -1PE • Desfocado. O ataque recebe uma penalidade de 4 no acerto (cumulativo até três vezes). -1PE Certas propriedades aumentam ou diminuem o custo e, ao terminar de montar o ataque especial, você paga o seu custo total; um ataque especial deve custar no mínimo 1 ponto de energia amaldiçoada (PE). No quarto nível você também recebe a habilidade Implemento Marcial: Implemento Marcial. Você recebe +2 na CD de suas Habilidades de Especialização, Feitiços e Aptidões Amaldiçoadas. Esse bônus aumenta em 1 nos níveis 8° e 16° de Especialista em Combate.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"RENOVAÇÃO PELO SANGUE","d":"Com tamanha precisão e letalidade, você passa a ser capaz de renovar seu próprio estoque de energia a partir do sangue. Ao acertar um ataque crítico em um inimigo ou reduzir seus pontos de vida a 0, você recupera um ponto de energia amaldiçoada.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":9,"n":"TESTE DE RESISTÊNCIA MESTRE","d":"Você se torna treinado em um segundo teste de resistência e mestre no concedido pela sua especialização.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":20,"n":"AUTOSSUFICIENTE","d":"Tornando-se um mestre das técnicas armadas, você consegue ser autossuficiente na energia para usar seu golpe especial. Sempre que realizar um Golpe Especial, recebe 3 PE temporários para serem usados no ataque. Uma vez por cena, você pode escolher transformar esse valor em 6. Além disso, todos seus ataques causam um dado de dano adicional, do mesmo tipo da arma manuseada. 65","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"ARREMESSOS POTENTES","d":"Seus ataques com armas de arremesso contam como um nível de dano acima. Além disso, no começo do seu turno, você pode fazer com que seus ataques com armas de arremesso ignorem RD igual ao seu bônus de treinamento.","execucao":"Passiva","custo":"1 PE","alcance":"","gatilho":"","pre":""},{"l":2,"n":"ARSENAL CÍCLICO","d":"Uma vez por rodada, você pode sacar ou trocar um item com uma ação livre. Você recebe +1d até o fim do seu próximo turno com a arma trocada.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao realizar um golpe com um grupo de armas e trocar para outra arma de outro grupo na mesma rodada ou na próxima","pre":""},{"l":2,"n":"ASSUMIR POSTURA","d":"Você recebe acesso às posturas, explicadas e listadas no final da especialização.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":2,"n":"DISPAROS SINCRONIZADOS","d":"Caso esteja manejando duas armas a distância ou de fogo, você pode usar suas ações de ataque juntas para tentar sincronizar os dois tiros. Realize os dois ataques e, caso ambos acertem, você combina o dano em uma única instância, depois adicionando efeitos aplicáveis para ambas as armas, além de aplicar resistências ou fraquezas apenas uma vez.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"ALISTA EM COMBATE","d":"Recebe uma habilidade de especialista em a qualquer pré-requisito para poder obter a","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"ESCUDEIRO AGRESSIVO","d":"Uma vez por rodada, ao realizar uma ação de ataque e estiver empunhando um escudo, você pode fazer um ataque adicional com o escudo.","execucao":"Passiva","custo":"1 PE","alcance":"","gatilho":"","pre":""},{"l":2,"n":"EXTENSÃO DO CORPO","d":"Seu alcance em ataques com armas corpo a corpo aumenta em 1,5 metros e você recebe um bônus de +2 em jogadas de ataque e em testes para evitar ser desarmado.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"FLANQUEADOR SUPERIOR","d":"Enquanto estiver flanqueando uma criatura, a criatura flanqueada recebe -2 em testes de resistência.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"GOLPE FALSO","d":"Você é capaz de fingir desferir um golpe, distraindo seus inimigos para auxiliar aliados. Como reação a um aliado atacando um inimigo dentro do seu alcance de ataque, você realiza o golpe falso. O inimigo deve realizar um TR de Astúcia e, caso falhe, o seu aliado recebe vantagem no teste de ataque.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"GOLPES POTENTES","d":"Sempre que você estiver usando uma arma com a qual você seja treinado o dano dela aumenta em um nível e suas rolagens de dano recebem um bônus de +2.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"INDOMÁVEL","d":"Uma quantidade de vezes por descanso curto ou longo igual a metade do seu nível de personagem, você pode rolar novamente um teste de resistência em que você falhar, ficando com o melhor resultado.","execucao":"Passiva","custo":"1 PE","alcance":"","gatilho":"","pre":""},{"l":2,"n":"PISTOLEIRO INICIADO","d":"Quando for realizar um ataque com uma arma de fogo, antes da jogada de ataque, você pode escolher aumentar a margem de Emperrar em 2 e, em troca, você causa 1 dado de dano adicional caso acerte.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"POSICIONAMENTO AMEAÇADOR","d":"A menos que esteja furtivo, você pode conceder os benefícios de Flanco para aliados, mesmo utilizando armas a distância ou de fogo, desde que o alvo do flanco esteja dentro do primeiro alcance da sua arma.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"PRECISÃO DEFINITIVA","d":"Você pode receber +2 na rolagem para acertar. A cada quatro níveis, você pode gastar 1 ponto a mais para aumentar o bônus em +2. Você também pode optar por adicionar esse bônus na rolagem de dano ao invés da de acerto, com um bônus de +4 ao invés de +2 para esse uso.","execucao":"Passiva","custo":"1 PE","alcance":"","gatilho":"Quando faz um ataque","pre":""},{"l":2,"n":"PRESENÇA SUPRIMIDA","d":"Você recebe um bônus de +2 em rolagens de Furtividade. Sua penalidade em furtividade por atacar e fazer outras ações chamativas é reduzida para -5.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"REVIGORAR","d":"Diante o quão extenso e cansativo um combate pode ser, você é capaz de focar e recuperar seu vigor. Uma quantidade de vezes igual ao seu bônus de treinamento você pode se curar em um valor igual a 1d10 + o dobro do seu modificador de Constituição + bônus de treinamento, aumentando em um dado a cada 4 níveis. Você recupera todos os usos em um descanso longo ou metade em um descanso curto.","execucao":"Ação Bônus","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"TIRO FALSO","d":"Como reação a um aliado atacando um inimigo dentro do seu alcance de ataque, caso esteja manejando uma arma a distância ou de fogo, você realiza um tiro falso, fingindo que dispararia. O inimigo deve realizar um TR de Astúcia e, caso falhe, o seu aliado recebe vantagem no teste de ataque.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"ZONA DE RISCO","d":"Uma vez por rodada, se estiver empunhando uma arma corpo-a-corpo com a propriedade Estendida e um inimigo entrar no seu alcance de ataque, você pode realizar um ataque contra ele.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"","pre":""},{"l":4,"n":"APRENDER POSTURA","d":"Você aprende uma postura adicional à sua escolha. No 10° nível você aprende outra postura.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Assumir Postura"},{"l":4,"n":"ARMAS ESCOLHIDAS","d":"Escolha um grupo de arma: seus ataques com armas dele tem o nível de dano aumentado em 3.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"ARREMESSO RÁPIDO","d":"Uma vez por rodada, ao realizar um ataque com uma arma de arremesso, você pode realizar um ataque com arma de arremesso contra outro alvo. Você arremessa outra arma ou a mesma arma utilizada antes, desde que ela possua a propriedade Retorno. TÉCNICAS DE AVANÇO As técnicas de avanço envolvem a mistura do deslocamento com os golpes. Você aprende duas artes de combate de avanço, listadas no final da especialização.","execucao":"Passiva","custo":"1 PE","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":4,"n":"BUSCAR OPORTUNIDADE","d":"Realize um teste de Percepção com CD16 + 2 para cada inimigo em campo. Caso suceda no teste, você pode utilizar Andar, Desengajar ou Esconder como Ação Livre.","execucao":"Ação Livre","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"COMPENSAR ERRO","d":"Você se torna habilidoso o suficiente para compensar erros com a liberação bruta de energia. Uma vez por rodada, quando errar um ataque com uma arma corpo a corpo, você pode gastar até uma quantidade de PE igual ao seu bônus de treinamento para causar dano no alvo do ataque. Para cada ponto gasto, o alvo recebe 1d10 de dano Energético com o seu modificador de força, destreza ou sabedoria sendo somado ao total.","execucao":"Passiva","custo":"Variável","alcance":"","gatilho":"","pre":""},{"l":4,"n":"ESPECIALISTA EM ESCUDO","d":"Você se especializa completamente na defesa e no uso de escudos. Você passa a somar o aumento base em RD do seu escudo em testes de resistência de Reflexos e Fortitude.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"ESPÍRITO DE LUTA","d":"Você pode receber um bônus de +2 em jogadas de ataque até o fim da cena. Além disso, ao utilizar esta habilidade, você ganha PV temporários igual ao seu nível de personagem.","execucao":"Ação Livre","custo":"1 PE","alcance":"","gatilho":"","pre":""},{"l":4,"n":"GRUPO FAVORITO","d":"Escolha um grupo de armas: você recebe acesso ao efeito de crítico do grupo enquanto manejando uma arma que pertença a ele.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"GUARDA ESTUDADA","d":"Você passa a somar metade do seu modificador de Sabedoria na sua Defesa, limitado pelo seu nível. Além disso, você pode escolher um Teste de Resistência para receber um bônus de +2.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"MENTE OCULTA","d":"Você passa a adicionar também o seu bônus de sabedoria em rolagens de Furtividade.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"PREPARO IMEDIATO","d":"Durante uma rolagem de iniciativa, você pode gastar 3 pontos de preparo para utilizar Preparar, mas apenas para uma ação bônus. A partir do 10° nível, você pode optar por gastar 7 pontos de preparo para preparar uma ação comum.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"RECARGA RÁPIDA","d":"O custo em ações para recarregar armas a distância que você empunhar diminui em um nível; custo de ação comum se torna ação bônus e ação bônus se torna ação livre.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"USO RÁPIDO","d":"Você pode usar um item adicional.","execucao":"Passiva","custo":"1 PE","alcance":"","gatilho":"Ao utilizar uma ação para usar um item","pre":""},{"l":6,"n":"ACERVO AMPLO","d":"Você aprende mais um Estilo de Combate. Após meditar por 1 hora, você pode trocar quais estilos de combate você possui.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":6,"n":"APRIMORAMENTO ESPECIALIZADO","d":"Você passa a somar metade do modificador do seu atributo chave em sua CD de Especialização.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"ATAQUE EXTRA","d":"Você pode atacar duas vezes ao invés de uma.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"Ao realizar a ação Atacar","pre":""},{"l":6,"n":"CRÍTICO MELHORADO","d":"Você aguça o seu olhar para tornar mais fácil encaixar um golpe certeiro. A margem do seu acerto crítico reduz em um número.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"CRÍTICO POTENTE","d":"Acertar um golpe certeiro é realmente devastador para você. Ao acertar um ataque crítico, ele causa 1 dado de dano adicional.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"FEITIÇARIA IMPLEMENTADA","d":"Uma vez por rodada, quando utilizar um Feitiço de dano, você pode realizar um ataque contra uma criatura que tenha sido afetada por ela, como Ação Livre.","execucao":"Ação Livre","custo":"2 PE","alcance":"","gatilho":"","pre":"Treinado em Feitiçaria"},{"l":6,"n":"FLUXO PERFEITO","d":"Caso você acerte todos os seus ataques no turno, no seu próximo turno você ganha 1 ponto de energia amaldiçoada temporária. No 12° nível, esse valor se torna 2.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"OLHOS DE ÁGUIA","d":"Você pode usar Mirar como uma ação livre.","execucao":"Ação Livre","custo":"1 PE","alcance":"","gatilho":"","pre":""},{"l":6,"n":"MANEJO ESPECIAL","d":"Você pode escolher uma propriedade de ferramenta amaldiçoada para ser aplicada em toda arma que você estiver manejando, se possível.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"MARCAR INIMIGO","d":"Você marca um inimigo como seu no campo de batalha, impedindo-o de atacar e retaliando tentativas de o ignorar. Você pode escolher marcá-la até o final do seu próximo turno: enquanto a criatura marcada estiver, ela recebe -4 em jogadas de ataque e, adicionalmente, caso a criatura marcada cause dano em alguém além de você, você pode realizar um ataque como Ação Bônus contra ela no seu próximo turno. Você pode realizar este ataque uma quantidade de vezes igual ao seu modificador de Força, Destreza ou Sabedoria por descanso curto. Caso seja incapacitado, desmaiado ou morto, o efeito da habilidade é cancelado.","execucao":"Ação Bônus","custo":"1 PE","alcance":"4,5 m","gatilho":"Após um golpe","pre":""},{"l":6,"n":"MIRA DESTRUTIVA","d":"Você optar por deixar de receber vantagem para mirar em uma parte específica do corpo: escolha entre Olho, Braço, Perna ou Ferida Interna e, no seu próximo ataque, você recebe -15 na jogada de ataque, mas, caso acerte, o alvo recebe a consequência do membro de acordo com a tabela de Ferimentos Complexos durante uma rodada.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Quando utilizar a ação Mirar","pre":"Treinado em Percepção"},{"l":6,"n":"PREPARAÇÃO RÁPIDA","d":"Entrar em uma postura se torna uma Ação Livre e elas não são canceladas caso você seja empurrado.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Assumir Postura"},{"l":8,"n":"APTIDÕES DE COMBATE","d":"Você pode aumentar o seu nível de aptidão em Aura ou Controle e Leitura em 1. Você pode pegar esta habilidade duas vezes, uma para cada aptidão.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":8,"n":"TÉCNICAS DA FORÇA","d":"As técnicas da força permitem uma concentração ainda maior da sua potência e poder. Você aprende duas artes de combate da força, listadas no final da especialização.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":8,"n":"DESTRUIÇÃO DUPLA","d":"Enquanto estiver lutando com duas armas de grupos diferentes, seu ataque com a segunda arma causa 1 dado de dano adicional e, caso consiga um acerto crítico, você pode aplicar o Efeito Crítico do grupo das duas armas que você maneja ao mesmo tempo, caso sejam de grupos diferentes.","execucao":"Passiva","custo":"1 PE","alcance":"","gatilho":"","pre":""},{"l":8,"n":"ESPÍRITO INCANSÁVEL","d":"Você pode optar por gastar 2PE ao invés de 1, aumentando o bônus em ataques para +5 e fazendo com que os pontos de vida temporários ganhos se tornam o seu bônus de ataque, ao invés do Nível do Personagem, já considerando o bônus da habilidade.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"Quando utilizar Espírito de Luta","pre":"Espírito de Luta"},{"l":8,"n":"PISTOLEIRO AVANÇADO","d":"Você pode optar por aumentar o Emperrar em até 6, ao invés de 2, causando 1 dado de dano adicional para cada outros 2 que aumentar. Além disso, caso uma criatura dentro do primeiro alcance da sua arma de fogo tente se mover, você pode gastar sua Reação para realizar um ataque contra ela e, se acertar, ela recebe dano e ela perde 4,5 metros de movimento até o final do turno dela.","execucao":"Reação","custo":"","alcance":"","gatilho":"","pre":"Pistoleiro Iniciado"},{"l":8,"n":"RICOCHETE CONSTANTE","d":"Você pode pagar 5PE ao invés de 1 para que, até o final do turno, seus ataques com armas de arremesso possam acertar uma criatura à sua escolha do alvo do ataque, caso sua jogada de ataque supere a Defesa da outra criatura.","execucao":"Passiva","custo":"5 PE","alcance":"4,5 m","gatilho":"Quando for ativar Arremessos Potentes","pre":""},{"l":8,"n":"SOMBRA VIVA","d":"Uma vez por rodada, você pode utilizar Esgueirar e se mover todo o seu movimento, ao invés de apenas metade. Além disso, uma vez por rodada, caso fosse ser encontrado por uma criatura o procurando, você pode realizar outro teste de Furtividade e, caso o resultado do novo teste supere a Percepção do inimigo o procurando, você continua escondido.","execucao":"Reação","custo":"","alcance":"","gatilho":"","pre":"Treinado em Furtividade"},{"l":8,"n":"SURTO DE AÇÃO","d":"Uma quantidade de vezes igual a metade do seu bônus de treinamento, por descanso longo, você pode, uma vez por rodada, realizar uma ação comum a mais no seu turno.","execucao":"Passiva","custo":"5 PE","alcance":"","gatilho":"","pre":""},{"l":10,"n":"ANÁLISE ACELERADA","d":"Utilizar a ação de Análise se torna uma ação bônus.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"ARMAS PERFEITAS","d":"Suas armas escolhidas se tornaram perfeitas, sabendo como contornar fraquezas e defesas. Seus ataques com uma arma do grupo escolhido em Armas Escolhidas ignoram 10 de RD ao tipo de dano dela.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Armas Escolhidas"},{"l":10,"n":"ASSASSINAR","d":"Durante a primeira rodada de um combate, ao atacar uma criatura desprevenida a partir da furtividade ou surpresa, seu primeiro ataque é um crítico garantido.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Mestre em Furtividade"},{"l":10,"n":"ATAQUE CONCENTRADO","d":"Você pode gastar PE equivalentes a metade do custo de Ataque Extra e/ou Surto de Ação, até um limite igual ao máximo de vezes que poderia usá-los dentro do seu turno. Para cada vez que o fizer, você adiciona metade dos dados de dano de um ataque (mínimo 1 dado) à rolagem de dano do seu próximo ataque. Ao utilizar esta habilidade, considera-se que ataque extra e/ou Surto de Ação foram utilizados, não podendo os realizar novamente no mesmo turno.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao utilizar a ação Atacar","pre":"Ataque Extra"},{"l":10,"n":"CHUVA DE ARREMESSOS","d":"Como uma ação completa você pode escolher realizar uma quantidade de ataques com armas de arremesso igual ao seu bônus de treinamento. Para cada ataque após o primeiro, você você só pode continuar realizando ataques enquanto ainda tenha armas de arremesso em sua posse.","execucao":"Ação Completa","custo":"1 PE","alcance":"","gatilho":"","pre":"Arremessos Potentes e Arremesso Rápido"},{"l":10,"n":"POTÊNCIA ANTES DE CAIR","d":"Se você for cair para 0 de vida, você pode realizar um turno impedindo o turno atual. Ao ter 0 de vida neste turno, tomar dano resulta em falhas no teste de morte. Você fica inconsciente e recebe um nível de exaustão. Pode ser usada uma vez por descanso longo.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Quando o turno acaba","pre":""},{"l":12,"n":"TÉCNICAS DE SAQUE","d":"Você aprende duas artes de combate de saque, listadas no final da especialização.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":12,"n":"CICLAGEM ABSOLUTA","d":"Você passa a poder, durante o seu turno, trocar a arma que esteja manejando toda vez que atacar. Além disso, sempre que trocar para outra arma de outro grupo durante seu turno, você recebe um bônus de +2 na próxima jogada de ataque que realizar.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Arsenal Cíclico"},{"l":12,"n":"MANEJO ÚNICO","d":"Você escolhe mais uma propriedade para ser aplicada em toda arma que estiver manejando e, no começo de uma cena de combate, pode receber uma propriedade única durante o resto da cena. Essa propriedade pode tanto ser criada pelo jogador, quanto ser uma das já existentes.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"","pre":"Manejo Especial"},{"l":16,"n":"CRÍTICO APERFEIÇOADO","d":"A margem do seu acerto crítico reduz em dois números, ao invés de um.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Crítico Melhorado"},{"l":16,"n":"MESTRE PISTOLEIRO","d":"Fazer uma arma emperrada funcionar novamente se torna uma ação de movimento e sua margem de crítico com armas de fogo aumenta em 1.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Pistoleiro Avançado"},{"l":16,"n":"SINCRONIA PERFEITA","d":"O alcance adicional concedido por Extensão do Corpo aumenta para 3 metros e recebe vantagem em testes para evitar ser desarmado.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Extensão do Corpo"},{"l":16,"n":"MESTRE DA POSTURA","d":"Você pode assumir duas posturas ao mesmo tempo, recebendo os benefícios de ambas.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Quando entrar em postura","pre":"Assumir Postura"},{"l":16,"n":"ARTES DO COMBATE","d":"Você aprende as duas artes do combate abaixo: •  Avanço Bumerangue. Ao utilizar a ação Atacar, você pode gastar 3 Pontos de Preparo para saltar na direção de um inimigo dentro de 6 metros e, após encerrar a ação, você retorna para o ponto de partida. Nem o avanço nem o retorno causam ataques de oportunidade. Durante o retorno, você pode gastar 1 Ponto de Preparo para realizar um ataque com uma arma de arremesso ou a distância contra o mesmo alvo. • Sombra Descendente. Como uma Ação Comum, você pode gastar 3 Pontos de Preparo para avançar rapidamente contra um inimigo dentro de 6 metros e realizar um ataque contra ele. Após realizar o ataque, você o utiliza como apoio e se ergue no ar, podendo escolher cair em outro inimigo dentro de 6 metros e realizar um ataque contra ele, caindo em um lugar desocupado dentro de 3 metros do alvo após isso. Artes do Combate – Técnicas da Força. Ao obter essa habilidade, você aprende as duas artes do combate abaixo: • Nuvens Espirais. Como uma Ação Completa, você inicia uma sequência contra um inimigo dentro do alcance da sua arma: você pode realizar até três ataques, gastando 2 Pontos de Preparo para cada um. A cada ataque, o alvo é empurrado 3 metros para qualquer direção, com você o acompanhando, além de cada ataque causar 2d6 de dano Energético adicional. • Onda do Dragão. Quando utilizar a ação Atacar, você pode gastar 5 Pontos de Preparo para receber vantagem neste ataque e, caso acerte, o alvo é empurrado 6 metros para trás, recebe 3d12 de dano Energético adicional e tem metade da sua Redução de Dano ignorada. Artes do Combate – Técnicas de Saque. Ao obter essa habilidade, você aprende as duas artes do combate abaixo: • Saque Devastador. No final do seu turno, você pode gastar 2 Pontos de Preparo para preparar um saque, o qual dura até o começo do seu próximo turno. Caso seja atacado enquanto estiver com o saque preparado, você pode gastar 4 Pontos de Preparo e sua Reação para realizar um ataque contra a criatura atacante. Caso o resultado da sua Jogada de Ataque seja maior do que a da criatura, você anula o ataque dela e acerta o seu, o qual causa 4d10 de dano adicional do mesmo tipo da arma e ignora Redução de Dano. Caso o seu resultado seja menor, você apenas causa o dano comum de um ataque. • Saque Trovão. Como uma Ação Completa, você pode gastar 6 Pontos de Preparo para se mover uma distância igual ao seu Deslocamento e, enquanto se movendo desta maneira, você não recebe ataques de oportunidade e pode realizar um ataque contra todo inimigo que fique dentro de 3 metros de você durante a locomoção.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter essa habilidade","pre":""}],"Especialista em Técnica":[{"l":1,"n":"DOMÍNIO DOS FUNDAMENTOS","d":"Você aprende duas das Mudanças de Fundamento abaixo no primeiro nível e uma adicional no nível 12. •  Feitiço Cruel. Quando usar um Feitiço que força um Teste de Resistência você pode gastar 1 ponto de energia amaldiçoada para aumentar a CD do teste em 2 ou 2 pontos para aumentar em 4. • Feitiço Distante. Quando usar um Feitiço a distância, você pode gastar 2 pontos de energia amaldiçoada para dobrar seu alcance. Caso seja um Feitiço corpo-a-corpo, você pode gastar 2 pontos de energia para a dar um alcance de 9 metros. • Feitiço Duplicado. Uma vez por rodada, quando usar um Feitiço de dano cujo alvo seja apenas uma criatura, você pode gastar pontos de energia para dar um segundo alvo a habilidade. O custo é igual ao dobro do nível do Feitiço (considere 1 para Feitiços nível 0). • Feitiço Expansivo. Quando usar um Feitiço em área, você pode gastar 3 pontos de energia amaldiçoada para aumentar a área em um valor igual a metade da área padrão (1,5x do total). 78","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":1,"n":"CONJURAÇÃO APRIMORADA","d":"Você soma um bônus ao total de dano causado baseado no nível do Feitiço, de acordo com a tabela abaixo. Além disso, você passa a receber novos Feitiços em todo nível, ao invés de apenas nos níveis pares. NÍVEL DA HABILIDADE BÔNUS DE DANO Nível 1 Modificador de Atributo Nível 2 Modificador de Atributo Nível 3 Dobro do Modificador de Atributo Nível 4 2x Mod. de Atributo + Nível de Personagem Nível 5 2x Mod. de Atributo + 2x Nível de Personagem Técnica Máxima 3x Mod. de Atributo + 3x Nível de Personagem","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"Sempre que utilizar um Feitiço que cause dano","pre":""},{"l":4,"n":"ADIANTAR A EVOLUÇÃO","d":"Ao invés de seguir o padrão para conseguir Feitiços de nível superior, com o aumento de treinamento, você segue o seguinte padrão: no nível 4, você recebe acesso a Feitiços nível 2; no nível 7, você recebe acesso a Feitiços nível 3; no nível 11, você recebe acesso a Feitiços nível 4; no nível 15, você recebe acesso a Feitiços nível 5.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":9,"n":"TESTE DE RESISTÊNCIA MESTRE","d":"Você se torna treinado em um segundo teste de resistência e mestre no concedido pela sua especialização. 79","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":10,"n":"FOCO AMALDIÇOADO","d":"Durante seu desenvolvimento, você se foca em certos aspectos do funcionamento da energia amaldiçoada, podendo escolher entre um dos três focos: •  Destruição. Todo Feitiço que você conjurar causa +1 de dano para cada dado rolado nela. Além disso, sempre que causar dano com um Feitiço ou aptidão amaldiçoada, você soma o seu bônus de treinamento no total de dano. • Economia. O custo de todos os seus Feitiços é reduzido em 2, podendo reduzir o custo dos Feitiços nível 1 para 0. Além disso, você passa a somar o seu bônus de treinamento no seu máximo de energia amaldiçoada. • Refino. Você recebe uma Aptidão Amaldiçoada ou Feitiço adicional a sua escolha. Além disso, você passa a somar metade do seu bônus de treinamento no cálculo de todas as suas CDs e em jogadas de ataque amaldiçoado.","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":20,"n":"O HONRADO","d":"Feitiços de nível 1, 2 e 3 tem o seu custo reduzido pela metade; a CD de todos seus Feitiços e Aptidões Amaldiçoadas aumenta em 5 e você recebe +5 em rolagens de ataque para Feitiços e Aptidões Amaldiçoadas. 80","b":1,"execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"ABASTECIDO PELO SANGUE","d":"Quando um inimigo morre, você pode recuperar uma quantidade de energia amaldiçoada igual ao seu modificador de Inteligência ou Sabedoria, ao absorver os vestígios de sua energia. Você pode realizar essa ação uma vez por descanso longo. No nível 8 aumenta para duas vezes e no nível 16 para três vezes.","execucao":"Reação","custo":"","alcance":"12 m","gatilho":"Quando um inimigo morre dentro de 12 metros de você","pre":""},{"l":2,"n":"CONHECIMENTO APLICADO","d":"Você pode gastar pontos de energia amaldiçoada igual a metade do seu bônus de treinamento para receber um bônus: para cada ponto gasto, você adiciona +2 no teste de resistência.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Sempre que for realizar um teste de resistência contra o efeito de um Feitiço","pre":""},{"l":2,"n":"CONJURAÇÃO DEFENSIVA","d":"Você mantém parte da energia amaldiçoada como um revestimento em seu corpo. Você pode, até o começo do seu próximo turno, receber um bônus em Defesa e um valor em RD igual ao nível do Feitiço usado.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"Após uma conjuração","pre":""},{"l":2,"n":"ECONOMIA DE ENERGIA","d":"Após um descanso curto, sua reserva é igual a 1d4, após um descanso longo esse valor é 1d6, aumentando em um dado a cada 5 níveis. Você pode adicionar a energia da reserva no seu valor atual. A economia não acumula.","execucao":"Ação Comum","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"ALISTA EM TÉCNICAS","d":"Recebe uma habilidade de especialista em a qualquer pré-requisito para poder obter a","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"EXPLOSÃO ENCADEADA","d":"Um bom desempenho em uma conjuração o permite aumentar o poder destrutivo, encadeando a força. Você rola mais um dado de dano de mesmo valor, adicionando o resultado ao total de dano. Tal habilidade funciona apenas uma vez por dado do Feitiço: caso role-se um dado adicional por causa de Explosão Encadeada, e tal seja dano máximo, não se ativa novamente.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao rolar o dano máximo em um dado de dano de um Feitiço de dano","pre":""},{"l":2,"n":"FINTA AMALDIÇOADA","d":"Você pode utilizar Fintar com seu atributo-chave ao invés de Presença e os efeitos de Desprevenido por fintar são aplicados na sua próxima conjuração de Feitiço.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"MENTE PLÁCIDA","d":"Sua mente é sempre plácida, dificultando que sua concentração seja quebrada. Quando realizar um teste para manter concentração, você pode gastar 1 ponto de energia para receber um bônus de +3 ou 2 pontos de energia para receber +5, e a Classe de Dificuldade sempre será reduzida em um valor igual ao seu modificador de Inteligência ou sabedoria.","execucao":"Passiva","custo":"1 PE","alcance":"","gatilho":"","pre":""},{"l":2,"n":"NOVA HABILIDADE","d":"Você pode imediatamente criar dois novos Feitiços ou três variações de liberação. Você pode pegar essa habilidade repetidas vezes.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":2,"n":"PERTURBAÇÃO AMALDIÇOADA","d":"Você pode perturbar uma criatura, a qual deve realizar um TR de Vontade. Caso a criatura falhe, ela receberá um prejuízo em rolagens igual ao seu modificador de Inteligência ou Sabedoria; caso a criatura suceda, esse prejuízo é apenas metade do bônus escolhido. A perturbação dura por uma quantidade de rolagens igual ao seu bônus de treinamento.","execucao":"Ação Comum","custo":"2 PE","alcance":"9 m","gatilho":"","pre":""},{"l":2,"n":"REAÇÃO RÁPIDA","d":"Você sempre reage rápido quando uma situação de combate começa. Você passa a adicionar seu modificador de Inteligência ou Sabedoria no seu bônus de iniciativa.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"REFORÇO AMALDIÇOADO","d":"Sua CD de Especialização e Amaldiçoada aumenta em +2. No nível 10, esse aumento se torna +3 e no nível 20, se torna +4.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"SOBRECARREGAR","d":"Focando em sobrecarregar as suas habilidades, você pode consumir energia para a deixar quase impossível de resistir. Quando usar um Feitiço que força um teste de resistência você pode gastar pontos de energia amaldiçoada igual ao seu bônus de treinamento para aumentar a dificuldade do teste. Para cada ponto gasto, a dificuldade aumenta em 1.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"TÉCNICAS DE COMBATE","d":"Você pode escolher duas armas quaisquer para se tornar treinado, caso não tenha, e para poder utilizar Inteligência ou Sabedoria nas jogadas de ataque e dano enquanto as manejando.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":2,"n":"ZELO RECOMPENSADOR","d":"O seu zelo diante si mesmo é recompensador: sempre que você suceder em um teste de resistência para evitar o efeito de um Feitiço, você recebe 1 ponto de energia amaldiçoada temporário. A partir do nível 14 você passa a receber 2 pontos temporários, ao invés de 1.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"ATÉ A ÚLTIMA GOTA","d":"Uma vez por descanso longo, caso esteja com menos da metade do seu máximo de energia amaldiçoada, você pode recuperar 1d4 + seu modificador de Int/ Sab em pontos de energia, aumentando em um dado a cada 5 níveis. Entretanto, é um processo exaustivo, e você recebe um ponto de exaustão após usar essa habilidade.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"CICLAGEM MALDITA","d":"Quando utilizar um Feitiço de dano diferente do último Feitiço que você utilizou anteriormente, ele causa uma quantidade de dados de dano adicionais igual a metade do seu bônus de treinamento.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"DETERMINAÇÃO ENERGIZADA","d":"A partir da energia, você consegue criar uma determinação superior para a sua mente, acelerando-a ou reforçando-a. Quando fizer um teste de resistência de Astúcia ou de Vontade, você pode pagar 1 ponto de energia amaldiçoada para receber vantagem no teste, aumentando em +1PE para cada teste após o primeiro, na mesma rodada.","execucao":"Passiva","custo":"1 PE","alcance":"","gatilho":"","pre":""},{"l":4,"n":"ENERGIA FOCALIZADA","d":"Você escolhe uma perícia de Teste de Resistência (Fortitude, Reflexos, Astúcia e Vontade) para ter metade do seu modificador de Sabedoria ou Inteligência somado a rolagens dela.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"ENERGIA INACABÁVEL","d":"Seu máximo de energia amaldiçoada aumenta em um valor igual a metade do seu nível de Especialista em Técnicas.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"EPIFANIA AMALDIÇOADA","d":"Você aprende uma Aptidão Amaldiçoada. No nível 12 você recebe outra aptidão amaldiçoada.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter essa habilidade","pre":""},{"l":4,"n":"EXPLOSÃO DEFENSIVA","d":"Reagindo a um ataque com uma grande explosão de energia amaldiçoada, você consegue reduzir os danos dele. Como uma Reação, quando for atingido por um ataque corpo a corpo, você pode gastar até uma quantidade de PE igual ao seu bônus de treinamento: para cada PE gasto, você reduz o dano em 5 e empurra o atacante em 3 metros para longe de si.","execucao":"Reação","custo":"Variável","alcance":"","gatilho":"Quando for atingido por um ataque corpo a corpo","pre":"Aptidão Cobrir-se"},{"l":4,"n":"FEITIÇO FAVORITO","d":"Ao obter esta habilidade, escolha um Feitiço: ele recebe uma Melhoria de Ritual permanente, a qual não pode ser alterada após escolhida. A Melhoria concedida por esta habilidade contabiliza como um efeito já aplicado ao realizar um ritual.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"FEITIÇOS REFINADOS","d":"Você passa a somar metade do seu bônus de treinamento no cálculo de CD dos seus Feitiços e Aptidões Amaldiçoadas.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"MOVIMENTOS IMPREVISÍVEIS","d":"Você pode adicionar seu modificador de Inteligência ou de Sabedoria na sua Defesa, limitado pelo seu nível.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"NATURALIDADE COM RITUAIS","d":"Você pode utilizar Inteligência no lugar de Destreza em testes de Prestidigitação para realizar rituais.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Treinado em Prestidigitação"},{"l":4,"n":"PREPARAÇÃO DE TÉCNICAS","d":"Você pode preparar dois Feitiços por descanso longo, para conjurar com custo reduzido pela metade, na primeira vez que as usar. O nível do Feitiço deve ser um; no nível 5, você pode preparar Feitiços de nível dois; no nível 12 você pode preparar Feitiços de nível três; no nível 16 você pode preparar Feitiços de nível quatro e no nível 20 você pode preparar Feitiços de nível cinco.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"OLHAR PRECISO","d":"Você recebe um bônus de +2 em rolagens de ataque para Feitiços e aptidões amaldiçoadas. A cada 4 níveis, esse bônus aumenta em +1.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"SACRIFÍCIO PELA ENERGIA","d":"Você pode se infligir dano para recuperar energia amaldiçoada. Para cada 6 de dano que você causar a si mesmo, você recupera 2 pontos de energia amaldiçoada. Os pontos de vida perdidos por meio desta habilidade não podem ser restaurados até o final do próximo descanso, e qualquer cura que fosse restaurar vida além desse novo limite, é reduzida pela metade e transformada em pontos de vida temporários. Caso cause dano a si mesmo igual ou superior a metade da sua vida máxima, você recebe 1 ponto de exaustão.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":4,"n":"VERSATILIDADE EM FUNDAMENTOS","d":"Durante um descanso curto, você pode alterar quais Mudanças de Fundamentos você possui, até um limite de trocas igual a metade do seu bônus de treinamento. Em um descanso longo, este limite de trocas se torna seu bônus de treinamento.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"BASTIÃO INTERIOR","d":"Você recebe vantagem para resistir às condições amedrontado, desorientado e enfeitiçado.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Treinado em Vontade"},{"l":6,"n":"COMBATE AMALDIÇOADO","d":"Todo ataque feito com uma arma com a qual você se tornou treinado graças a Técnicas de Combate causa dano adicional igual ao seu bônus de treinamento. Você pode também pode que a arma em sua posse cause dano como se fosse um nível de dano acima durante todo o combate.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"","pre":"Técnicas de Combate"},{"l":6,"n":"CORREÇÃO","d":"Uma vez por rodada, quando você for perder a concentração em um Feitiço, você pode gastar pontos de energia amaldiçoada igual ao nível do Feitiço para evitar perder a concentração nele.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"DOMINÂNCIA EM FEITIÇO","d":"Você usa tanto um Feitiço da sua técnica que você passa a dominar ele completamente e otimizar seu uso ao máximo. O custo de um Feitiço a sua escolha diminui em um valor igual a metade do nível dele, arredondado para cima.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"ELEVAR APTIDÃO","d":"Você aumenta um dos seus Níveis de Aptidão em 1. Você pode pegar esta habilidade uma quantidade de vezes igual ao seu bônus de treinamento.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":6,"n":"ESPECIALIZAÇÃO","d":"Você se torna mestre em 3 perícias nas quais você seja treinado, a sua escolha.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":6,"n":"INCAPAZ DE FALHAR","d":"Ao realizar uma rolagem de aptidão amaldiçoada, exceto com Aptidões de Domínio, você pode adicionar um valor igual ao seu modificador de Inteligência ou Sabedoria no resultado. Você só pode utilizar esta habilidade uma vez por Aptidão usada na rodada.","execucao":"Passiva","custo":"2 PE","alcance":"","gatilho":"","pre":""},{"l":6,"n":"MENTE REPARTIDA","d":"Você pode se manter concentrando em duas fontes diferentes simultaneamente.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"NÍVEL PERFEITO","d":"Todos os seus Feitiços de um nível a sua escolha têm a CD de resistência aumentada em 2. Nos níveis 12 e 18 você pode escolher outro nível de Feitiço para ter a CD aumentada em 2.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":6,"n":"PASSO RÁPIDO","d":"Você pode afastar-se em uma distância igual a metade do seu movimento. Tal movimento não permite um ataque de oportunidade.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Quando um inimigo se aproxima de você e você entra no alcance corpo a corpo dele","pre":""},{"l":6,"n":"POTÊNCIA CONCENTRADA","d":"Você é capaz de se preparar e concentrar para aumentar o poder. Uma vez por rodada, você pode gastar uma Ação de Movimento para fazer com que seu próximo Feitiço de dano com alvo único cause dano adicional igual a 5 multiplicado pelo nível do Feitiço.","execucao":"Ação de Movimento","custo":"","alcance":"","gatilho":"Quando for disparar uma manifestação de sua técnica","pre":""},{"l":6,"n":"RITUALISTA","d":"Você é familiar com a aplicação de rituais em suas conjurações, conseguindo ampliar a capacidade deles. Você recebe um bônus de +2 em testes para realizar Conjuração em Ritual e, uma quantidade de vezes igual a metade do seu bônus de treinamento, por Descanso Longo, você pode optar por colocar 1 melhoria adicional nela.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":""},{"l":8,"n":"EXPANSÃO DOS FUNDAMENTOS","d":"Você aprende mais uma Mudança de Fundamento. No nível 12, você aprende outro adicional.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":8,"n":"FÍSICO AMALDIÇOADO DEFENSIVO","d":"A quantidade de PEs que você pode gastar com a aptidão Cobrir-se aumenta em 2. Caso possua Cobertura Avançada, aumenta em +1.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Aptidão Cobrir-se"},{"l":8,"n":"IMBUIR COM TÉCNICA","d":"Quando for utilizar um Feitiço de dano, que não seja de um tipo especial ou em área, você pode gastar 2 PE adicionais para a imbuir em uma arma que esteja manejando, desde que seja treinado com a arma e o Feitiço seja uma Ação Comum ou inferior. Se acertar o ataque, além de causar dano, você causa o efeito do Feitiço, como após ataque. Caso o Feitiço seja de TR, não será necessário um teste para efeito, aplicando-o diretamente, com exceção de Condições, que ainda irão exigir um TR.","execucao":"Ação Bônus","custo":"2 PE","alcance":"","gatilho":"","pre":"Combate Amaldiçoado"},{"l":8,"n":"LIBERAÇÕES EXPANDIDAS","d":"Você recebe uma Liberação Máxima adicional. Nos níveis 12 e 16 você recebe mais uma liberação máxima.","execucao":"Passiva","custo":"","alcance":"","gatilho":"Ao obter esta habilidade","pre":""},{"l":8,"n":"MIRA APERFEIÇOADA","d":"Você pode utilizar Mirar para jogadas de ataque amaldiçoado e recebe a Mudança de Fundamento Técnica Precisa. Caso já possua Técnica Precisa, o bônus conferido por ela aumenta em +1.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Olhar Preciso"},{"l":8,"n":"PRIMEIRO DISPARO","d":"Durante a rolagem da iniciativa, você pode usar uma habilidade cujo custo de tempo seja Ação Bônus ou Ação Livre.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Treinado em Reflexos"},{"l":8,"n":"REVESTIMENTO CONSTANTE","d":"Você recebe redução de dano contra todos os tipos, exceto na alma, igual ao seu bônus de treinamento.","execucao":"Passiva","custo":"","alcance":"","gatilho":"","pre":"Aptidão Cobrir-se"},{"l":8,"n":"SUSTENTAÇÃO AVANÇADA","d":"Seu corpo agora é capaz de dividir a liberação de energia entre dois feitiços diferentes. Você pode manter um feitiço sustentado adicional e, no começo do combate, pode ativar um feitiço
